# Open WebUI Helm Values — homelab deployment
# Chart: open-webui/open-webui

replicaCount: 1

image:
  repository: ghcr.io/open-webui/open-webui
  pullPolicy: IfNotPresent
  slim: true

# --- External Ollama (timmy K8s) ---
ollama:
  enabled: false

ollamaUrls:
  - "http://ollama.llama.svc:80"

# --- Available models (matches llama/ollama-configmap.yaml) ---
# Leaving unset = auto-discover all models from Ollama endpoint.
# Set OLLAMA_MODELS to filter which models appear in the UI (comma-separated).
extraEnvVars:
  - name: OLLAMA_MODELS
    value: "mistral-nemo-q8,gemma4:e4b,qwen3.5:9b"

  # --- Web Search (SearXNG) ---
  - name: ENABLE_RAG_WEB_SEARCH
    value: "true"
  - name: WEB_SEARCH_ENGINE
    value: "searxng"
  - name: SEARXNG_QUERY_URL
    value: "http://searxng.searxng.svc:8080/search?q=<query>&format=json"
  - name: WEB_SEARCH_RESULT_COUNT
    value: "5"

# --- OpenAI-compatible API (disabled — OV LLM is for OpenViking, not chat UI) ---
enableOpenaiApi: false

# --- Pipelines (disabled for simplicity) ---
pipelines:
  enabled: false

# --- Persistence (Longhorn SSD) ---
persistence:
  enabled: true
  size: 2Gi
  storageClass: longhorn-ssd
  accessModes:
    - ReadWriteOnce

# --- Ingress (disabled — Cloudflare tunnel handles chat.nathanwhyte.dev) ---
ingress:
  enabled: false

# --- Service ---
service:
  type: ClusterIP
  port: 80

# --- Resources ---
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 3Gi

# --- Websocket (single replica, no Redis needed) ---
websocket:
  enabled: false
