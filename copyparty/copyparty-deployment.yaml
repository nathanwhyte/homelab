---
# Single copyparty Pod, the new home for both MacBook backup (writable) and
# yt-dlp media browse (read-only via NFS gateway).
#
# Pinned to wemby because:
#   - The NFS gateway in `yt-dlp` ns is also wemby-pinned (same-node share
#     with the yt-dlp `media` RWO PVC).
#   - Keeping copyparty colocated cuts NFS RTT to a local-loopback hop and
#     lets `dataLocality: best-effort` on the copyparty-files PVC keep its
#     primary replica on wemby too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copyparty
  namespace: copyparty
  labels:
    app: copyparty
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: copyparty
  template:
    metadata:
      labels:
        app: copyparty
    spec:
      nodeSelector:
        kubernetes.io/hostname: wemby
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # BUG-1081: without this, fsGroupChangePolicy defaults to `Always` and the
        # kubelet recursively chowns EVERY file on the 200Gi PVC at each mount.
        # Measured 2026-08-25: ~1,600 files/sec, 7m20s of full downtime for a
        # routine restart, and the volume is RWO so the old pod is torn down
        # first — there is no overlap. Cost scales with file COUNT, not data
        # size, on an HDD-backed volume, so it worsens as the archive grows.
        #
        # `OnRootMismatch` compares only the volume's top-level directory against
        # what fsGroup requires and skips the walk when it already matches —
        # which it will on every restart after the first.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copyparty
          # `iv` variant (Pillow + pyvips + ffmpeg + Mutagen) enables image
          # (incl. HEIF/AVIF/JXL via pyvips), video, and audio thumbnails,
          # audio transcoding, and media tags. Upgraded from `min` (which
          # has no thumbnailer) to turn on full thumbnail support. Digest-
          # pinned; the copyparty images are published to run as -u 1000.
          image: docker.io/copyparty/iv:1.20.16@sha256:1bfe3931173c17c0d3837afdc199a3d9278691f4be4f08e74f9db21ce35241a0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          # Volume spec:
          #   /srv/files -> URL /files with rwmd granted to ${USER} only.
          #       u2c.py needs w/m/d for sync semantics (incl. --dr delete-
          #       remote); the MacBook backup script relies on delete to
          #       mirror Mac-side rms.
          #   /srv/media -> URL /media with r granted to ${USER} only.
          #       NFS mount is RO at mount level too; belt and braces.
          # We do NOT pass `-s` (copyparty's safety profile). `-s` bundles
          # --no-thumb --no-mtag-ff --dotpart --no-robots --force-js; the
          # first two disable thumbnails and ffprobe tag-reading, which would
          # defeat the whole point of running the `iv` image. Instead we keep
          # only the non-disabling pieces of `-s`: --dotpart (hide in-flight
          # u2c uploads from listings), --no-robots (no public hostname
          # anyway), --force-js (rich JS browser UI). `-s` deliberately
          # excludes --no-mv/--no-del (those are in -ss), so omitting it
          # keeps write/move/delete on /files intact for u2c sync semantics.
          # The yt-dlp /media videos carry --embed-thumbnail covers (mkv
          # attachments), so video thumbs extract the embedded cover cheaply
          # rather than decoding a frame; /files may hold raw images/video
          # that need real decode (hence the memory bump below).
          # `-e2d` enables up2k file indexing for chunk deduplication;
          # `--hist=/cfg` puts the sqlite db + thumbnail cache on a local
          # emptyDir (sized below), avoiding sqlite-on-network-fs corruption
          # and keeping the RO /srv/media NFS mount free of .hist writes.
          # The thumb cache is ephemeral (regenerated on pod restart); swap
          # to a PVC if cold regen of the media library gets annoying.
          # Server-side accidental-rm safety: copyparty has no built-in
          # retention. Longhorn RecurringJob snapshots on copyparty-files
          # PVC handle point-in-time recovery (see snapshot-policy.yaml).
          args:
            - |
              set -eu
              exec python3 -m copyparty \
                -i 0.0.0.0 -p 3923 \
                -v "/srv/files:files:A,${USER}" \
                -v "/srv/media:media:A,${USER}" \
                -a "${USER}:${PASSWORD}" \
                -e2d \
                --hist=/cfg \
                --dotpart --no-robots --force-js --no-reload \
                --acao "https://files.nathanwhyte.dev,http://100.95.215.105:31920,http://192.168.1.19:31920" \
                --xff-hdr cf-connecting-ip \
                --xff-src "10.42.0.0/16,10.43.0.0/16" \
                --rproxy 1 \
                -q
          env:
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: copyparty-accounts
                  key: USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: copyparty-accounts
                  key: PASSWORD
          ports:
            - containerPort: 3923
              name: http
          resources:
            # Raised for throughput experiments (FEAT-1017 perf push). The
            # u2c side will run -j 32 -J 12 from an M5 Max; copyparty needs
            # CPU room to hash + write chunks concurrently. HDD-backed PVC
            # is still the floor on sustained throughput, but CPU was the
            # actual cap below ~32 parallel connections.
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "8"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: 3923
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: 3923
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 3923
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: files
              mountPath: /srv/files
            - name: media
              mountPath: /srv/media
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cfg
              mountPath: /cfg
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: copyparty-files
        - name: media
          persistentVolumeClaim:
            claimName: media-nfs
            readOnly: true
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: cfg
          emptyDir:
            # Holds the hist sqlite db + thumbnail cache for both volumes
            # (--hist=/cfg). 10 GiB headroom for image/video/audio thumbs of
            # the yt-dlp media library + MacBook backup tree; ephemeral.
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: copyparty
  namespace: copyparty
  labels:
    app: copyparty
spec:
  type: ClusterIP
  selector:
    app: copyparty
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 3923
---
# Single LAN + Tailscale entry point. Reachable at:
#   - http://192.168.1.19:31920/      (LAN, any node IP)
#   - http://100.95.215.105:31920/    (Tailscale, primary off-LAN)
# Replaces the previous proxy on the same NodePort.
apiVersion: v1
kind: Service
metadata:
  name: copyparty-lan
  namespace: copyparty
  labels:
    app: copyparty
spec:
  type: NodePort
  selector:
    app: copyparty
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 3923
      nodePort: 31920
