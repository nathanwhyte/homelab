---
apiVersion: batch/v1
kind: Job
metadata:
  name: nanochat-gpt2-rocm
  namespace: nanochat
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: timmy
        gpu.vendor: amd
      containers:
        - name: nanochat
          image: registry.nathanwhyte.dev/library/nanochat:rocm-v4
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              cd /app
              # Symlink cache to PVC so downloads survive restarts
              mkdir -p /app/data/cache
              ln -sfn /app/data/cache /root/.cache/nanochat

              # Stage 1: Data + tokenizer (single-process)
              python -m nanochat.dataset -n 170
              python -m scripts.tok_train
              python -m scripts.tok_eval

              # Stage 2: Pretrain GPT-2 (depth=4, ~15M params) — single GPU
              python -c "
              import faulthandler, sys; faulthandler.enable()
              sys.argv = ['base_train', '--depth=4', '--device-batch-size=8', '--run=dummy', '--save-every=100']
              import scripts.base_train
              " || { echo '--- STAGE 2 FAILED ---'; exit 1; }

              # Stage 3: Evaluate (single-process)
              python -m scripts.base_eval

              # Stage 4: Download identity data for SFT
              curl -L -o /app/data/identity_conversations.jsonl \
                https://karpathy-public.s3.us-west-2.amazonaws.com/identity_conversations.jsonl

              # Stage 5: SFT — single GPU
              python -m scripts.chat_sft \
                --device-batch-size=4

              # Stage 6: Chat eval (single-process)
              python -m scripts.chat_eval -i sft
          env:
            - name: HIP_VISIBLE_DEVICES
              value: "1"
            - name: NANOCHAT_DTYPE
              value: "float16"
            - name: PYTORCH_TUNABLEOP_ENABLED
              value: "1"
            - name: PYTORCH_ALLOC_CONF
              value: "expandable_segments:True"
            - name: WANDB_MODE
              value: "online"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-api-key
                  key: WANDB_API_KEY
            - name: WANDB_PROJECT
              value: "nanochat"
            - name: OMP_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              amd.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              amd.com/gpu: "1"
          securityContext:
            privileged: true
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: checkpoints
              mountPath: /app/logs
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nanochat-data
        - name: checkpoints
          persistentVolumeClaim:
            claimName: nanochat-checkpoints
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
