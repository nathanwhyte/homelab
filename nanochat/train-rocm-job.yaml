---
apiVersion: batch/v1
kind: Job
metadata:
  name: nanochat-gpt2-rocm
  namespace: nanochat
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: timmy
        gpu.vendor: amd
      containers:
        - name: nanochat
          image: registry.nathanwhyte.dev/library/nanochat:rocm-v4
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              cd /app
              # Symlink cache to PVC so downloads survive restarts
              mkdir -p /app/data/cache
              ln -sfn /app/data/cache /root/.cache/nanochat

              # Stage 1: Data + tokenizer (single-process)
              python -m nanochat.dataset -n 170
              python -m scripts.tok_train
              python -m scripts.tok_eval

              # GPU diagnostic — verify we're on the discrete GPU, not iGPU
              echo "=== GPU DIAGNOSTIC ==="
              echo "ROCR_VISIBLE_DEVICES=${ROCR_VISIBLE_DEVICES:-unset}"
              echo "HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-unset}"
              echo "GPU_DEVICE_ORDINAL=${GPU_DEVICE_ORDINAL:-unset}"
              ls -la /dev/kfd /dev/dri/render* 2>&1 || true
              rocm-smi --showid 2>&1 | head -20 || true
              python -c "
              import torch
              print(f'PyTorch version: {torch.__version__}')
              print(f'CUDA available: {torch.cuda.is_available()}')
              print(f'Device count: {torch.cuda.device_count()}')
              for i in range(torch.cuda.device_count()):
                  print(f'  Device {i}: {torch.cuda.get_device_name(i)}')
              print(f'Current device: {torch.cuda.current_device()} = {torch.cuda.get_device_name()}')
              t = torch.randn(16, 16, device='cuda')
              print(f'Tensor test passed: {t.shape} on {t.device}')
              " || { echo '--- GPU DIAGNOSTIC FAILED ---'; exit 1; }
              echo "=== GPU DIAGNOSTIC PASSED ==="

              # Stage 2: Pretrain GPT-2 (depth=16, ~205M params) — single GPU
              python -c "
              import faulthandler, sys; faulthandler.enable()
              sys.argv = ['base_train', '--depth=16', '--device-batch-size=4', '--run=pop', '--save-every=500', '--window-pattern=L']
              import scripts.base_train
              "
              echo "--- STAGE 2 FINISHED ---"

              # Stage 3: Evaluate — skipped, OOM on 16GB GPU
              # base_eval tries to allocate 8 GiB for logits softcap; base_train already runs inline eval
              # python -m scripts.base_eval

              # Stage 4: Download identity data for SFT
              curl -L -o /app/data/identity_conversations.jsonl \
                https://karpathy-public.s3.us-west-2.amazonaws.com/identity_conversations.jsonl

              # Stage 5: SFT — single GPU
              python -m scripts.chat_sft \
                --run=pop \
                --device-batch-size=4

              # Stage 6: Chat eval (single-process)
              python -m scripts.chat_eval -i sft

              echo "=== ALL STAGES COMPLETE ==="
          env:
            # GPU visibility managed by amd.com/gpu device plugin
            # Do NOT set HIP_VISIBLE_DEVICES or ROCR_VISIBLE_DEVICES — conflicts with plugin
            - name: TORCHDYNAMO_DISABLE
              value: "1"
            - name: PYTORCH_TUNABLEOP_ENABLED
              value: "0"
            - name: PYTORCH_ALLOC_CONF
              value: "expandable_segments:True"
            - name: WANDB_MODE
              value: "online"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-api-key
                  key: WANDB_API_KEY
            - name: WANDB_PROJECT
              value: "nanochat"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
              amd.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              amd.com/gpu: "1"
          securityContext:
            privileged: true
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: checkpoints
              mountPath: /app/logs
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nanochat-data
        - name: checkpoints
          persistentVolumeClaim:
            claimName: nanochat-checkpoints
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
