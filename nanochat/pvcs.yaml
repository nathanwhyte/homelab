---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanochat-data
  namespace: nanochat
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn-ssd
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanochat-checkpoints
  namespace: nanochat
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn-ssd
  volumeMode: Filesystem
