---
# sysbench doesn't support GPU testing — this job uses ROCm tools
# to benchmark the AMD RX 9070 XT on timmy.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-bench-timmy
  namespace: sysbench
  labels:
    app: gpu-bench
    node: timmy
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: gpu-bench
        node: timmy
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: timmy
        gpu.vendor: amd
      containers:
        - name: gpu-bench
          image: rocm/rocm-terminal:latest
          env:
            - name: HIP_VISIBLE_DEVICES
              value: "0"
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail
              echo "=============================="
              echo "  GPU BENCHMARK — timmy"
              echo "  RX 9070 XT (RDNA 4)"
              echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo "=============================="

              echo ""
              echo "--- ROCm SMI (device info + thermals) ---"
              rocm-smi || echo "rocm-smi not available"

              echo ""
              echo "--- ROCm SMI Clock Summary ---"
              rocm-smi --showclocks || echo "clock info not available"

              echo ""
              echo "--- ROCm Info (first agent) ---"
              rocminfo | grep -A 30 "Agent 1" | head -40 || echo "rocminfo not available"

              echo ""
              echo "--- ROCm Bandwidth Test (host<->device copy) ---"
              rocm-bandwidth-test || echo "rocm-bandwidth-test not available — install with: apt install rocm-bandwidth-test"

              echo ""
              echo "=============================="
              echo "  GPU BENCH COMPLETE"
              echo "=============================="
          resources:
            requests:
              amd.com/gpu: "1"
            limits:
              amd.com/gpu: "1"
          securityContext:
            privileged: true
