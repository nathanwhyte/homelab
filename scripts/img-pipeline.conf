# img-pipeline.conf — Configuration for img-pipeline.sh
#
# Image generation (FLUX.2 Klein via Ollama) and image understanding
# (Qwen3.6-27B+mmproj via llama-server) on the MacBook M5 Max.
#
# Override any variable by setting it in the environment before calling
# img-pipeline.sh, e.g.  LLAMACPP_PORT=9090 img-pipeline.sh up

# Paths (MacBook local)
LLAMACPP_MODEL="$HOME/code/robots/media/homework/models/Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved-Q4_K_M.gguf"
LLAMACPP_MMPROJ="$HOME/code/robots/media/homework/models/Qwen3.6-27B-mmproj-BF16.gguf"
FLUX_MODEL="x/flux2-klein"

# llama-server settings
LLAMACPP_PORT="${LLAMACPP_PORT:-8081}"
LLAMACPP_HOST="${LLAMACPP_HOST:-127.0.0.1}"
LLAMACPP_CTX="${LLAMACPP_CTX:-8192}"
LLAMACPP_NGL="${LLAMACPP_NGL:-99}"

# Timeouts
UP_TIMEOUT="${UP_TIMEOUT:-120}"       # seconds to wait for llama-server readiness
DOWN_TIMEOUT="${DOWN_TIMEOUT:-30}"    # seconds to wait for llama-server shutdown

# Output
OUTPUT_DIR="${OUTPUT_DIR:-$HOME/Pictures/ai-generated}"

# PID file
PID_FILE="${PID_FILE:-/tmp/img-pipeline-llamaserver.pid}"

# Ollama settings
OLLAMA_HOST="${OLLAMA_HOST:-http://localhost:11434}"