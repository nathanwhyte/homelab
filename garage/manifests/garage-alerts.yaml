# Garage storage alerts (ERR-1011 follow-up, 2026-07-02).
#
# Garage runs replication factor 3 with a write quorum of 2. When replicas drop
# below quorum, OpenViking resource pushes fail with an opaque
# "[PROCESSING_ERROR] ... Could not reach quorum of 2" while OV /health stays
# 200 — nothing alerted during the 2026-07-02 outage. These rules alert on
# kube-state-metrics signals so storage failures are visible before (and
# during) quorum loss. The cluster Prometheus has empty rule/serviceMonitor
# selectors, so no extra labels are required.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: garage-alerts
  namespace: garage
spec:
  groups:
    - name: garage.rules
      rules:
        - alert: GarageReplicaDown
          expr: kube_statefulset_status_replicas_ready{namespace="garage", statefulset="garage"} < 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Garage has {{ $value }}/3 ready replicas for 5m"
            description: "At 2/3 the next replica loss breaks write quorum and OpenViking pushes start failing (ERR-1011)."
        - alert: GarageQuorumLost
          expr: kube_statefulset_status_replicas_ready{namespace="garage", statefulset="garage"} < 2
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Garage write quorum lost ({{ $value }}/3 ready)"
            description: "S3 writes are failing NOW; OpenViking resource pushes return PROCESSING_ERROR quorum failures (ERR-1011) while OV /health stays 200."
        - alert: GarageRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="garage"}[30m]) > 0
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "Garage pod {{ $labels.pod }} restarted in the last 30m"
            description: "Repeated restarts (e.g. node drain loops) erode quorum headroom; check node cordon/drain events."
        - alert: GaragePodChurn
          # Pod RECREATION (drain/evict → new pod) leaves restart counters at 0
          # and can keep replicas_ready at 3 between scrapes — this was the
          # 2026-07-02 failure mode (wemby GPU-upgrade drain loop recreated all
          # three pods while OV pushes failed on quorum). Alert on young pods.
          expr: (time() - kube_pod_start_time{namespace="garage"}) < 1800
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "Garage pod {{ $labels.pod }} was recreated in the last 30m"
            description: "Pod recreation churn (node drains, evictions) can break Garage quorum without tripping restart or ready-replica alerts (ERR-1011)."
        # Garage's own signals (2026-11-08): garage-2's metadata disk filled twice
        # while it caught up after a restart, its resync worker failed on LMDB
        # ENOSPC, and only the generic KubePersistentVolumeFillingUp alert fired.
        # Backtested over 14 days to 2026-11-09 00:26Z: GarageResyncQueueStuck
        # fires once (garage-2, 23:01Z); GarageTableBehind fires once at
        # for: 30m (garage-2, 23:56Z) and never at for: 1h.
        - alert: GarageMetadataDiskFillingFast
          # A metadata volume over half full that would fill within 6 h at its
          # last 30 min's rate. Catches a slow refill like garage-2's corrupt-
          # freelist growth (BUG-1294) before the generic PVC alert; a fill in
          # minutes outruns any rate alert. The 50% condition drops the
          # all-node false positive a `garage meta snapshot` write caused on
          # 2026-11-03. Backtested over 14 days to 2026-11-09 16:00Z: fires
          # three times, all garage-2 on 2026-11-08/09; the slow refill at
          # 00:49Z, 38 min before the volume filled at 01:27Z.
          expr: |
            (
              predict_linear(kubelet_volume_stats_available_bytes{namespace="garage", persistentvolumeclaim=~"meta-garage-.*"}[30m], 6 * 3600) < 0
            )
            and
            (
              kubelet_volume_stats_used_bytes{namespace="garage", persistentvolumeclaim=~"meta-garage-.*"}
                / kubelet_volume_stats_capacity_bytes{namespace="garage", persistentvolumeclaim=~"meta-garage-.*"} > 0.5
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Garage metadata volume {{ $labels.persistentvolumeclaim }} is over half full and on course to fill within 6h"
            description: "Compare its size with the other meta-garage volumes; one node far above its peers that keeps growing after its resync queue drains is the LMDB runaway-growth case (GUIDE-1079 Mode 4). Growing the volume only buys time."
        - alert: GarageResyncQueueStuck
          # min_over_time: the queue never dropped below 1000 in the last hour.
          expr: min_over_time(block_resync_queue_length{job="garage"}[1h]) > 1000
          labels:
            severity: warning
          annotations:
            summary: "Garage {{ $labels.instance }} block resync queue above 1000 for 1h"
            description: "Its resync worker is not keeping up or is failing; check `garage worker info` on that node for consecutive errors (an LMDB ENOSPC means its metadata volume is full)."
        - alert: GarageTableBehind
          expr: |
            table_size{job="garage", table_name="version"}
              < on(table_name) group_left
            0.95 * max by (table_name) (table_size{job="garage", table_name="version"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Garage {{ $labels.instance }} version table more than 5% behind its peers for 30m"
            description: "The node has not caught up on table sync; it holds {{ $value }} items. Check its metadata disk and `garage stats -a`."
