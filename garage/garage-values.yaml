---
# Garage Helm Chart Values
# Customized for Glossary deployment with Longhorn storage
#
# Based on official Garage Helm chart structure:
# https://garagehq.deuxfleurs.fr/documentation/cookbook/kubernetes/
#
# Install with:
# helm install garage ./garage/script/helm/garage -f garage-values.yaml -n garage
#
# View default values:
# helm show values ./garage/script/helm/garage

# Garage configuration (maps to garage.toml)
garage:
  # Database engine (lmdb is default and recommended)
  dbEngine: "lmdb"

  # Block size (1MB default, can be increased for better performance)
  blockSize: "1048576"

  # Replication factor 3 comes from the chart default (garage.replicationFactor).
  # The former `replicationMode` key here was never read by the chart (IMPR-1457).

  # Compression level (1 is default, higher = more CPU, less storage)
  compressionLevel: "1"

  # RPC bind address
  rpcBindAddr: "[::]:3901"

  # RPC secret - if empty, chart will auto-generate and store in Secret
  # To use existing secret, reference it here (e.g., from garage-secrets)
  # The secret should contain the RPC secret as a plain string value
  rpcSecret: ""

  # Bootstrap peers (not needed with Kubernetes discovery)
  bootstrapPeers: []

  # Use Kubernetes discovery (default, creates CRDs automatically)
  kubernetesSkipCrd: false

  # S3 API configuration
  s3:
    api:
      region: "garage"
      rootDomain: ".s3.garage.tld"
    web:
      rootDomain: ".web.garage.tld"
      index: "index.html"

  # Use existing ConfigMap for garage.toml (leave empty to use values above)
  existingConfigMap: ""

  # Custom garage.toml string template (overrides above if set)
  garageTomlString: ""

# Data persistence
persistence:
  enabled: true
  meta:
    # Use custom Longhorn StorageClass for metadata
    storageClass: "longhorn-nvme"
    # 1Gi filled up 2026-07-02 (LMDB ENOSPC on 2/3 nodes broke write quorum —
    # found by the k3s-datastore-backup test run). PVCs expanded live to 5Gi.
    # 5Gi is 5-7x a healthy node's meta-volume usage (0.74 GiB on meta-garage-2
    # after its 2026-11-09 rebuild, 0.39 GiB of it a Garage snapshot; ~1 GiB on
    # 0/1). meta-garage-2 alone runs at 20Gi: on 2026-11-08/09 (UTC) its LMDB
    # file grew to 18.6 GiB, 18.2 GiB of it in pages outside every tree (tree
    # data ~0.4 GiB; likely freed pages never reused, but mdb_stat's freelist
    # walk aborted, so unconfirmed) while anti-entropy sync to it never settled, filling 5Gi, 10Gi and 20Gi in turn. A db.lmdb rebuild
    # from peers brought it back to 0.74 GiB; more space did not. Longhorn cannot
    # shrink a PVC, so that one stays 20Gi. This value sizes only a newly created
    # PVC, and it must match the live StatefulSet: volumeClaimTemplates are
    # immutable, so deploy-garage.sh stops on a mismatch and names the runbook
    # (compendium GUIDE-1079, "Recreating the garage StatefulSet").
    size: 5Gi
  data:
    # 2026-09-04: longhorn-ssd -> longhorn-garage-data.
    #
    # longhorn-ssd sets no dataLocality, so Longhorn scheduled all three
    # data-garage-* replicas onto timmy's NVMe even though the pods are spread
    # across manu/timmy/wemby. Garage reported "Zone redundancy: maximum" while
    # every zone's bytes sat on one disk. The new class uses
    # dataLocality: best-effort so each node's data follows its own pod.
    # See storageclass-longhorn-garage-data.yaml for why not strict-local.
    storageClass: "longhorn-garage-data"
    # 2026-09-04: 100Gi -> 50Gi. The 2026-03-22 doubling (0ab75aa) was a
    # preemptive expansion ahead of a full codebase re-index that never
    # materialised at that scale. Actual contents across ALL buckets are ~1.5 GiB
    # (k3s-backups 1.5 GiB / 39 objects; openviking-agfs 6.3 MiB / 2593 objects;
    # filestore 586 kiB), landing at ~4.5 GiB per node.
    #
    # 50Gi also matches what Garage itself already believes: `garage layout show`
    # has declared 50.0 GB capacity per node all along — the layout was never
    # re-assigned after the PVC doubled, so the extra 50Gi was never usable by
    # Garage anyway. This makes the PVC and the layout agree again.
    #
    # Longhorn cannot shrink in place, so changing this requires recreating each
    # volume; do it one node at a time and let Garage resync from the other two.
    size: 50Gi

# Deployment configuration
deployment:
  # Use StatefulSet for stable pod identities
  kind: StatefulSet
  # Number of Garage nodes (matches replication mode)
  replicaCount: 3
  # 2026-07-06 (BUG-1033): Parallel, matching the live StatefulSet rebuilt during
  # the LMDB recovery — OrderedReady deadlocks the cluster when ordinals 0/1 are
  # corrupted (garage-2 can never start). Field is immutable; the live sts already
  # holds Parallel, so upgrades rendering the same value pass validation.
  podManagementPolicy: Parallel

# Container image
image:
  repository: dxflrs/amd64_garage
  # 2026-11-03 (IMPR-1457): pinned to the chart's appVersion (chart 0.10.4), so a
  # chart re-clone at another tag cannot silently change the running Garage.
  # v2.5.0 is one-way: an upgraded node must not be downgraded to an older v2.x.
  tag: "v2.5.0"
  pullPolicy: IfNotPresent

# Init container image
initImage:
  repository: busybox
  tag: stable
  pullPolicy: IfNotPresent

# Image pull secrets (if needed for private registry)
imagePullSecrets: []

# Name overrides (leave empty for defaults)
nameOverride: ""
fullnameOverride: ""

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Additional pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

# Container security context
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Service configuration
service:
  # Service type for S3 API
  type: ClusterIP
  s3:
    api:
      port: 3900
    web:
      port: 3902

# Admin API is handled via headless service automatically

# Ingress configuration
# 2026-11-02 (IMPR-1457): disabled. Garage is cluster-only; the former
# uploads.nathanwhyte.dev ingress and tunnel route were removed.
ingress:
  s3:
    api:
      enabled: false

# Resource limits and requests (added: was unbounded)
# 2026-07-06 (IMPR-1038): 64Mi/256Mi -> 128Mi/1Gi. LMDB block-manager init on the
# current ~105GB store SIGBUSes (exit 135) inside a 256Mi limit — see BUG-1033.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 1Gi

# Health probes
# 2026-11-03 (IMPR-1457): readiness on the admin API's unauthenticated /health,
# which returns 200 only while the node sees write quorum. It keeps the S3
# Service off a pod that has not rejoined, and makes a StatefulSet rollout wait
# for each pod to rejoin before rolling the next. No liveness probe: a quorum
# loss would fail it on every pod at once and restart the whole cluster.
livenessProbe: {}
readinessProbe:
  httpGet:
    path: /health
    port: 3903
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

# Node selector (for pod placement)
nodeSelector: {}

# Tolerations (for tainted nodes)
tolerations: []

# Affinity rules (for pod placement)
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - garage
        topologyKey: kubernetes.io/hostname

# Additional environment variables
# 2026-11-02 (IMPR-1457): the admin API token comes from the garage-admin-token
# Secret (created by hand, see garage/README.md). GARAGE_ADMIN_TOKEN overrides
# admin.admin_token in garage.toml, which no longer carries one.
#
# 2026-11-09 (BUG-1293): RUST_LOG keeps Garage's server default
# (netapp=info,garage=info, src/garage/main.rs:193-199@v2.5.0) and lowers only
# the per-request S3 access lines to warn. generic_server.rs:170,216 logs every
# request and every 4xx at info; those were 99% of each pod's lines (garage-2:
# 940,042 of 944,830 over 6 h on 2026-11-09), about 110k lines/h from one pod,
# which rotated its kubelet log file past what a Loki outage could catch up.
# 5xx errors stay (warn, :210), and so do the table sync, block resync and
# LMDB lines that explain metadata growth. Request counts by endpoint and
# errors remain in Prometheus (api_s3_request_counter, api_s3_error_counter).
environment:
  - name: GARAGE_ADMIN_TOKEN
    valueFrom:
      secretKeyRef:
        name: garage-admin-token
        key: admin-token
  - name: RUST_LOG
    value: "netapp=info,garage=info,garage_api_common::generic_server=warn"

# Extra volumes
extraVolumes: {}

# Extra volume mounts
extraVolumeMounts: {}

# Monitoring configuration
monitoring:
  metrics:
    # Enable metrics service with Prometheus annotations
    enabled: true
    serviceMonitor:
      # Create ServiceMonitor CRD for Prometheus Operator
      enabled: false
      path: /metrics
      labels: {}
      interval: 15s
      scheme: http
      tlsConfig: {}
      scrapeTimeout: 10s
      relabelings: []
  tracing:
    # OpenTelemetry trace sink endpoint
    sink: ""
