# Kubelet drop-in: a bigger current container log file (BUG-1293).
# Installed on each node as
#   /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/50-container-logs.conf
# by install-kubelet-container-logs.sh; see README.md.
#
# Alloy reads pod logs through the kubelet log API, which serves only a
# container's current file (cri-client/pkg/logs/logs.go:292-297@v1.36.2). After
# a Loki outage the collectors resume from that file, so its size bounds how
# long an outage a pod's lines survive. At the default 10Mi the busiest writer
# outside Loki (the ARC controller, about 1.6 MB/h on disk) lasts about 6.5 h;
# at 50Mi, about 32 h. The 2026-11-08 timmy drain took 12.5 h.
#
# containerLogMaxFiles stays at the default 5: the log API never reads rotated
# files, so more files would add disk use and no buffer. A container that writes
# this much keeps up to two uncompressed files (current and newest rotated) plus
# three gzipped ones.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
containerLogMaxSize: 50Mi
