# K3s datastore backup (IMPR-1021)
#
# timmy is the sole control-plane node and its datastore is SQLite (kine) —
# NOT etcd, so `k3s etcd-snapshot` does not apply. Longhorn replicates PVCs
# but nothing replicates /var/lib/rancher/k3s/server. This CronJob takes a
# consistent SQLite online backup (sqlite3 backup API via python stdlib, safe
# against a live WAL) plus the join token and TLS CA material, and ships it
# to Garage S3 (which is replicated across all three nodes).
#
# Apply-time prerequisites (one-off, not in this manifest):
#   1. Create the bucket + key in Garage:
#        garage bucket create k3s-backups
#        garage key create k3s-backup-key
#        garage bucket allow --read --write k3s-backups --key k3s-backup-key
#   2. Create the credentials secret (see k3s-backup-s3-credentials.secret.yaml.example):
#        kubectl -n kube-system create secret generic k3s-backup-s3-credentials \
#          --from-literal=ACCESS_KEY_ID=... --from-literal=SECRET_ACCESS_KEY=...
#
# Restore sketch (full procedure to document after first verified backup):
#   stop k3s on the replacement node, restore state.db to
#   /var/lib/rancher/k3s/server/db/, restore token + tls/, start k3s.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k3s-datastore-backup
  namespace: kube-system
spec:
  # Nightly at 03:30 local, before the 04:00/04:30 Longhorn snapshot windows.
  schedule: "30 3 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      # Give up rather than pile on retries against the control-plane disk.
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: timmy
          restartPolicy: Never
          initContainers:
            - name: snapshot
              image: python:3.12-slim
              # Root needed to read the root-owned k3s server dir.
              securityContext:
                runAsUser: 0
              command: ["python3", "-c"]
              args:
                - |
                  import shutil, sqlite3, subprocess, time
                  stamp = time.strftime("%Y-%m-%d")
                  # Online backup: consistent even while kine is writing (WAL).
                  src = sqlite3.connect("file:/server/db/state.db?mode=ro", uri=True)
                  dst = sqlite3.connect(f"/backup/state-{stamp}.db")
                  src.backup(dst)
                  dst.close(); src.close()
                  shutil.copy("/server/token", f"/backup/token-{stamp}")
                  subprocess.run(
                      ["tar", "czf", f"/backup/tls-{stamp}.tar.gz", "-C", "/server", "tls"],
                      check=True)
                  print("snapshot complete:", stamp)
              volumeMounts:
                - name: k3s-server
                  mountPath: /server
                  readOnly: true
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: rclone/rclone:1.67
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  rclone copy /backup garage:k3s-backups/timmy/ --s3-no-check-bucket
                  # Retention: keep 14 days.
                  rclone delete garage:k3s-backups/timmy/ --min-age 14d
                  echo "upload + prune complete"
                  rclone ls garage:k3s-backups/timmy/ | tail -5
              env:
                - name: RCLONE_CONFIG_GARAGE_TYPE
                  value: s3
                - name: RCLONE_CONFIG_GARAGE_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_GARAGE_ENDPOINT
                  value: http://garage.garage.svc.cluster.local:3900
                - name: RCLONE_CONFIG_GARAGE_REGION
                  value: garage
                - name: RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: k3s-backup-s3-credentials
                      key: ACCESS_KEY_ID
                - name: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: k3s-backup-s3-credentials
                      key: SECRET_ACCESS_KEY
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
          volumes:
            - name: k3s-server
              hostPath:
                path: /var/lib/rancher/k3s/server
                type: Directory
            - name: backup
              emptyDir:
                sizeLimit: 2Gi
