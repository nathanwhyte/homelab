# build-hook: webhook-driven CI image builder
#
# Retired 2026-07-20, RESTORED 2026-08-26. See HISTORY.md for the full history.
#
# `hook` receives authenticated webhook calls, builds images with buildkitd
# (build/buildkitd.yaml), pushes them to registry.nathanwhyte.dev, and restarts
# the target Deployments — for five projects (build-hook, credit-coach,
# equal-risk, portfolio, glossary), configured in the `hook-config` ConfigMap.
#
# This pipeline NEVER successfully pushed an image. Two separate things were
# broken, and a restore is more than re-applying this file:
#   1. The `build` Cloudflare tunnel (a11f180d) was deleted 2026-03-28 during
#      the consolidation, and nothing repointed the webhook endpoint. Fixed by
#      an ingress rule on the cluster-wide tunnel — see the note at the bottom.
#   2. The registry credential named `robot$builder` NEVER EXISTED in Harbor.
#      It seemed to work only because every project here is public, so the
#      token service grants `pull` to anyone — anonymous, that credential, and
#      nonsense credentials all got identical grants. The audit log shows all
#      108 historical pushes were made by `admin` by hand, and that no robot
#      account ever logged in. Fixed by creating robot$build-hook-pusher.
#
# Secrets are referenced by name only and are NOT in this repo:
#   bearer-tokens-secret   — inbound webhook auth (BEARER_TOKENS); rotated
#                            2026-08-26, five tokens, one per project
#   github-access-token    — repo clone PAT (GITHUB_TOKEN)
#   registry-credentials   — dockerconfigjson for registry.nathanwhyte.dev
#
# SECURITY (BUG-1088): builds run on buildkitd with privileged: true, in a
# namespace holding both the GitHub PAT and the registry credentials. Write
# access to any of the five configured GitHub repos is therefore equivalent to
# code execution here. The bearer token bounds *who can trigger* a build; it
# does not bound what a build can do. GitHub repo permissions are the real
# perimeter.
#
# hostPath volumes /data/build-cache and /data/build-context remain on whichever
# node last ran the pod; they are not cleaned up by deleting these workloads.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildx-builder
  namespace: build
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buildx-builder
  namespace: build
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buildx-builder
  namespace: build
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: buildx-builder
subjects:
  - kind: ServiceAccount
    name: buildx-builder
    namespace: build
---
apiVersion: v1
kind: Service
metadata:
  name: hook
  namespace: build
spec:
  type: ClusterIP
  selector:
    app: hook
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hook
  namespace: build
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hook
  template:
    metadata:
      labels:
        app: hook
    spec:
      serviceAccountName: buildx-builder
      containers:
        - name: hook
          # Mutable :latest ON PURPOSE, reversing the digest pin added earlier
          # on 2026-08-26. The two are incompatible here: hook-config has this
          # pipeline build itself and then `rollout restart` deploy/hook, and a
          # restart against a pinned digest brings the pod back on the SAME
          # image — so pinning silently turned the self-build into a no-op.
          # Deploy-by-restart requires a mutable tag.
          #
          # This reopens the IMPR-1023 gap for this one Deployment, knowingly.
          # :latest was repointed at the hardened build
          # (sha256:881344b4…, build-hook f24141a) before this change, so
          # switching back does not regress to the pre-hardening March image.
          image: registry.nathanwhyte.dev/build-hook/api:latest
          # Required for deploy-by-restart to mean anything: with IfNotPresent
          # a rollout restart reuses the cached layer and never sees the newly
          # built image.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: BEARER_TOKENS
              valueFrom:
                secretKeyRef:
                  name: bearer-tokens-secret
                  key: BEARER_TOKENS
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-access-token
                  key: GITHUB_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config.toml
              subPath: config.toml
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: build-context
              mountPath: /build-context
            - name: docker-config
              mountPath: /root/.docker/config.json
              subPath: .dockerconfigjson
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hook-config
        - name: cache
          hostPath:
            path: /data/build-cache
            type: DirectoryOrCreate
        - name: build-context
          hostPath:
            path: /data/build-context
            type: DirectoryOrCreate
        - name: docker-config
          secret:
            secretName: registry-credentials
#
# The dedicated `tunnel` Deployment that used to be here has been REMOVED as
# part of the 2026-08-26 restore. It ran cloudflared against tunnel a11f180d,
# which was deleted on 2026-03-28 during the consolidation into the
# cluster-wide `homelab` tunnel; its `hook-cloudflared-token` secret was
# deleted at retirement and the token is worthless. Recreating it would rebuild
# exactly the fragility that caused the original four-month outage.
#
# The public front door is instead an ingress rule on the cluster-wide tunnel:
#
#   - hostname: hook.nathanwhyte.dev
#     service: http://hook.build.svc.cluster.local:3000
#
# in ../cloudflare/main-tunnel/cloudflared-configmap.yaml, plus a proxied CNAME.
# Git history holds the old Deployment if it is ever needed as a reference.
