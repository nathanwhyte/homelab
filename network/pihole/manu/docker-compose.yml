services:
  pihole:
    container_name: pihole
    # Pinned (IMPR-1023). 2026.07.2 == what :latest resolved to on 2026-07-25.
    image: pihole/pihole:2026.07.2
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      - "8008:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
      - "7443:443/tcp"
    environment:
      # Set the appropriate timezone for your location (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones), e.g:
      TZ: "America/Chicago"
      # Web UI password. Kept OUT of the repo (AGENTS.md: do not commit secrets) —
      # set it in an untracked .env alongside this file. See ../.env.example.
      FTLCONF_webserver_api_password: "${PIHOLE_WEBSERVER_API_PASSWORD:?set PIHOLE_WEBSERVER_API_PASSWORD in .env}"
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'ALL'
      FTLCONF_dns_listeningMode: "ALL"
      # Configure Pi-hole to forward DNS queries to Unbound
      # Use the unbound service name on the DNS port (53) within the Docker network
      # IMPR-1101: the v5 name FTLCONF_upstream_dns_servers is silently ignored by
      # v6 (key is dns.upstreams). This host only reached unbound because the value
      # was persisted in its pihole-data volume; a volume rebuild would have
      # defaulted to 8.8.8.8/8.8.4.4.
      FTLCONF_dns_upstreams: "unbound#53"
      # PROJ-1018 Phase 0 — the private record set, version-controlled here.
      #
      # This is the ONLY mechanism that survives a deliberate pihole-data volume
      # rebuild: the value lives in this file, not in the volume's pihole.toml.
      # UI-added records and API writes both land in the volume and are lost.
      #
      # MUST be byte-identical across wemby/manu/timmy — clients pick a resolver
      # arbitrarily, so a two-of-three rollout yields intermittent failures
      # (INFO-1124 answer-identically invariant).
      #
      # WARNING: setting this as an env var makes dns.hosts READ-ONLY in the web
      # UI. That is intended (reproducible-from-git), but a one-off record added
      # through the UI will silently fail to stick. Edit here instead.
      FTLCONF_dns_hosts: "192.168.1.19 registry.nathanwhyte.dev;192.168.1.19 k8s.nathanwhyte.dev;192.168.1.19 longhorn.nathanwhyte.dev"
    depends_on:
      - unbound
    networks:
      - dns-network
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - pihole-data:/etc/pihole
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    restart: unless-stopped

  unbound:
    container_name: unbound
    # alpinelinux/unbound — Alpine's own packaging, unbound 1.25.1 (2026-07-19),
    # replacing the dormant mvance image (1.22.0, last built 2024-10-19).
    # Deliberately unpinned: this repo publishes only `latest`-style tags, so there
    # is no version tag to pin. Its entrypoint runs `unbound-anchor -a
    # /etc/unbound/root.key`, so the DNSSEC trust anchor is created and maintained
    # automatically. Config path is /etc/unbound, NOT mvance's /opt/unbound/etc/unbound.
    image: alpinelinux/unbound:latest
    volumes:
      # Unbound config + state. The entrypoint chowns this directory to the
      # in-container `unbound` user, which on the host shows as uid 101.
      - ./unbound:/etc/unbound
    networks:
      - dns-network
    restart: unless-stopped
    # Unbound runs as recursive resolver, no external ports needed
    # Pi-hole will connect to it via Docker network

networks:
  logs:
    external: true
  dns-network:
    driver: bridge

volumes:
  pihole-data:
    external: true
    name: deployments_pihole-data
