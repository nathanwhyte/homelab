# An IngressRouteTCP for k8s.nathanwhyte.dev was removed here 2026-07-20. It
# declared HostSNI() on the `websecure` entrypoint with no `tls:` block, which
# Traefik rejects outright — "invalid rule: has HostSNI matcher, but no TLS on
# router" — so it never routed anything and only produced repeating errors in
# the Traefik log. The Ingress below already serves this host.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-dashboard-ingress
  namespace: kubernetes-dashboard
  annotations:
    # websecure (not web) so Traefik terminates TLS for this host. Required
    # because `.dev` is HSTS-preloaded — browsers refuse plain HTTP outright,
    # same fix applied to longhorn.nathanwhyte.dev (f77a516).
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # There is deliberately NO ipAllowList middleware here (BUG-1057, removed
    # 2026-07-21). One was attached 2026-07-20 and filtered nothing: k3s
    # ServiceLB (klipper-lb) masquerades the client address inside the
    # svclb-traefik pod, a layer beneath kube-proxy, so Traefik only ever sees a
    # node IP. Measured via access logs — a request from 192.168.1.8 logged as
    # ClientHost 192.168.1.19 (timmy's node IP), which matched the allowlist's
    # own 192.168.1.0/24 and passed. `externalTrafficPolicy: Local` does NOT fix
    # this; it governs kube-proxy's SNAT, which never gets a say.
    #
    # It was removed rather than kept-but-labelled because an attached allowlist
    # reads as protection in every future review. Restoring one requires first
    # bypassing klipper (MetalLB, or Traefik on hostNetwork/hostPort) AND a
    # negative test proving an out-of-range client actually receives 403.
    # Access control that does work: tailnet membership for the `tailscale serve`
    # route, Cloudflare Access for anything genuinely public. This host is not
    # publicly routable. NOTE 2026-08-24 (PROJ-1018): it has no public A record
    # at all any more — that record was deleted. k8s.nathanwhyte.dev resolves
    # via the Pi-hole local records (network/pihole/) on LAN and Tailscale
    # split DNS off-LAN. DNS-01 issuance is unaffected; it uses a temporary
    # TXT record via the Cloudflare API. Same pattern as
    # longhorn.nathanwhyte.dev / harbor-tls / openviking-tls.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - k8s.nathanwhyte.dev
      secretName: k8s-dashboard-tls
  rules:
    - host: k8s.nathanwhyte.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubernetes-dashboard-kong-proxy
                port:
                  number: 443
