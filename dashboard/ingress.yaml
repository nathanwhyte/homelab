# An IngressRouteTCP for k8s.nathanwhyte.dev was removed here 2026-07-20. It
# declared HostSNI() on the `websecure` entrypoint with no `tls:` block, which
# Traefik rejects outright — "invalid rule: has HostSNI matcher, but no TLS on
# router" — so it never routed anything and only produced repeating errors in
# the Traefik log. The Ingress below already serves this host.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-dashboard-ingress
  namespace: kubernetes-dashboard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # traefik.ingress.kubernetes.io/router.middlewares: k8s-dashboard-lan-only@kubernetescrd
    # ^ blocked: Traefik's kubernetescrd provider currently fails to resolve
    # ANY Middleware CRD ref cluster-wide ("middleware ... does not exist"),
    # confirmed live 2026-07-02 even for pre-existing middlewares
    # (hermes-lan-only, viking-openviking-basicauth) after a full Traefik
    # restart. Re-enable once that's fixed — see the filed bug.
spec:
  rules:
    - host: k8s.nathanwhyte.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubernetes-dashboard-kong-proxy
                port:
                  number: 443
