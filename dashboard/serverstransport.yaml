# Traefik -> Kong backend transport for the Kubernetes Dashboard.
#
# The dashboard's Ingress targets `kubernetes-dashboard-kong-proxy:443`, and
# Kong serves TLS there with a self-signed certificate. Traefik connects to the
# backend by pod IP, and Kong's cert carries no IP SANs, so verification fails
# and every request 500s:
#
#   tls: failed to verify certificate: x509: cannot validate certificate for
#   10.42.2.3 because it doesn't contain any IP SANs
#
# Kong itself is healthy — `curl -k https://<clusterIP>:443/` returns 200.
# Skipping verification is appropriate here: the hop is pod-to-pod inside the
# cluster, and the certificate is self-signed by design.
#
# Referenced from the Kong proxy Service via
#   traefik.ingress.kubernetes.io/service.serverstransport:
#     kubernetes-dashboard-kong-transport@kubernetescrd
#
# That ref is <namespace>-<name>@kubernetescrd — how Traefik's kubernetescrd
# provider namespaces CRDs. `kong-transport` in namespace `kubernetes-dashboard`
# is addressed as `kubernetes-dashboard-kong-transport`, NOT a bare
# metadata.name. Same convention as the Middleware refs elsewhere in this repo
# (e.g. viking-openviking-https-redirect@kubernetescrd).
#
# The Service is Helm-managed. Chart 7.14.0 exposes `kong.proxy.annotations`, so
# deploy-dashboard.sh sets the annotation through chart values — a post-upgrade
# `kubectl annotate` would be stripped by any helm upgrade run outside that
# script, silently restoring the 500.
#
# Added 2026-07-20, and it resolves: the dashboard went 500 -> 200 on the first
# reload with no resolution error. Worth recording because BUG-1031 has Traefik's
# kubernetescrd provider failing to resolve *any* Middleware ref cluster-wide —
# ServersTransport goes through the same provider and works, so that bug is
# Middleware-specific rather than provider-wide.
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: kong-transport
  namespace: kubernetes-dashboard
spec:
  insecureSkipVerify: true
