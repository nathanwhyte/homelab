# Daily Longhorn backup of every volume in the `default` recurring-job group to
# the R2 backup target (IMPR-1478 Phase 4).
#
# Which volumes: Longhorn puts a volume with no recurring-job label into
# `default` implicitly. Volumes that must never be snapshotted or backed up
# (Loki, Prometheus, Alertmanager per IMPR-1125; caches; test data; media,
# which has its own rclone sync) carry recurring-job-group.longhorn.io/manual on
# their PVC instead, a group no RecurringJob belongs to.
# longhorn/replica-policy.yaml is the record and `replica-policy.py --check`
# verifies the labels; apply this file only when that check exits 0, or a cron
# tick can catch a volume whose exemption has not reached its Volume CR.
#
# Most exemption labels are live-only: Loki's and Alertmanager's claims come
# from chart volumeClaimTemplates (immutable on a StatefulSet) and were labelled
# by hand on 2026-11-08; only Prometheus's is re-applied by a script
# (grafana/apply-prometheus-filesystem-trim.sh). A recreated claim lands in
# `default` and is backed up and snapshotted at the next run, so run
# `replica-policy.py --check` after redeploying the observability stack or any
# exempt workload, and relabel what it reports.
#
# A backup always takes a snapshot first, and Longhorn keeps the latest backup
# snapshot per job on disk (auto-cleanup-recurring-job-backup-snapshot), which
# is why the observability volumes must stay out of this group.
#
# Time: Longhorn turns this into a CronJob with no timeZone, so the cron runs
# on kube-controller-manager's clock, which is America/Chicago on timmy
# (copyparty's `0 4 * * *` fires at 10:00Z in standard time). 02:00 Chicago
# leaves 90 minutes before the k3s datastore backup (03:30) and two hours before
# copyparty's 04:00 snapshot. The first run (2026-11-09) wrote backups from
# 08:00Z to 10:18Z, 02:00 to 04:18 Chicago, so it overran both; whether to move
# the slot waits on how long the incremental runs take.
#
# Traffic: the first run is a full backup of every enrolled volume. It measured
# 76.2 GiB across 19 backups on 2026-11-09 (sum of backups.longhorn.io
# status.size), not the 45 GiB estimated on 2026-11-08. Every later run is
# incremental: Longhorn stores a volume as 2 MB checksum-addressed blocks and
# uploads only the changed ones. full-backup-interval is "0" (2026-11-10), so it
# never re-uploads every block. The cost is that a block corrupted in R2 is
# never rewritten; the restore drill is the check for that.
# concurrency: 1 serializes this job's volumes but caps no bandwidth.
#
# Retention: retain 1 (2026-11-10) keeps only the latest backup per volume in
# R2. That backup is complete for a restore, but there is no older point to roll
# back to: a deletion or corruption is copied over the only R2 copy at the next
# run. copyparty's own 7 daily snapshots stay on its disk.
# copyparty (162 GiB) joins by its own PVC label, not the group, after its
# one-off first full backup `impr1478-copyparty-first` (decision A1), which ran
# 2026-11-10 20:45Z to 2026-11-11 02:57Z and uploaded 63.7 GiB
# (status.newlyUploadDataSize) with Garage healthy throughout.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: longhorn-system
spec:
  cron: "0 2 * * *"
  task: backup
  groups: [default]
  retain: 1
  concurrency: 1
  labels:
    policy: daily
  parameters:
    full-backup-interval: "0"
