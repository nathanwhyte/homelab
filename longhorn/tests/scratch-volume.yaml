# Apply explicitly for the alert drill; never included by the deploy script.
apiVersion: v1
kind: Namespace
metadata:
  name: storage-alert-drill
  labels:
    purpose: storage-alert-drill
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-alert-drill
  labels:
    purpose: storage-alert-drill
provisioner: driver.longhorn.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scratch
  namespace: storage-alert-drill
spec:
  storageClassName: storage-alert-drill
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: scratch
  namespace: storage-alert-drill
spec:
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: timmy
  containers:
    - name: scratch
      image: busybox:1.37.0
      command: [sh, -c, "printf 'storage-alert-drill\n' > /data/probe; sleep 86400"]
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
      volumeMounts:
        - name: scratch
          mountPath: /data
  volumes:
    - name: scratch
      persistentVolumeClaim:
        claimName: scratch
