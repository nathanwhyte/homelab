---
# Longhorn Helm Chart Values
# Chart: longhorn/longhorn v1.11.1
#
# Install with:
#   helm repo add longhorn https://charts.longhorn.io
#   helm repo update
#   helm upgrade --install longhorn longhorn/longhorn \
#     --namespace longhorn-system --create-namespace \
#     -f longhorn/longhorn-values.yaml --version 1.11.1

# Default StorageClass configuration
persistence:
  defaultClass: true
  defaultFsType: ext4
  defaultClassReplicaCount: 1
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  disableRevisionCounter: "true"

# Default settings
defaultSettings:
  priorityClass: "longhorn-critical"
  disableRevisionCounter: '{"v1":"true"}'
  guaranteedInstanceManagerCPU: '{"v1":"2","v2":"2"}'
  # After shrinking from five Longhorn nodes to three, keep future volumes
  # minimally rebalanced without the churn of best-effort balancing.
  replicaAutoBalance: "least-effort"

# Default backup target for manual off-cluster backups to Cloudflare R2.
# Credentials live in the longhorn-r2-backup-target secret.
defaultBackupStore:
  backupTarget: "s3://homelab@auto/cluster/homelab-k3s/longhorn/"
  backupTargetCredentialSecret: "longhorn-r2-backup-target"
  pollInterval: 900

# Ingress for Longhorn UI
ingress:
  enabled: true
  ingressClassName: traefik
  host: longhorn.nathanwhyte.dev
  path: /
  annotations:
    # websecure (not web) so Traefik terminates TLS for this host. Required
    # because `.dev` is HSTS-preloaded — browsers refuse plain HTTP outright,
    # and port 443 previously answered with Traefik's self-signed default cert.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # BasicAuth (IMPR-1020, added 2026-07-21). Longhorn's frontend has NO auth of
    # its own — before this, an unauthenticated GET returned 200 and a usable
    # storage admin console that can detach and delete volumes.
    #
    # An `ipAllowList` middleware sat here until 2026-07-21 and filtered nothing:
    # klipper-lb masquerades the client inside the svclb-traefik pod, beneath
    # kube-proxy, so Traefik saw a node IP as ClientHost and it matched the
    # allowlist's own 192.168.1.0/24 (BUG-1057; `externalTrafficPolicy: Local`
    # does not fix that — it governs kube-proxy's SNAT, which never gets a say).
    #
    # BasicAuth is immune to that failure mode: it checks the Authorization
    # HEADER, which klipper does not rewrite. That is precisely why an auth-layer
    # control replaced the network-layer one rather than another CIDR rule.
    #
    # Namespace-prefixed ref per BUG-1031 (`<namespace>-<name>@kubernetescrd`) —
    # the unprefixed form silently 404s the whole router.
    # Credentials: secret `longhorn-auth-secret`, see longhorn/middleware.yaml
    # and longhorn-auth-secret.yaml.example.
    traefik.ingress.kubernetes.io/router.middlewares: longhorn-system-longhorn-basicauth@kubernetescrd
    # DNS-01 issuance, so the host does not need to be publicly reachable.
    # NOTE 2026-08-24 (PROJ-1018): the public A record was DELETED. The name now
    # resolves only via the Pi-hole local records (network/pihole/) on LAN and
    # Tailscale split DNS off-LAN. DNS-01 is unaffected — it creates a temporary
    # TXT record via the Cloudflare API and never needed the A record.
    # It previously resolved to 192.168.1.19
    # (timmy's LAN IP, where Traefik listens), not the tunnel. Deliberately NOT
    # timmy's tailnet IP: `tailscale serve` binds :443 there and rejects any
    # other SNI, so the request would never reach Traefik. Off-LAN access rides
    # manu's 192.168.1.0/24 subnet route and needs `--accept-routes`.
    # Same pattern as harbor-tls / openviking-tls.
    cert-manager.io/cluster-issuer: letsencrypt-prod
  # NB: this chart takes `tls` as a BOOLEAN plus a separate `tlsSecret` name —
  # not the list-of-hosts form used by a raw Kubernetes Ingress. Passing the
  # list form silently falls back to the chart default (`longhorn.local-tls`).
  tls: true
  tlsSecret: longhorn-tls

# Network policies (k3s)
networkPolicies:
  enabled: false
  type: "k3s"
