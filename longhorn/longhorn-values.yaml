---
# Longhorn Helm Chart Values
# Chart: longhorn/longhorn (version read from the cluster; see deploy-longhorn.sh)
#
# Reapply values: longhorn/deploy-longhorn.sh
# Upgrade the chart: longhorn/upgrading.md

# Default StorageClass configuration
persistence:
  defaultClass: true
  defaultFsType: ext4
  defaultClassReplicaCount: 1
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  disableRevisionCounter: "true"

# Default settings
defaultSettings:
  priorityClass: "longhorn-critical"
  disableRevisionCounter: '{"v1":"true"}'
  guaranteedInstanceManagerCPU: '{"v1":"2","v2":"2"}'
  # After shrinking from five Longhorn nodes to three, keep future volumes
  # minimally rebalanced without the churn of best-effort balancing.
  replicaAutoBalance: "least-effort"
  # 30 min (chart default 600 s). How long Longhorn waits, after a replica
  # fails, before building a REPLACEMENT elsewhere — which is also how long the
  # failed replica has to come back and be reused with a delta resync. A node
  # maintenance cycle (drain, reboot, Ready) keeps a replica down for ~5-15 min,
  # well past 600 s, so every cycle used to re-copy whole replicas: copyparty's
  # 48 GiB over HDD dominated the Longhorn gate at 20-45 min per node
  # (GUIDE-1070, IDEA-1105 session 2026-09-17). Reuse needs the interval, not
  # just fastReplicaRebuild.
  #
  # The trade is patience on a genuinely dead node: a replacement replica waits
  # 30 min. Two-replica volumes keep serving from the surviving replica
  # meanwhile, and large volumes run one replica with R2 as the other copy
  # (longhorn/replica-policy.yaml), so nothing is left without a copy while it
  # waits.
  replicaReplenishmentWaitInterval: "1800"

  # The settings below matched live before IMPR-1478 wrote them down (except
  # nodeDownPodDeletionPolicy), so a reinstall or chart upgrade cannot drift
  # them back to chart defaults silently.
  #
  # When a node is down, force-delete its StatefulSet and Deployment pods once
  # Kubernetes has evicted them (Terminating past their deletion time), so the
  # replacements can start. kube-scheduler places a replacement on any node its
  # constraints allow, and Longhorn attaches the volume there, served by the
  # surviving replica (over the network unless it is local). A volume whose only
  # replica was on the dead node still cannot attach, and a pod pinned to that
  # node stays Pending. The default, do-nothing, leaves pods Terminating until
  # the node returns, which made second replicas useless for fail-over.
  nodeDownPodDeletionPolicy: "delete-both-statefulset-and-deployment-pod"
  # A drain stops before evicting the last healthy replica of a volume.
  nodeDrainPolicy: "block-if-contains-last-replica"
  # Recover a volume whose replicas all failed by picking the newest usable one.
  autoSalvage: "true"
  # Hard anti-affinity: two replicas of one volume never share a node.
  replicaSoftAntiAffinity: "false"
  defaultDataLocality: "disabled"
  # The scheduling floor that keeps wemby's NVMe (232 GB, ~55 GB free) out of
  # new placements; volume-inventory.md records the effect.
  storageMinimalAvailablePercentage: "25"
  # Create a volume even when fewer nodes than its replica count can take it.
  allowVolumeCreationWithDegradedAvailability: "true"
  # Off: orphans are reviewed and deleted by hand (IMPR-1478 Phase 2).
  orphanResourceAutoDeletion: ""

# Default backup target: Cloudflare R2, written nightly by the backup-daily
# RecurringJob (longhorn/backup-policy.yaml, IMPR-1478) and by manual backups.
# Credentials live in the longhorn-r2-backup-target secret.
defaultBackupStore:
  backupTarget: "s3://homelab@auto/cluster/homelab-k3s/longhorn/"
  backupTargetCredentialSecret: "longhorn-r2-backup-target"
  pollInterval: 900

# Ingress for Longhorn UI
ingress:
  enabled: true
  ingressClassName: traefik
  host: longhorn.nathanwhyte.dev
  path: /
  annotations:
    # websecure (not web) so Traefik terminates TLS for this host. Required
    # because `.dev` is HSTS-preloaded — browsers refuse plain HTTP outright,
    # and port 443 previously answered with Traefik's self-signed default cert.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # BasicAuth (IMPR-1020, added 2026-07-21). Longhorn's frontend has NO auth of
    # its own — before this, an unauthenticated GET returned 200 and a usable
    # storage admin console that can detach and delete volumes.
    #
    # An `ipAllowList` middleware sat here until 2026-07-21 and filtered nothing:
    # klipper-lb masquerades the client inside the svclb-traefik pod, beneath
    # kube-proxy, so Traefik saw a node IP as ClientHost and it matched the
    # allowlist's own 192.168.1.0/24 (BUG-1057; `externalTrafficPolicy: Local`
    # does not fix that — it governs kube-proxy's SNAT, which never gets a say).
    #
    # BasicAuth is immune to that failure mode: it checks the Authorization
    # HEADER, which klipper does not rewrite. That is precisely why an auth-layer
    # control replaced the network-layer one rather than another CIDR rule.
    #
    # Namespace-prefixed ref per BUG-1031 (`<namespace>-<name>@kubernetescrd`) —
    # the unprefixed form silently 404s the whole router.
    # Credentials: secret `longhorn-auth-secret`, see longhorn/middleware.yaml
    # and longhorn-auth-secret.yaml.example.
    traefik.ingress.kubernetes.io/router.middlewares: longhorn-system-longhorn-basicauth@kubernetescrd
    # DNS-01 issuance, so the host does not need to be publicly reachable.
    # NOTE 2026-08-24 (PROJ-1018): the public A record was DELETED. The name now
    # resolves only via the Pi-hole local records (network/pihole/) on LAN and
    # Tailscale split DNS off-LAN. DNS-01 is unaffected — it creates a temporary
    # TXT record via the Cloudflare API and never needed the A record.
    # It previously resolved to 192.168.1.19
    # (timmy's LAN IP, where Traefik listens), not the tunnel. Deliberately NOT
    # timmy's tailnet IP: `tailscale serve` binds :443 there and rejects any
    # other SNI, so the request would never reach Traefik. Off-LAN access rides
    # manu's 192.168.1.0/24 subnet route and needs `--accept-routes`.
    # Same pattern as harbor-tls / openviking-tls.
    cert-manager.io/cluster-issuer: letsencrypt-prod
  # NB: this chart takes `tls` as a BOOLEAN plus a separate `tlsSecret` name —
  # not the list-of-hosts form used by a raw Kubernetes Ingress. Passing the
  # list form silently falls back to the chart default (`longhorn.local-tls`).
  tls: true
  tlsSecret: longhorn-tls

# Network policies (k3s)
networkPolicies:
  enabled: false
  # Chart 1.12.1 adds this key, default true, which renders six NetworkPolicies
  # even with `enabled: false`. Its longhorn-manager policy admits only Longhorn's
  # own pods, so Prometheus in `grafana` could no longer scrape :9500 (the
  # IMPR-1119 alerts) and anything else calling the manager API from outside
  # longhorn-system would be cut off too. Kept off to match 1.12.0; adopting it
  # needs an allow rule for those clients first.
  restrictInternalTraffic: false
  type: "k3s"
