---
# Ollama deployment variant for benchmarking the Vulkan backend on timmy's
# RX 9070 XT. Based on llama/ollama-deployment.yaml but uses the non-ROCm
# Ollama image and GGML_VK_VISIBLE_DEVICES for discrete-GPU selection.
#
# Apply only for benchmark sessions; the production deployment remains the
# ROCm-based llama/ollama-deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llama
  labels:
    app: ollama
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        kubernetes.io/hostname: timmy
        gpu.vendor: amd
      securityContext:
        fsGroup: 0
      containers:
        - name: ollama
          # Non-ROCm image with Vulkan enabled by default in Ollama 0.30+.
          # ROCm gfx1201 validation does not apply here; this is a benchmark-only
          # backend comparison.
          image: ollama/ollama:0.31.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              ollama serve &
              OLLAMA_PID=$!
              /scripts/startup.sh
              wait $OLLAMA_PID
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0
            - name: OLLAMA_CONTEXT_LENGTH
              value: "32768"
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
            - name: OLLAMA_KV_CACHE_TYPE
              value: q4_0
            # Keep model resident during benchmark sessions to avoid reloads
            # between workload levels.
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            - name: OLLAMA_LOAD_TIMEOUT
              value: 15m
            - name: OLLAMA_NUM_PARALLEL
              value: "8"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            # Explicitly enable Vulkan (redundant on 0.30+, but harmless).
            - name: OLLAMA_VULKAN
              value: "1"
            # Device selection: on timmy the Vulkan device order is reversed
            # relative to ROCm, and the iGPU (PCI 1002:164E) is enumerated.
            # HIP_VISIBLE_DEVICES=0 picks the discrete RX 9070 XT under ROCm;
            # under Vulkan we need GGML_VK_VISIBLE_DEVICES to exclude the iGPU.
            # Start with index 1 (discrete) and verify with `ollama ps` / logs.
            - name: GGML_VK_VISIBLE_DEVICES
              value: "1"
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
          securityContext:
            privileged: true
          startupProbe:
            tcpSocket:
              port: 11434
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /tmp/startup-complete
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          volumeMounts:
            - name: model-cache
              mountPath: /root/.ollama
            - name: shm
              mountPath: /dev/shm
            - name: startup
              mountPath: /scripts
        - name: ollama-exporter
          image: python:3.12-slim
          command:
            - python3
            - /scripts/ollama-exporter.py
          args:
            - --ollama
            - http://localhost:11434
            - --port
            - "9111"
          ports:
            - containerPort: 9111
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: startup
              mountPath: /scripts
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llama-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: startup
          configMap:
            name: ollama-startup
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llama
  labels:
    app: ollama
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  externalIPs:
    - 192.168.1.19
  ports:
    - name: http
      port: 11434
      protocol: TCP
      targetPort: 11434
    - name: metrics
      port: 9111
      protocol: TCP
      targetPort: 9111
  selector:
    app: ollama
