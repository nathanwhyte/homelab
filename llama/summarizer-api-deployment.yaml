---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: summarizer-api
  namespace: llama
  labels:
    app: summarizer-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: summarizer-api
  template:
    metadata:
      labels:
        app: summarizer-api
    spec:
      containers:
        - name: summarizer-api
          image: registry.nathanwhyte.dev/robots/summarizer-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: LLM_URL
              value: "http://qwen-summarizer-llm.llama.svc.cluster.local/v1/chat/completions"
            - name: LLM_MODEL
              value: "qwen3-8b"
            - name: OPENVIKING_URL
              value: "http://openviking.viking.svc.cluster.local:1933"
            - name: OPENVIKING_KEY
              value: "47067ca1b704af555e417d8abf18ceebfa2e54f88e08b7d66db6f457d51fff55"
            - name: OPENVIKING_ACCOUNT
              value: "default"
            - name: OPENVIKING_USER
              value: "noot"
            - name: MAX_LLM_CONCURRENT
              value: "2"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: summarizer-api
  namespace: llama
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8082
  selector:
    app: summarizer-api
  sessionAffinity: None
