---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: summarizer-api
  namespace: llama
  labels:
    app: summarizer-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: summarizer-api
  template:
    metadata:
      labels:
        app: summarizer-api
    spec:
      containers:
        - name: summarizer-api
          image: python:3.12-slim
          command:
            - python3
            - /app/app.py
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: LLM_URL
              value: "http://qwen-summarizer-llm.llama.svc.cluster.local/v1/chat/completions"
            - name: LLM_MODEL
              value: "qwen3-8b"
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: app-code
          configMap:
            name: summarizer-api-code
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: summarizer-api
  namespace: llama
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8082
  selector:
    app: summarizer-api
  sessionAffinity: None
