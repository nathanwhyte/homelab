---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llama
  labels:
    app: ollama
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        kubernetes.io/hostname: timmy
        gpu.vendor: amd
      securityContext:
        fsGroup: 0
      containers:
        - name: ollama
          # Vulkan backend is the default in Ollama 0.30+ and is faster than ROCm
          # on timmy's RX 9070 XT (RDNA4). See INFO-1084 for benchmark findings.
          image: ollama/ollama:0.31.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              ollama serve &
              OLLAMA_PID=$!
              /scripts/startup.sh
              wait $OLLAMA_PID
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0
            # 32768: ceiling for benchmark/agentic workloads (cluster-agentic.toml
            # uses num_ctx=32768). Ollama allocates KV on demand, so this does not
            # pre-allocate 32K worth of cache; it just permits per-request num_ctx up
            # to this value. Production Hermes/mem0 workloads stay at 16K or below.
            - name: OLLAMA_CONTEXT_LENGTH
              value: "32768"
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
            - name: OLLAMA_KV_CACHE_TYPE
              value: q4_0
            # Keep the working model resident to avoid reload latency for Hermes/mem0
            # and other always-on cluster services. Trade-off: GPU stays warm and the
            # case fans may spin periodically even when no requests are in flight.
            # The previous 3m unload was chosen to keep temps/fan noise down; -1
            # prioritizes latency and slot stability over idle acoustics.
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            # Allow large model pulls from cluster registry over slow paths.
            - name: OLLAMA_LOAD_TIMEOUT
              value: 15m
            # 8 slots: matches the benchmark suite's cluster-agentic config
            # (max_concurrency=8). q4_0 KV keeps 8×32K slots within the 16 GB VRAM
            # budget for typical agentic prompt lengths. Production Hermes currently
            # peaks at 5 sub-agents + 1 mem0 extraction, so 8 is generous headroom.
            - name: OLLAMA_NUM_PARALLEL
              value: "8"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            # Explicitly enable Vulkan (redundant on 0.30+, but harmless).
            - name: OLLAMA_VULKAN
              value: "1"
            # Device selection: on timmy the Vulkan device order is reversed
            # relative to ROCm, and the iGPU (PCI 1002:164E) is enumerated first.
            # HIP_VISIBLE_DEVICES=0 picked the discrete RX 9070 XT under ROCm;
            # under Vulkan we need GGML_VK_VISIBLE_DEVICES to exclude the iGPU.
            - name: GGML_VK_VISIBLE_DEVICES
              value: "1"
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
              amd.com/gpu: "2"
            limits:
              cpu: "8"
              memory: 16Gi
              # De-privileged (IMPR-1022): device-plugin injection replaces
              # privileged (which exposed ALL host devices). The plugin registers
              # both the iGPU and the 9070 XT on timmy; requesting 2 keeps the
              # container's device enumeration identical to the host so
              # HIP_VISIBLE_DEVICES / GGML_VK_VISIBLE_DEVICES selection is
              # unchanged. Nothing else schedules AMD GPUs. Verify GPU offload in
              # `ollama ps` on next rollout before trusting this in production.
              amd.com/gpu: "2"
          startupProbe:
            tcpSocket:
              port: 11434
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /tmp/startup-complete
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          volumeMounts:
            - name: model-cache
              mountPath: /root/.ollama
            - name: shm
              mountPath: /dev/shm
            - name: startup
              mountPath: /scripts
        - name: ollama-exporter
          image: python:3.12-slim
          command:
            - python3
            - /scripts/ollama-exporter.py
          args:
            - --ollama
            - http://localhost:11434
            - --port
            - "9111"
          ports:
            - containerPort: 9111
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: startup
              mountPath: /scripts
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llama-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: startup
          configMap:
            name: ollama-startup
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llama
  labels:
    app: ollama
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  externalIPs:
    - 192.168.1.19
  ports:
    - name: http
      port: 11434
      protocol: TCP
      targetPort: 11434
    - name: metrics
      port: 9111
      protocol: TCP
      targetPort: 9111
  selector:
    app: ollama
