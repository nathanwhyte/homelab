---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llama
  labels:
    app: ollama
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        kubernetes.io/hostname: timmy
        gpu.vendor: amd
      securityContext:
        fsGroup: 0
      containers:
        - name: ollama
          # ROCm gfx1201 validated: llama/docs/2026-06-28-rocm-gfx1201-validation-baseline.md
          image: ollama/ollama:0.30.6-rocm
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              ollama serve &
              OLLAMA_PID=$!
              /scripts/startup.sh
              wait $OLLAMA_PID
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0
            # 16384 (was 8192): mem0's v2.0.6 ADDITIVE_EXTRACTION_PROMPT is ~9-10K
            # tokens; at 8192 it was truncated and local models emitted "{" then
            # stopped. 16384 fits the prompt so local gemma4:12b extracts correctly
            # (no cloud model needed). KV cache grows accordingly (q4_0, ×NUM_PARALLEL).
            - name: OLLAMA_CONTEXT_LENGTH
              value: "16384"
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
            - name: OLLAMA_KV_CACHE_TYPE
              value: q4_0
            - name: OLLAMA_KEEP_ALIVE
              value: 3m
            # 6 slots: sized for the mem0 + Hermes cohabitation design (INFO-055).
            # Worst-case concurrent local generations = up to 5 Hermes sub-agents
            # (max_concurrent_children) + 1 mem0 extraction. q4_0 KV @16k is ~0.25 GB
            # per slot, so 6 slots ≈ 7.2 GB weights + ~1.5 GB KV ≈ 8.7 GB / 16 GB.
            - name: OLLAMA_NUM_PARALLEL
              value: "6"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            # RDNA4 guardrail: keeps container on discrete RX 9070 XT, not iGPU.
            # Do NOT set HSA_OVERRIDE_GFX_VERSION — gfx1201 is native.
            - name: HIP_VISIBLE_DEVICES
              value: "0"
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
          securityContext:
            privileged: true
          startupProbe:
            tcpSocket:
              port: 11434
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /tmp/startup-complete
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          volumeMounts:
            - name: model-cache
              mountPath: /root/.ollama
            - name: shm
              mountPath: /dev/shm
            - name: startup
              mountPath: /scripts
            - name: rocblas-library
              mountPath: /opt/rocm/lib/rocblas/library
        - name: ollama-exporter
          image: python:3.12-slim
          command:
            - python3
            - /scripts/ollama-exporter.py
          args:
            - --ollama
            - http://localhost:11434
            - --port
            - "9111"
          ports:
            - containerPort: 9111
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: startup
              mountPath: /scripts
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llama-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: startup
          configMap:
            name: ollama-startup
            defaultMode: 0755
        - name: rocblas-library
          hostPath:
            path: /opt/rocm-7.2.1/lib/rocblas/library
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llama
  labels:
    app: ollama
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  externalIPs:
    - 192.168.1.19
  ports:
    - name: http
      port: 11434
      protocol: TCP
      targetPort: 11434
    - name: metrics
      port: 9111
      protocol: TCP
      targetPort: 9111
  selector:
    app: ollama
