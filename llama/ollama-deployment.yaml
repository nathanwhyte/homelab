---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llama
  labels:
    app: ollama
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        kubernetes.io/hostname: timmy
        gpu.vendor: amd
      securityContext:
        fsGroup: 0
      containers:
        - name: ollama
          # Vulkan backend is the default in Ollama 0.30+ and is faster than ROCm
          # on timmy's RX 9070 XT (RDNA4). See INFO-1084 for benchmark findings.
          image: ollama/ollama:0.31.1
          imagePullPolicy: IfNotPresent
          # CAP_PERFMON: with MAX_LOADED_MODELS=2, Ollama needs real free-VRAM
          # readings to pack two runners safely; under Vulkan on a de-privileged pod
          # it otherwise falls back to model-size estimates. PERFMON is a narrow
          # perf-monitoring capability, not privileged — the pod stays de-privileged
          # per IMPR-1022 in every other respect. (Requires the llama namespace to
          # permit added capabilities; verify the pod is admitted on next rollout.)
          securityContext:
            capabilities:
              add: ["PERFMON"]
          command:
            - /bin/bash
            - -c
          args:
            # Detach model warmup (startup.sh polls until the server answers), then
            # exec `ollama serve` as PID 1 so it receives SIGTERM directly for a clean
            # shutdown — simpler and better-behaved than the previous
            # `serve & … wait $PID` wrapper. startup.sh touches /tmp/startup-complete
            # when done (the readinessProbe gates on it); if it fails it just exits
            # in the background without taking down the server (unchanged semantics).
            - |
              /scripts/startup.sh &
              exec ollama serve
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0
            # 32768: ceiling for benchmark/agentic workloads (cluster-agentic.toml
            # uses num_ctx=32768). Ollama allocates KV on demand, so this does not
            # pre-allocate 32K worth of cache; it just permits per-request num_ctx up
            # to this value. Production Hermes/mem0 workloads stay at 16K or below.
            - name: OLLAMA_CONTEXT_LENGTH
              value: "32768"
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
            - name: OLLAMA_KV_CACHE_TYPE
              value: q4_0
            # Keep the working model resident to avoid reload latency for Hermes/mem0
            # and other always-on cluster services. Trade-off: GPU stays warm and the
            # case fans may spin periodically even when no requests are in flight.
            # The previous 3m unload was chosen to keep temps/fan noise down; -1
            # prioritizes latency and slot stability over idle acoustics.
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            # Allow large model pulls from cluster registry over slow paths.
            - name: OLLAMA_LOAD_TIMEOUT
              value: 15m
            # 4 slots (was 8): NUM_PARALLEL is per-resident-model, and with
            # MAX_LOADED_MODELS=2 that slot KV is now paid for BOTH runners (chat +
            # FIM) on one 16 GB card. Real local concurrency is low — FIM
            # edit-prediction is single-editor (~1-2 in flight, tiny Minuet
            # context_window=1024 slots) and the heavy agentic fan-out is cloud-primary
            # routed, so the local chat model rarely sees more than a few concurrent
            # requests. 4 covers a modest agentic burst while halving per-model slot KV
            # vs 8; a larger local fan-out would queue, acceptable under cloud-primary
            # routing. (Benchmark runs that want the old 8-wide config set it per-run.)
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
            # 2 (was 1): the OV embedder was relocated off this card to manu's GTX
            # 1080 (IMPR-1077, 2026-07-17), freeing ~5 GB, so the 9070 XT is now a
            # single-tenant Ollama card that can hold two resident runners — chat +
            # the qwen2.5-coder:fim edit-prediction model — instead of evicting one
            # for the other under KEEP_ALIVE=-1. Enables IMPR-1067 deliverable 2
            # (declared FIM residency) and IDEA-1071's cohabitation legs. Caveat:
            # under Vulkan on a de-privileged pod (IMPR-1022) Ollama packs on
            # model-size estimates, not real free-VRAM readings (needs CAP_PERFMON);
            # FIM ≈ 3.4 GB + a 12B-class chat model fits the 16 GB with margin.
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            # Device selection: on timmy the Vulkan device order is reversed
            # relative to ROCm, and the iGPU (PCI 1002:164E) is enumerated first.
            # HIP_VISIBLE_DEVICES=0 picked the discrete RX 9070 XT under ROCm;
            # under Vulkan we need GGML_VK_VISIBLE_DEVICES to exclude the iGPU.
            - name: GGML_VK_VISIBLE_DEVICES
              value: "1"
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: 1000m
              # 2026-07-06 (IMPR-1038): 4Gi -> 6Gi; host-RAM 7d peak 7.2Gi during
              # model loads even with cloud-primary routing.
              memory: 6Gi
              amd.com/gpu: "2"
            limits:
              cpu: "8"
              memory: 16Gi
              # De-privileged (IMPR-1022): device-plugin injection replaces
              # privileged (which exposed ALL host devices). The plugin registers
              # both the iGPU and the 9070 XT on timmy; requesting 2 keeps the
              # container's device enumeration identical to the host so
              # HIP_VISIBLE_DEVICES / GGML_VK_VISIBLE_DEVICES selection is
              # unchanged. Nothing else schedules AMD GPUs. Verify GPU offload in
              # `ollama ps` on next rollout before trusting this in production.
              amd.com/gpu: "2"
          startupProbe:
            tcpSocket:
              port: 11434
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /tmp/startup-complete
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          volumeMounts:
            - name: model-cache
              mountPath: /root/.ollama
            - name: shm
              mountPath: /dev/shm
            - name: startup
              mountPath: /scripts
        - name: ollama-exporter
          image: python:3.12-slim
          command:
            - python3
            - /scripts/ollama-exporter.py
          args:
            - --ollama
            - http://localhost:11434
            - --port
            - "9111"
          ports:
            - containerPort: 9111
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: startup
              mountPath: /scripts
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llama-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: startup
          configMap:
            name: ollama-startup
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llama
  labels:
    app: ollama
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  externalIPs:
    - 192.168.1.19
  ports:
    - name: http
      port: 11434
      protocol: TCP
      targetPort: 11434
    - name: metrics
      port: 9111
      protocol: TCP
      targetPort: 9111
  selector:
    app: ollama
