---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llama
  labels:
    app: ollama
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        kubernetes.io/hostname: timmy
        gpu.vendor: amd
      # `exec ollama serve` (see args below) makes ollama PID 1, and ollama has
      # no child reaper — so the backgrounded /scripts/startup.sh exits into a
      # zombie that nothing wait()s for. Two accumulate per pod start and sit in
      # the process table until the pod restarts, which the node MOTD reports as
      # "There are N zombie processes."  Sharing the process namespace makes the
      # pause container PID 1 for the pod, and pause reaps. SIGTERM delivery is
      # unaffected: the kubelet signals each container's main process directly,
      # not PID 1, so the clean-shutdown property the exec wrapper exists for is
      # preserved. Trade-off: containers in this pod (ollama, ollama-exporter)
      # can now see each other's processes in /proc.
      shareProcessNamespace: true
      securityContext:
        fsGroup: 0
      containers:
        - name: ollama
          # Production uses the Vulkan backend on timmy's RX 9070 XT (RDNA4).
          # Force it explicitly because the image also ships ROCm runner libraries.
          # See INFO-1084 for benchmark findings and device-selection details.
          # :latest (user call, 2026-08-14; was pinned 0.31.1 -> 0.32.9 for
          # nemotron-3.5-family support). imagePullPolicy stays IfNotPresent on
          # purpose: the tag resolves to the image last pulled deliberately on the
          # node, so a pod bounce cannot silently upgrade the server. To upgrade:
          # pull the new image on timmy, then bounce the pod. The manifest no
          # longer states the running version — trust /api/version and each
          # benchmark run's env capture (TASK-1186 rows before 2026-08-14 evening
          # ran on 0.31.1; later rows on 0.32.9+).
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          # CAP_PERFMON: Ollama needs real free-VRAM readings to pack the single
          # resident runner (and any ad-hoc swap) safely; under Vulkan on a
          # de-privileged pod it otherwise falls back to model-size estimates.
          # PERFMON is a narrow perf-monitoring capability, not privileged — the
          # pod stays de-privileged per IMPR-1022 in every other respect.
          # (Requires the llama namespace to permit added capabilities; verify the
          # pod is admitted on next rollout.)
          securityContext:
            capabilities:
              add: ["PERFMON"]
          command:
            - /bin/bash
            - -c
          args:
            # Detach model warmup (startup.sh polls until the server answers), then
            # exec `ollama serve` as PID 1 so it receives SIGTERM directly for a clean
            # shutdown — simpler and better-behaved than the previous
            # `serve & … wait $PID` wrapper. startup.sh touches /tmp/startup-complete
            # when done (the readinessProbe gates on it); if it fails it just exits
            # in the background without taking down the server (unchanged semantics).
            - |
              /scripts/startup.sh &
              exec ollama serve
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0
            # 32768: ceiling for benchmark/agentic workloads (cluster-agentic.toml
            # uses num_ctx=32768). Ollama allocates KV on demand, so this does not
            # pre-allocate 32K worth of cache; it just permits per-request num_ctx up
            # to this value. Production Hermes/mem0 workloads stay at 16K or below.
            # 131072 (was 32768 -> 65536 -> 131072, TASK-1188/IMPR-1114): NemoHermes
            # checks a >=64000 loaded context at onboarding and on every rebuild
            # (INFO-1142); 128K gives long-running agent tasks real room. The
            # nano-4b tenant's hybrid-Mamba KV makes this nearly free: measured
            # 7.9 GiB @64K and 8.68 GiB @128K, both 100% GPU (2026-08-14).
            # Models with Modelfile-baked num_ctx (the FIM tags) are unaffected;
            # benchmark configs always set num_ctx explicitly. Background/fork
            # agents use the nemotron-3-nano:agent-bg tag (baked num_ctx 16384)
            # so they never allocate the full window.
            - name: OLLAMA_CONTEXT_LENGTH
              value: "131072"
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
            # q8_0 (was q4_0, ea1cafc): q4_0 was needed when dual-model loading
            # first landed to fit two runners under 16 GB. That co-load is retired
            # (BUG-1037, MAX_LOADED_MODELS=1) — the headroom now covers the single
            # resident model plus ad-hoc swaps. IMPR-1083 already halved
            # NUM_PARALLEL 4->2 for the Zeta+FIM co-load, measured
            # 11.8/16 GB — 4.2 GB headroom comfortably covers q8_0's larger KV
            # (near-lossless vs f16, unlike q4_0).
            - name: OLLAMA_KV_CACHE_TYPE
              value: q8_0
            # Keep the working model resident to avoid reload latency for Hermes/mem0
            # and other always-on cluster services. Trade-off: GPU stays warm and the
            # case fans may spin periodically even when no requests are in flight.
            # The previous 3m unload was chosen to keep temps/fan noise down; -1
            # prioritizes latency and slot stability over idle acoustics.
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            # Allow large model pulls from cluster registry over slow paths.
            - name: OLLAMA_LOAD_TIMEOUT
              value: 15m
            # 2 slots (was 4, IMPR-1083): edit-prediction is inherently
            # low-concurrency (~1-2 in flight per editor), so 2 is ample. Since
            # the 2026-07-24 cutover the single resident model is
            # deepseek-coder-v2:fim (16B MoE, ~13 GB incl. 2-slot KV at 16k);
            # its MLA KV is small, but 2 slots stays right-sized for the
            # workload — raise only with a measured need.
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            # 2 (was 1): the 2026-08-30 agentpair cutover pins TWO runners —
            # agentpair:fim (2.56 GiB) + agentpair:agent-gemma4-12b (7.48 GiB),
            # measured 10.78 GiB peak on the card with 5.1 GiB free
            # (benchmarks/results/pair-cohab-20260828 + fence-mistag-20260830).
            # Any THIRD ad-hoc load still evicts a pinned half — clients must
            # pin the pair by name (agentpair:*); deepseek-coder-v2:fim stays
            # on the PVC as the rollback tag, unwarmed. OV's VLM still routes a
            # *cloud* tag (gemma4:31b-cloud) through this pod via
            # chat-ollama-proxy — cloud tags don't occupy a local slot. Under
            # Vulkan on a de-privileged pod (IMPR-1022) Ollama packs on
            # estimates unless CAP_PERFMON is set (it is, below).
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            # Backend selection. These two were set on the live Deployment but
            # never written back here, so the tracked manifest described a
            # ROCm-by-default pod while the cluster ran Vulkan — a re-apply from
            # the repo would have silently switched the backend, and a later
            # "which backend is this?" question could only be answered by
            # inspecting the live object. Reconciled 2026-08-11 against the
            # running Deployment (OLLAMA_VULKAN=1, OLLAMA_LLM_LIBRARY=vulkan).
            - name: OLLAMA_VULKAN
              value: "1"
            - name: OLLAMA_LLM_LIBRARY
              value: vulkan
            # Device selection: Vulkan/RADV enumerates in PCI order on timmy, so
            # the discrete RX 9070 XT (PCI 03:00.0, renderD128) is device 0 and
            # the Raphael iGPU (PCI 13:00.0, renderD129) is device 1 — the SAME
            # order as ROCm, not reversed.
            #
            # Corrected 2026-09-04: this was "1" (the iGPU) from 2026-08-11 until
            # now. Ollama selected the iGPU, then dropped it as integrated, and
            # fell back to CPU — `ollama ps` showed 100% CPU for both agentpair
            # models with `inference compute ... library=cpu` in the logs. Verify
            # after any change to this value with `ollama ps`; a wrong index fails
            # silently as a CPU fallback, not an error.
            - name: GGML_VK_VISIBLE_DEVICES
              value: "0"
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: 1000m
              # 2026-07-06 (IMPR-1038): 4Gi -> 6Gi; host-RAM 7d peak 7.2Gi during
              # model loads even with cloud-primary routing.
              memory: 6Gi
              amd.com/gpu: "2"
            limits:
              cpu: "8"
              memory: 16Gi
              # De-privileged (IMPR-1022): device-plugin injection replaces
              # privileged (which exposed ALL host devices). The plugin registers
              # both the iGPU and the 9070 XT on timmy; requesting 2 keeps the
              # container's device enumeration identical to the host so
              # HIP_VISIBLE_DEVICES / GGML_VK_VISIBLE_DEVICES selection is
              # unchanged. Nothing else schedules AMD GPUs. Verify GPU offload in
              # `ollama ps` on next rollout before trusting this in production.
              amd.com/gpu: "2"
          startupProbe:
            tcpSocket:
              port: 11434
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /tmp/startup-complete
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          volumeMounts:
            - name: model-cache
              mountPath: /root/.ollama
            - name: shm
              mountPath: /dev/shm
            - name: startup
              mountPath: /scripts
        - name: ollama-exporter
          image: python:3.12-slim
          command:
            - python3
            - /scripts/ollama-exporter.py
          args:
            - --ollama
            - http://localhost:11434
            - --port
            - "9111"
          ports:
            - containerPort: 9111
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: startup
              mountPath: /scripts
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llama-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: startup
          configMap:
            name: ollama-startup
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llama
  labels:
    app: ollama
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  externalIPs:
    - 192.168.1.19
  ports:
    - name: http
      port: 11434
      protocol: TCP
      targetPort: 11434
    - name: metrics
      port: 9111
      protocol: TCP
      targetPort: 9111
  selector:
    app: ollama
