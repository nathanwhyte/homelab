---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llama
  labels:
    app: ollama
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        kubernetes.io/hostname: timmy
        gpu.vendor: amd
      securityContext:
        fsGroup: 0
      containers:
        - name: ollama
          image: ollama/ollama:rocm
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              ollama serve &
              OLLAMA_PID=$!
              /scripts/startup.sh
              wait $OLLAMA_PID
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: OLLAMA_NUM_CTX
              value: "65536"
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
            - name: OLLAMA_KV_CACHE_TYPE
              value: "q4_0"
            - name: OLLAMA_KEEP_ALIVE
              value: "1h"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: HIP_VISIBLE_DEVICES
              value: "0"
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 20Gi
          securityContext:
            privileged: true
          startupProbe:
            tcpSocket:
              port: 11434
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/startup-complete"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          volumeMounts:
            - name: model-cache
              mountPath: /root/.ollama
            - name: shm
              mountPath: /dev/shm
            - name: startup
              mountPath: /scripts
            - name: rocblas-library
              mountPath: /opt/rocm/lib/rocblas/library
        - name: ollama-exporter
          image: python:3.12-slim
          command: ["python3", "/scripts/ollama-exporter.py"]
          args:
            - "--ollama"
            - "http://localhost:11434"
            - "--port"
            - "9111"
          ports:
            - containerPort: 9111
              name: metrics
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "200m"
              memory: 128Mi
          volumeMounts:
            - name: startup
              mountPath: /scripts
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llama-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: startup
          configMap:
            name: ollama-startup
            defaultMode: 0755
        - name: rocblas-library
          hostPath:
            path: /opt/rocm-7.2.1/lib/rocblas/library
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llama
  labels:
    app: ollama
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  externalIPs:
    - 192.168.1.19
  ports:
    - name: http
      port: 11434
      protocol: TCP
      targetPort: 11434
    - name: metrics
      port: 9111
      protocol: TCP
      targetPort: 9111
  selector:
    app: ollama
