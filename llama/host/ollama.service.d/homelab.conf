# systemd drop-in for the stock ollama.service on timmy (IMPR-1075).
#
# The host daemon is timmy's ONLY Ollama since the 2026-09 cutover; the k3s
# Deployment (llama/ollama-deployment.yaml, retired) used to carry this exact
# env. Keep the two in sync with llama/host/README.md, and the reference rows in
# reference/llm-config.md. Installed by llama/host/install-host-ollama.sh to
# /etc/systemd/system/ollama.service.d/homelab.conf.

[Unit]
# The cluster's ollama.llama.svc EndpointSlice points at this socket; nothing
# else may bind 11434 on the host. If klipper's svclb still holds the port
# (the old LoadBalancer Service), the bind fails with EADDRINUSE — apply
# llama/ollama-service.yaml (selector-less Service) BEFORE restarting this unit.
After=network-online.target
Wants=network-online.target
# Pull the warm unit in on first install, a manual start, and crash recovery.
# PartOf on the warm unit only propagates stops/restarts, not initial starts.
Wants=ollama-warm.service

[Service]
# Preserve the pod's 16 GiB RAM / 8 CPU limits on this control-plane node.
MemoryMax=16G
CPUQuota=800%
# Listen on every interface: LAN clients (pop's FIM lane, minuet fallback) use
# 192.168.1.19, Tailscale clients use 100.95.215.105, and the cluster reaches
# it through the selector-less Service. Was 127.0.0.1 (stock default), which
# made the host daemon unreachable from everywhere that mattered.
Environment="OLLAMA_HOST=0.0.0.0:11434"
# Model store. The stock unit runs as user `ollama` with HOME=/usr/share/ollama;
# stated explicitly so the path is not an accident of the unit's User=.
# install-host-ollama.sh --sync-models copies the retired PVC's store here.
Environment="OLLAMA_MODELS=/usr/share/ollama/.ollama/models"
# 131072: NemoHermes checks a >=64000 loaded context at onboarding
# (TASK-1188/IMPR-1114); KV is allocated on demand so this only permits
# per-request num_ctx up to the ceiling. FIM tags bake num_ctx 16384.
Environment="OLLAMA_CONTEXT_LENGTH=131072"
Environment="OLLAMA_FLASH_ATTENTION=1"
# q8_0 KV: near-lossless vs f16; headroom covers it with one resident model.
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
# Keep the resident model loaded. -1 trades idle acoustics for zero reload
# latency on the edit-prediction path.
Environment="OLLAMA_KEEP_ALIVE=-1"
Environment="OLLAMA_LOAD_TIMEOUT=15m"
# 2 slots: edit prediction is ~1-2 in flight per editor (IMPR-1083).
Environment="OLLAMA_NUM_PARALLEL=2"
# One pinned runner (deepseek-coder-v2:fim). The agentpair pair posture needs 2.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
# Vulkan on the RX 9070 XT (RDNA4). Force it: the binary also ships ROCm
# runners. RADV enumerates in PCI order — device 0 is the discrete card,
# device 1 the Raphael iGPU (BUG-1094). A wrong index fails silently as a CPU
# fallback: verify `ollama ps` AND journal GPU/backend evidence after changes.
Environment="OLLAMA_VULKAN=1"
Environment="OLLAMA_LLM_LIBRARY=vulkan"
Environment="GGML_VK_VISIBLE_DEVICES=0"
# The stock unit's Restart=always/RestartSec=3 stays in effect.
