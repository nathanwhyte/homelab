---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-ollama-proxy-config
  namespace: llama
  labels:
    app: chat-ollama-proxy
data:
  chat-ollama-proxy.py: |
    #!/usr/bin/env python3
    """Minimal Ollama reasoning-suppression shim for Hermes.

    Hermes cannot send reasoning controls to a generic Ollama provider
    (NousResearch/hermes-agent#25758, #11237), and local models (gemma4,
    qwen3.5, ...) emit a large `reasoning` field by default. That reasoning
    consumes the per-response output budget, yielding `finish_reason: length`,
    which Hermes treats as truncation and retries 3x before failing with
    `agent_incomplete`.

    This shim injects the top-level `reasoning_effort: "none"` field (which
    Ollama's OpenAI-compatible endpoint DOES respect) into
    /v1/chat/completions for non-cloud models, then transparently proxies the
    response bytes to Ollama -- streamed (SSE) or not. It does not rewrite the
    response, finish_reason, tool calls, or anything else. Context length is
    handled natively by Hermes' `model.ollama_num_ctx` injection.
    """

    import http.client
    import json
    import os
    import urllib.parse
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    OLLAMA_URL = os.environ.get("OLLAMA_URL", "http://ollama.llama.svc.cluster.local:11434")
    PORT = int(os.environ.get("PORT", "11434"))
    INJECT_REASONING_NONE = os.environ.get("INJECT_REASONING_NONE", "true").lower() in {"1", "true", "yes"}
    parsed = urllib.parse.urlparse(OLLAMA_URL)


    def is_cloud_model(model):
        return isinstance(model, str) and (model.endswith(":cloud") or "-cloud" in model)


    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def _send_json(self, status, obj):
            body = json.dumps(obj).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.send_header("Connection", "close")
            self.end_headers()
            self.close_connection = True
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/healthz":
                self._send_json(200, {"ok": True})
                return
            self._proxy()

        def do_POST(self):
            self._proxy()

        def do_PUT(self):
            self._proxy()

        def do_DELETE(self):
            self._proxy()

        def _proxy(self):
            length = int(self.headers.get("Content-Length", "0") or 0)
            body = self.rfile.read(length) if length else b""
            path = urllib.parse.urlsplit(self.path).path
            model = "unknown"

            if INJECT_REASONING_NONE and path == "/v1/chat/completions" and body:
                try:
                    payload = json.loads(body)
                    model = payload.get("model") or "unknown"
                    already = "reasoning_effort" in payload or bool(
                        isinstance(payload.get("reasoning"), dict) and payload["reasoning"].get("effort")
                    )
                    if not is_cloud_model(model) and not already:
                        payload["reasoning_effort"] = "none"
                        body = json.dumps(payload).encode()
                except Exception:
                    pass

            conn_cls = http.client.HTTPSConnection if parsed.scheme == "https" else http.client.HTTPConnection
            port = parsed.port or (443 if parsed.scheme == "https" else 80)
            conn = conn_cls(parsed.hostname, port, timeout=600)
            headers = {
                k: v for k, v in self.headers.items()
                if k.lower() not in ("host", "content-length", "connection")
            }
            headers["Host"] = parsed.netloc
            if body:
                headers["Content-Length"] = str(len(body))

            try:
                conn.request(self.command, self.path, body=body, headers=headers)
                resp = conn.getresponse()
                self.send_response(resp.status, resp.reason)
                for k, v in resp.getheaders():
                    if k.lower() in ("connection", "transfer-encoding", "content-length"):
                        continue
                    self.send_header(k, v)
                self.send_header("Connection", "close")
                self.end_headers()
                self.close_connection = True
                while True:
                    chunk = resp.read(8192)
                    if not chunk:
                        break
                    self.wfile.write(chunk)
                    self.wfile.flush()
                print(f"{self.command} {path} model={model} status={resp.status}", flush=True)
            except Exception as e:
                try:
                    self._send_json(502, {"error": {"message": f"upstream error: {e}", "type": "shim_error"}})
                except Exception:
                    pass
            finally:
                conn.close()

        def log_message(self, *args):
            pass


    if __name__ == "__main__":
        print(
            f"chat-ollama shim on :{PORT}; upstream={OLLAMA_URL}; "
            f"inject_reasoning_none={INJECT_REASONING_NONE}",
            flush=True,
        )
        ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-ollama-proxy
  namespace: llama
  labels:
    app: chat-ollama-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-ollama-proxy
  template:
    metadata:
      labels:
        app: chat-ollama-proxy
    spec:
      containers:
        - name: proxy
          image: python:3.12-slim
          command: ["python3", "/scripts/chat-ollama-proxy.py"]
          env:
            - name: OLLAMA_URL
              value: http://ollama.llama.svc.cluster.local:11434
            - name: INJECT_REASONING_NONE
              value: "true"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PORT
              value: "11434"
          ports:
            - containerPort: 11434
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 11434
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: chat-ollama-proxy-config
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: chat-ollama-proxy
  namespace: llama
  labels:
    app: chat-ollama-proxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      protocol: TCP
      targetPort: 11434
  selector:
    app: chat-ollama-proxy
