---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder-cpu
  namespace: llama
  labels:
    app: embedder-cpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedder-cpu
  template:
    metadata:
      labels:
        app: embedder-cpu
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
          args:
            - --model-id
            - sentence-transformers/all-MiniLM-L6-v2
            - --pooling
            - mean
            - --dtype
            - float32
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
