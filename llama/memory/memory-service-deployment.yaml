---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-service
  namespace: llama
  labels:
    app: memory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-service
  template:
    metadata:
      labels:
        app: memory-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - qdrant
                        - embedder-cpu
                topologyKey: kubernetes.io/hostname
      containers:
        - name: memory-service
          image: python:3.12-slim
          command:
            - python3
            - /app/app.py
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: memory-config
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: app-code
          configMap:
            name: memory-service-code
            defaultMode: 0555
