---
apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-service-code
  namespace: llama
data:
  app.py: |
    #!/usr/bin/env python3
    from __future__ import annotations

    import json
    import os
    import re
    import time
    import urllib.error
    import urllib.request
    import uuid
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer


    QDRANT_URL = os.getenv("QDRANT_URL", "http://qdrant.llama.svc.cluster.local:6333").rstrip("/")
    QDRANT_COLLECTION = os.getenv("QDRANT_COLLECTION", "chat-memory")
    GPU_EMBED_URL = os.getenv("GPU_EMBED_URL", "http://embedder-gpu.llama.svc.cluster.local:8080/embed")
    CPU_EMBED_URL = os.getenv("CPU_EMBED_URL", "http://embedder-cpu.llama.svc.cluster.local:8080/embed")
    EMBED_TIMEOUT_SECONDS = float(os.getenv("EMBED_TIMEOUT_SECONDS", "2"))
    GPU_COOLDOWN_SECONDS = int(os.getenv("GPU_COOLDOWN_SECONDS", "60"))
    RETRIEVE_TOP_K = int(os.getenv("RETRIEVE_TOP_K", "8"))
    MEMORY_MAX_CHARS = int(os.getenv("MEMORY_MAX_CHARS", "3500"))
    RECENT_TURNS = int(os.getenv("RECENT_TURNS", "6"))
    FACT_MIN_CONFIDENCE = float(os.getenv("FACT_MIN_CONFIDENCE", "0.7"))
    BIND_HOST = os.getenv("BIND_HOST", "0.0.0.0")
    BIND_PORT = int(os.getenv("BIND_PORT", "8081"))

    gpu_cooldown_until = 0.0
    collection_ready = False
    vector_size = 0

    GPU_PATTERNS = [
        re.compile(
            r"\b(?:i have|my gpu is|i am using|i'm using|im using)\s+(?:an?\s+)?((?:nvidia\s+)?(?:geforce\s+)?(?:gtx|rtx)\s*\d{3,4}(?:\s*ti)?)\b",
            re.IGNORECASE,
        ),
        re.compile(r"\b(?:gtx|rtx)\s*\d{3,4}(?:\s*ti)?\b", re.IGNORECASE),
    ]


    def now_iso() -> str:
        return datetime.now(timezone.utc).isoformat()


    def http_json(method: str, url: str, payload: dict | None, timeout: float, headers: dict | None = None) -> dict:
        data = None
        merged_headers = {"Content-Type": "application/json"}
        if headers:
            merged_headers.update(headers)
        if payload is not None:
            data = json.dumps(payload).encode("utf-8")
        req = urllib.request.Request(url=url, data=data, method=method, headers=merged_headers)
        with urllib.request.urlopen(req, timeout=timeout) as resp:
            body = resp.read().decode("utf-8")
        return json.loads(body) if body else {}


    def normalize_embed_response(response: object) -> list[float]:
        if isinstance(response, list):
            if response and isinstance(response[0], list):
                return [float(x) for x in response[0]]
            return [float(x) for x in response]
        if isinstance(response, dict):
            data = response.get("data")
            if isinstance(data, list) and data:
                emb = data[0].get("embedding") if isinstance(data[0], dict) else None
                if isinstance(emb, list):
                    return [float(x) for x in emb]
            emb = response.get("embedding")
            if isinstance(emb, list):
                return [float(x) for x in emb]
        raise ValueError("Unsupported embedding response format")


    def embed_with_url(url: str, text: str) -> list[float]:
        response = http_json("POST", url, {"inputs": [text]}, EMBED_TIMEOUT_SECONDS)
        return normalize_embed_response(response)


    def embed_text(text: str) -> tuple[list[float], str]:
        global gpu_cooldown_until
        now = time.time()

        if now >= gpu_cooldown_until:
            try:
                return embed_with_url(GPU_EMBED_URL, text), "gpu"
            except Exception:
                gpu_cooldown_until = now + GPU_COOLDOWN_SECONDS

        return embed_with_url(CPU_EMBED_URL, text), "cpu"


    def ensure_collection(dim: int) -> None:
        global collection_ready, vector_size
        if collection_ready:
            return

        get_url = f"{QDRANT_URL}/collections/{QDRANT_COLLECTION}"
        try:
            existing = http_json("GET", get_url, None, 5)
            cfg = (((existing.get("result") or {}).get("config") or {}).get("params") or {}).get("vectors") or {}
            existing_size = cfg.get("size")
            if existing_size and int(existing_size) != int(dim):
                raise RuntimeError("Qdrant collection exists with a different vector dimension")
            collection_ready = True
            vector_size = int(existing_size or dim)
            return
        except urllib.error.HTTPError as exc:
            if exc.code != 404:
                raise

        create_url = f"{QDRANT_URL}/collections/{QDRANT_COLLECTION}"
        payload = {
            "vectors": {
                "size": dim,
                "distance": "Cosine",
            }
        }
        http_json("PUT", create_url, payload, 10)
        collection_ready = True
        vector_size = dim


    def qdrant_upsert(points: list[dict]) -> None:
        if not points:
            return
        url = f"{QDRANT_URL}/collections/{QDRANT_COLLECTION}/points"
        payload = {"points": points}
        http_json("PUT", url, payload, 10)


    def qdrant_search(vector: list[float], user_id: str, limit: int) -> list[dict]:
        url = f"{QDRANT_URL}/collections/{QDRANT_COLLECTION}/points/search"
        payload = {
            "vector": vector,
            "limit": limit,
            "with_payload": True,
            "filter": {
                "must": [
                    {"key": "user_id", "match": {"value": user_id}},
                ]
            },
        }
        response = http_json("POST", url, payload, 10)
        return response.get("result") or []


    def qdrant_scroll(user_id: str, kind: str, limit: int) -> list[dict]:
        url = f"{QDRANT_URL}/collections/{QDRANT_COLLECTION}/points/scroll"
        payload = {
            "limit": limit,
            "with_payload": True,
            "filter": {
                "must": [
                    {"key": "user_id", "match": {"value": user_id}},
                    {"key": "type", "match": {"value": kind}},
                ]
            },
        }
        response = http_json("POST", url, payload, 10)
        return response.get("result", {}).get("points") or []


    def extract_facts(text: str) -> list[dict]:
        facts = []
        for pattern in GPU_PATTERNS:
            match = pattern.search(text)
            if not match:
                continue
            value = match.group(1) if match.groups() else match.group(0)
            facts.append(
                {
                    "key": "hardware.gpu",
                    "value": " ".join(value.upper().split()),
                    "confidence": 0.95,
                }
            )
            break
        return facts


    def format_memory_block(profile_facts: list[dict], semantic_hits: list[dict], recent_turns: list[dict]) -> str:
        lines: list[str] = []

        if profile_facts:
            lines.append("Known profile facts:")
            for fact in profile_facts:
                payload = fact.get("payload") or {}
                lines.append(
                    f"- {payload.get('key')}: {payload.get('value')} "
                    f"(confidence={payload.get('confidence')}, ts={payload.get('timestamp')})"
                )

        if semantic_hits:
            lines.append("Relevant prior context:")
            for hit in semantic_hits:
                payload = hit.get("payload") or {}
                text = (payload.get("content") or "").strip()
                if not text:
                    continue
                lines.append(f"- [{payload.get('role', 'memory')}] {text}")

        if recent_turns:
            lines.append("Recent conversation turns:")
            for point in recent_turns:
                payload = point.get("payload") or {}
                text = (payload.get("content") or "").strip()
                if not text:
                    continue
                lines.append(f"- [{payload.get('role', 'memory')}] {text}")

        output = "\n".join(lines).strip()
        if len(output) > MEMORY_MAX_CHARS:
            output = output[: MEMORY_MAX_CHARS - 3] + "..."
        return output


    class MemoryHandler(BaseHTTPRequestHandler):
        server_version = "memory-service/0.1"

        def log_message(self, fmt: str, *args: object) -> None:
            print(fmt % args)

        def send_json(self, status: int, payload: dict) -> None:
            body = json.dumps(payload).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def parse_json_body(self) -> dict:
            content_length = int(self.headers.get("Content-Length", "0"))
            raw = self.rfile.read(content_length) if content_length else b"{}"
            return json.loads(raw.decode("utf-8"))

        def do_GET(self) -> None:
            if self.path == "/healthz":
                self.send_json(200, {"ok": True, "timestamp": now_iso()})
                return
            self.send_json(404, {"error": "not_found"})

        def do_POST(self) -> None:
            if self.path == "/memory/upsert-turn":
                self.handle_upsert_turn()
                return
            if self.path == "/memory/retrieve":
                self.handle_retrieve()
                return
            self.send_json(404, {"error": "not_found"})

        def handle_upsert_turn(self) -> None:
            try:
                body = self.parse_json_body()
                user_id = (body.get("user_id") or "").strip()
                chat_id = (body.get("chat_id") or "").strip()
                turns = body.get("turns") or []
                timestamp = body.get("timestamp") or now_iso()

                if not user_id:
                    self.send_json(400, {"error": "user_id is required"})
                    return
                if not turns:
                    self.send_json(400, {"error": "turns is required"})
                    return

                points = []
                used_embedders = []

                for turn in turns:
                    role = (turn.get("role") or "user").strip()
                    content = (turn.get("content") or "").strip()
                    if not content:
                        continue

                    vector, embedder = embed_text(content)
                    used_embedders.append(embedder)
                    ensure_collection(len(vector))

                    points.append(
                        {
                            "id": uuid.uuid4().hex,
                            "vector": vector,
                            "payload": {
                                "type": "turn",
                                "user_id": user_id,
                                "chat_id": chat_id,
                                "role": role,
                                "content": content,
                                "timestamp": timestamp,
                            },
                        }
                    )

                    for fact in extract_facts(content):
                        if float(fact.get("confidence", 0.0)) < FACT_MIN_CONFIDENCE:
                            continue
                        fact_text = f"{fact['key']}={fact['value']}"
                        fact_vec, fact_embedder = embed_text(fact_text)
                        used_embedders.append(fact_embedder)
                        ensure_collection(len(fact_vec))
                        points.append(
                            {
                                "id": uuid.uuid4().hex,
                                "vector": fact_vec,
                                "payload": {
                                    "type": "profile_fact",
                                    "user_id": user_id,
                                    "chat_id": chat_id,
                                    "key": fact["key"],
                                    "value": fact["value"],
                                    "confidence": fact["confidence"],
                                    "timestamp": timestamp,
                                },
                            }
                        )

                qdrant_upsert(points)
                self.send_json(
                    200,
                    {
                        "ok": True,
                        "stored_points": len(points),
                        "used_embedders": sorted(set(used_embedders)),
                    },
                )
            except Exception as exc:
                self.send_json(500, {"error": "upsert_failed", "detail": str(exc)})

        def handle_retrieve(self) -> None:
            try:
                body = self.parse_json_body()
                user_id = (body.get("user_id") or "").strip()
                query = (body.get("query") or "").strip()
                top_k = int(body.get("top_k") or RETRIEVE_TOP_K)

                if not user_id:
                    self.send_json(400, {"error": "user_id is required"})
                    return
                if not query:
                    self.send_json(400, {"error": "query is required"})
                    return

                vector, used_embedder = embed_text(query)
                ensure_collection(len(vector))

                hits = qdrant_search(vector, user_id, top_k)
                facts = qdrant_scroll(user_id, "profile_fact", 50)
                turns = qdrant_scroll(user_id, "turn", max(RECENT_TURNS * 4, 20))

                sorted_facts = sorted(
                    facts,
                    key=lambda p: (p.get("payload") or {}).get("timestamp") or "",
                    reverse=True,
                )
                latest_by_key = {}
                for point in sorted_facts:
                    payload = point.get("payload") or {}
                    key = payload.get("key")
                    if key and key not in latest_by_key:
                        latest_by_key[key] = point

                sorted_turns = sorted(
                    turns,
                    key=lambda p: (p.get("payload") or {}).get("timestamp") or "",
                    reverse=True,
                )[:RECENT_TURNS]
                sorted_turns.reverse()

                memory_block = format_memory_block(list(latest_by_key.values()), hits, sorted_turns)
                self.send_json(
                    200,
                    {
                        "ok": True,
                        "used_embedder": used_embedder,
                        "memory_block": memory_block,
                        "profile_facts": len(latest_by_key),
                        "semantic_hits": len(hits),
                        "recent_turns": len(sorted_turns),
                    },
                )
            except Exception as exc:
                self.send_json(500, {"error": "retrieve_failed", "detail": str(exc)})


    def main() -> None:
        server = ThreadingHTTPServer((BIND_HOST, BIND_PORT), MemoryHandler)
        print(f"memory-service listening on {BIND_HOST}:{BIND_PORT}")
        server.serve_forever()


    if __name__ == "__main__":
        main()
