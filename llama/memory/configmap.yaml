---
apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-config
  namespace: llama
data:
  QDRANT_URL: http://qdrant.llama.svc.cluster.local:6333
  QDRANT_COLLECTION: chat-memory
  GPU_EMBED_URL: http://embedder-gpu.llama.svc.cluster.local:8080/embed
  CPU_EMBED_URL: http://embedder-cpu.llama.svc.cluster.local:8080/embed
  EMBED_TIMEOUT_SECONDS: "2"
  GPU_COOLDOWN_SECONDS: "60"
  RETRIEVE_TOP_K: "8"
  MEMORY_MAX_CHARS: "3500"
  RECENT_TURNS: "6"
