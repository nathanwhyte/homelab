---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-auth-proxy-config
  namespace: llama
data:
  # IMPR-1085: inference-route allowlist + per-consumer tokens.
  # Tokens are rendered from the ollama-api-key Secret by the init container:
  #   API_KEY       -> owner token (pre-existing key, value unchanged)
  #   JOEL_API_KEY  -> Joel's token (must exist in the Secret before this applies)
  # Add a consumer: new Secret key + map entry + init-container env/sed pair.
  # Revoke a consumer: remove their map entry or rotate their Secret key, THEN
  # `kubectl -n llama rollout restart deployment/ollama-auth-proxy` and verify
  # with `kubectl -n llama rollout status deployment/ollama-auth-proxy`.
  # The config is rendered once by the init container into an emptyDir — a
  # running pod never re-reads the Secret/ConfigMap, so a revoked token stays
  # valid until the rollout completes. The restart is part of revocation, not
  # optional hygiene.
  nginx.conf.template: |
    events {
      worker_connections 128;
    }
    http {
      # Real token lengths (44+ chars) overflow the default 64-byte map hash
      # bucket and nginx refuses to start ("could not build map_hash").
      map_hash_bucket_size 128;

      map $http_authorization $auth_user {
        default "";
        "Bearer __TOKEN_NOOT__" "noot";
        "Bearer __TOKEN_JOEL__" "joel";
      }

      log_format authlog '$remote_addr [$time_local] "$request" '
                         '$status user=$auth_user';

      upstream ollama {
        server ollama.llama.svc.cluster.local:11434;
      }

      server {
        listen 8080;
        access_log /dev/stdout authlog;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        chunked_transfer_encoding on;

        location = /health {
          return 200 'ok';
          add_header Content-Type text/plain;
        }

        # Inference surface only. Model-management routes (/api/delete,
        # /api/pull, /api/create, /api/copy, /api/push) fall through to the
        # 444 default below even with a valid token.
        location = /api/generate {
          if ($auth_user = "") { return 401 '{"error":"unauthorized"}'; }
          proxy_pass http://ollama;
        }
        location = /api/chat {
          if ($auth_user = "") { return 401 '{"error":"unauthorized"}'; }
          proxy_pass http://ollama;
        }
        location = /api/embed {
          if ($auth_user = "") { return 401 '{"error":"unauthorized"}'; }
          proxy_pass http://ollama;
        }
        location = /api/embeddings {
          if ($auth_user = "") { return 401 '{"error":"unauthorized"}'; }
          proxy_pass http://ollama;
        }
        location = /api/tags {
          if ($auth_user = "") { return 401 '{"error":"unauthorized"}'; }
          proxy_pass http://ollama;
        }
        location = /api/show {
          if ($auth_user = "") { return 401 '{"error":"unauthorized"}'; }
          proxy_pass http://ollama;
        }
        location = /api/ps {
          if ($auth_user = "") { return 401 '{"error":"unauthorized"}'; }
          proxy_pass http://ollama;
        }
        location /v1/ {
          if ($auth_user = "") { return 401 '{"error":"unauthorized"}'; }
          proxy_pass http://ollama;
        }

        # Everything else: close without a response so the surface is not
        # enumerable (IMPR-1085 acceptance criterion).
        location / {
          return 444;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-auth-proxy
  namespace: llama
  labels:
    app: ollama-auth-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-auth-proxy
  template:
    metadata:
      labels:
        app: ollama-auth-proxy
    spec:
      initContainers:
        - name: render-config
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - >-
              sed -e "s|__TOKEN_NOOT__|${TOKEN_NOOT}|"
              -e "s|__TOKEN_JOEL__|${TOKEN_JOEL}|"
              /config-template/nginx.conf.template > /config/nginx.conf
          env:
            - name: TOKEN_NOOT
              valueFrom:
                secretKeyRef:
                  name: ollama-api-key
                  key: API_KEY
            - name: TOKEN_JOEL
              valueFrom:
                secretKeyRef:
                  name: ollama-api-key
                  key: JOEL_API_KEY
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config-rendered
              mountPath: /config
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config-rendered
              mountPath: /etc/nginx
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: config-template
          configMap:
            name: ollama-auth-proxy-config
        - name: config-rendered
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-auth-proxy
  namespace: llama
  labels:
    app: ollama-auth-proxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: ollama-auth-proxy
