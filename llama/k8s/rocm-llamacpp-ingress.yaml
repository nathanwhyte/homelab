---
apiVersion: v1
kind: Secret
metadata:
  name: llama-rocm-api-key
  namespace: llama
type: Opaque
# Never inline the key (BUG-1029: a real key was committed here). Create the
# secret out-of-band before applying:
#   kubectl -n llama create secret generic llama-rocm-api-key \
#     --from-literal=API_KEY="$(openssl rand -base64 32)"
stringData:
  API_KEY: "REPLACE_ME"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: llama-rocm-api
  namespace: llama
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`llama.local`) || PathPrefix(`/llama-api`)
      kind: Rule
      services:
        - name: llama-rocm-api
          port: 80
