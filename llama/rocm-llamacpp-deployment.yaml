---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp-rocm
  namespace: llama
  labels:
    app: llamacpp-rocm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llamacpp-rocm
  template:
    metadata:
      labels:
        app: llamacpp-rocm
    spec:
      nodeSelector:
        kubernetes.io/hostname: timmy
        gpu.vendor: amd
      securityContext:
        fsGroup: 0
      initContainers:
        - name: model-fetch
          image: curlimages/curl:8.12.1
          env:
            - name: LLAMA_PRIMARY_MODEL_FILE
              value: Qwen3-8B-Q4_K_M.gguf
            - name: LLAMA_PRIMARY_MODEL_URL
              value: https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf
            - name: LLAMA_FALLBACK_MODEL_FILE
              value: Qwen3-14B-Q5_K_M.gguf
            - name: LLAMA_FALLBACK_MODEL_URL
              value: https://huggingface.co/unsloth/Qwen3-14B-GGUF/resolve/main/Qwen3-14B-Q5_K_M.gguf
            - name: LLAMA_SELECTED_MODEL_SYMLINK
              value: /models/current.gguf
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - /bin/sh
            - -c
          args:
            - >-
              set -eu;
              primary_model="/models/${LLAMA_PRIMARY_MODEL_FILE}";
              fallback_model="/models/${LLAMA_FALLBACK_MODEL_FILE}";
              if [ -f "${primary_model}" ]; then
                echo "Primary model already present in PVC cache.";
              else
                echo "Downloading primary model from ${LLAMA_PRIMARY_MODEL_URL}...";
                if curl -fL --retry 5 --retry-delay 5 "${LLAMA_PRIMARY_MODEL_URL}" -o "${primary_model}"; then
                  echo "Primary model download complete.";
                else
                  echo "Primary model download failed; using fallback model.";
                  if [ -f "${fallback_model}" ]; then
                    echo "Fallback model already present in PVC cache.";
                  else
                    echo "Downloading fallback model from ${LLAMA_FALLBACK_MODEL_URL}...";
                    curl -fL --retry 5 --retry-delay 5 "${LLAMA_FALLBACK_MODEL_URL}" -o "${fallback_model}";
                  fi;
                fi;
              fi;
              if [ -f "${primary_model}" ]; then
                ln -sf "${primary_model}" "${LLAMA_SELECTED_MODEL_SYMLINK}";
                echo "Selected primary model.";
              elif [ -f "${fallback_model}" ]; then
                ln -sf "${fallback_model}" "${LLAMA_SELECTED_MODEL_SYMLINK}";
                echo "Selected fallback model.";
              else
                echo "No model available after download attempts.";
                exit 1;
              fi
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server-rocm
          env:
            - name: HIP_VISIBLE_DEVICES
              value: "0"
          command:
            - /app/llama-server
          args:
            - --model
            - /models/current.gguf
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --ctx-size
            - "32768"
            - --n-gpu-layers
            - "999"
            - --parallel
            - "8"
            - --cache-type-k
            - q4_0
            - --cache-type-v
            - q4_0
            - --batch-size
            - "2048"
            - --ubatch-size
            - "512"
            - --cont-batching
            - --split-mode
            - none
            - --main-gpu
            - "0"
            - --mlock
            - --flash-attn
            - "on"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
              amd.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 6Gi
              amd.com/gpu: "1"
          securityContext:
            privileged: true
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llama-rocm-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
