---
apiVersion: v1
kind: Secret
metadata:
  name: ollama-api-key
  namespace: llama
type: Opaque
data:
  # base64-encoded htpasswd entry: ollama:YOUR_API_KEY_HERE
  # Generate with: htpasswd -nb ollama <password> | base64 -w 0
  users: REPLACE_WITH_BASE64_HTPASSWD
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ollama-auth
  namespace: llama
spec:
  basicAuth:
    secret: ollama-api-key
---
# HTTP → HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ollama-https-redirect
  namespace: llama
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HTTP entrypoint — redirects to HTTPS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama-redirect
  namespace: llama
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: llama-ollama-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: robots.nathanwhyte.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ollama
                port:
                  number: 80
---
# HTTPS entrypoint — with BasicAuth
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama-ingress
  namespace: llama
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: llama-ollama-auth@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - robots.nathanwhyte.dev
      secretName: ollama-tls
  rules:
    - host: robots.nathanwhyte.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ollama
                port:
                  number: 80
