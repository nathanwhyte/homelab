---
# FROZEN — May 2026 RWX → RWO migration artifacts
# These pods ran successfully and are functionally dead. Retained as
# paper trail for any future volume-class migration. Do not apply.
# See RWO-MIGRATION.md for the full runbook and rollback procedure.
# One-shot copy pods used during the RWX -> RWO migration.
apiVersion: v1
kind: Pod
metadata:
  name: harbor-jobservice-rwo-sync
  namespace: harbor
spec:
  restartPolicy: Never
  containers:
    - name: rsync
      image: alpine:3.20
      command:
        - /bin/sh
        - -c
      args:
        - apk add --no-cache rsync && rsync -aHAX --numeric-ids --delete /source/ /dest/
      volumeMounts:
        - name: source
          mountPath: /source
        - name: dest
          mountPath: /dest
  volumes:
    - name: source
      persistentVolumeClaim:
        claimName: harbor-jobservice
    - name: dest
      persistentVolumeClaim:
        claimName: harbor-jobservice-rwo
---
