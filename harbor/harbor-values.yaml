---
# Harbor Helm Chart Values
# Chart: harbor-1.19.1, App: Harbor v2.15.1
# Last refreshed: 2026-06-10 — `deploy-harbor.sh` ran a single helm upgrade
# that bumped chart 1.18.3 / app 2.14.3 -> chart 1.19.1 / app 2.15.1.
# The DB and Redis images are intentionally pinned to v2.14.3 to match
# the prior release; bump on the next planned upgrade cycle.
#
# Install with:
#   helm repo add harbor https://helm.goharbor.io
#   helm repo update
#   helm install harbor harbor/harbor -f harbor/harbor-values.yaml -n harbor --create-namespace
#
# Access:
#   Web UI: https://registry.nathanwhyte.dev
#   Docker: docker login registry.nathanwhyte.dev
#
# Default admin credentials: admin / <CHANGE_ME> (change after first login)

# Expose Harbor services
expose:
  type: ingress
  tls:
    # Enable TLS with cert-manager for automatic Let's Encrypt certificates
    enabled: true
    certSource: secret
    secret:
      # cert-manager populates this secret automatically
      secretName: harbor-tls
  ingress:
    hosts:
      core: registry.nathanwhyte.dev
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    # Harbor's nginx handles routing internally

# External URL (must match ingress host)
externalURL: https://registry.nathanwhyte.dev

# Persistence configuration
persistence:
  enabled: true
  # Resource policy: keep persistent volumes on helm delete
  resourcePolicy: "keep"
  persistentVolumeClaim:
    # Registry storage (filesystem-based on Longhorn)
    registry:
      # Pre-created in harbor/rwo-pvcs.yaml for easier rollback of old RWX PVCs.
      existingClaim: harbor-registry-rwo
      storageClass: longhorn-harbor
      accessMode: ReadWriteOnce
      size: 50Gi
    jobservice:
      jobLog:
        # Pre-created in harbor/rwo-pvcs.yaml for easier rollback of old RWX PVCs.
        existingClaim: harbor-jobservice-rwo
        storageClass: longhorn-harbor
        accessMode: ReadWriteOnce
        size: 1Gi
    database:
      # PostgreSQL data
      storageClass: longhorn-hdd
      size: 5Gi
    redis:
      # Redis data
      storageClass: longhorn-ssd
      size: 5Gi
    trivy:
      # Trivy vulnerability database
      storageClass: longhorn-ssd
      size: 5Gi

# Image pull policy
imagePullPolicy: IfNotPresent

# Harbor components configuration
harborAdminPassword: "<CHANGE_ME>" # Change after first login

# Image and chart storage (using filesystem/PVC)
imageChartStorage:
  disableredirect: false
  type: filesystem
  filesystem:
    rootdirectory: /storage

# Database (PostgreSQL)
database:
  type: internal
  internal:
    image:
      repository: goharbor/harbor-db
      tag: v2.14.3
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - harbor
                  - key: component
                    operator: In
                    values:
                      - core
                      - redis
              topologyKey: kubernetes.io/hostname

# Redis cache
redis:
  type: internal
  internal:
    image:
      repository: goharbor/redis-photon
      tag: v2.14.3
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - harbor
                  - key: component
                    operator: In
                    values:
                      - database
                      - core
              topologyKey: kubernetes.io/hostname

# Harbor Core (API server)
core:
  replicas: 1 # Single replica to avoid volume conflicts
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m
  # NOTE: Probe timeouts are patched manually on the live deployment because
  # chart v1.18.3 hardcodes them without values support. After any helm
  # upgrade, re-apply: kubectl patch deployment harbor-core -n harbor --type='json' -p='[{"op":"add","path":"/spec/template/spec/containers/0/livenessProbe/timeoutSeconds","value":5},{"op":"add","path":"/spec/template/spec/containers/0/readinessProbe/timeoutSeconds","value":5}]'
  # deploy-harbor.sh re-applies this patch automatically post-upgrade; --skip-probe-patch to opt out.
  # Allow anonymous/public pull access for projects marked as public.
  # Pushes still require authentication.
  projectCreationRestriction: "everyone"
  # Enable automatic cert generation
  enableAutoGenCert: true
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - harbor
                - key: component
                  operator: In
                  values:
                  - database
                  - redis
            topologyKey: kubernetes.io/hostname

# Harbor Portal (Web UI)
portal:
  replicas: 1
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

# Harbor Job Service (image scanning, garbage collection)
jobservice:
  replicas: 1 # Set to 1 to avoid Multi-Attach errors with RWO volumes
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m

# Harbor Registry (Docker registry component)
registry:
  replicas: 1 # Set to 1 to avoid Multi-Attach errors with RWO volumes
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m
  # Registry controller
  controller:
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m

# Trivy vulnerability scanner
trivy:
  enabled: true
  replicas: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m
  # Update vulnerability database on startup
  gitHubToken: ""
  # Offline mode (use cached database)
  offlineScan: false

# Notary (image signing) - optional, disabled by default
notary:
  enabled: false

# Metrics
metrics:
  enabled: true
  core:
    path: /metrics
    port: 8001
  registry:
    path: /metrics
    port: 8001
  jobservice:
    path: /metrics
    port: 8001
  exporter:
    path: /metrics
    port: 8001

# Cache configuration
cache:
  enabled: true
  expireHours: 24

# Log level
logLevel: info

# Proxy configuration (if Harbor needs to access external registries through proxy)
proxy:
  httpProxy:
  httpsProxy:
  noProxy: 127.0.0.1,localhost,.local,.internal,garage.garage.svc.cluster.local
  components:
    - core
    - jobservice
    - trivy

# Update strategy
updateStrategy:
  # RWO claims require old pods to terminate before replacements start.
  type: Recreate

# Nginx (internal component, handles routing)
nginx:
  replicas: 1
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m
