# Dedicated StorageClass for the yt-dlp media PVC.
#
# Q2 (Option 1A) for the IDEA-019 yt-dlp revival:
#   PVC pinned to wemby's HDD via nodeSelector: wemby.
#
# Replicas: the `media` volume runs 1 replica (wemby-hdd), set on the
# live Longhorn volume. wemby has a single HDD disk, so the SC's
# `numberOfReplicas: "2"` below only seeds new volumes and never got a
# second copy placed. StorageClass parameters are immutable, so the
# value stays matching the live object. The R2 backup (r2-backup-cronjob)
# is the only other copy of the media.
#
# Why a dedicated SC: the existing `longhorn-hdd` SC has no
# wemby-specific nodeSelector, so it would land on either manu-hdd or
# wemby-hdd. This SC bakes in the wemby-pinned defaults so the PVC
# manifest stays clean.
#
# Modeled on `longhorn/longhorn-harbor` StorageClass in
# ~/code/homelab/longhorn/storage.yaml (HDD + ethernet).
#
# `volumeBindingMode: Immediate` is the right call here because the SC
# is restricted to a single node (wemby); the pod will run on wemby too
# (via `nodeName: wemby` in the Job template) so there's no scheduling
# skew to worry about.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-hdd-wemby
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
  fromBackup: ""
  fsType: "ext4"
  diskSelector: "hdd"
  nodeSelector: "wemby"
