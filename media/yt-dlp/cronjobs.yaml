---
# Suspended CronJobs for playlists 1, 3, 4, 5, 6.
#
# `suspend: true` keeps them registered with the cluster (so the
# schedule is visible in `kubectl get cronjobs -A` and the operator
# scripts can `create job --from=cronjob/...` against any of them) but
# prevents the controller from creating Jobs on the schedule.
#
# After the validation run on playlist 2 proves the pipeline, flip
# each `suspend: true` → `suspend: false` (or `kubectl patch cronjob
# ... -p '{"spec":{"suspend":false}}'` per-playlist) to enable the
# rest of the set.
#
# Schedule staggering:
#   - 0 0  * * * — Essential (midnight UTC, off-peak)
#   - 10 2 * * * — Gotta Keep These Somewhere (validation; this one
#                 is enabled in `cronjob-validation.yaml` and is
#                 intentionally duplicated here for discovery — but
#                 the validation file is the source of truth)
#   - 20 4 * * * — Nice
#   - 30 6 * * * — Study (audio extraction; heavier on CPU)
#   - 40 8 * * * — Wow
#   - 50 10 * * * — Ugh
#
# Each schedule is offset by ~2h10m from the previous one so the
# cluster never has two yt-dlp Jobs contending for the media PVC
# (RWO). If you ever want parallel runs, switch the PVC to RWX or
# give each playlist its own PVC.
#
# The "Study" playlist (4) gets `--extract-audio --preset-alias mp3`
# via its ConfigMap key `playlist-4-extra-args`, which the Job
# template reads into EXTRA_ARGS_DEFAULT. No second ConfigMap
# (`yt-dlp-music`) is needed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: yt-dlp-playlist-1
  namespace: yt-dlp
  labels:
    app.kubernetes.io/name: yt-dlp
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/playlist: "1"
spec:
  schedule: "0 0 * * *"
  suspend: true
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: yt-dlp
            app.kubernetes.io/component: job
            app.kubernetes.io/playlist: "1"
        spec:
          restartPolicy: OnFailure
          nodeName: wemby
          securityContext:
            fsGroup: 1000
          containers:
            - name: yt-dlp
              image: nathanwhyte/yt-dlp:2026.06.10-yt-dlp
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
              env:
                - name: PLAYLIST_URL
                  valueFrom:
                    configMapKeyRef:
                      name: yt-dlp-playlists
                      key: playlist-1
                - name: PLAYLIST_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: yt-dlp-playlists
                      key: playlist-1-name
                - name: EXTRA_ARGS_DEFAULT
                  valueFrom:
                    configMapKeyRef:
                      name: yt-dlp-playlists
                      key: playlist-1-extra-args
                      optional: true
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  EXTRA_ARGS="${EXTRA:-${EXTRA_ARGS_DEFAULT:-}}"
                  set -- \
                    --config-locations /config/yt-dlp.conf \
                    --download-archive "/yt-dlp-archive/archive-playlist-1.txt" \
                    "${PLAYLIST_URL}"
                  if [ -f /yt-dlp-archive/cookies.txt ]; then
                    set -- --cookies /yt-dlp-archive/cookies.txt "$@"
                  fi
                  if [ -n "${EXTRA_ARGS}" ]; then
                    eval "set -- ${EXTRA_ARGS} \"\$@\""
                  fi
                  mkdir -p "/downloads/${PLAYLIST_NAME}"
                  cd "/downloads/${PLAYLIST_NAME}"
                  exec yt-dlp "$@"
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: media
                  mountPath: /downloads
                - name: media
                  mountPath: /yt-dlp-archive
          volumes:
            - name: config
              configMap:
                name: yt-dlp-config
            - name: media
              persistentVolumeClaim:
                claimName: media
---
