---
# Weekly Job: mirror the media PVC to R2.
#
# Direction: PVC -> R2. Sundays 05:00 UTC, well clear of the daily
# playlist CronJobs (02:00-04:00 UTC). `concurrencyPolicy: Forbid`
# guarantees no overlap with a still-running prior backup.
#
# `--size-only` skips unchanged objects (no mtime drift re-uploads).
# `--backup-dir` redirects deletes/overwrites to a dated `_trash/`
# prefix so destructive ops are recoverable; pair with a Cloudflare R2
# lifecycle rule on `backups/cluster/homelab-k3s/volumes/archive/media/_trash/`
# to expire after 60 days.
#
# `ad-hoc/` is excluded — that subdir is a yt-dlp scratch space, not
# part of the archive.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: yt-dlp-r2-backup
  namespace: yt-dlp
  labels:
    app.kubernetes.io/name: yt-dlp
    app.kubernetes.io/component: r2-backup
spec:
  schedule: "0 5 * * 0"
  timeZone: "Etc/UTC"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: yt-dlp
            app.kubernetes.io/component: r2-backup
        spec:
          restartPolicy: OnFailure
          nodeName: wemby
          securityContext:
            fsGroup: 1000
          containers:
            - name: rclone
              image: rclone/rclone:1.68
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "4"
                  memory: 4Gi
              envFrom:
                - secretRef:
                    name: r2-credentials
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  DATE=$(date -u +%Y-%m-%d)
                  # Excludes: ad-hoc (scratch), Kasey's Playlists (dropped
                  # 2026-06-24, not synced further), cookies.txt (credentials —
                  # never push to R2). archive-playlist-*.txt are kept (harmless
                  # ID lists, useful for a future restore).
                  exec rclone sync /downloads \
                    r2:homelab/backups/cluster/homelab-k3s/volumes/archive/media/YouTube \
                    --transfers=8 \
                    --checkers=16 \
                    --fast-list \
                    --s3-chunk-size=64M \
                    --size-only \
                    --exclude=ad-hoc/** \
                    --exclude="Kasey's Playlists/**" \
                    --exclude=cookies.txt \
                    --backup-dir="r2:homelab/backups/cluster/homelab-k3s/volumes/archive/media/_trash/${DATE}" \
                    --stats=60s \
                    --stats-one-line
              volumeMounts:
                - name: media
                  mountPath: /downloads
          volumes:
            - name: media
              persistentVolumeClaim:
                claimName: media
