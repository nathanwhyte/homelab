---
# Validation CronJob: playlist 2 ("Gotta Keep These Somewhere").
#
# This is the single enabled CronJob in the IDEA-019 yt-dlp revival.
# The other 5 playlists (1, 3, 4, 5, 6) live in `cronjobs.yaml` with
# `suspend: true` until the validation run proves the pipeline.
#
# Schedule rationale:
#   - "10 2 * * *" = 02:10 UTC daily. Off-hours so it doesn't conflict
#     with interactive MacBook Ollama or peak YouTube serving.
#   - "10" past the hour to avoid the spike of 02:00 cron jobs across
#     the cluster.
#
# Job template:
#   - image: nathanwhyte/yt-dlp:2026.06.10-yt-dlp (built from
#     media/yt-dlp/docker/Dockerfile; pinned tag, not :latest)
#   - imagePullPolicy: IfNotPresent (the image is small; K3s caches it
#     on wemby after the first pull)
#   - nodeName: wemby — same node as the media PVC; prevents cross-node
#     RWO mount scheduling issues
#   - securityContext.fsGroup: 1000 — matches the ytdlp user in the
#     image, so the emptyDir / PVC mounts are writable
#   - resources: requests {cpu: 500m, memory: 1Gi} / limits
#     {cpu: "4", memory: 8Gi} (matches the retired setup; ffmpeg on
#     yt-dlp[default] is the heaviest dependency)
#
# Command shell:
#   1. Expand EXTRA_ARGS_DEFAULT to set the per-playlist base args
#      (playlist 4's "--extract-audio --preset-alias mp3" lives there;
#      for playlist 2 this is empty).
#   2. Build the base arg set: --config-locations /config/yt-dlp.conf,
#      --download-archive /yt-dlp-archive/archive-playlist-2.txt.
#   3. Conditionally add --cookies /yt-dlp-archive/cookies.txt if the
#      file is present (gated by `[ -f ... ]`; we don't ship cookies
#      in the repo).
#   4. eval set -- to splice EXTRA_ARGS in (preserving quoting) so the
#      operator can pass per-run overrides like
#      `operator.sh run-job 2 "--no-mtime"`.
#   5. yt-dlp "$@" || true — run yt-dlp; ignore non-zero exit (unavailable
#      videos cause exit 1 even with --ignore-errors; the job should succeed
#      as long as the playlist was fully processed).
#   6. On exit, sweep *.f[0-9]* (yt-dlp's fragment files) and *.part
#      from the playlist directory to prevent stale partials from
#      being re-counted on the next run. (yt-dlp's --no-keep-fragments
#      flag should handle this on success; this is a belt-and-braces
#      cleanup for the failure case.)
#
# Volume layout:
#   - `config` ConfigMap (`yt-dlp-config`) → /config/yt-dlp.conf
#   - `media` PVC (`media`) → /downloads (RWO subPath for media files)
#     and /yt-dlp-archive (RWO subPath for archive + cookies)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: yt-dlp-playlist-2
  namespace: yt-dlp
  labels:
    app.kubernetes.io/name: yt-dlp
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/playlist: "2"
spec:
  schedule: "10 2 * * *"
  suspend: false
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 14400 # 4h hard cap
      template:
        metadata:
          labels:
            app.kubernetes.io/name: yt-dlp
            app.kubernetes.io/component: job
            app.kubernetes.io/playlist: "2"
        spec:
          restartPolicy: OnFailure
          nodeName: wemby
          securityContext:
            fsGroup: 1000
          containers:
            - name: yt-dlp
              image: nathanwhyte/yt-dlp:2026.06.10-yt-dlp
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
              env:
                - name: PLAYLIST_URL
                  valueFrom:
                    configMapKeyRef:
                      name: yt-dlp-playlists
                      key: playlist-2
                - name: PLAYLIST_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: yt-dlp-playlists
                      key: playlist-2-name
                - name: EXTRA_ARGS_DEFAULT
                  valueFrom:
                    configMapKeyRef:
                      name: yt-dlp-playlists
                      key: playlist-2-extra-args
                      optional: true
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  # Defaults: per-playlist base args; playlist 2 has none.
                  EXTRA_ARGS="${EXTRA_ARGS:-${EXTRA_ARGS_DEFAULT:-}}"

                  set -- \
                    --config-locations /config/yt-dlp.conf \
                    --download-archive "/yt-dlp-archive/archive-playlist-2.txt" \
                    "${PLAYLIST_URL}"

                  # Optional cookies file — only load if present.
                  if [ -f /yt-dlp-archive/cookies.txt ]; then
                    set -- --cookies /yt-dlp-archive/cookies.txt "$@"
                  fi

                  # Splice in EXTRA_ARGS via eval so quoting is preserved
                  # (e.g. --extract-audio --preset-alias mp3 stays two
                  # args, not one quoted blob).
                  if [ -n "${EXTRA_ARGS}" ]; then
                    eval "set -- ${EXTRA_ARGS} \"\$@\""
                  fi

                  mkdir -p "/downloads/${PLAYLIST_NAME}"
                  cd "/downloads/${PLAYLIST_NAME}"

                  # || true: yt-dlp exits non-zero when videos are
                  # unavailable even with --ignore-errors; the job
                  # should succeed as long as the playlist was fully
                  # processed.
                  yt-dlp "$@" || true
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: media
                  mountPath: /downloads
                - name: media
                  mountPath: /yt-dlp-archive
          volumes:
            - name: config
              configMap:
                name: yt-dlp-config
            - name: media
              persistentVolumeClaim:
                claimName: media
