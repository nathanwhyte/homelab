# Helm values for the compendium runner scale set (IDEA-1094).
# Release: compendium / namespace: arc-runners.
#
# One scale set per repo, each with a UNIQUE runnerScaleSetName: the chart
# names the AutoscalingRunnerSet and its service accounts after the scale-set
# name, so two releases sharing a name in one namespace collide on Helm
# ownership (PR #63 review). Workflows in the compendium repo target this one
# with `runs-on: homelab-arc-compendium`; a future repo gets its own release
# and `homelab-arc-<repo>` name.
#
# PRIVATE REPOS ONLY — never add a scale set for nathanwhyte/homelab (public):
# a self-hosted runner on a public repo executes fork-PR code on the cluster.

githubConfigUrl: https://github.com/nathanwhyte/compendium

# Secret in arc-runners holding github_token (see
# github-config-secret.yaml.example). Shared by all scale sets.
githubConfigSecret: github-config-secret

runnerScaleSetName: homelab-arc-compendium

# Pin the controller explicitly: chart autodetection requires exactly one
# controller deployment to be discoverable and fails rendering otherwise
# (bit us in `helm template` / --diff preflights).
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

# minRunners: 4 — measured cold start is ~1s for a pod whose node already has
# the runner image, so the penalty for NOT keeping one warm is small. The
# reason to keep four is capacity lead time, not cold start: a pod needs
# create -> schedule -> pull -> register before GitHub can hand it a job, and
# with 1 warm pod the remaining lanes of a run queue behind that. Four covers a
# full vault-checks run's parallel jobs (script suites unit ∥ e2e, lint,
# formatting), so a push starts immediately instead of waiting for the set to
# grow. Cost is four idle pods (~37 MiB and ~4m CPU each between jobs).
#
# maxRunners: 8 — vault-checks runs FOUR parallel jobs per push, so 8 is
# exactly two concurrent full runs' worth of work. Verified live at 7 with two
# overlapping runs: the listener reported `assigned job=7 decision=7 max=7`
# (saturated, queueing) and the pods split 4 manu / 4 wemby. Observed peak
# per-run demand is 4–5 pods (a run's e2e lane holds its pod while the other
# lanes finish), so 8 covers two runs and absorbs the +1 that overshoot would
# otherwise queue behind.
minRunners: 4
maxRunners: 8

# No containerMode: vault-checks runs plain steps only (no `container:` jobs,
# no docker builds), so jobs execute directly in the runner container —
# no privileged pods, no dind.

# The listener pod is created in the CONTROLLER's namespace (arc-systems) and
# is NOT covered by template.spec below — it needs its own template to stay
# off timmy.
listenerTemplate:
  spec:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - timmy
    containers:
      # Merged onto the chart's listener container by name.
      - name: listener
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi

template:
  spec:
    # Runner pods stay off timmy (control plane, heaviest memory load).
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - timmy

    # Without this every runner pod lands on wemby. The runner image (679MB) is
    # cached only on wemby, and ImageLocality (weight 1) then outweighs the
    # resource-fit scores that favour the emptier manu (manu ~62 vs wemby ~38
    # before locality), so the scheduler sees a two-node eligible set and picks
    # one of them until it fills. The image is pulled on first use regardless;
    # the spread is what actually uses manu's headroom instead of stacking all
    # CI on the cluster's slowest CPU (i7-8750H vs manu's Ryzen 7 1700).
    #
    # maxSkew 1 on the hostname: PodTopologySpread carries weight 2, so it wins
    # over ImageLocality's 1 and flips the decision. ScheduleAnyway (not
    # DoNotSchedule) is deliberate — skew is a preference, and a hard constraint
    # would leave runners Pending rather than let them pile up on whichever node
    # has room.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: runner

    containers:
      - name: runner
        # Custom image with uv/node/make preinstalled — built by
        # images/runner/build-push.sh, hosted in Harbor project `ci`.
        image: registry.nathanwhyte.dev/ci/actions-runner:latest
        # Overriding the container REPLACES the chart default wholesale, so the
        # runner entrypoint must be restated.
        command: ["/home/runner/run.sh"]
        # The upstream runner image gives uid 1001 passwordless sudo, so
        # workflow code could otherwise become container-root. Lock the
        # container down: no escalation (breaks sudo — vault-checks doesn't
        # use it), no capabilities, default seccomp (PR #63 review).
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        # Right-sized from a 1h Prometheus sample (49 runner pods,
        # container_memory_working_set_bytes / container_cpu_usage_seconds_total
        # + container_cpu_cfs_*), cross-checked against `kubectl top`:
        #   memory  idle ~37Mi, median 425Mi, PEAK 736Mi  (limit was 4Gi = 5.6x)
        #   CPU     idle ~4m,   median 333m, PEAK 1.14 cores (limit 57% used)
        #   CFS throttling 2.8% of periods.
        #
        # 2026-09-14 refresh (IMPR-1166), 2d sample ending 18:10Z. Values below
        # are UNCHANGED — per-pod sizing still holds:
        #   CPU     per-pod p90 522m against the 500m request; peak 739m
        #   memory  per-pod peak 809Mi (was 736Mi, crept ~10%)
        # What HAS drifted is aggregate, which nothing here bounds:
        #   fleet peak 12.86 cores against 8 x 500m = 4 cores reserved (3.2x)
        #   per node   wemby 8.45 of 12 allocatable, manu 6.77 of 16
        #   CFS throttling 24.2% peak / 5.1% median (was 2.8% — ~9x)
        # maxRunners bounds pod count and the 2-core limit bounds one pod, but
        # the sum across concurrent pods on a node is unconstrained. IMPR-1166
        # weighs the candidate mechanisms (lower per-pod limit, a LimitRange or
        # ResourceQuota in arc-runners, or a larger request so scheduler fit
        # caps placement) and is gated on measuring the vault-checks e2e-lane
        # latency regression first. Do not change the values below until it
        # lands: raising the CPU request would reserve headroom the pods do not
        # use at p90 and would cut how many runners fit, for no measured gain.
        #
        # Reproducing: aggregate server-side or the query returns megabytes of
        # per-series data, e.g.
        #   max(max_over_time(rate(container_cpu_usage_seconds_total{
        #     namespace="arc-runners",container="runner"}[5m])[2d:5m]))
        # Note manu's CPU was capped to 1550 MHz at 2026-09-14T17:04Z for a
        # cooling fault (BUG-1101); CPU-time figures sampled on manu after that
        # point read high for identical work.
        #
        # Memory limit 4Gi was set by BUG-1099 for a `pre-commit --all-files`
        # spike on a 1827-file vault (~2GB). IMPR-1131 then added
        # PRE_COMMIT_NO_CONCURRENCY=1, which removed the os.cpu_count()
        # fan-out that caused it — observed peak is now 736Mi. 2Gi keeps 2.7x
        # headroom over the worst pod while halving worst-case node exposure:
        # with the spread constraint pinning 4 pods per node, 4x4Gi was 103%
        # of allocatable; 4x2Gi is 50%.
        #
        # CPU request was under-provisioned: median 333m against a 250m
        # request, so runners routinely exceed what the scheduler reserved.
        # 500m matches the p90 (560m). The 2-core limit is left alone — peak
        # was 1.14 cores with only 2.8% throttling, so it is already correct.
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
