# Helm values for the compendium runner scale set (IDEA-1094).
# Release: compendium / namespace: arc-runners.
#
# One scale set per repo, each with a UNIQUE runnerScaleSetName: the chart
# names the AutoscalingRunnerSet and its service accounts after the scale-set
# name, so two releases sharing a name in one namespace collide on Helm
# ownership (PR #63 review). Workflows in the compendium repo target this one
# with `runs-on: homelab-arc-compendium`; a future repo gets its own release
# and `homelab-arc-<repo>` name.
#
# PRIVATE REPOS ONLY — never add a scale set for nathanwhyte/homelab (public):
# a self-hosted runner on a public repo executes fork-PR code on the cluster.

githubConfigUrl: https://github.com/nathanwhyte/compendium

# Secret in arc-runners holding github_token (see
# github-config-secret.yaml.example). Shared by all scale sets.
githubConfigSecret: github-config-secret

runnerScaleSetName: homelab-arc-compendium

# Pin the controller explicitly: chart autodetection requires exactly one
# controller deployment to be discoverable and fails rendering otherwise
# (bit us in `helm template` / --diff preflights).
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

# minRunners: 4 — measured cold start is ~1s for a pod whose node already has
# the runner image, so the penalty for NOT keeping one warm is small. The
# reason to keep four is capacity lead time, not cold start: a pod needs
# create -> schedule -> pull -> register before GitHub can hand it a job, and
# with 1 warm pod the remaining lanes of a run queue behind that. Four covers a
# full vault-checks run's parallel jobs (script suites unit ∥ e2e, merge-ids,
# lint), so a push starts immediately instead of waiting for the set to grow.
# Cost is four idle pods (~37 MiB and ~4m CPU each between jobs).
#
# The `formatting` job this comment used to name was deleted on 2026-09-15 —
# its two ruff steps were already covered by `make lint`. The count is still
# four per branch push because merge-ids takes the freed slot; on main, where
# merge-ids is skipped, a run needs three.
#
# maxRunners: 8 — vault-checks runs FOUR parallel jobs per push, so 8 is
# exactly two concurrent full runs' worth of work. Verified live at 7 with two
# overlapping runs: the listener reported `assigned job=7 decision=7 max=7`
# (saturated, queueing) and the pods split 4 manu / 4 wemby — that split
# predates the 2026-09-15 move to wemby + timmy. Observed peak
# per-run demand is 4–5 pods (a run's e2e lane holds its pod while the other
# lanes finish), so 8 covers two runs and absorbs the +1 that overshoot would
# otherwise queue behind.
minRunners: 4
maxRunners: 8

# No containerMode: vault-checks runs plain steps only (no `container:` jobs,
# no docker builds), so jobs execute directly in the runner container —
# no privileged pods, no dind.

# The listener pod is created in the CONTROLLER's namespace (arc-systems) and
# is NOT covered by template.spec below — it needs its own template to carry
# the same node exclusion.
#
# Excludes manu, not timmy, since 2026-09-15 (see the runner template below for
# the full rationale). The listener is a singleton and the scale set stops
# entirely if it cannot schedule, so it is left eligible for both surviving
# nodes rather than pinned to wemby alone.
listenerTemplate:
  spec:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - manu
    containers:
      # Merged onto the chart's listener container by name.
      - name: listener
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi

template:
  spec:
    # Runner pods stay off MANU (2026-09-15). This inverts the previous rule,
    # which excluded timmy as the control plane; the reasoning changed because
    # the hardware did.
    #
    # manu took a cooling fault on 2026-09-14 (BUG-1101): two thermal shutdowns
    # at 16:05Z and 16:50Z, die temp 84-88C, and its CPU has been capped to
    # 1550 MHz since 17:04Z as mitigation. That cap is still in force — a live
    # read on 2026-09-15 showed 1.42 GHz. A Ryzen 7 1700 held at ~52% of base
    # clock is not the 16-core node the old comment reasoned about: it is worth
    # roughly 8 effective cores, so manu + wemby was ~20 effective cores and
    # wemby + timmy is 20 at full clock. Excluding manu is therefore close to
    # throughput-neutral while keeping sustained CI load off a node with a known
    # cooling defect — and CI load was named in IMPR-1166 as an aggravator of
    # that fault, though not its root cause.
    #
    # Putting runners on timmy (control plane) is a deliberate, reviewed
    # trade-off, not an oversight. The protection that makes it safe is the
    # lowered per-pod CPU limit below — see the resources block. Revisit this
    # whole decision when manu's cooler is repaired and the 1550 MHz cap is
    # lifted: the old manu + wemby split is better for the control plane.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - manu

    # Without this every runner pod lands on wemby. The runner image (679MB) is
    # cached only on wemby, and ImageLocality (weight 1) then outweighs the
    # resource-fit scores favouring an emptier node, so the scheduler picks
    # wemby until it fills. That was true when the pair was manu + wemby and is
    # true now for wemby + timmy: timmy has never pulled the image, so its
    # locality score is 0 and every pod would stack on wemby without this.
    #
    # maxSkew 1 on the hostname: PodTopologySpread carries weight 2, so it wins
    # over ImageLocality's 1 and flips the decision.
    #
    # ScheduleAnyway -> DoNotSchedule (2026-09-15). The old comment argued that
    # a soft constraint was better because a hard one "would leave runners
    # Pending rather than let them pile up on whichever node has room". That
    # reasoning was sound while the pool was two worker nodes. It is wrong now
    # that one of the two IS the control plane: ScheduleAnyway expresses a
    # preference, so with wemby unavailable or full, all 8 runners could legally
    # land on timmy. At a 1500m limit that is 12 CPU of limits on an 8-core
    # control plane — the exact failure this placement was supposed to prevent,
    # arriving precisely during degraded operation.
    #
    # Pending runners are the correct outcome there. CI slowing down is
    # recoverable; starving kube-apiserver and etcd is not.
    #
    # nodeTaintsPolicy Ignore is load-bearing, not decoration: a cordoned wemby
    # must still count as a topology domain. Under Honor it would drop out of
    # the domain set, leaving timmy as the only domain, trivially satisfying
    # maxSkew and re-opening the all-8-on-timmy path this change closes.
    #
    # minDomains 2 closes the remaining case, which nodeTaintsPolicy does not:
    # wemby REMOVED from the cluster rather than cordoned. With one real domain
    # the global minimum is timmy's own count, so skew is identically 0 and the
    # constraint stops binding — all 8 runners land, 12000m of limits on an
    # 8-core control plane (150%). minDomains makes the scheduler treat the
    # absent domain as holding 0 pods, so a 2nd pod on timmy computes skew 2 >
    # maxSkew 1 and is refused. timmy caps at 1 until a second domain returns.
    #
    # That is a deliberately harsh degradation — CI nearly stops — and it is the
    # same trade as DoNotSchedule above: recoverable slowness beats an
    # unrecoverable control plane. Requires whenUnsatisfiable DoNotSchedule
    # (the field is ignored under ScheduleAnyway) and k8s >= 1.30 for GA; this
    # cluster runs k3s v1.36.2.
    #
    # THIS is the binding bound on timmy, not the CPU request below. With two
    # domains and maxSkew 1, 8 pods admit only a 4/4 split, whatever the node's
    # spare CPU happens to be. The request is defense in depth against this
    # block being weakened or removed, not the primary mechanism.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        minDomains: 2
        nodeAffinityPolicy: Honor
        nodeTaintsPolicy: Ignore
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: runner

    containers:
      - name: runner
        # Custom image with uv/node/make preinstalled — built by
        # images/runner/build-push.sh, hosted in Harbor project `ci`.
        image: registry.nathanwhyte.dev/ci/actions-runner:latest
        # Overriding the container REPLACES the chart default wholesale, so the
        # runner entrypoint must be restated.
        command: ["/home/runner/run.sh"]
        # The upstream runner image gives uid 1001 passwordless sudo, so
        # workflow code could otherwise become container-root. Lock the
        # container down: no escalation (breaks sudo — vault-checks doesn't
        # use it), no capabilities, default seccomp (PR #63 review).
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        # Right-sized from a 1h Prometheus sample (49 runner pods,
        # container_memory_working_set_bytes / container_cpu_usage_seconds_total
        # + container_cpu_cfs_*), cross-checked against `kubectl top`:
        #   memory  idle ~37Mi, median 425Mi, PEAK 736Mi  (limit was 4Gi = 5.6x)
        #   CPU     idle ~4m,   median 333m, PEAK 1.14 cores (limit 57% used)
        #   CFS throttling 2.8% of periods.
        #
        # 2026-09-14 refresh (IMPR-1166), 2d sample ending 18:10Z. Values below
        # are UNCHANGED — per-pod sizing still holds:
        #   CPU     per-pod p90 522m against the 500m request; peak 739m
        #   memory  per-pod peak 809Mi (was 736Mi, crept ~10%)
        # What HAS drifted is aggregate, which nothing here bounds:
        #   fleet peak 6.43 cores, deduplicated (see the scrape note below)
        #   per node   wemby 4.35 of 12 allocatable, manu 3.39 of 16
        #   CFS throttling 15.2% peak as a deduplicated fleet ratio (the old
        #     2.8% above is from the 1h sample and is not like-for-like)
        # Restricting further to pods in Running state drops the fleet peak to
        # ~3.42 cores; the 6.43 figure still counts series from pods that had
        # terminated. Treat 3.42-6.43 as the band, not 6.43 as a point value.
        #
        # Do NOT compare these against "8 x 500m = 4 cores reserved". The peak
        # predates the 250m -> 500m request change, so the contemporaneous
        # reservation was smaller, and mixing the two produces a ratio that
        # describes no configuration that ever ran.
        #
        # Scrape duplication — this bit us. Two ServiceMonitors scrape the same
        # kubelet cAdvisor endpoint, service="prom-kubelet" and
        # service="kube-prometheus-stack-kubelet", BOTH carrying job="kubelet".
        # Every container series therefore exists twice (verified: 10 series for
        # 5 runner pods), so filtering on job= does not deduplicate and any
        # sum() over these metrics doubles. An earlier revision of this comment
        # claimed 12.86 fleet cores and 8.45/6.77 per node; those were exactly
        # 2x. max() and quantile() are unaffected, which is why the per-pod
        # numbers above needed no correction. Deduplicate with an inner
        # max by (pod) before summing:
        #   max_over_time(sum(max by (pod) (rate(
        #     container_cpu_usage_seconds_total{namespace="arc-runners",
        #     container="runner"}[5m])))[2d:5m])
        # maxRunners bounds pod count and the 2-core limit bounds one pod, but
        # the sum across concurrent pods on a node is unconstrained. IMPR-1166
        # weighs the candidate mechanisms (lower per-pod limit, a LimitRange or
        # ResourceQuota in arc-runners, or a larger request so scheduler fit
        # caps placement) and is gated on measuring the vault-checks e2e-lane
        # latency regression first. Do not change the values below until it
        # lands: raising the CPU request would reserve headroom the pods do not
        # use at p90 and would cut how many runners fit, for no measured gain.
        #
        # Reproducing: aggregate server-side or the query returns megabytes of
        # per-series data, e.g.
        #   max(max_over_time(rate(container_cpu_usage_seconds_total{
        #     namespace="arc-runners",container="runner"}[5m])[2d:5m]))
        # Note manu's CPU was capped to 1550 MHz at 2026-09-14T17:04Z for a
        # cooling fault (BUG-1101); CPU-time figures sampled on manu after that
        # point read high for identical work.
        #
        # The duplicate kubelet scrape is itself worth fixing — two
        # ServiceMonitors for one endpoint doubles cardinality on every
        # container metric in the cluster, not just these. Not addressed here.
        #
        # Memory limit 4Gi was set by BUG-1099 for a `pre-commit --all-files`
        # spike on a 1827-file vault (~2GB). IMPR-1131 then added
        # PRE_COMMIT_NO_CONCURRENCY=1, which removed the os.cpu_count()
        # fan-out that caused it — observed peak is now 736Mi. 2Gi keeps 2.7x
        # headroom over the worst pod while halving worst-case node exposure:
        # with the spread constraint pinning 4 pods per node, 4x4Gi was 103%
        # of allocatable; 4x2Gi is 50%.
        #
        # CPU LIMIT 2 -> 1500m and REQUEST 500m -> 1000m (2026-09-15), both
        # forced by the placement change above. Together they are what makes
        # runners-on-timmy safe; neither is sufficient alone.
        #
        # The limit bounds one pod. timmy has 8 cores, so 4 runners at the old
        # 2-core limit is 8 cores — 100% of the control plane, starving
        # kube-apiserver and etcd and with them every other workload
        # (OpenViking, Grafana, Longhorn). At 1500m four pods cap at 6 cores
        # and leave 2. 1500m is still above every measured peak (739m per-pod
        # in the 2d IMPR-1166 sample, 1.14 cores in the older 1h sample), so
        # it is 1.3x the worst observation, not a squeeze.
        #
        # The REQUEST is what makes "four pods" true rather than hoped for.
        # A per-pod limit says nothing about how many pods land on a node, and
        # the spread constraint above is only one of the two bounds — so the
        # request is sized so that CPU admission independently caps timmy at
        # four, and would do so even if the spread were satisfied some other
        # way. Measured 2026-09-15:
        #
        #   timmy  8000m allocatable - 3281m already requested = 4719m free
        #          floor(4719 / 1000) = 4 pods; a 5th needs 5000m and is refused
        #   wemby 12000m allocatable - 6875m non-runner requests = 5125m free
        #          floor(5125 / 1000) = 5 pods
        #
        # 4 + 5 = 9 >= maxRunners 8, so the healthy case loses no capacity —
        # the reservation costs nothing operationally. With wemby unavailable,
        # timmy admits 4 and the rest stay Pending, which is the intended
        # degradation. 1000m is ~2x the 522m p90; that overshoot is the price
        # of the bound and is deliberate.
        #
        # Correction (2026-09-15): an earlier revision of this comment called
        # the reservation-sensitivity above "the" residual — if other workloads
        # on timmy shrink by ~280m, a 5th runner becomes admissible. That is
        # true of the request bound in isolation and irrelevant in practice:
        # the topologySpreadConstraint above caps timmy at 4 whatever the spare
        # CPU is, because 8 pods across 2 domains at maxSkew 1 admit only a 4/4
        # split. The request loosening to 5 cannot be reached while the spread
        # holds. The genuine residual was the one-domain case, now closed by
        # minDomains 2 — see that block.
        #
        # Memory stays at 2Gi: 4 x 2Gi = 8Gi against timmy's 31Gi (9038Mi in
        # use), and per-pod peak is 809Mi.
        #
        # This deliberately moves ahead of IMPR-1166, which says not to touch
        # these values until the e2e-lane latency regression is measured. That
        # gate assumed the pool was manu + wemby, where an unbounded aggregate
        # only risked CI slowness. With the control plane in the pool the
        # downside is cluster-wide, so bounding it first is the safer order.
        resources:
          requests:
            cpu: 1000m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 2Gi
