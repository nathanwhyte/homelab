---
# In-cluster compendium→OV BACKFILL Job (template — render via compendium/cluster-backfill.sh).
# A long, explicit-path variant of compendium-sync-job.template.yaml: the path
# list comes from a ConfigMap mounted at /backfill (paths.txt, one vault path per
# line), and the budgets are sized for hundreds of entries through the VLM queue
# rather than a --changed delta. First used by hand for BUG-1173 (684 active
# entries, ~2h40m); this template makes that run repeatable.
#
# ${JOB_NAME}, ${PATHS_CONFIGMAP} and ${SYNC_ARGS} are substituted by the runner
# (envsubst). The runner creates the ConfigMap AFTER the Job, with an
# ownerReference to it, so the TTL below garbage-collects both — a ConfigMap
# created on its own outlives its Job forever (the BUG-1173 leftovers).
#
# It is still the SINGLE sync writer: same app=compendium-sync label (so
# cluster-sync.sh refuses to dispatch over it), same state claim and
# OV_SYNC_LOCK. Keep the container body in step with the sync template — the
# version pins and their rationale live there.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: compendium
  labels:
    app: compendium-sync
    purpose: backfill
spec:
  completions: 1
  parallelism: 1
  # No retries: a partial backfill re-run is a fresh decision (the errors are
  # named in the log), not something to repeat blindly for another 9h.
  backoffLimit: 0
  podReplacementPolicy: Failed
  # 9h ceiling; the default SYNC_ARGS give the script a 32000s deadline, which
  # leaves 400s for scheduling, image pull, package install and clone.
  activeDeadlineSeconds: 32400
  # A failed Job stays visible (KubeJobFailed) for 24h, then the Job, its pod
  # and — via the ownerReference — its paths ConfigMap are deleted. Deleting the
  # Job by hand after investigation clears the alert sooner.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: compendium-sync
        purpose: backfill
    spec:
      restartPolicy: Never
      serviceAccountName: compendium-sync
      containers:
        - name: sync
          image: python:3.13-slim@sha256:eb43ff125d8d58d7449dcba7d336c23bcac412f526d861db493b9994d8010280
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              apt-get update -qq && apt-get install -y -qq git >/dev/null
              pip install --quiet openviking==0.4.10
              # ov CLI requires a config file to exist even when env vars are set
              mkdir -p "$HOME/.openviking"
              printf '{"url":"%s","api_key":"%s","root_api_key":"%s","account":"default","user":"noot","timeout":300.0,"output":"table"}\n' \
                "$OPENVIKING_URL" "$OPENVIKING_KEY" "$OPENVIKING_KEY" > "$HOME/.openviking/ovcli.conf"
              git clone --filter=blob:none "https://x-access-token:${GITHUB_TOKEN}@github.com/nathanwhyte/compendium.git" "$HOME/code/compendium"
              cd "$HOME/code/compendium"
              echo "vault at $(git rev-parse --short HEAD); running: sync ${SYNC_ARGS}"
              echo "backfill paths: $(wc -l < /backfill/paths.txt)"
              mapfile -t paths < /backfill/paths.txt
              python3 _scripts/compendium-sync.py sync ${SYNC_ARGS} "${paths[@]}"
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: JOB_NAME
              value: ${JOB_NAME}
            - name: OV_SYNC_STATE
              value: /state/compendium-sync-state.json
            # Must match the sync template and CronJob — it is the cross-pod
            # single-writer guard on the shared claim.
            - name: OV_SYNC_LOCK
              value: /state/compendium-sync.lock
            - name: OPENVIKING_URL
              value: http://openviking.viking.svc.cluster.local:1933
            - name: OPENVIKING_ACCOUNT
              value: default
            - name: OPENVIKING_USER
              value: noot
            - name: OPENVIKING_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-api-key
                  key: api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: compendium-git-token
                  key: GITHUB_TOKEN
          volumeMounts:
            - name: sync-state
              mountPath: /state
            - name: backfill-paths
              mountPath: /backfill
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: sync-state
          persistentVolumeClaim:
            claimName: compendium-sync-state-v2
        - name: backfill-paths
          configMap:
            name: ${PATHS_CONFIGMAP}
