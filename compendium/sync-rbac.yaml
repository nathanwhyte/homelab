---
# RBAC for the in-Job guarded OV heal-restart (IMPR-1062 Phase 4).
# The compendium-sync Job classifies a wedge (BUG-1039: a new lock handle
# created during the run that persists across drained-queue polls while still
# lease-refreshing) and, breaker permitting, rolling-restarts
# deploy/openviking by PATCHing the kubectl restartedAt annotation via the
# Kubernetes API (no kubectl in the Job image).
#
# Scope: get/patch on the ONE named deployment in viking, and nothing else: the
# `kubectl auth can-i` matrix the IMPR-1062 plan recorded (Phase 4 automated
# verification, 2026-07-21) holds as written again. `get` on the named
# deployment lets the SA read its own restart's rollout status when diagnosing
# a heal.
#
# BUG-1282 dropped the pod and pod-log read that BUG-1181 option 3 added: the
# lease lines it read are debug on v0.5.1.1, and the wedge check reads
# ov-exporter's GET /locks over HTTP instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compendium-sync
  namespace: compendium
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: compendium-sync-ov-restart
  namespace: viking
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["openviking"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: compendium-sync-ov-restart
  namespace: viking
subjects:
  - kind: ServiceAccount
    name: compendium-sync
    namespace: compendium
roleRef:
  kind: Role
  name: compendium-sync-ov-restart
  apiGroup: rbac.authorization.k8s.io
