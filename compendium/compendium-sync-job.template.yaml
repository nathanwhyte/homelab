---
# In-cluster compendium→OV sync Job (template — render via compendium/cluster-sync.sh).
# Clones the vault from GitHub and runs _scripts/compendium-sync.py against the
# in-cluster OV service. This is the SINGLE sync writer for the compendium OV
# namespace (BUG-1034 phase 2): it only sees pushed origin/main, and the
# last-synced state lives on the compendium-sync-state-v2 PVC.
# ${JOB_NAME} and ${SYNC_ARGS} are substituted by the runner (envsubst).
#
# Version pins (bump deliberately, together with a smoke run):
#   image: python:3.13-slim as of 2026-07-07
#   openviking CLI: 0.4.10 (IMPR-1062 Phase 3: the recovery phases rely on the
#     0.4.10 `ov status`/durability contracts, and CLI 0.4.10 ↔ server 0.4.10 is
#     what prod already runs from the Mac; bumped from 0.4.7 2026-07-16)
#   The pip install below ALSO ships the in-process SyncHTTPClient (the 0.4.10
#     wheel vendors openviking_cli) — the IMPR-1071 SDK transport needs NO extra
#     pin. The SDK is the ONLY transport (IMPR-1081 retired the --client=cli
#     rollback lever 2026-08-21 after the soak); pointers are written as PLAIN
#     FILES. The ov CLI install is retained for MANAGEMENT operations only —
#     the `ov language en` preflight, `ov rm` deletes, and the observer/status
#     calls the recovery phases rely on — never as a write transport.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: compendium
  labels:
    app: compendium-sync
spec:
  completions: 1
  parallelism: 1
  # Retry transient pod/node loss, but never replace a merely terminating pod:
  # Failed waits for a terminal phase before replacement, preserving the
  # single-writer contract across retries (in addition to the RWO state claim).
  backoffLimit: 3
  podReplacementPolicy: Failed
  # BUG-1035: bound a wedged run so it frees the state PVC + guard.
  # IMPR-1062 Phase 3: the script owns a 2400s journal deadline. Kubernetes
  # starts this clock before scheduling, image pull, package install, clone, and
  # journal preparation, so reserve 1200s for that preflight work. The 3600s
  # ceiling still bounds a pod that hangs outside the script's deadline path.
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: compendium-sync
    spec:
      restartPolicy: Never
      # IMPR-1062 Phase 4: the SA carries the narrowly-scoped cross-namespace
      # permission (sync-rbac.yaml) for the in-Job guarded OV heal-restart.
      serviceAccountName: compendium-sync
      containers:
        - name: sync
          image: python:3.13-slim@sha256:eb43ff125d8d58d7449dcba7d336c23bcac412f526d861db493b9994d8010280
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              # Idle pre-check (IMPR-1154): most scheduled runs have nothing
              # to deliver, and apt + pip + clone cost ~4.5 min to learn that.
              # Exit early only on the exact idle condition compendium-sync.py
              # itself uses (canonical --changed run, no journal run in the
              # state file, watermark == origin/main). Any doubt (other
              # flags, missing state, API error, odd SHA) falls through to
              # the full run.
              if python3 - <<'PRECHECK'
              import json, os, re, sys, urllib.request
              args = os.environ.get("SYNC_ARGS", "").split()
              if "--changed" not in args or {"--retry-parked", "--abandon-run", "--set-baseline"} & set(args):
                  sys.exit(1)
              try:
                  with open(os.environ["OV_SYNC_STATE"]) as fh:
                      doc = json.load(fh)
                  baseline = doc["last_delivered_commit"]
              except Exception:
                  sys.exit(1)
              if doc.get("run") or not isinstance(baseline, str):
                  sys.exit(1)
              req = urllib.request.Request(
                  "https://api.github.com/repos/nathanwhyte/compendium/commits/main",
                  headers={
                      "Authorization": "Bearer " + os.environ.get("GITHUB_TOKEN", ""),
                      "Accept": "application/vnd.github.sha",
                      "User-Agent": "compendium-sync-precheck",
                  },
              )
              try:
                  head = urllib.request.urlopen(req, timeout=20).read().decode().strip()
              except Exception:
                  sys.exit(1)
              if not re.fullmatch(r"[0-9a-f]{40}", head) or head != baseline:
                  sys.exit(1)
              print(f"nothing to sync: HEAD == last delivered commit ({head[:12]}) [idle pre-check, setup skipped]")
              PRECHECK
              then
                exit 0
              fi
              apt-get update -qq && apt-get install -y -qq git >/dev/null
              pip install --quiet openviking==0.4.10
              # ov CLI requires a config file to exist even when env vars are set
              mkdir -p "$HOME/.openviking"
              printf '{"url":"%s","api_key":"%s","root_api_key":"%s","account":"default","user":"noot","timeout":300.0,"output":"table"}\n' \
                "$OPENVIKING_URL" "$OPENVIKING_KEY" "$OPENVIKING_KEY" > "$HOME/.openviking/ovcli.conf"
              # compendium-sync.py resolves the vault at ~/code/compendium.
              # Blobless clone (NOT --depth 1): --changed needs full history to
              # resolve the baseline SHA and run git diff; blobs fetch lazily so
              # only HEAD's files are downloaded at checkout.
              git clone --filter=blob:none "https://x-access-token:${GITHUB_TOKEN}@github.com/nathanwhyte/compendium.git" "$HOME/code/compendium"
              cd "$HOME/code/compendium"
              echo "vault at $(git rev-parse --short HEAD); running: sync ${SYNC_ARGS}"
              python3 _scripts/compendium-sync.py sync ${SYNC_ARGS}
          env:
            # Stream Python stdout line-by-line to the container log instead of
            # block-buffering (BUG-1039 follow-up): a long-running entry (e.g. a
            # busy-lock retry) would otherwise hide all prior output until exit.
            - name: PYTHONUNBUFFERED
              value: "1"
            # IMPR-1062 Phase 5: journal run_id + status-file job_name key on
            # this; without it the script falls back to "local-<epoch>".
            - name: JOB_NAME
              value: ${JOB_NAME}
            # BUG-1121: the default dispatch passes --state-file explicitly, but
            # a custom `cluster-sync.sh -- <args>` run replaces SYNC_ARGS whole,
            # so a bulk run would otherwise fall back to the script default
            # (~/.openviking/...) inside the container — writing its state and
            # its terminal receipt to a filesystem that dies with the pod, and
            # reading no journal from the PVC. This makes the mounted claim the
            # default for every mode; an explicit --state-file still wins.
            - name: OV_SYNC_STATE
              value: /state/compendium-sync-state.json
            # The cross-pod single-writer guard. The script's flock defaults to
            # ~/.openviking/compendium-sync.lock — private to each pod — and its
            # check_cluster_sync_active() probe returns early in-cluster, so
            # neither serializes two Jobs. ReadWriteOnce is per-node, so two pods
            # on one node can both mount this claim. Putting the lock ON the
            # claim makes flock the guard when they share a node, and the RWO
            # attach the guard when they do not. Must stay identical to the
            # CronJob's value (IMPR-1154); check-sync-spec-parity.py asserts it.
            - name: OV_SYNC_LOCK
              value: /state/compendium-sync.lock
            - name: OPENVIKING_URL
              value: http://openviking.viking.svc.cluster.local:1933
            - name: OPENVIKING_ACCOUNT
              value: default
            - name: OPENVIKING_USER
              value: noot
            - name: OPENVIKING_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-api-key
                  key: api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: compendium-git-token
                  key: GITHUB_TOKEN
          volumeMounts:
            - name: sync-state
              mountPath: /state
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: sync-state
          persistentVolumeClaim:
            claimName: compendium-sync-state-v2
