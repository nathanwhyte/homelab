---
# In-cluster compendium→OV sync Job (template — render via compendium/cluster-sync.sh).
# Clones the vault from GitHub and runs _scripts/compendium-sync.py against the
# in-cluster OV service. This is the SINGLE sync writer for the compendium OV
# namespace (BUG-1034 phase 2): it only sees pushed origin/main, and the
# last-synced state lives on the compendium-sync-state PVC.
# ${JOB_NAME} and ${SYNC_ARGS} are substituted by the runner (envsubst).
#
# Version pins (bump deliberately, together with a smoke run):
#   image: python:3.13-slim as of 2026-07-07
#   openviking CLI: 0.4.10 (IMPR-1062 Phase 3: the recovery phases rely on the
#     0.4.10 `ov status`/durability contracts, and CLI 0.4.10 ↔ server 0.4.10 is
#     what prod already runs from the Mac; bumped from 0.4.7 2026-07-16)
#   The pip install below ALSO ships the in-process SyncHTTPClient (the 0.4.10
#     wheel vendors openviking_cli) — the IMPR-1071 SDK transport needs NO extra
#     pin. Since Phase 2 (BUG-1042 fix, verified live 2026-07-17) the default
#     transport is --client=sdk: pointers are written as PLAIN FILES. The ov CLI
#     install is retained only as the one-release rollback lever
#     (OV_SYNC_CLIENT=cli or SYNC_ARGS "--client cli").
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: compendium
  labels:
    app: compendium-sync
spec:
  backoffLimit: 0
  # BUG-1035: bound a wedged run so it frees the state PVC + guard.
  # IMPR-1062 Phase 3: the script owns a 2400s journal deadline. Kubernetes
  # starts this clock before scheduling, image pull, package install, clone, and
  # journal preparation, so reserve 1200s for that preflight work. The 3600s
  # ceiling still bounds a pod that hangs outside the script's deadline path.
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: compendium-sync
    spec:
      restartPolicy: Never
      # IMPR-1062 Phase 4: the SA carries the narrowly-scoped cross-namespace
      # permission (sync-rbac.yaml) for the in-Job guarded OV heal-restart.
      serviceAccountName: compendium-sync
      containers:
        - name: sync
          image: python:3.13-slim@sha256:eb43ff125d8d58d7449dcba7d336c23bcac412f526d861db493b9994d8010280
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              apt-get update -qq && apt-get install -y -qq git >/dev/null
              pip install --quiet openviking==0.4.10
              # ov CLI requires a config file to exist even when env vars are set
              mkdir -p "$HOME/.openviking"
              printf '{"url":"%s","api_key":"%s","root_api_key":"%s","account":"default","user":"noot","timeout":300.0,"output":"table"}\n' \
                "$OPENVIKING_URL" "$OPENVIKING_KEY" "$OPENVIKING_KEY" > "$HOME/.openviking/ovcli.conf"
              # compendium-sync.py resolves the vault at ~/code/compendium.
              # Blobless clone (NOT --depth 1): --changed needs full history to
              # resolve the baseline SHA and run git diff; blobs fetch lazily so
              # only HEAD's files are downloaded at checkout.
              git clone --filter=blob:none "https://x-access-token:${GITHUB_TOKEN}@github.com/nathanwhyte/compendium.git" "$HOME/code/compendium"
              cd "$HOME/code/compendium"
              echo "vault at $(git rev-parse --short HEAD); running: sync ${SYNC_ARGS}"
              python3 _scripts/compendium-sync.py sync ${SYNC_ARGS}
          env:
            # Stream Python stdout line-by-line to the container log instead of
            # block-buffering (BUG-1039 follow-up): a long-running entry (e.g. a
            # busy-lock retry) would otherwise hide all prior output until exit.
            - name: PYTHONUNBUFFERED
              value: "1"
            # IMPR-1062 Phase 5: journal run_id + status-file job_name key on
            # this; without it the script falls back to "local-<epoch>".
            - name: JOB_NAME
              value: ${JOB_NAME}
            - name: OPENVIKING_URL
              value: http://openviking.viking.svc.cluster.local:1933
            - name: OPENVIKING_ACCOUNT
              value: default
            - name: OPENVIKING_USER
              value: noot
            - name: OPENVIKING_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-api-key
                  key: api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: compendium-git-token
                  key: GITHUB_TOKEN
          volumeMounts:
            - name: sync-state
              mountPath: /state
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: sync-state
          persistentVolumeClaim:
            claimName: compendium-sync-state
