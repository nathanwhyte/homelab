# SSH access services for Cloudflare Tunnel
# Headless Services with manual Endpoints to route SSH traffic to cluster nodes
# cloudflared can't use ExternalName for SSH, so we use Endpoints + Service
---
apiVersion: v1
kind: Service
metadata:
  name: wemby
  namespace: cloudflare-system
spec:
  clusterIP: None
  ports:
    - name: ssh
      port: 22
      protocol: TCP
      targetPort: 22
---
apiVersion: v1
kind: Endpoints
metadata:
  name: wemby
  namespace: cloudflare-system
subsets:
  - addresses:
      - ip: 192.168.1.9
    ports:
      - name: ssh
        port: 22
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: timmy
  namespace: cloudflare-system
spec:
  clusterIP: None
  ports:
    - name: ssh
      port: 22
      protocol: TCP
      targetPort: 22
---
apiVersion: v1
kind: Endpoints
metadata:
  name: timmy
  namespace: cloudflare-system
subsets:
  - addresses:
      - ip: 192.168.1.19
    ports:
      - name: ssh
        port: 22
        protocol: TCP