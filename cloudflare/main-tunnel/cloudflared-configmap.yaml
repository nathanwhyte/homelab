apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflare-system
data:
  config.yaml: |
    tunnel: 936478c5-b4a9-400c-8490-053451dda497
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000

    ingress:
      # k8s.nathanwhyte.dev removed 2026-07-02 (IMPR-1029): admin UI is now
      # Tailscale/LAN-only via Traefik, not tunneled publicly.
      # headlamp torn down 2026-07-02 (namespace deleted); lamp.nathanwhyte.dev
      # DNS record removal is a Cloudflare-dashboard action.
      - hostname: uploads.nathanwhyte.dev
        service: http://garage.garage.svc.cluster.local:3900
      - hostname: logs.nathanwhyte.dev
        service: http://kube-prometheus-stack-grafana.grafana.svc.cluster.local:3000
      # longhorn.nathanwhyte.dev removed 2026-07-02 (IMPR-1029): admin UI is
      # now Tailscale/LAN-only via Traefik, not tunneled publicly.
      - hostname: chat.nathanwhyte.dev
        service: http://open-webui.openwebui.svc.cluster.local:80
      - hostname: context.nathanwhyte.dev
        service: http://openviking.viking.svc.cluster.local:1933
      - hostname: nathanwhyte.dev
        service: http://phx.portfolio.svc.cluster.local:80
      - hostname: www.nathanwhyte.dev
        service: http://phx.portfolio.svc.cluster.local:80
      # registry.nathanwhyte.dev — stays on Traefik (bandwidth limits)
      # Scaled-to-0 services — uncomment and set domains when ready
      # - hostname: <coach>.nathanwhyte.dev
      #   service: http://credit-coach.coach.svc.cluster.local:3000
      # equal-risk — has its own tunnel "eqrsk"
      # (8af1bd26-d09e-4d5e-86ad-aa7c593d4f21, healthy/4 conns) in the
      # equal-risk namespace; serves risk.nathanwhyte.dev. ID corrected
      # 2026-07-20 — the 49357c9c noted here previously matches no live tunnel.
      # - hostname: <glossary>.nathanwhyte.dev
      #   service: http://glossary.glossary.svc.cluster.local:4000
      - hostname: llama.nathanwhyte.dev
        service: http://ollama-auth-proxy.llama.svc.cluster.local:80
      # hermes stack torn down 2026-07-16 (namespace deleted; mem0 was its sole
      # memory provider and its issues prompted the retirement — see
      # hermes/RETIRED.md). hermes.nathanwhyte.dev DNS record removal is a
      # Cloudflare-dashboard action.
      # mem0 stack torn down 2026-07-02 (namespace deleted; pg dump archived in
      # backups/2026-07-02-mem0-teardown/). mem0/api-mem0.nathanwhyte.dev DNS
      # record removal is a Cloudflare-dashboard action.
      # --- Pending Cloudflare-dashboard DNS removals -----------------------
      # Verified live 2026-07-20 against the Cloudflare API. Each record below
      # still resolves and is proxied to THIS tunnel, so requests reach
      # cloudflared and fall through to the http_status:404 catch-all rather
      # than failing at DNS. Removal is a dashboard action (not GitOps).
      #   hermes, mem0, api-mem0, lamp, k8s, longhorn — see notes above
      #   viking      — ov-console removed; only context.nathanwhyte.dev remains
      #   ssh-manu, ssh-timmy, ssh-wemby — superseded by the single ssh. entry
      #                 point below; no ingress rule here has ever matched them
      # Separately: ollama.nathanwhyte.dev points at tunnel
      # 376cdea8-6f77-4058-af80-76f2c1f9cd43 ("ollama"), which is DOWN with 0
      # connectors and is not defined anywhere in this repo — an orphan
      # predating the llama.nathanwhyte.dev + ollama-auth-proxy route above.
      # Both that DNS record and the tunnel itself are safe to delete.
      # ---------------------------------------------------------------------
      # Single break-glass entry point: timmy (control plane). Reach wemby/manu by
      # hopping from timmy (ssh wemby / ssh manu over the tailnet, or ssh -J).
      - hostname: ssh.nathanwhyte.dev
        service: ssh://timmy.cloudflare-system.svc.cluster.local:22
      # Consolidated copyparty (FEAT-1017). Auth is copyparty's built-in
      # account from copyparty-accounts Secret — a single shared password
      # is the weak link on the public internet, accepted as a tradeoff
      # for "browse from anywhere" convenience. The MacBook backup script
      # still pushes via Tailscale (100.95.215.105:31920), not the tunnel,
      # to keep u2c unattended. See INFO-1064 for the auth-posture
      # tradeoffs and the path to upgrade to Cloudflare Access if wanted.
      - hostname: files.nathanwhyte.dev
        service: http://copyparty.copyparty.svc.cluster.local:80
      # build-hook CI webhook endpoint. Restored 2026-08-26 after retirement on
      # 2026-07-20 (build/HISTORY.md). Deliberately routed through THIS
      # cluster-wide tunnel rather than the dedicated `build` tunnel it used to
      # have — that tunnel (a11f180d) was deleted in the 2026-03-28
      # consolidation, and nothing repointed the endpoint, which is what caused
      # the four-month silent outage. Note the hostname changed: the old
      # endpoint was build.nathanwhyte.dev.
      #
      # POST /{project} requires a bearer token; GET /health is public. A
      # triggered build runs on privileged buildkitd in the `build` namespace
      # alongside the GitHub PAT and registry credentials, so write access to
      # any configured GitHub repo is equivalent to code execution there — see
      # BUG-1088. The token bounds who can trigger a build, not what it can do.
      - hostname: hook.nathanwhyte.dev
        service: http://hook.build.svc.cluster.local:3000
      - service: http_status:404
