# Per-namespace Cloudflare Tunnel connectors
#
# Almost everything that once lived here was consolidated into the single
# cluster-wide `homelab` tunnel on 2026-03-28 (see
# ../main-tunnel/cloudflared-configmap.yaml). The per-service tunnels
# uploads/grafana/viking/portfolio/ssh-server were deleted that day, and the
# admin UIs (k8s, longhorn, lamp) came off the public internet entirely under
# IMPR-1029.
#
# Rewritten 2026-07-20 (IMPR-1028): this file previously declared connectors for
# heaper, garage, kubernetes-dashboard, excalidraw and longhorn-system. None of
# the five were running — heaper and excalidraw no longer exist as namespaces,
# and the other three carried no cloudflared Deployment. Their token Secrets
# (plus coach, glossary, portfolio) referenced tunnels deleted in March and were
# removed from the cluster the same day.
#
# `equal-risk` is the one genuine survivor: it is deliberately NOT part of the
# consolidated tunnel and keeps its own connector for risk.nathanwhyte.dev.
#
# Full topology and history: compendium INFO-1120.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared
  namespace: equal-risk
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: equal-risk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      serviceAccountName: cloudflared
      containers:
        - name: cloudflared
          # The live pod still runs `cloudflare/cloudflared:latest` — applying
          # this manifest pins it, per IMPR-1023. Digest matches the main-tunnel
          # connector; bump tag+digest together when upgrading.
          image: cloudflare/cloudflared:2026.6.1@sha256:6d91c121b803126f7a5344005d17a9324788fc09d305b6e2560ec6040a7ae283
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token-file=/etc/cloudflared/token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tokenfile
              mountPath: /etc/cloudflared
              readOnly: true
      volumes:
        - name: tokenfile
          secret:
            secretName: equal-risk-cloudflared-token
            items:
              - key: TOKEN
                path: token
