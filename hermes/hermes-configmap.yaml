---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
  labels:
    app: hermes-agent
data:
  config.yaml: |
    _config_version: 24
    agent:
      api_max_retries: 3
      max_turns: 90
      tool_use_enforcement: auto
      verbose: false
    approvals:
      mode: manual
      timeout: 60
    compression:
      enabled: true
      threshold: 0.5
      target_ratio: 0.2
    delegation:
      max_concurrent_children: 5
      max_spawn_depth: 2
      child_timeout_seconds: 900
    display:
      show_reasoning: false
      show_cost: false
      streaming: false
    fallback_providers: []
    memory:
      memory_enabled: true
      user_profile_enabled: true
      memory_char_limit: 2200
      user_char_limit: 1375
      provider: openviking
    model:
      api_key: ollama
      base_url: http://chat-ollama.llama.svc:11434/v1
      default: glm-5.1:cloud
      provider: ollama-launch
      ollama_num_ctx: 131072
    providers:
      ollama-launch:
        api: http://chat-ollama.llama.svc:11434/v1
        default_model: glm-5.1:cloud
        models:
          - gemma4:12b-it-qat
          - glm-5.1:cloud
          - nemotron-3-ultra:cloud
        name: Chat Ollama
    terminal:
      backend: ssh
      cwd: /home/hermes
      persistent_shell: true
      ssh_host: hermes-jump.hermes.svc.cluster.local
      ssh_user: hermes
      ssh_port: 22
      ssh_key: /opt/data/.ssh/id_ed25519
      timeout: 180
    toolsets:
      - hermes-cli
    mcp_servers:
      kubernetes:
        command: "npx"
        args: ["-y", "@modelcontextprotocol/server-kubernetes"]
      grafana:
        url: "${GRAFANA_URL}"
        headers:
          Authorization: "Bearer ${GRAFANA_SERVICE_ACCOUNT_TOKEN}"
      openviking:
        url: "http://openviking.viking.svc.cluster.local:1933/mcp"
        headers:
          Authorization: "Bearer ${OPENVIKING_API_KEY}"
