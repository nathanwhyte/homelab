---
# RETIRED 2026-07-16: namespace deleted; reference only. Do not apply.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-jump-entrypoint
  namespace: hermes
  labels:
    app: hermes-jump
data:
  entrypoint.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends \
      ca-certificates \
      curl \
      git \
      jq \
      openssh-server
    rm -rf /var/lib/apt/lists/*

    if ! command -v kubectl >/dev/null 2>&1; then
      curl -fsSL -o /usr/local/bin/kubectl \
        https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl
      chmod +x /usr/local/bin/kubectl
    fi

    if ! command -v gh >/dev/null 2>&1; then
      curl -fsSL -o /tmp/gh.tar.gz \
        https://github.com/cli/cli/releases/download/v2.74.0/gh_2.74.0_linux_amd64.tar.gz
      tar xzf /tmp/gh.tar.gz -C /tmp
      cp /tmp/gh_*/bin/gh /usr/local/bin/gh
      rm -rf /tmp/gh.tar.gz /tmp/gh_*
      chmod +x /usr/local/bin/gh
    fi

    if ! id -u hermes >/dev/null 2>&1; then
      useradd -m -s /bin/bash hermes
    fi

    # Ensure the hermes user owns their persistent home (first-boot fix)
    chown hermes:hermes /home/hermes

    mkdir -p /home/hermes/.ssh /run/sshd
    cp /ssh-public/id_ed25519.pub /home/hermes/.ssh/authorized_keys
    chown -R hermes:hermes /home/hermes/.ssh
    chmod 700 /home/hermes/.ssh
    chmod 600 /home/hermes/.ssh/authorized_keys

    mkdir -p /home/hermes/.kube
    SERVICEACCOUNT_DIR=/var/run/secrets/kubernetes.io/serviceaccount
    cat > /home/hermes/.kube/config <<EOF
    apiVersion: v1
    kind: Config
    clusters:
    - name: in-cluster
      cluster:
        certificate-authority: ${SERVICEACCOUNT_DIR}/ca.crt
        server: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
    contexts:
    - name: in-cluster
      context:
        cluster: in-cluster
        namespace: hermes
        user: hermes-jump
    current-context: in-cluster
    users:
    - name: hermes-jump
      user:
        tokenFile: ${SERVICEACCOUNT_DIR}/token
    EOF
    chown -R hermes:hermes /home/hermes/.kube
    chmod 700 /home/hermes/.kube
    chmod 600 /home/hermes/.kube/config

    # Set up PATH for all login shells so ~/.local/bin is always available
    cat > /etc/profile.d/hermes-path.sh <<'PATHEOF'
    export PATH="$HOME/.local/bin:$PATH"
    PATHEOF

    # Bootstrap git config on first boot (persists on PVC)
    if [ ! -f /home/hermes/.gitconfig ]; then
      su - hermes -c 'git config --global user.name "NewtBot" && git config --global user.email "nathanwhyte35@gmail.com" && git config --global init.defaultBranch main && git config --global core.sshCommand "ssh -o StrictHostKeyChecking=accept-new"'
      chown hermes:hermes /home/hermes/.gitconfig
    fi

    # Install uv + Python on first boot (persists on PVC)
    if ! command -v uv >/dev/null 2>&1; then
      su - hermes -c 'curl -LsSf https://astral.sh/uv/install.sh | sh'
    fi
    # Ensure uv-managed Python is available
    if [ ! -x /home/hermes/.local/bin/python3.12 ]; then
      su - hermes -c '/home/hermes/.local/bin/uv python install 3.12'
    fi

    # Authenticate gh CLI if GITHUB_TOKEN is provided (persists on PVC)
    if [ -n "${GITHUB_TOKEN:-}" ] && [ ! -f /home/hermes/.config/gh/hosts.yml ]; then
      su - hermes -c "echo \"$GITHUB_TOKEN\" | gh auth login --with-token 2>/dev/null || true"
    fi

    # Persist SSH host keys on PVC so they survive pod recreation.
    # On first boot: generate keys and store in /home/hermes/.ssh/host_keys/.
    # On subsequent boots: symlink from /etc/ssh/ to the PVC-backed keys.
    HOST_KEY_DIR=/home/hermes/.ssh/host_keys
    mkdir -p "$HOST_KEY_DIR"
    for keytype in ed25519 ecdsa rsa; do
      if [ -f "$HOST_KEY_DIR/ssh_host_${keytype}_key" ]; then
        # Reuse persisted key — symlink into /etc/ssh/ where sshd expects them
        ln -sf "$HOST_KEY_DIR/ssh_host_${keytype}_key"     "/etc/ssh/ssh_host_${keytype}_key"
        ln -sf "$HOST_KEY_DIR/ssh_host_${keytype}_key.pub" "/etc/ssh/ssh_host_${keytype}_key.pub"
      else
        # First boot: generate and persist
        ssh-keygen -t "$keytype" -f "$HOST_KEY_DIR/ssh_host_${keytype}_key" -N "" -q
        ln -sf "$HOST_KEY_DIR/ssh_host_${keytype}_key"     "/etc/ssh/ssh_host_${keytype}_key"
        ln -sf "$HOST_KEY_DIR/ssh_host_${keytype}_key.pub" "/etc/ssh/ssh_host_${keytype}_key.pub"
      fi
    done
    chown -R hermes:hermes "$HOST_KEY_DIR"
    # Ensure sshd can read the keys (root needs read access via symlink)
    chmod 600 "$HOST_KEY_DIR"/ssh_host_*_key
    chmod 644 "$HOST_KEY_DIR"/ssh_host_*_key.pub

    exec /usr/sbin/sshd -D -e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-jump
  namespace: hermes
  labels:
    app: hermes-jump
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-jump
  template:
    metadata:
      labels:
        app: hermes-jump
    spec:
      serviceAccountName: hermes-jump
      containers:
        - name: sshd
          image: debian:12-slim
          command: ["/scripts/entrypoint.sh"]
          ports:
            - containerPort: 22
              name: ssh
          readinessProbe:
            tcpSocket:
              port: 22
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 22
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-access-token
                  key: GITHUB_TOKEN
          volumeMounts:
            - name: entrypoint
              mountPath: /scripts
            - name: ssh-public
              mountPath: /ssh-public
              readOnly: true
            - name: hermes-jump-home
              mountPath: /home/hermes
      volumes:
        - name: entrypoint
          configMap:
            name: hermes-jump-entrypoint
            defaultMode: 0755
        - name: ssh-public
          secret:
            secretName: hermes-jump-ssh-key
            items:
              - key: id_ed25519.pub
                path: id_ed25519.pub
        - name: hermes-jump-home
          persistentVolumeClaim:
            claimName: hermes-jump-home
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-jump
  namespace: hermes
  labels:
    app: hermes-jump
spec:
  type: ClusterIP
  ports:
    - name: ssh
      port: 22
      protocol: TCP
      targetPort: 22
  selector:
    app: hermes-jump
