---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes
  labels:
    app: hermes-agent
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      serviceAccountName: hermes-agent
      terminationGracePeriodSeconds: 210
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: setup
          image: busybox:1.37
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              # Copy config (always overwrite to pick up ConfigMap changes)
              cp /config/config.yaml /data/config.yaml
              # Ensure .ssh directory exists and copy SSH key
              mkdir -p /data/.ssh
              cp /ssh-key/id_ed25519 /data/.ssh/id_ed25519
              chmod 600 /data/.ssh/id_ed25519
              # Clean stale gateway lock/state from previous pod —
              # s6-overlay auto-supervises gateway, stale PIDs cause
              # "Gateway already running" on fresh pod start (cf. #13655)
              rm -f /data/gateway.lock /data/gateway_state.json
              # SSH client config: auto-accept new host keys (safety net for
              # jump pod recreation after host key persistence fix)
              if [ ! -f /data/.ssh/config ]; then
                printf 'Host hermes-jump.hermes.svc.cluster.local\n  StrictHostKeyChecking accept-new\n  UserKnownHostsFile /opt/data/.ssh/known_hosts\n' > /data/.ssh/config
                chmod 600 /data/.ssh/config
              fi
              # Fix ownership for hermes user (UID 10000) — recursive to cover
              # all files created by root on first run (kanban.db, history, etc.)
              chown -R 10000:10000 /data
          volumeMounts:
            - name: hermes-data
              mountPath: /data
            - name: hermes-config
              mountPath: /config
              readOnly: true
            - name: ssh-key
              mountPath: /ssh-key
              readOnly: true
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:latest
          imagePullPolicy: Always
          # No --replace: s6-overlay supervises gateway lifecycle;
          # --replace races with s6-supervise restart (cf. #11718, #13655)
          args: ["gateway", "run"]
          env:
            - name: HERMES_INFERENCE_MODEL
              value: glm-5.1:cloud
            - name: TERMINAL_ENV
              value: ssh
            - name: TERMINAL_SSH_HOST
              value: hermes-jump.hermes.svc.cluster.local
            - name: TERMINAL_SSH_USER
              value: hermes
            - name: TERMINAL_SSH_PORT
              value: "22"
            - name: TERMINAL_SSH_KEY
              value: /opt/data/.ssh/id_ed25519
            - name: TERMINAL_TIMEOUT
              value: "180"
            - name: HERMES_ACCEPT_HOOKS
              value: "1"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_MODEL_NAME
              value: glm-5.1:cloud
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-api-server-key
                  key: api-key
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            - name: HERMES_DASHBOARD_INSECURE
              value: "1"
            - name: HERMES_DASHBOARD_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-dashboard-token
                  key: token
            # Removed HERMES_GATEWAY_BOOTSTRAP_STATE — it triggered
            # s6 reconcile-profiles to start a second gateway instance,
            # racing with the container args "gateway run" (cf. #13655)
            - name: GATEWAY_ALLOW_ALL_USERS
              value: "true"
            # OpenViking knowledge base provider (IDEA-017) — still active for viking_* tools
            - name: OPENVIKING_ENDPOINT
              value: http://openviking.viking.svc.cluster.local:1933
            - name: OPENVIKING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-api-key
                  key: api-key
            - name: OPENVIKING_ACCOUNT
              value: default
            - name: OPENVIKING_USER
              value: noot
            - name: OPENVIKING_AGENT
              value: hermes
            # Mem0 memory provider (IDEA-029) — replaces OV for agent memory
            - name: MEM0_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mem0-api-key
                  key: ADMIN_API_KEY
            - name: SLACK_HOME_CHANNEL
              value: C0BAP91GV42
          ports:
            - containerPort: 8642
              name: api
            - containerPort: 9119
              name: dashboard
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
            postStart:
              exec:
                # Re-assert SSH key permissions after kubelet fsGroup
                # volume reconciliation may have added g+rw (0660 → 0600)
                command:
                  - /bin/sh
                  - -c
                  - chmod 600 /opt/data/.ssh/id_ed25519
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-home
        - name: hermes-config
          configMap:
            name: hermes-config
        - name: ssh-key
          secret:
            secretName: hermes-jump-ssh-key
            items:
              - key: id_ed25519
                path: id_ed25519
