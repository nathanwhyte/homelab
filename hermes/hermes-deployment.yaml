---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-home
  namespace: hermes
  labels:
    app: hermes-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
  labels:
    app: hermes-agent
data:
  config.yaml: |
    _config_version: 24
    agent:
      api_max_retries: 1
      max_turns: 90
      tool_use_enforcement: auto
      verbose: false
    approvals:
      mode: manual
      timeout: 60
    compression:
      enabled: true
      threshold: 0.5
      target_ratio: 0.2
    display:
      show_reasoning: false
      show_cost: false
      streaming: false
    fallback_providers: []
    memory:
      memory_enabled: true
      user_profile_enabled: true
      memory_char_limit: 2200
      user_char_limit: 1375
    model:
      api_key: ollama
      base_url: http://chat-ollama.llama.svc:11434/v1
      default: glm-5.1:cloud
      provider: ollama-launch
      ollama_num_ctx: 131072
    providers:
      ollama-launch:
        api: http://chat-ollama.llama.svc:11434/v1
        default_model: glm-5.1:cloud
        models:
          - glm-5.1:cloud
          - gemma4:12b-it-qat
          - nemotron-3-ultra:cloud
        name: Chat Ollama
    terminal:
      backend: ssh
      cwd: /home/hermes
      persistent_shell: true
      ssh_host: hermes-jump.hermes.svc.cluster.local
      ssh_user: hermes
      ssh_port: 22
      ssh_key: /opt/data/.ssh/id_ed25519
      timeout: 180
    toolsets:
      - hermes-cli
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes
  labels:
    app: hermes-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      serviceAccountName: hermes-agent
      securityContext:
        fsGroup: 10000
      initContainers:
        - name: setup
          image: busybox:1.37
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              # Copy config (always overwrite to pick up ConfigMap changes)
              cp /config/config.yaml /data/config.yaml
              # Copy SSH key and fix permissions
              mkdir -p /data/.ssh
              cp /ssh-key/id_ed25519 /data/.ssh/id_ed25519
              chmod 600 /data/.ssh/id_ed25519
              # Fix ownership for hermes user (UID 10000) — recursive to cover
              # all files created by root on first run (kanban.db, history, etc.)
              chown -R 10000:10000 /data
          volumeMounts:
            - name: hermes-data
              mountPath: /data
            - name: hermes-config
              mountPath: /config
              readOnly: true
            - name: ssh-key
              mountPath: /ssh-key
              readOnly: true
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.6.5
          args: ["gateway", "run"]
          env:
            - name: HERMES_INFERENCE_MODEL
              value: glm-5.1:cloud
            - name: TERMINAL_ENV
              value: ssh
            - name: TERMINAL_SSH_HOST
              value: hermes-jump.hermes.svc.cluster.local
            - name: TERMINAL_SSH_USER
              value: hermes
            - name: TERMINAL_SSH_PORT
              value: "22"
            - name: TERMINAL_SSH_KEY
              value: /opt/data/.ssh/id_ed25519
            - name: TERMINAL_TIMEOUT
              value: "180"
            - name: HERMES_ACCEPT_HOOKS
              value: "1"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_MODEL_NAME
              value: glm-5.1:cloud
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-api-server-key
                  key: api-key
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            - name: HERMES_DASHBOARD_INSECURE
              value: "1"
            - name: HERMES_DASHBOARD_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-dashboard-token
                  key: token
            - name: HERMES_GATEWAY_BOOTSTRAP_STATE
              value: running
          ports:
            - containerPort: 8642
              name: api
            - containerPort: 9119
              name: dashboard
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-home
        - name: hermes-config
          configMap:
            name: hermes-config
        - name: ssh-key
          secret:
            secretName: hermes-jump-ssh-key
            items:
              - key: id_ed25519
                path: id_ed25519
