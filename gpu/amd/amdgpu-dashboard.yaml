---
# Grafana dashboard for AMD GPU metrics
# Auto-provisioned by the Grafana sidecar via label grafana_dashboard: "1"
apiVersion: v1
kind: ConfigMap
metadata:
  name: amdgpu-dashboard
  namespace: grafana
  labels:
    grafana_dashboard: "1"
data:
  amd-gpu.json: |
    {
      "title": "AMD GPU",
      "uid": "amdgpu-overview",
      "tags": ["gpu", "amd"],
      "timezone": "browser",
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "title": "GPU Utilization",
          "type": "timeseries",
          "id": 1,
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "datasource": {"type": "prometheus"},
          "targets": [
            {"expr": "amdgpu_utilization_percent", "legendFormat": "GPU {{gpu}}", "refId": "A"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": {"mode": "palette-classic"},
              "custom": {
                "fillOpacity": 20,
                "lineWidth": 2,
                "spanNulls": true
              }
            }
          }
        },
        {
          "title": "Temperature",
          "type": "timeseries",
          "id": 2,
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "datasource": {"type": "prometheus"},
          "targets": [
            {"expr": "amdgpu_temperature_celsius", "legendFormat": "GPU {{gpu}}", "refId": "A"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "color": {"mode": "palette-classic"},
              "custom": {
                "fillOpacity": 20,
                "lineWidth": 2,
                "spanNulls": true
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 70},
                  {"color": "red", "value": 90}
                ]
              }
            }
          }
        },
        {
          "title": "Power Draw",
          "type": "timeseries",
          "id": 3,
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "datasource": {"type": "prometheus"},
          "targets": [
            {"expr": "amdgpu_power_watts", "legendFormat": "GPU {{gpu}}", "refId": "A"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "color": {"mode": "palette-classic"},
              "custom": {
                "fillOpacity": 20,
                "lineWidth": 2,
                "spanNulls": true
              }
            }
          }
        },
        {
          "title": "VRAM Usage",
          "type": "timeseries",
          "id": 4,
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8},
          "datasource": {"type": "prometheus"},
          "targets": [
            {"expr": "amdgpu_vram_used_bytes", "legendFormat": "Used", "refId": "A"},
            {"expr": "amdgpu_vram_total_bytes", "legendFormat": "Total", "refId": "B"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": {"mode": "palette-classic"},
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "spanNulls": true
              }
            }
          }
        },
        {
          "title": "Fan Speed",
          "type": "timeseries",
          "id": 5,
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8},
          "datasource": {"type": "prometheus"},
          "targets": [
            {"expr": "amdgpu_fan_rpm", "legendFormat": "GPU {{gpu}}", "refId": "A"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "rpm",
              "color": {"mode": "palette-classic"},
              "custom": {
                "fillOpacity": 20,
                "lineWidth": 2,
                "spanNulls": true
              }
            }
          }
        },
        {
          "title": "Clock Speeds",
          "type": "timeseries",
          "id": 6,
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8},
          "datasource": {"type": "prometheus"},
          "targets": [
            {"expr": "amdgpu_clock_gpu_mhz", "legendFormat": "GPU Core", "refId": "A"},
            {"expr": "amdgpu_clock_mem_mhz", "legendFormat": "Memory", "refId": "B"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "MHz",
              "color": {"mode": "palette-classic"},
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "spanNulls": true
              }
            }
          }
        }
      ]
    }
