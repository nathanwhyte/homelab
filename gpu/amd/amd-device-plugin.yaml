---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amd-gpu-device-plugin
  namespace: kube-system
  labels:
    app: amd-gpu-device-plugin
spec:
  selector:
    matchLabels:
      app: amd-gpu-device-plugin
  template:
    metadata:
      labels:
        app: amd-gpu-device-plugin
    spec:
      nodeSelector:
        gpu.vendor: amd
      priorityClassName: system-node-critical
      containers:
        - name: amd-gpu-dp
          # Digest of the :latest running in-cluster on 2026-07-02 (IMPR-1023);
          # upstream publishes no version tags, so pin by digest.
          image: rocm/k8s-device-plugin@sha256:f5bf03bf1afa97416869557118358253e3551db20db82577b6edc309ad8fe5c9
          securityContext:
            privileged: true
          volumeMounts:
            - name: dp
              mountPath: /var/lib/kubelet/device-plugins
            - name: sys
              mountPath: /sys
      volumes:
        - name: dp
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: sys
          hostPath:
            path: /sys
