apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: searxng
data:
  settings.yml: |
    use_default_settings: true

    server:
      # Internal-only — no need for rate limiting
      limiter: false
      image_proxy: false

    search:
      safe_search: 0
      autocomplete: ""
      # JSON format must be explicitly enabled (disabled by default for security)
      formats:
        - html
        - json

    ui:
      static_use_hash: true
