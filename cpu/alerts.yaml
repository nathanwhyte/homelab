---
# CPU package temperature alerting.
#
# manu shut down twice on 2026-09-14 with the AMD firmware reset reason
# [0x00080a00]: internal CPU thermal limit was tripped. Prometheus had recorded
# the whole run-up — a 110 C peak, and 91 C ninety seconds before the first
# shutdown — and nothing alerted, because no rule evaluated the series. The gap
# was alerting, not instrumentation.
#
# Thresholds are PER NODE, and the two AMD nodes are NOT treated alike.
#
#   node   CPU                  Tjmax   p99     3d peak   condition
#   manu   Ryzen 7 1700          95     67.9*   110       absolute: warn 80, crit 90
#   wemby  Core i7-8750H        100     80.0     96       absolute: warn 92, crit 97
#   timmy  Ryzen 7 7800X3D       89     50.1     65.3     hot AND idle (see below)
#
#   * manu's p99 is measured under the 1550 MHz cap from cpu-freq-cap.service.
#     Revisit its thresholds when the cooler is repasted and the cap comes off.
#
# WHY TIMMY IS DIFFERENT, AND WHY AN ABSOLUTE THRESHOLD CANNOT WORK FOR IT.
#
# The 7800X3D is an X3D part: AMD caps it at 89 C and it is designed to sit
# there under sustained load, holding the ceiling by throttling. So on timmy,
# 89 C is the expected result of working hard — not a fault.
#
# That makes any absolute threshold self-defeating. Set it below 89 and it
# pages every time the machine does real work. Set it above 89 and it never
# fires, because the chip throttles rather than exceeding its own limit. An
# earlier revision of this file used 85/88 and hit both failure modes at once:
# a constant 89 C — the temperature the comment itself called normal — fired
# critical in 3 minutes and warning in 11.
#
# The discriminator is not temperature. It is temperature RELATIVE TO LOAD.
# A 7800X3D at 89 C under full load is healthy. A 7800X3D at 89 C while
# largely idle has a cooling problem, because nothing is producing that heat.
# timmy therefore alerts on hot-while-idle, and has no absolute threshold.
#
# timmy also gets no critical. A meaningful critical would have to predict a
# thermal trip, and this chip throttles instead of tripping — there is no
# temperature above its ceiling to alert on. If it ever does trip, the evidence
# is the firmware reset reason on the next boot, which is after the fact by
# construction. Inventing an unreachable critical to fill the column would be
# worse than leaving it empty.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cpu-alerts
  namespace: grafana
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cpu-temperature
      rules:
        # node_hwmon_temp_celsius carries no `node` label — only `instance`,
        # which is the node-exporter POD IP and therefore changes whenever that
        # pod restarts. manu had three different instance values across the
        # 2026-09-14 incident window, so any rule keyed on instance would have
        # silently lost the node across the very event it exists to catch.
        # Join through kube_pod_info to get a stable node name.
        #
        # Chip selection: k10temp (AMD) surfaces as a PCI path, not a driver
        # name — hence the pci0000:...18_3 matcher rather than something
        # containing "k10temp", which matches nothing. temp1 is the package
        # sensor on both vendors (Tctl on AMD); coretemp temp2+ and AMD's
        # Tccd1 are per-die and redundant here.
        - record: node:cpu_temperature_celsius
          expr: |
            max by (node) (
              node_hwmon_temp_celsius{
                chip=~"pci0000:00_0000:00:18_3|platform_coretemp_0",
                sensor="temp1"
              }
              * on (namespace, pod) group_left (node)
              kube_pod_info{namespace="grafana"}
            )

        # Same join, so the two series share a `node` label and can be combined
        # with `and on (node)`.
        - record: node:cpu_utilization:rate5m
          expr: |
            1 - avg by (node) (
              rate(node_cpu_seconds_total{mode="idle"}[5m])
              * on (namespace, pod) group_left (node)
              kube_pod_info{namespace="grafana"}
            )

        # manu and wemby: absolute thresholds are meaningful, because neither
        # is designed to run at its ceiling. Reaching it means something is
        # wrong.
        - alert: NodeCPUTemperatureHigh
          expr: |
            node:cpu_temperature_celsius{node="manu"}  > 80
            or node:cpu_temperature_celsius{node="wemby"} > 92
          for: 10m
          labels:
            severity: warning
            alertgroup: hardware
          annotations:
            summary: "CPU on {{ $labels.node }} has been above its warning threshold for 10m"
            description: "{{ $labels.node }} CPU package temperature is {{ $value }} C. Sustained heat at this level means cooling is degrading — check fan speed and the die-to-board gradient before it reaches the trip point. See cpu/README.md."

        # Short `for:` deliberately. At 91 C on 2026-09-14 there were 105
        # seconds left before the trip; a 10m hold here would fire after the
        # shutdown it is meant to pre-empt.
        - alert: NodeCPUTemperatureCritical
          expr: |
            node:cpu_temperature_celsius{node="manu"}  > 90
            or node:cpu_temperature_celsius{node="wemby"} > 97
          for: 2m
          labels:
            severity: critical
            alertgroup: hardware
          annotations:
            summary: "CPU on {{ $labels.node }} is near its thermal trip point"
            description: "{{ $labels.node }} CPU package temperature is {{ $value }} C, close to Tjmax. A firmware thermal trip halts the CPU with no OS warning and no teardown — the node simply stops. Shed load now."

        # timmy: heat without work. 85 C is unremarkable for this chip under
        # load, so temperature alone says nothing; paired with utilization
        # below 25% it says the cooler is not removing heat that nothing is
        # generating.
        #
        # 15m rather than 10m: utilization is a 5m rate, so a burst ending just
        # as the window opens can leave the average low while the die is still
        # shedding real heat. The longer hold outlasts that.
        #
        # warning, not critical: an X3D throttles rather than tripping, so this
        # is "cooling is degrading, look at it" — not "the node is about to
        # stop".
        - alert: NodeCPUCoolingDegraded
          expr: |
            node:cpu_temperature_celsius{node="timmy"} > 85
            and on (node) node:cpu_utilization:rate5m{node="timmy"} < 0.25
          for: 15m
          labels:
            severity: warning
            alertgroup: hardware
          annotations:
            summary: "CPU on {{ $labels.node }} is hot while largely idle"
            description: "{{ $labels.node }} CPU package temperature is {{ $value }} C with CPU utilization under 25% for 15m. This chip is designed to sit at its 89 C ceiling under load, so temperature alone is not a fault — but heat without work is. Check fan speed, dust, and cooler seating."

    # BUG-1137: manu's cpu-freq-cap.service (see cpu/README.md) can fail its
    # apply and leave the CPU uncapped, running hot under the exact load the
    # cap exists to prevent. node_cpu_scaling_frequency_hertz tracks the
    # CURRENT frequency and fluctuates with load even while capped, so it
    # cannot tell "uncapped" from "capped but busy". scaling_max_freq is the
    # cap itself, exported as node_cpu_scaling_frequency_max_hertz.
    - name: cpu-freq-cap
      rules:
        # Same instance-churn problem as node_hwmon_temp_celsius: this metric
        # carries `cpu`, not `node`. Join through kube_pod_info for a stable
        # node label, same as the temperature rules above.
        - record: node:cpu_scaling_frequency_max_hertz
          expr: |
            max by (node) (
              node_cpu_scaling_frequency_max_hertz
              * on (namespace, pod) group_left (node)
              kube_pod_info{namespace="grafana"}
            )

        # CAP_KHZ=1550000 in cpu-freq-cap.service is 1.55e9 Hz. Alert well
        # above that — 2e9 Hz is past both of manu's other P-states rounding
        # down to the cap (see the service file's P-state comment), so this
        # only fires on a genuine uncap, not on a boundary rounding artifact.
        # Short `for:` because Restart=on-failure (BUG-1137) now retries a
        # failed apply within RestartSec=5s — a real uncap should still be
        # visible past a brief restart window, but this must not compete with
        # that self-heal on every transient restart.
        - alert: NodeCPUFreqCapOff
          expr: node:cpu_scaling_frequency_max_hertz{node="manu"} > 2e9
          for: 1m
          labels:
            severity: warning
            alertgroup: hardware
          annotations:
            summary: "CPU frequency cap is off on {{ $labels.node }}"
            description: "{{ $labels.node }} is running at {{ $value }} Hz, above the 1.55 GHz cooling-fault cap (BUG-1101). cpu-freq-cap.service has failed to apply or restore the cap — check `systemctl status cpu-freq-cap` on {{ $labels.node }} before load drives it back toward its thermal trip point."
