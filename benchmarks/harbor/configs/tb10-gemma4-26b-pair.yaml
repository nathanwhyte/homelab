# Terminal-Bench 2.1 x 10 tasks — gemma4-26b quant pair (IMPR-1109 step 4)
#
# Stratified 10-task subset of terminal-bench/terminal-bench-2-1 (89 tasks,
# downloaded 2026-07-29 to tb-2-1/): git repair x2, sysadmin x2, text/regex x2,
# coding x2, db recovery x1, misc x1. Heavy build/GPU tasks (compile-compcert,
# caffe-cifar-10, qemu-*, torch-*-parallelism) deliberately excluded from the
# first pass — wall-clock and arm64 risk.
#
# First pass: n_attempts 1 per (task, model) = 20 trials. Bump to 3 for the
# statistical quant comparison once the subset proves stable.
#
# Usage (from benchmarks/harbor/):
#   hb run -c configs/tb10-gemma4-26b-pair.yaml --print-config   # validate
#   hb run -c configs/tb10-gemma4-26b-pair.yaml                  # run (gated)

# Series history: `tb10-gemma4-26b-pair` (2026-07-29, abandoned after trial 1)
# ran on prebuilt amd64 images under emulation at 1.5x timeout — trial 1
# (regex-log, mxfp8) hit AgentTimeoutError at 1350 s yet still scored reward
# 1.0 (solved by step 6, burned the rest self-verifying; 81.6k thinking-heavy
# completion tokens). This -native series builds arm64 images locally and runs
# 2.0x timeouts to give thinking-on local models headroom.
# Series 2 (`-native`, 2026-07-29, abandoned after trial 1): native arm64 build
# worked, but gemma4 looped — solved regex-log at step 1, then 20+ filesystem
# sweeps hunting for a (verifier-side, agent-invisible) test corpus. Root
# cause: Terminus-2 requires the model to declare "task_complete": true TWICE
# (declare + confirm, terminus_2.py:509-533); gemma4 never declared once, and
# the default max_turns is unlimited, so only the timeout stopped it.
# Series 3 (`-native2`) adds max_turns: 20 per agent — a capped agent stops
# cleanly and still gets verified/scored, vs an AgentTimeoutError at the
# ceiling (which, note, also still scores: series-1 trial 1 timed out with
# reward 1.0).
# Series 3 pilot results (stopped at 6/20 trials, 2026-07-29 ~14:45): mxfp8
# 1/3 (git-multibranch 1.0 in 11 turns incl. proper double task_complete;
# regex-log 0 capped; polyglot-c-py 0 timeout at 4 turns), nvfp4 0/2
# (regex-log 0 capped; git-multibranch 0 — clean 5-turn declare-and-confirm
# but wrong, overconfident one-shot). Every failure was stopping-behavior
# (loop / overconfident stop / think-past-timeout); zero unrecovered parser
# errors. Thinking-on burned ~7k tokens/turn → ~7 min/turn on hard tasks.
# Series 4 (`-nothink`): reasoning_effort "none" → LiteLLM maps to top-level
# Ollama think:false (ERR-1004-correct; verified statically in litellm 1.94.0
# ollama transformations lines 180-184/315-316 and harbor lite_llm.py:308).
# Conditions otherwise frozen. Thinking-mode is now a series axis: -native2 =
# think-on evidence, -nothink = think-off.
job_name: tb10-gemma4-26b-pair-nothink
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 2.0

orchestrator:
  type: local
  n_concurrent_trials: 1 # hard cap: one local-model consumer

environment:
  type: docker
  # ⚠ false = pull TB's prebuilt images, which are amd64-only → Rosetta
  # emulation on pop (observed 2026-07-29; task compute emulated, model
  # inference native). All 89 TB-2.1 tasks ship environment/Dockerfile on
  # multi-arch bases, so force_build: true builds native arm64 images locally.
  # Keep ONE value per comparison series — emulated vs native task envs are
  # different conditions. true = build native arm64 images from each task's
  # own Dockerfile (600 s build budget each), ignoring the amd64-only pinned
  # docker_image pulls.
  force_build: true
  delete: true

# Terminus-2 temperature pinned to gemma4's published 1.0 (default is 0.7 —
# INFO-1129); model_info carries limits/cost only.
agents:
  - name: terminus-2
    model_name: ollama/gemma4:coding-26b # mxfp8, 27.7 GB
    kwargs:
      temperature: 1.0
      max_turns: 20 # loop cap — gemma4 rarely signals task_complete (series-2/3 finding)
      reasoning_effort: none # -> Ollama top-level think:false (series-3 timeout fix)
      model_info: &local_model_info
        max_tokens: 131072
        max_input_tokens: 122880
        max_output_tokens: 8192
        input_cost_per_token: 0.0
        output_cost_per_token: 0.0
  - name: terminus-2
    model_name: ollama/gemma4:coding-26b-nvfp4 # nvfp4, ~17 GB (MTP on MLX path)
    kwargs:
      temperature: 1.0
      max_turns: 20
      reasoning_effort: none
      model_info: *local_model_info

datasets:
  - path: tb-2-1/terminal-bench-2-1
    task_names:
      - fix-git
      - git-multibranch
      - openssl-selfsigned-cert
      - nginx-request-logging
      - regex-log
      - log-summary-date-ranges
      - filter-js-from-html
      - polyglot-c-py
      - sqlite-db-truncate
      - password-recovery
