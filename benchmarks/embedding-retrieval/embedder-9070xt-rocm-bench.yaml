# TEMPORARY benchmark-only Qwen3-Embedding-4B on timmy's 9070 XT (ROCm).
# Derived from viking/manifests/embedder-qwen-rocm-deployment.yaml but with a
# FRESH PVC + distinct names so it does NOT fight the RWO volume still attached
# to the dead wemby pod, and does NOT touch the real embedder-qwen wiring.
# Teardown: kubectl delete -f this file  (and the PVC).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embedder-bench-cache
  namespace: bench
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-ssd
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder-rocm-bench
  namespace: bench
  labels:
    app: embedder-rocm-bench
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: embedder-rocm-bench
  template:
    metadata:
      labels:
        app: embedder-rocm-bench
    spec:
      nodeSelector:
        kubernetes.io/hostname: timmy
        gpu.vendor: amd
      securityContext:
        fsGroup: 0
      initContainers:
        - name: model-fetch
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              model_path="/models/${MODEL_FILE}"
              if [ -f "${model_path}" ]; then
                echo "cached: ${model_path}"
              else
                curl -fL --retry 5 --retry-delay 10 "${MODEL_URL}" -o "${model_path}.tmp"
                mv "${model_path}.tmp" "${model_path}"
              fi
              ln -sf "${model_path}" /models/current.gguf
          env:
            - name: MODEL_FILE
              value: Qwen3-Embedding-4B-Q8_0.gguf
            - name: MODEL_URL
              value: https://huggingface.co/Qwen/Qwen3-Embedding-4B-GGUF/resolve/main/Qwen3-Embedding-4B-Q8_0.gguf
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server-rocm
          env:
            - name: HIP_VISIBLE_DEVICES
              value: "0"
          command: ["/app/llama-server"]
          args:
            - --model
            - /models/current.gguf
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --embedding
            - --pooling
            - last
            - --ctx-size
            - "32768"
            - --n-gpu-layers
            - "999"
            - --parallel
            - "4"
            - --threads
            - "8"
            - --batch-size
            - "4096"
            - --ubatch-size
            - "4096"
            - --split-mode
            - none
            - --main-gpu
            - "0"
            - --flash-attn
            - "on"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 12Gi
          securityContext:
            privileged: true
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            - name: rocblas-library
              mountPath: /opt/rocm/lib/rocblas/library
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: embedder-bench-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: rocblas-library
          hostPath:
            path: /opt/rocm-7.2.1/lib/rocblas/library
            type: Directory
