# Embedder throughput on one CUDA node, one quant arm per run (TASK-1217).
# TASK-1136 measured manu's GTX 1080 at 894 tok/s (July, no power cap, batch
# 4096). This template measures a card at the PRODUCTION embedder config and
# adds a Q4_K_M arm next to Q8_0.
#
# History: first written for wemby's GTX 1060. That run hard-powered-off wemby
# ~5 min into full load (GPU 84-85 C, 5,631 / 6,144 MiB; power-cable fault
# suspected), so the 1060 is out and the template is now node-parameterized.
#
# TEMPLATE: not directly appliable. throughput-cuda-run.sh substitutes
#   __NODE__     kubernetes.io/hostname of the GPU node (manu | wemby)
#   __QUANT__    GGUF quant tag (Q8_0 | Q4_K_M)
#   __UBATCH__   batch/ubatch size (default 512 = production embedder-qwen-cuda)
#   __LABEL__    result label, e.g. gtx1080-cuda-q8_0-ub512
#   __MAX_DOCS__ doc cap; 0 = full corpus, 200 = quick validation pass
#
# Serving args mirror viking/manifests/embedder-qwen-cuda-deployment.yaml:
# ctx 8192, --parallel 1, batch/ubatch 512, flash-attn on, pooling last,
# --threads 4. Holding batch fixed makes the quant the only variable between
# arms.
#
# Models are cached on the bench-data PVC (/data/models), so a rerun or the
# second arm does not re-download. The PVC is RWO and pinned to the node by
# `throughput-apply.sh --node <node>`; this Deployment and the Job share it
# node-locally.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: embedder-cuda-arm, namespace: bench, labels: { app: embedder-cuda-arm } }
spec:
  replicas: 1
  # First run of a quant downloads its GGUF in the init container; the default
  # 600s deadline fails the rollout mid-download on a 4.3 GB file.
  progressDeadlineSeconds: 3600
  strategy: { type: Recreate }
  selector: { matchLabels: { app: embedder-cuda-arm } }
  template:
    metadata: { labels: { app: embedder-cuda-arm } }
    spec:
      runtimeClassName: nvidia
      nodeSelector: { kubernetes.io/hostname: __NODE__ }
      initContainers:
        - name: fetch
          image: curlimages/curl:8.12.1
          # curlimages runs as curl_user; the fresh PVC root is root-owned, so
          # mkdir /data/models fails without root (production manifest does the same).
          securityContext: { runAsUser: 0, runAsGroup: 0 }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu; mkdir -p /data/models; f=/data/models/Qwen3-Embedding-4B-__QUANT__.gguf
              [ -f "$f" ] || { curl -fL --retry 5 --retry-delay 10 \
                https://huggingface.co/Qwen/Qwen3-Embedding-4B-GGUF/resolve/main/Qwen3-Embedding-4B-__QUANT__.gguf -o "$f.tmp" && mv "$f.tmp" "$f"; }
          volumeMounts: [{ name: data, mountPath: /data }]
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          command: ["/app/llama-server"]
          args: ["--model","/data/models/Qwen3-Embedding-4B-__QUANT__.gguf","--host","0.0.0.0","--port","8000","--embedding","--pooling","last","--ctx-size","8192","--n-gpu-layers","999","--parallel","1","--threads","4","--batch-size","__UBATCH__","--ubatch-size","__UBATCH__","--split-mode","none","--main-gpu","0","--flash-attn","on","--metrics"]
          ports: [{ containerPort: 8000, name: http }]
          resources:
            requests: { cpu: "500m", memory: 2Gi, nvidia.com/gpu: "1" }
            limits: { cpu: "4", memory: 6Gi, nvidia.com/gpu: "1" }
          startupProbe: { tcpSocket: { port: 8000 }, periodSeconds: 10, failureThreshold: 120 }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: bench-data } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: embedder-cuda-arm, namespace: bench }
spec: { selector: { app: embedder-cuda-arm }, ports: [{ port: 8000, targetPort: 8000 }] }
---
apiVersion: batch/v1
kind: Job
metadata: { name: throughput-cuda-arm, namespace: bench }
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector: { kubernetes.io/hostname: __NODE__ } # shares bench-data (RWO) node-locally
      containers:
        - name: runner
          image: ghcr.io/astral-sh/uv:python3.12-bookworm
          workingDir: /app
          env:
            - { name: EMBED_URL, value: "http://embedder-cuda-arm.bench.svc:8000/v1/embeddings" }
            - { name: BENCH_CORPUS, value: /data/corpus.jsonl }
            - { name: BENCH_RESULTS, value: /data/results }
            - { name: BENCH_LABEL, value: __LABEL__ }
            - { name: BENCH_BATCH, value: "16" }
            - { name: BENCH_MAX_DOCS, value: "__MAX_DOCS__" }
            - { name: BENCH_MODEL, value: Qwen3-Embedding-4B-__QUANT__ }
            - { name: UV_CACHE_DIR, value: /data/uvcache }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until python3 -c "import urllib.request; urllib.request.urlopen('http://embedder-cuda-arm.bench.svc:8000/health',timeout=3)" 2>/dev/null; do
                echo "waiting for embedder-cuda-arm /health..."; sleep 5
              done
              uv run /app/benchmark_throughput.py
          resources: { requests: { cpu: "1", memory: 1Gi }, limits: { cpu: "2", memory: 4Gi } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: scripts, mountPath: /app }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: bench-data } }
        - { name: scripts, configMap: { name: throughput-scripts } }
