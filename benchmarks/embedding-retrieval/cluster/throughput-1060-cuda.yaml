# Embedder throughput on wemby's GTX 1060 (CUDA), one quant arm per run.
# Follows TASK-1136 (which measured only manu's GTX 1080: 894 tok/s). manu is
# thermally restricted, so this measures the 1060 as the OpenViking embedder
# host, and adds a Q4_K_M arm next to production Q8_0.
#
# TEMPLATE: not directly appliable. throughput-1060-run.sh substitutes
#   __QUANT__   GGUF quant tag (Q8_0 | Q4_K_M)
#   __UBATCH__  batch/ubatch size (default 512 = the production 1060 config)
#   __LABEL__   result label, e.g. gtx1060-cuda-q8_0-ub512
#   __MAX_DOCS__ doc cap; 0 = full corpus, 200 = quick validation pass
#
# Serving args mirror the production 1060 config (viking/manifests/
# embedder-qwen-cuda-deployment.yaml before the IMPR-1077 move): ctx 8192,
# --parallel 1, batch/ubatch 512, flash-attn on, pooling last. Holding batch
# fixed makes the quant the only variable between arms. Note the 1080 run used
# batch 4096, so a 1060-vs-1080 comparison carries that difference.
#
# Models are cached on the bench-data PVC (/data/models), so a rerun or the
# second arm does not re-download. The PVC is RWO and pinned to wemby by
# `throughput-apply.sh --node wemby`; this Deployment and the Job share it
# node-locally.
#
# Prereq: reranker-bge (viking) holds wemby's only GPU and must be at
# replicas=0 for the run window. The run script checks and refuses otherwise.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: embedder-1060-bench, namespace: bench, labels: { app: embedder-1060-bench } }
spec:
  replicas: 1
  # First run of a quant downloads its GGUF in the init container; the default
  # 600s deadline fails the rollout mid-download on a 4.3 GB file.
  progressDeadlineSeconds: 3600
  strategy: { type: Recreate }
  selector: { matchLabels: { app: embedder-1060-bench } }
  template:
    metadata: { labels: { app: embedder-1060-bench } }
    spec:
      runtimeClassName: nvidia
      nodeSelector: { kubernetes.io/hostname: wemby }
      initContainers:
        - name: fetch
          image: curlimages/curl:8.12.1
          # curlimages runs as curl_user; the fresh PVC root is root-owned, so
          # mkdir /data/models fails without root (production manifest does the same).
          securityContext: { runAsUser: 0, runAsGroup: 0 }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu; mkdir -p /data/models; f=/data/models/Qwen3-Embedding-4B-__QUANT__.gguf
              [ -f "$f" ] || { curl -fL --retry 5 --retry-delay 10 \
                https://huggingface.co/Qwen/Qwen3-Embedding-4B-GGUF/resolve/main/Qwen3-Embedding-4B-__QUANT__.gguf -o "$f.tmp" && mv "$f.tmp" "$f"; }
          volumeMounts: [{ name: data, mountPath: /data }]
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          command: ["/app/llama-server"]
          args: ["--model","/data/models/Qwen3-Embedding-4B-__QUANT__.gguf","--host","0.0.0.0","--port","8000","--embedding","--pooling","last","--ctx-size","8192","--n-gpu-layers","999","--parallel","1","--threads","4","--batch-size","__UBATCH__","--ubatch-size","__UBATCH__","--split-mode","none","--main-gpu","0","--flash-attn","on","--metrics"]
          ports: [{ containerPort: 8000, name: http }]
          resources:
            requests: { cpu: "500m", memory: 2Gi, nvidia.com/gpu: "1" }
            limits: { cpu: "4", memory: 6Gi, nvidia.com/gpu: "1" }
          startupProbe: { tcpSocket: { port: 8000 }, periodSeconds: 10, failureThreshold: 120 }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: bench-data } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: embedder-1060-bench, namespace: bench }
spec: { selector: { app: embedder-1060-bench }, ports: [{ port: 8000, targetPort: 8000 }] }
---
apiVersion: batch/v1
kind: Job
metadata: { name: throughput-1060, namespace: bench }
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector: { kubernetes.io/hostname: wemby } # shares bench-data (RWO) node-locally
      containers:
        - name: runner
          image: ghcr.io/astral-sh/uv:python3.12-bookworm
          workingDir: /app
          env:
            - { name: EMBED_URL, value: "http://embedder-1060-bench.bench.svc:8000/v1/embeddings" }
            - { name: BENCH_CORPUS, value: /data/corpus.jsonl }
            - { name: BENCH_RESULTS, value: /data/results }
            - { name: BENCH_LABEL, value: __LABEL__ }
            - { name: BENCH_BATCH, value: "16" }
            - { name: BENCH_MAX_DOCS, value: "__MAX_DOCS__" }
            - { name: BENCH_MODEL, value: Qwen3-Embedding-4B-__QUANT__ }
            - { name: UV_CACHE_DIR, value: /data/uvcache }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until python3 -c "import urllib.request; urllib.request.urlopen('http://embedder-1060-bench.bench.svc:8000/health',timeout=3)" 2>/dev/null; do
                echo "waiting for embedder-1060-bench /health..."; sleep 5
              done
              uv run /app/benchmark_throughput.py
          resources: { requests: { cpu: "1", memory: 1Gi }, limits: { cpu: "2", memory: 4Gi } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: scripts, mountPath: /app }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: bench-data } }
        - { name: scripts, configMap: { name: throughput-scripts } }
