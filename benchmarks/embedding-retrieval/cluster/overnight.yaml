# Cluster-native overnight benchmark (TASK-1122). Disposable `bench` namespace.
# Apply order handled by kubectl (it creates all; Job waits on services via the
# driver's wait_url). Teardown: kubectl delete namespace bench.
# Prereqs created out-of-band: secret `bench-git` (GitHub token) + configmap
# `bench-scripts` (the .py + run-all.sh + ground truth) — see cluster/apply.sh.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: bench-data, namespace: bench }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-ssd
  resources: { requests: { storage: 30Gi } }
---
# --- scratch pgvector ---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pgvector, namespace: bench, labels: { app: pgvector } }
spec:
  replicas: 1
  selector: { matchLabels: { app: pgvector } }
  template:
    metadata: { labels: { app: pgvector } }
    spec:
      containers:
        - name: pg
          image: pgvector/pgvector:pg17
          env:
            - { name: POSTGRES_USER, value: bench }
            - { name: POSTGRES_PASSWORD, value: bench }
            - { name: POSTGRES_DB, value: embedbench }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: pgdata, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "bench", "-d", "embedbench"] }
            periodSeconds: 5
      volumes: [{ name: pgdata, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: pgvector, namespace: bench }
spec:
  selector: { app: pgvector }
  ports: [{ port: 5432, targetPort: 5432 }]
---
# --- Qwen embedders on the 9070 XT (ROCm, --pooling last). Two pods share the
#     card with Ollama (proven OK); ~5 GB combined weights. ---
apiVersion: apps/v1
kind: Deployment
metadata: { name: embedder-qwen4b, namespace: bench, labels: { app: embedder-qwen4b } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: embedder-qwen4b } }
  template:
    metadata: { labels: { app: embedder-qwen4b } }
    spec:
      nodeSelector: { kubernetes.io/hostname: timmy, gpu.vendor: amd }
      securityContext: { fsGroup: 0 }
      initContainers:
        - name: fetch
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu; f=/models/Qwen3-Embedding-4B-Q8_0.gguf
              [ -f "$f" ] || curl -fL --retry 5 https://huggingface.co/Qwen/Qwen3-Embedding-4B-GGUF/resolve/main/Qwen3-Embedding-4B-Q8_0.gguf -o "$f"
              ln -sf "$f" /models/current.gguf
          securityContext: { runAsUser: 0 }
          volumeMounts: [{ name: models, mountPath: /models }]
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server-rocm
          env: [{ name: HIP_VISIBLE_DEVICES, value: "0" }]
          command: ["/app/llama-server"]
          args: ["--model","/models/current.gguf","--host","0.0.0.0","--port","8000",
                  "--embedding","--pooling","last","--ctx-size","8192","--n-gpu-layers","999",
                  "--parallel","1","--batch-size","4096","--ubatch-size","4096",
                  "--split-mode","none","--main-gpu","0","--flash-attn","on"]
          ports: [{ containerPort: 8000 }]
          securityContext: { privileged: true }
          startupProbe: { tcpSocket: { port: 8000 }, periodSeconds: 10, failureThreshold: 120 }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10 }
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: shm, mountPath: /dev/shm }
            - { name: rocblas, mountPath: /opt/rocm/lib/rocblas/library }
      volumes:
        - { name: models, emptyDir: {} }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 4Gi } }
        - { name: rocblas, hostPath: { path: /opt/rocm-7.2.1/lib/rocblas/library, type: Directory } }
---
apiVersion: v1
kind: Service
metadata: { name: embedder-qwen4b, namespace: bench }
spec: { selector: { app: embedder-qwen4b }, ports: [{ port: 8000, targetPort: 8000 }] }
---
