---
apiVersion: v1
kind: Service
metadata: { name: embedder-qwen06, namespace: bench }
spec: { selector: { app: embedder-qwen06 }, ports: [{ port: 8000, targetPort: 8000 }] }
---
# --- runner Job: seed corpus (clone compendium + export), then run the matrix ---
apiVersion: batch/v1
kind: Job
metadata: { name: bench-runner, namespace: bench }
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector: { kubernetes.io/hostname: manu } # CPU/RAM headroom, off control-plane
      initContainers:
        - name: clone
          image: alpine/git:2.47.1
          env:
            - { name: TOKEN, valueFrom: { secretKeyRef: { name: bench-git, key: token } } }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              [ -d /data/compendium/.git ] || git clone --depth 1 \
                "https://${TOKEN}@github.com/nathanwhyte/compendium.git" /data/compendium
              # Strip the token from the persisted remote URL — otherwise it
              # sits in .git/config on the PVC for the namespace's lifetime.
              git -C /data/compendium remote set-url origin \
                https://github.com/nathanwhyte/compendium.git
          volumeMounts: [{ name: data, mountPath: /data }]
        - name: export
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - python /app/export_corpus.py --vault /data/compendium --out /data/corpus.jsonl
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: scripts, mountPath: /app }
      containers:
        - name: runner
          image: ghcr.io/astral-sh/uv:python3.12-bookworm
          workingDir: /app
          env:
            - { name: BENCH_DB, value: "postgresql://bench:bench@pgvector.bench.svc:5432/embedbench" }
            - { name: BENCH_CORPUS, value: /data/corpus.jsonl }
            - { name: BENCH_GROUND_TRUTH, value: /app/eval_groundtruth_2026-07-04.json }
            - { name: BENCH_RESULTS, value: /data/results }
            - { name: BENCH_SCRATCH, value: /data/scratch }
            - { name: UV_CACHE_DIR, value: /data/uvcache }
            - { name: HF_HOME, value: /data/hf }
            - { name: QWEN4B_URL, value: "http://embedder-qwen4b.bench.svc:8000/v1/embeddings" }
            - { name: QWEN06_URL, value: "http://embedder-qwen06.bench.svc:8000/v1/embeddings" }
          command: ["bash", "/app/run-all.sh"]
          resources: { requests: { cpu: "2", memory: 4Gi }, limits: { cpu: "8", memory: 16Gi } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: scripts, mountPath: /app }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: bench-data } }
        - { name: scripts, configMap: { name: bench-scripts } }
