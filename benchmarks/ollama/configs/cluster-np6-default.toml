# Cluster-side NUM_PARALLEL=6 baseline for timmy's RX 9070 XT.
# Matches current production concurrency with the production QAT GGUF model.

[ollama]
url = "http://ollama.llama.svc:11434"
model = "gemma4:12b-it-qat"
num_ctx = 16384
num_predict = 512
temperature = 0.3

[workload]
name = "mixed_mem0"
max_concurrency = 6
requests_per_level = 6
repeats = 3
cooldown_seconds = 15

[prometheus]
url = "http://prom-prometheus.grafana:9090"
instance_label = ".*"
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-cluster-np6-default"
