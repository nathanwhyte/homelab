# Pop small-MoE matrix: north-mini-code-1.0 REPEAT of row 1, agentic @ 32K, C=1..3
#
# Byte-identical to pop-moe-north-mini-nvfp4-agentic.toml except for the output
# prefix. Runs last so the same config is measured at both ends of the matrix.
#
# Why: across two runs of the identical config this model reported 86.6 and
# then 72.1 tok/s at C=1 — a ~17% swing — while nemotron3 moved ~2% between the
# same two runs. Several models in this table sit within 17% of one another, so
# an unquantified run-to-run variance of that size would undermine cross-model
# ranking.
#
# Suspected cause is residual memory pressure: laguna:mxfp8 was loaded at 52 GB
# during the mxfp8 investigation, taking swap-in-use to 8.9 GB and growing the
# swap file 4 -> 10 GB, and macOS does not shrink that back promptly. Running
# the same config at the end of a long matrix — with the oversized models now
# deleted — tests whether the number recovers.
#
# Read the pair as a variance estimate, not as two independent measurements.
[ollama]
url = "http://localhost:11434"
model = "north-mini-code-1.0:mlx-nvfp4"
num_ctx = 32768
num_predict = 16384
temperature = 1.0                         # per-config (shipped Modelfile)

[ollama.options]                          # per-config (shipped Modelfile)
top_p = 0.95

[workload]
name = "agentic"
max_concurrency = 3
requests_per_level = 3
repeats = 3
cooldown_seconds = 20

[prometheus]
url = ""
instance_label = ""
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-pop-moe-north-mini-nvfp4-repeat-agentic"
