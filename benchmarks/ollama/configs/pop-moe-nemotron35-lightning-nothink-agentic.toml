# Pop MoE matrix addition: nemotron-3.5-lightning:30b-mlx, THINKING OFF, agentic @ 32K, C=1..3 (PROJ-1003)
# Paired with pop-moe-nemotron35-lightning-agentic.toml to isolate reasoning cost.
# The pair matters here more than usual: the model's thinking output length is
# high-variance at its recommended temperature 1.0 (INFO-1140 measured 912 vs
# 10,249 tokens for the same trivial ask across two runs).
# Sampling: NVIDIA HF card (2026-08-11) — Temperature 1.0 / Top_P 0.95, as shipped.
# Requires ollama >= 0.32.9 (Nemotron 3 architecture support).
[ollama]
url = "http://localhost:11434"
model = "nemotron-3.5-lightning:30b-mlx"
num_ctx = 32768
num_predict = 16384
temperature = 1.0                         # per-config (shipped Modelfile = HF card rec)
think = false

[ollama.options]                          # per-config (shipped Modelfile = HF card rec)
top_p = 0.95

[workload]
name = "agentic"
max_concurrency = 3
requests_per_level = 3
repeats = 3
cooldown_seconds = 20

[prometheus]
url = ""
instance_label = ""
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-pop-moe-nemotron35-lightning-nothink-agentic"
