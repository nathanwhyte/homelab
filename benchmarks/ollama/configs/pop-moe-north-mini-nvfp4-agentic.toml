# Pop small-MoE matrix: north-mini-code-1.0 agentic @ 32K, C=1..3 (PROJ-1003)
# Sampling: shipped Modelfile defaults (see pop-moe-recommended-params.txt)
[ollama]
url = "http://localhost:11434"
model = "north-mini-code-1.0:mlx-nvfp4"
num_ctx = 32768
num_predict = 2048
temperature = 1.0                         # per-config (shipped Modelfile)

[ollama.options]                          # per-config (shipped Modelfile)
top_p = 0.95

[workload]
name = "agentic"
max_concurrency = 3
requests_per_level = 3
repeats = 3
cooldown_seconds = 20

[prometheus]
url = ""
instance_label = ""
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-pop-moe-north-mini-nvfp4-agentic"
