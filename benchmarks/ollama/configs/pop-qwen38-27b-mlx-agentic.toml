# Pop matrix: qwen3.8 27b MLX/nvfp4 agentic @ 32K, C=1..3 (PROJ-1003, TASK-1189)
# Format pair to pop-qwen38-27b-gguf-agentic.toml. Both tags are 18 GB, so
# unlike most MLX-vs-GGUF rows in the 2026-05-08 matrix the delta here is the
# serving path and quant format alone, NOT weight size. Everything below must
# stay byte-identical between the two configs except `model` and `prefix`.
#
# qwen3.8:27b is DENSE (27 B active every token) with a hybrid attention stack:
# 64 layers, full_attention_interval=4, so only 16 of 64 carry a KV cache.
# It also ships an MTP head (mtp_num_hidden_layers=1, shared embeddings).
#
# Bandwidth sanity check for reading the result: pop's measured MLX streaming
# peak is ~570 GB/s (see run-pop-gemma4-31b-matrix.sh). A purely bandwidth-bound
# dense decode at 18 GB of weights tops out near 570/18 = 31.7 tok/s. A decode
# figure materially above that implies MTP is active and accepting, exactly as
# the gemma4:31b-nvfp4 row inferred. Below it implies a slow kernel path.
#
# Sampling is Qwen's recommended THINKING-mode set (thinking is on by default
# for this family): temperature=1.0, top_p=0.95, top_k=20. min_p/presence_penalty
# from the model card are omitted deliberately — Ollama does not expose them in
# the shape Qwen documents, and a silently-ignored option is worse than an
# absent one. Record the effective set from `ollama show --parameters`.
[ollama]
url = "http://localhost:11434"
model = "qwen3.8:27b-mlx"
num_ctx = 32768
num_predict = 16384
temperature = 1.0                         # Qwen3.8 thinking-mode recommendation

[ollama.options]                          # Qwen3.8 thinking-mode recommendation
top_p = 0.95
top_k = 20

[workload]
name = "agentic"
max_concurrency = 3
requests_per_level = 3
repeats = 3
cooldown_seconds = 20

[prometheus]
url = ""
instance_label = ""
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-pop-qwen38-27b-mlx-agentic"
