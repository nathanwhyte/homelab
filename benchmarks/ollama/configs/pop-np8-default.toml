# Pop-local NUM_PARALLEL=8 baseline for the M5 Max.
# Queue-depth scaling test with gemma4:12b-mlx.

[ollama]
url = "http://localhost:11434"
model = "gemma4:12b-mlx"
num_ctx = 16384
num_predict = 512
temperature = 0.3

[workload]
name = "mixed_mem0"
max_concurrency = 8
requests_per_level = 8
repeats = 3
cooldown_seconds = 15

[prometheus]
url = ""
instance_label = ""
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-pop-np8-default"
