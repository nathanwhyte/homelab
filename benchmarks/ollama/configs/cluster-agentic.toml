# Cluster-side agentic benchmark config for timmy's RX 9070 XT.
# Larger context and generation limits to match omnipendium sub-agent and mem0
# extraction workloads.

[ollama]
url = "http://ollama.llama.svc:11434"
model = "gemma4:12b-it-qat"
num_ctx = 32768
num_predict = 2048
temperature = 0.3

[workload]
name = "agentic"
max_concurrency = 8
requests_per_level = 8
repeats = 3
cooldown_seconds = 20

[prometheus]
url = "http://prom-prometheus.grafana:9090"
instance_label = ".*"
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-cluster-agentic"
