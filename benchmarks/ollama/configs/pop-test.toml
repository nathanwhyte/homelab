# Quick test config for pop-local Ollama validation.

[ollama]
url = "http://localhost:11434"
model = "gemma4:12b-mlx"
num_ctx = 16384
num_predict = 128
temperature = 0.3

[workload]
name = "mixed_mem0"
max_concurrency = 2
requests_per_level = 2
repeats = 1
cooldown_seconds = 5

[prometheus]
url = ""
instance_label = ""
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-pop-test"
