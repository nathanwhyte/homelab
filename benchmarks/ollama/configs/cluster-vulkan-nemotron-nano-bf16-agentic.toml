# TASK-1186 row 8 / TASK-1013: nemotron-3-nano:4b-bf16, NATIVE THINKING,
# agentic @ 32K, C=1..3 — mirrors pop's nemotron-3.5-lightning pair
# (pop-moe-nemotron35-lightning-agentic.toml) parameter-for-parameter so the
# timmy row is directly comparable to the INFO-1140 record.
# Sampling: NVIDIA HF card rec Temperature 1.0 / Top_P 0.95, as shipped.
# Run the runner with BENCH_NUM_PARALLEL=3 for this family (pop ran NP=3).
# VERSION GATE: nemotron 3 architecture needs ollama >= 0.32.9 — the pod image
# must be bumped before this config can run; the coherence gate fails closed
# on an unsupported server.

[ollama]
url = "http://ollama.llama.svc:11434"
model = "nemotron-3-nano:4b-bf16"
num_ctx = 32768
num_predict = 16384
temperature = 1.0

[ollama.options]
top_p = 0.95

[workload]
name = "agentic"
max_concurrency = 3
requests_per_level = 3
repeats = 3
cooldown_seconds = 20

[prometheus]
url = "http://prom-prometheus.grafana:9090"
instance_label = ".*"
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-cluster-nemotron-nano-bf16-agentic"
