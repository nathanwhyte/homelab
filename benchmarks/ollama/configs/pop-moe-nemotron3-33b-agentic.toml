# Pop small-MoE matrix: nemotron3:33b agentic @ 32K, C=1..3 (PROJ-1003)
# Sampling: harness default temperature 0.3 — no shipped Modelfile params and
# no ollama.com card recommendation (see pop-moe-recommended-params.txt).
# The absence of model-specific settings is itself recorded in the report.
[ollama]
url = "http://localhost:11434"
model = "nemotron3:33b"
num_ctx = 32768
num_predict = 2048
temperature = 0.3                         # harness default (no model rec found)

[workload]
name = "agentic"
max_concurrency = 3
requests_per_level = 3
repeats = 3
cooldown_seconds = 20

[prometheus]
url = ""
instance_label = ""
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-pop-moe-nemotron3-33b-agentic"
