# TASK-1186 row 8 / TASK-1013: nemotron-3-nano:4b-bf16, THINKING OFF, agentic
# @ 32K, C=1..3 — the nothink half of the pair, isolating reasoning cost
# (pop measured thinking at ~4x output tokens / ~6x wall on this family).
# Sampling: Temperature 1.0 / Top_P 0.95, as shipped.
# Run with BENCH_NUM_PARALLEL=3. VERSION GATE: needs ollama >= 0.32.9.

[ollama]
url = "http://ollama.llama.svc:11434"
model = "nemotron-3-nano:4b-bf16"
num_ctx = 32768
num_predict = 16384
temperature = 1.0
think = false

[ollama.options]
top_p = 0.95

[workload]
name = "agentic"
max_concurrency = 3
requests_per_level = 3
repeats = 3
cooldown_seconds = 20

[prometheus]
url = "http://prom-prometheus.grafana:9090"
instance_label = ".*"
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-cluster-nemotron-nano-bf16-agentic-nothink"
