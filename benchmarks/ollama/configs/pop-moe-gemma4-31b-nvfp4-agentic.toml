# Pop matrix: gemma4 31b MLX nvfp4 agentic @ 32K, C=1..3 (PROJ-1003)
# Quantization pair to pop-moe-gemma4-31b-mxfp8-agentic.toml: identical
# workload, sampling and context, so the delta between the two rows is the
# quant format alone (the same pairing laguna-latest/laguna-nvfp4 provides).
# gemma4:31b is the large *dense* variant; the 12b/26b gemma4 rows are MoE.
[ollama]
url = "http://localhost:11434"
model = "gemma4:31b-nvfp4"
num_ctx = 32768
num_predict = 16384
temperature = 1.0                         # per-config (shipped Modelfile)

[ollama.options]                          # per-config (shipped Modelfile)
top_p = 0.95
top_k = 64

[workload]
name = "agentic"
max_concurrency = 3
requests_per_level = 3
repeats = 3
cooldown_seconds = 20

[prometheus]
url = ""
instance_label = ""
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-pop-moe-gemma4-31b-nvfp4-agentic"
