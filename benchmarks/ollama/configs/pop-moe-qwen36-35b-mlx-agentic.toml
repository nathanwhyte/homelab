# Pop small-MoE matrix: qwen3.6:35b-mlx baseline agentic @ 32K, C=1..3 (PROJ-1003)
# Current daily driver re-run under the matrix env. Sampling: shipped Modelfile
# defaults so it runs exactly as the daily driver does (see pop-moe-recommended-params.txt).
[ollama]
url = "http://localhost:11434"
model = "qwen3.6:35b-mlx"
num_ctx = 32768
num_predict = 2048
temperature = 1.0                         # per-config (shipped Modelfile)

[ollama.options]                          # per-config (shipped Modelfile)
top_p = 0.95
top_k = 20
repeat_penalty = 1
min_p = 0
presence_penalty = 1.5

[workload]
name = "agentic"
max_concurrency = 3
requests_per_level = 3
repeats = 3
cooldown_seconds = 20

[prometheus]
url = ""
instance_label = ""
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-pop-moe-qwen36-35b-mlx-agentic"
