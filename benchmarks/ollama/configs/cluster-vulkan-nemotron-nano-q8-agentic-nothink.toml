# TASK-1186 row 9: nemotron-3-nano:4b-q8_0, THINKING OFF, agentic @ 32K,
# C=1..3 — quant pair against the bf16 agentic-nothink row.
# Sampling: Temperature 1.0 / Top_P 0.95, as shipped.
# Run with BENCH_NUM_PARALLEL=3. VERSION GATE: needs ollama >= 0.32.9.

[ollama]
url = "http://ollama.llama.svc:11434"
model = "nemotron-3-nano:4b-q8_0"
num_ctx = 32768
num_predict = 16384
temperature = 1.0
think = false

[ollama.options]
top_p = 0.95

[workload]
name = "agentic"
max_concurrency = 3
requests_per_level = 3
repeats = 3
cooldown_seconds = 20

[prometheus]
url = "http://prom-prometheus.grafana:9090"
instance_label = ".*"
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-cluster-nemotron-nano-q8-agentic-nothink"
