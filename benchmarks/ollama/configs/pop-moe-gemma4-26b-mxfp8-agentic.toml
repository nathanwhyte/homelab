# Pop small-MoE matrix: gemma4 26b MLX mxfp8 agentic @ 32K, C=1..3 (PROJ-1003)
# Sampling: shipped Modelfile defaults (see pop-moe-recommended-params.txt)
# Thinking left at the model default; large models are scored in their
# native mode (no think on/off pair).
[ollama]
url = "http://localhost:11434"
model = "gemma4:26b-mxfp8"
num_ctx = 32768
num_predict = 16384
temperature = 1.0                         # per-config (shipped Modelfile)

[ollama.options]                          # per-config (shipped Modelfile)
top_p = 0.95
top_k = 64

[workload]
name = "agentic"
max_concurrency = 3
requests_per_level = 3
repeats = 3
cooldown_seconds = 20

[prometheus]
url = ""
instance_label = ""
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-pop-moe-gemma4-26b-mxfp8-agentic"
