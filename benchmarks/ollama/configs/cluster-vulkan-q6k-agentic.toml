# Vulkan Q6_K agentic benchmark. High VRAM risk: Q6_K weights plus 32K
# context at np=8 will likely exceed 16 GB. If the run fails to load, retry
# with NUM_PARALLEL=4 or num_ctx=16384.
#
# 2026-07-01: this model tag is not available in the Unsloth HF repo
# (only UD-Q4_K_XL exists there). Do not run until a Q6_K GGUF is
# published or converted locally.

[ollama]
url = "http://ollama.llama.svc:11434"
model = "hf.co/unsloth/gemma-4-12B-it-qat-GGUF:Q6_K"
num_ctx = 32768
num_predict = 2048
temperature = 0.3

[workload]
name = "agentic"
max_concurrency = 8
requests_per_level = 8
repeats = 3
cooldown_seconds = 20

[prometheus]
url = "http://prom-prometheus.grafana:9090"
instance_label = ".*"
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-cluster-vulkan-q6k-agentic"
