# Pop small-MoE matrix: laguna-xs-2.1 MLX mxfp8 agentic @ 32K, C=1..3 (PROJ-1003)
# Sampling: model-card recommended settings (see pop-moe-recommended-params.txt)
# Thinking left at the model default (enabled) per the card's benchmark
# methodology; large models are scored in their native mode.
#
# NOTE: a 2026-07-28 pre-flight probe measured this tag at ~2 tok/s versus
# ~75 tok/s for the nvfp4 tag of the same model. Some of that was pull
# contention, but not a 37x gap — treat a pathologically low row here as a
# real finding about mxfp8 on this machine, not a harness fault.
[ollama]
url = "http://localhost:11434"
model = "laguna-xs-2.1:mxfp8"
num_ctx = 32768
num_predict = 2048
temperature = 1.0                         # per-config (model card)

[ollama.options]                          # per-config (model card)
top_p = 1
top_k = 20

[workload]
name = "agentic"
max_concurrency = 3
requests_per_level = 3
repeats = 3
cooldown_seconds = 20

[prometheus]
url = ""
instance_label = ""
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-pop-moe-laguna-mxfp8-agentic"
