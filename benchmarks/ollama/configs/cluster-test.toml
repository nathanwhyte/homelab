# Quick cluster-side validation config for timmy's RX 9070 XT.

[ollama]
url = "http://ollama.llama.svc:11434"
model = "gemma4:12b-it-qat"
num_ctx = 16384
num_predict = 128
temperature = 0.3

[workload]
name = "mixed_mem0"
max_concurrency = 2
requests_per_level = 2
repeats = 1
cooldown_seconds = 5

[prometheus]
url = "http://prom-prometheus.grafana:9090"
instance_label = ".*"
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-cluster-test"
