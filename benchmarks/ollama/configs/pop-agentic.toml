# Pop-local agentic benchmark config for the M5 Max.
# Larger context and generation limits to match omnipendium sub-agent and mem0
# extraction workloads.

[ollama]
url = "http://localhost:11434"
model = "gemma4:12b-mlx"
num_ctx = 32768
num_predict = 2048
temperature = 0.3

[workload]
name = "agentic"
max_concurrency = 8
requests_per_level = 8
repeats = 3
cooldown_seconds = 20

[prometheus]
url = ""
instance_label = ""
sample_interval_seconds = 2.0

[output]
dir = "benchmarks/results"
prefix = "ollama-pop-agentic"
