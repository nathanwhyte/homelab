    """Shared benchmark prompt workloads.

    These prompts are version-controlled so that benchmark results can be compared
    across time. Changing a prompt changes the workload identity and should be
    reflected in the harness config/version.
    """

    from __future__ import annotations

    from dataclasses import dataclass, field
    from typing import Optional

    from tool_calls import tool_calling_prompts


    SUB_AGENT_PROMPTS = [
        "Write a Python function that validates an email address. Include a docstring and three test cases.",
        "Explain the trade-offs between REST and gRPC APIs in three short paragraphs.",
        "Design a minimal Prometheus exporter for a fictional job queue. List the metrics and their labels.",
        "Refactor this snippet into a class-based state machine: a door can be open, closed, or locked; transitions must be valid.",
        "Summarize the key differences between symmetric and asymmetric encryption for a junior developer.",
    ]


    AGENTIC_PROMPTS = [
        """Review the following Python function and produce a structured code review. Identify at least three concrete issues (bugs, style, or maintainability) and suggest fixes.

    ```python
    def process_orders(orders, users, apply_discount=False):
        results = []
        for order in orders:
            user = None
            for u in users:
                if u['id'] == order['user_id']:
                    user = u
                    break
            if user is None:
                print("User not found for order", order['id'])
                continue
            total = order['amount']
            if apply_discount:
                total = total * 0.9
            results.append({
                'order_id': order['id'],
                'user_email': user['email'],
                'total': total,
                'items': order['items']
            })
        return results
    ```

    Provide your review as a JSON object with a top-level key \"issues\" containing an array of objects, each with \"severity\", \"line\", \"description\", and \"suggestion\".""",
        """You are assisting with a system design task. A team wants to build a real-time collaborative note-taking application that supports offline editing, conflict resolution, and sync across mobile and desktop clients. Propose a high-level architecture covering data model, sync protocol, and conflict resolution strategy. Keep your response under 1500 words and use bullet points for trade-offs.""",
        """Summarize the following multi-turn conversation into a concise status update. Extract any decisions made, open questions, and action items with owners.

    Alice: We need to pick a vector database for the knowledge base.
    Bob: I've used pgvector and Chroma; pgvector scales better with our existing Postgres.
    Alice: What about embedding dimension and index type?
    Bob: Qwen3-Embedding-4B outputs 2560 dimensions. We'll need ivfflat or hnsw.
    Alice: Let's go with pgvector + hnsw. Bob, can you prototype the schema?
    Bob: Yes, I'll have a draft by Friday.
    Alice: I'll review it against the OpenViking ingest pipeline. One concern: how do we handle re-indexing after bulk updates?
    Bob: We'll batch updates and run a maintenance job weekly.

    Provide the output as JSON with keys: \"decisions\", \"open_questions\", \"action_items\".""",
    ]


    MEM0_EXTRACTION_PROMPT = """You are a memory extraction assistant. Your task is to read the conversation below and emit a single JSON object with a top-level key "memory" containing an array of memory operations. Each operation must have keys: "data" (string), "event" (string), "category" (one of: habits, preferences, goals, relationships, plans, other), and "score" (number 0.0-1.0). Do not output any text outside the JSON object.

    Conversation:
    User: I've been trying to wake up at 6am to work on my side project before my day job. I prefer dark mode for all my coding tools. My partner and I are planning a trip to Japan in the spring. I want to improve my Python async skills this year, and I usually review my weekly goals on Sunday evenings. I dislike noisy open-plan offices.

    Extract memories as JSON:"""


    VLM_VISION_PROMPT = "Describe this image in one sentence, then list three specific details visible in it."


    @dataclass
    class Workload:
        name: str
        prompts: list[str]
        expected_tools: list[Optional[str]] = field(default_factory=list)


    def sub_agent_workload(count: int) -> Workload:
        """Return a workload of distinct short sub-agent prompts."""
        prompts = [SUB_AGENT_PROMPTS[i % len(SUB_AGENT_PROMPTS)] for i in range(count)]
        return Workload(name="sub_agent", prompts=prompts)


    def prefix_cache_workload(count: int) -> Workload:
        """Return a workload that repeats the same prompt to exercise prefix caching."""
        return Workload(name="prefix_cache", prompts=[SUB_AGENT_PROMPTS[0]] * count)


    def mixed_mem0_workload(count: int) -> Workload:
        """Return a workload mixing one mem0-style extraction with sub-agent prompts."""
        prompts = [MEM0_EXTRACTION_PROMPT]
        i = 0
        while len(prompts) < count:
            prompts.append(SUB_AGENT_PROMPTS[i % len(SUB_AGENT_PROMPTS)])
            i += 1
        return Workload(name="mixed_mem0", prompts=prompts)


    def vlm_vision_workload() -> Workload:
        """Return the placeholder VLM vision-understanding workload."""
        return Workload(name="vlm_vision", prompts=[VLM_VISION_PROMPT])


    def agentic_workload(count: int) -> Workload:
        """Return a workload of longer, complex agentic prompts."""
        prompts = []
        i = 0
        while len(prompts) < count:
            prompts.append(AGENTIC_PROMPTS[i % len(AGENTIC_PROMPTS)])
            i += 1
        return Workload(name="agentic", prompts=prompts)


    def tool_calling_workload(count: int) -> Workload:
        """Return a workload of tool-calling prompts with expected tool names."""
        prompts, expected_tools = tool_calling_prompts(count)
        return Workload(name="tool_calling", prompts=prompts, expected_tools=expected_tools)


    def select_workload(name: str, count: int) -> Workload:
        """Select a named workload."""
        if name == "sub_agent":
            return sub_agent_workload(count)
        if name == "prefix_cache":
            return prefix_cache_workload(count)
        if name == "mixed_mem0":
            return mixed_mem0_workload(count)
        if name == "agentic":
            return agentic_workload(count)
        if name == "vlm_vision":
            return vlm_vision_workload()
        if name == "tool_calling":
            return tool_calling_workload(count)
        raise ValueError(f"Unknown workload: {name}")
  tool_calls.py: |
    """Tool-calling prompt schemas and response validators.

    Used by the benchmark harness to measure how reliably a model emits
    valid, well-formed tool calls when asked. The validator is intentionally
    strict: the response must be a single JSON object with a known tool name
    and all required arguments present.
    """

    from __future__ import annotations

    import json
    from dataclasses import dataclass
    from typing import Any, Optional


    TOOLS = {
        "get_weather": {
            "description": "Get current weather for a location.",
            "args": {
                "location": {"type": "str", "required": True},
                "unit": {"type": "str", "required": True},
            },
        },
        "search_calendar": {
            "description": "Search calendar events by query and optional date range.",
            "args": {
                "query": {"type": "str", "required": True},
                "date_range": {"type": "str", "required": True},
            },
        },
        "send_email": {
            "description": "Send an email to a recipient.",
            "args": {
                "to": {"type": "str", "required": True},
                "subject": {"type": "str", "required": True},
                "body": {"type": "str", "required": True},
            },
        },
        "create_reminder": {
            "description": "Create a reminder with a title and datetime.",
            "args": {
                "title": {"type": "str", "required": True},
                "datetime": {"type": "str", "required": True},
            },
        },
        "calculate": {
            "description": "Evaluate a mathematical expression and return the result.",
            "args": {
                "expression": {"type": "str", "required": True},
            },
        },
    }


    TOOL_INSTRUCTION = """You are a helpful assistant with access to the following tools:

    - get_weather: Get current weather for a location. Args: location (str), unit (str, "c" or "f").
    - search_calendar: Search calendar events. Args: query (str), date_range (str).
    - send_email: Send an email. Args: to (str), subject (str), body (str).
    - create_reminder: Create a reminder. Args: title (str), datetime (str).
    - calculate: Evaluate a math expression. Args: expression (str).

    Respond with ONLY a single JSON object in this exact format:
    {"tool": "<tool_name>", "arguments": {<args>}}

    Do not include markdown, explanations, or any text outside the JSON object."""


    TOOL_CALLING_PROMPTS = [
        (
            "get_weather",
            "What's the weather like in Austin, Texas? Give me the temperature in celsius.",
        ),
        ("search_calendar", "Find my meetings about the budget review next week."),
        ("send_email", "Email sarah@example.com to say the deployment is complete."),
        ("create_reminder", "Remind me to call Mom tomorrow at 6pm."),
        ("calculate", "What is 145 times 37 plus 82?"),
        (
            "get_weather",
            "Will it rain in Seattle today? Show the temperature in fahrenheit.",
        ),
        ("search_calendar", "When is my dentist appointment?"),
        (
            "send_email",
            "Send a quick email to team@example.com with the subject 'Standup notes' and body 'Notes are in the shared doc.'",
        ),
    ]


    @dataclass
    class ValidationResult:
        valid_json: bool
        has_tool_field: bool
        has_arguments_field: bool
        tool_recognized: bool
        required_args_present: bool
        arg_types_valid: bool
        error: Optional[str] = None

        def to_dict(self) -> dict[str, Any]:
            return {
                "valid_json": self.valid_json,
                "has_tool_field": self.has_tool_field,
                "has_arguments_field": self.has_arguments_field,
                "tool_recognized": self.tool_recognized,
                "required_args_present": self.required_args_present,
                "arg_types_valid": self.arg_types_valid,
                "error": self.error,
            }


    def _strip_markdown(text: str) -> str:
        """Remove markdown code fences if present."""
        text = text.strip()
        if text.startswith("```"):
            lines = text.splitlines()
            # Drop first fence and optional language line
            if lines and lines[0].startswith("```"):
                lines = lines[1:]
            if lines and lines[-1].startswith("```"):
                lines = lines[:-1]
            text = "\n".join(lines).strip()
        return text


    def validate_tool_call(
        response: str, expected_tool: Optional[str] = None
    ) -> ValidationResult:
        """Validate a single tool-calling response.

        If expected_tool is provided, tool_recognized also checks that the
        emitted tool name matches.
        """
        cleaned = _strip_markdown(response)
        try:
            parsed = json.loads(cleaned)
        except json.JSONDecodeError as exc:
            return ValidationResult(
                valid_json=False,
                has_tool_field=False,
                has_arguments_field=False,
                tool_recognized=False,
                required_args_present=False,
                arg_types_valid=False,
                error=f"json_decode_error: {exc}",
            )

        if not isinstance(parsed, dict):
            return ValidationResult(
                valid_json=True,
                has_tool_field=False,
                has_arguments_field=False,
                tool_recognized=False,
                required_args_present=False,
                arg_types_valid=False,
                error="parsed_json_not_object",
            )

        has_tool_field = "tool" in parsed and isinstance(parsed["tool"], str)
        has_arguments_field = "arguments" in parsed and isinstance(
            parsed.get("arguments"), dict
        )

        if not has_tool_field:
            return ValidationResult(
                valid_json=True,
                has_tool_field=False,
                has_arguments_field=has_arguments_field,
                tool_recognized=False,
                required_args_present=False,
                arg_types_valid=False,
                error="missing_tool_field",
            )

        tool_name = parsed["tool"]
        tool_recognized = tool_name in TOOLS
        if expected_tool and tool_recognized:
            tool_recognized = tool_name == expected_tool

        if not has_arguments_field:
            return ValidationResult(
                valid_json=True,
                has_tool_field=True,
                has_arguments_field=False,
                tool_recognized=tool_recognized,
                required_args_present=False,
                arg_types_valid=False,
                error="missing_arguments_field",
            )

        args = parsed["arguments"]
        schema = TOOLS.get(tool_name, {"args": {}})
        required = {k for k, v in schema["args"].items() if v.get("required")}
        required_args_present = required.issubset(args.keys())

        arg_types_valid = True
        type_errors: list[str] = []
        for key, spec in schema["args"].items():
            if key in args:
                expected_type = spec.get("type", "str")
                value = args[key]
                if expected_type == "str" and not isinstance(value, str):
                    arg_types_valid = False
                    type_errors.append(f"{key} should be str, got {type(value).__name__}")
                elif expected_type == "number" and not isinstance(value, (int, float)):
                    arg_types_valid = False
                    type_errors.append(
                        f"{key} should be number, got {type(value).__name__}"
                    )

        error = None
        if not tool_recognized:
            error = f"unrecognized_tool: {tool_name}"
        elif not required_args_present:
            missing = sorted(required - set(args.keys()))
            error = f"missing_required_args: {missing}"
        elif not arg_types_valid:
            error = f"arg_type_errors: {type_errors}"

        return ValidationResult(
            valid_json=True,
            has_tool_field=True,
            has_arguments_field=True,
            tool_recognized=tool_recognized,
            required_args_present=required_args_present,
            arg_types_valid=arg_types_valid,
            error=error,
        )


    def tool_calling_prompts(count: int) -> tuple[list[str], list[Optional[str]]]:
        """Return tool-calling user prompts and expected tool names.

        The returned prompts include the system/tool instruction prefix so the
        model knows the required output format. expected_tools is a parallel
        list used by the validator to check the correct tool was selected.
        """
        prompts: list[str] = []
        expected_tools: list[Optional[str]] = []
        i = 0
        while len(prompts) < count:
            tool, user_prompt = TOOL_CALLING_PROMPTS[i % len(TOOL_CALLING_PROMPTS)]
            full_prompt = f"{TOOL_INSTRUCTION}\n\nUser: {user_prompt}\n\nAssistant:"
            prompts.append(full_prompt)
            expected_tools.append(tool)
            i += 1
        return prompts, expected_tools
