  cluster-vulkan-agentic.toml: |
    # Cluster-side Vulkan backend agentic benchmark for timmy's RX 9070 XT.
    # Mirrors cluster-agentic.toml but uses the Vulkan-capable Ollama image and a
    # distinct output prefix so ROCm and Vulkan results do not collide.

    [ollama]
    url = "http://ollama.llama.svc:11434"
    model = "gemma4:12b-it-qat"
    num_ctx = 32768
    num_predict = 2048
    temperature = 0.3

    [workload]
    name = "agentic"
    max_concurrency = 8
    requests_per_level = 8
    repeats = 3
    cooldown_seconds = 20

    [prometheus]
    url = "http://prom-prometheus.grafana:9090"
    instance_label = ".*"
    sample_interval_seconds = 2.0

    [output]
    dir = "benchmarks/results"
    prefix = "ollama-cluster-vulkan-agentic"
