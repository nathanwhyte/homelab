# Prometheus exporter for Mem0 memory inventory metrics.
# Mem0 OSS exposes no /metrics endpoint, so this queries aggregate-only data from
# public.memories.payload in Postgres. It intentionally does not export memory text.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem0-exporter
  namespace: mem0
  labels:
    app: mem0-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mem0-exporter
  template:
    metadata:
      labels:
        app: mem0-exporter
    spec:
      containers:
        - name: exporter
          image: registry.nathanwhyte.dev/homelab/mem0-exporter:2026-06-30-r2
          ports:
            - containerPort: 9090
              name: metrics
          env:
            - name: POSTGRES_HOST
              value: mem0-postgres.mem0.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mem0-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mem0-exporter
  namespace: mem0
  labels:
    app: mem0-exporter
spec:
  selector:
    app: mem0-exporter
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
---
# kube-prometheus-stack Prometheus is configured with an empty
# serviceMonitorSelector, so ServiceMonitors in service namespaces are scraped.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mem0-exporter
  namespace: mem0
  labels:
    app: mem0-exporter
spec:
  selector:
    matchLabels:
      app: mem0-exporter
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scrapeTimeout: 10s
