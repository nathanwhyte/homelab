---
# Mem0 API server
# REST API for memory CRUD. Routes LLM/embedding calls to shared Ollama on timmy.
# Image: mem0/mem0 (official, Apache 2.0)
# Exposed at mem0-server.mem0.svc.cluster.local:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem0-server
  namespace: mem0
  labels:
    app: mem0-server
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: mem0-server
  template:
    metadata:
      labels:
        app: mem0-server
    spec:
      containers:
        - name: mem0
          image: mem0/mem0:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            # Point LLM + embedder to shared Ollama on timmy
            - name: OPENAI_API_KEY
              value: "sk-no-op"  # Ollama doesn't need a real key
            - name: OPENAI_API_BASE
              value: "http://ollama.llama.svc.cluster.local:11434/v1"
            # Postgres connection
            - name: POSTGRES_HOST
              value: "mem0-postgres.mem0.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "postgres"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mem0-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_COLLECTION_NAME
              value: "memories"
            # Auth
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mem0-secrets
                  key: ADMIN_API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mem0-secrets
                  key: JWT_SECRET
            # App DB for auth/api keys
            - name: APP_DB_NAME
              value: "mem0_app"
            # Default models (via Ollama for LLM, embedder-llamacpp for embeddings)
            - name: MEM0_DEFAULT_LLM_MODEL
              value: "gemma4:12b-it-qat"
            - name: MEM0_DEFAULT_EMBEDDER_MODEL
              value: "nomic-embed-text-v1.5"
            # Embedding provider override — point to the existing OV embedder
            # (not Ollama, since Ollama doesn't have embedding models loaded)
            - name: MEM0_EMBEDDER_API_BASE
              value: "http://embedder-llamacpp.viking.svc.cluster.local:8080/v1"
            - name: MEM0_EMBEDDER_API_KEY
              value: "sk-no-op"
            # Telemetry
            - name: MEM0_TELEMETRY
              value: "false"
            # Auth disabled for internal cluster use
            - name: AUTH_DISABLED
              value: "false"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mem0-server
  namespace: mem0
spec:
  selector:
    app: mem0-server
  ports:
    - port: 8080
      targetPort: 8000
      name: http