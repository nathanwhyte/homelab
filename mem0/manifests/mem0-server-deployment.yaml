---
# Mem0 API server
# REST API for memory CRUD. Routes LLM/embedding calls to shared Ollama on timmy.
# Image: built from mem0ai/mem0 server/ (commit b55c51e) for linux/amd64 and
# pushed to Harbor — the upstream mem0/mem0-api-server is arm64-only, and the
# cluster nodes are all amd64. The homelab build (Dockerfile.homelab) adds libpq5
# (upstream's server/Dockerfile omits it, so psycopg can't load) and drops the
# dev-only uvicorn --reload. Rebuild: docker buildx build --platform linux/amd64
# -f Dockerfile.homelab -t registry.nathanwhyte.dev/homelab/mem0-api-server:<sha>
# --push server/  (see mem0/README.md for the full recipe)
# Exposed at mem0-server.mem0.svc.cluster.local:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem0-server
  namespace: mem0
  labels:
    app: mem0-server
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: mem0-server
  template:
    metadata:
      labels:
        app: mem0-server
    spec:
      containers:
        - name: mem0
          image: registry.nathanwhyte.dev/homelab/mem0-api-server:b55c51e-hl4
          # Run DB migrations before serving — the upstream server/Dockerfile CMD
          # starts uvicorn directly and never runs `alembic upgrade head` (the dev
          # compose does it in its command), so the app tables (request_logs, api
          # keys, etc.) are missing without this.
          command:
            - sh
            - -c
            - alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000
          ports:
            - containerPort: 8000
              name: http
          env:
            # LLM extraction → chat-ollama-proxy (reasoning-suppressing shim), NOT
            # ollama directly. gemma4:12b-it-qat emits a reasoning field that can
            # leak into the response content and break mem0's strict json.loads of
            # the extracted facts (silent fallback to zero facts). The proxy injects
            # reasoning=none so the content is clean JSON. Embeddings use a separate
            # endpoint (MEM0_EMBEDDER_API_BASE below).
            - name: OPENAI_API_KEY
              value: "sk-no-op"  # Ollama doesn't need a real key
            - name: OPENAI_API_BASE
              value: "http://chat-ollama-proxy.llama.svc.cluster.local:11434/v1"
            # Postgres connection
            - name: POSTGRES_HOST
              value: "mem0-postgres.mem0.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "postgres"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mem0-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_COLLECTION_NAME
              value: "memories"
            # Auth
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mem0-secrets
                  key: ADMIN_API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mem0-secrets
                  key: JWT_SECRET
            # App DB for auth/api keys
            - name: APP_DB_NAME
              value: "mem0_app"
            # Default models (via Ollama for LLM, embedder-llamacpp for embeddings)
            # Extraction model: local gemma4:12b-it-qat via chat-ollama-proxy.
            # mem0 v2.0.6's ADDITIVE_EXTRACTION_PROMPT is ~9-10K tokens; the earlier
            # empty/truncated ("{\"") responses were caused by Ollama truncating it
            # at OLLAMA_CONTEXT_LENGTH=8192 — NOT a model-capability limit. With the
            # context raised to 16384 (see llama/ollama-deployment.yaml) the local
            # model extracts correctly, so no cloud model is needed. The proxy still
            # strips reasoning tokens.
            - name: MEM0_DEFAULT_LLM_MODEL
              value: "gemma4:12b-it-qat"
            - name: MEM0_DEFAULT_EMBEDDER_MODEL
              value: "nomic-embed-text-v1.5"
            # nomic-embed-text-v1.5 emits 768-dim vectors; mem0 defaults to 1536 and
            # creates the pgvector column at that width, so inserts fail without this.
            # Changing this requires dropping/recreating the `memories` table.
            - name: MEM0_EMBEDDING_DIMS
              value: "768"
            # Embedding provider override — point to the existing OV embedder
            # (not Ollama, since Ollama doesn't have embedding models loaded)
            - name: MEM0_EMBEDDER_API_BASE
              value: "http://embedder-llamacpp.viking.svc.cluster.local:8080/v1"
            - name: MEM0_EMBEDDER_API_KEY
              value: "sk-no-op"
            # Telemetry
            - name: MEM0_TELEMETRY
              value: "false"
            # Auth disabled for internal cluster use
            - name: AUTH_DISABLED
              value: "false"
            # SQLite audit-history DB. Upstream default is /app/history/history.db,
            # but that dir only exists via the dev compose volume mount — point it
            # at the mounted emptyDir below so the server can create it on startup.
            - name: HISTORY_DB_PATH
              value: "/data/history/history.db"
          volumeMounts:
            - name: history
              mountPath: /data/history
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              # This server has no /health route — `/` is an unauthenticated
              # redirect to the OpenAPI docs (307), which kubelet treats as healthy.
              path: /
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              # This server has no /health route — `/` is an unauthenticated
              # redirect to the OpenAPI docs (307), which kubelet treats as healthy.
              path: /
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        # Ephemeral store for the SQLite audit-history DB. The authoritative
        # memories live in pgvector (Postgres); this is just a per-pod history log.
        - name: history
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mem0-server
  namespace: mem0
spec:
  selector:
    app: mem0-server
  ports:
    - port: 8080
      targetPort: 8000
      name: http