---
# Mem0 OSS Dashboard
# Next.js standalone UI served on port 3000. It talks to the mem0-server API.
# Browser-side calls use the public hostname (via Cloudflare tunnel path routing),
# and server-side calls use the in-cluster service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem0-dashboard
  namespace: mem0
  labels:
    app: mem0-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mem0-dashboard
  template:
    metadata:
      labels:
        app: mem0-dashboard
    spec:
      containers:
        - name: dashboard
          image: registry.nathanwhyte.dev/homelab/mem0-dashboard:b55c51e-hl4
          ports:
            - containerPort: 3000
              name: http
          env:
            # Public base URL used by the browser to reach the mem0 API. The
            # dashboard is served at mem0.nathanwhyte.dev, so the API needs its
            # own hostname (api-mem0.nathanwhyte.dev) for browser-side calls.
            - name: NEXT_PUBLIC_API_URL
              value: "https://api-mem0.nathanwhyte.dev"
            # In-cluster API URL used by Next.js server-side rendering/API routes.
            - name: API_INTERNAL_URL
              value: "http://mem0-server.mem0.svc.cluster.local:8080"
            # Display name in the dashboard nav.
            - name: NEXT_PUBLIC_INSTANCE_NAME
              value: "Mem0 Homelab"
            # Used by the refresh route to decide secure cookie flag, and by the
            # mem0-server CORS middleware. Must match the public hostname.
            - name: DASHBOARD_URL
              value: "https://mem0.nathanwhyte.dev"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mem0-dashboard
  namespace: mem0
spec:
  selector:
    app: mem0-dashboard
  ports:
    - port: 3000
      targetPort: 3000
      name: http
