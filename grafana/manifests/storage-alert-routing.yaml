# Requires OnNamespaceExceptForAlertmanagerNamespace on prom-alertmanager.
# Keeping this in grafana lets it reference the existing webhook Secret.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: storage-alert-routing
  namespace: grafana
spec:
  route:
    receiver: slack-homelab
    matchers:
      - name: alertgroup
        value: storage
        matchType: "="
      # 2026-09-13: alertgroup=storage now spans two signals with different
      # trustworthiness. KubePersistentVolumeFillingUp measures live filesystem
      # usage and is actionable. LonghornVolumeSpaceHigh measures allocated
      # replica bytes (including deleted-but-undiscarded blocks) and fired at
      # 93.8% for a volume that was 23.7% full -- informational, not a page.
      # Exclude info here so the demotion is real in Slack; the alert still
      # exists in Prometheus for dashboards and trim review.
      - name: severity
        value: info
        matchType: "!="
    groupBy: [namespace, persistentvolumeclaim, alertname]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 1h
    routes:
      # Send genuine PVC pressure to both the gated resolver and Slack. The
      # resolver independently rechecks filesystem use, scope, cap, cooldown,
      # StorageClass support, and Longhorn disk headroom before any decision.
      - receiver: capacity-auto-resolver
        matchers:
          - name: alertname
            value: KubePersistentVolumeFillingUp
            matchType: "="
        continue: true
      - receiver: slack-homelab
  receivers:
    - name: capacity-auto-resolver
      webhookConfigs:
        - url: http://capacity-auto-resolver.grafana.svc:8080/alerts
          sendResolved: false
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: capacity-auto-resolver-token
                key: token
    - name: slack-homelab
      slackConfigs:
        - # IMPR-1173: the endpoint literal lives in the Secret because the CRD's
          # apiURL is a SecretKeySelector, not an inline URL. Posting to
          # chat.postMessage makes `channel` a per-delivery parameter; the
          # incoming-webhook transport ignored it and bound the destination at
          # webhook-creation time (BUG-1135).
          apiURL:
            name: alertmanager-slack-bot-token
            key: api-url
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: alertmanager-slack-bot-token
                key: bot-token
          channel: "#cron-homelab"
          sendResolved: true
          title: "{{ .CommonLabels.alertname }} — {{ .Status }}"
          text: "<@U0BAEG2AFC4> {{ range .Alerts }}{{ .Annotations.summary }}: {{ .Annotations.description }}{{ end }}"
