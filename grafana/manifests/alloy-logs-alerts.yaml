# alloy-logs collector alerts (BUG-1293).
#
# Each collector's loki.write has one sender, and it sends one batch at a time
# (Alloy v1.14.0 client/shards.go). A batch being retried therefore holds up
# everything behind it: the collector's hash-ring share of pods across the
# cluster, plus its own node's journal. With maxBackoffRetries: 300
# (helm/k8s-monitoring-values.yaml), a batch Loki keeps refusing with a 5xx or
# 429, or that cannot connect, blocks that collector for up to about 22.5 h.
#
# The same counter also rises for a short Loki restart. "for: 30m" keeps those
# quiet.
#
# Prometheus is pinned to timmy like Loki, so this cannot fire during a timmy
# drain. It covers a stuck sender, or a Loki outage, while Prometheus is up.
#
# Scraped by alloy-logs-podmonitor.yaml. The cluster Prometheus has empty rule
# selectors, so no extra labels are needed.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alloy-logs-alerts
  namespace: grafana
spec:
  groups:
    - name: alloy-logs.rules
      rules:
        - alert: AlloyLogsWriteRetrying
          # One alert per collector pod. increase() over 10m stays above 0
          # while the collector retries a batch at least once every 10 min.
          # At the 5m backoff cap each wait is 256-300 s, so a stuck batch
          # keeps it above 0.
          expr: |
            sum by (namespace, pod) (
              increase(loki_write_batch_retries_total{namespace="grafana", pod=~"k8s-monitoring-alloy-logs-.+"}[10m])
            ) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "alloy-logs collector {{ $labels.pod }} has been retrying Loki pushes for 30m+"
            description: >-
              {{ $labels.pod }} has retried a loki.write batch in every 10m
              window for over 30 minutes, so its pod and journal logs are not
              reaching Loki. Alloy logs a retry only at debug level, so check
              whether loki-gateway and loki-0 are up first. If they are, a
              5xx or 429 on every attempt (Loki's own logs) means Loki is
              refusing one batch; restarting the pod frees the sender and
              drops what is queued. BUG-1293.
