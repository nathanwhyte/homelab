# macbook-backup freshness alerts (BUG-1212).
#
# The MacBook → cluster mirror (bin/macbook-backup.sh on pop, uploading into
# copyparty) failed every source on every run for 47 days and nothing noticed.
# grafana/backup-alerts.md covers the cluster's own backups, but this one is
# invisible to both of its tiers:
#   - there is no Kubernetes CronJob or Job to fail — the schedule is a
#     LaunchAgent on pop;
#   - there are no objects in R2 to list — the mirror lands in copyparty's
#     Longhorn PVC.
#
# So the freshness signal is exported from pop instead, by
# mac-gpu-exporter.py (`macbook_backup_last_success_timestamp_seconds`), which
# Alloy already scrapes into this Prometheus. The marker it reads,
# ~/Library/Application Support/macbook-backup/last-success, is stamped by
# macbook-backup.sh only when EVERY source succeeded — so its age is a direct
# "is the backup actually working" signal, not merely "did the job start".
#
# The cluster Prometheus has empty rule/Servicemonitor selectors, so no extra
# labels are required (same as backup-alerts.yaml and
# garage/manifests/garage-alerts.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: macbook-backup-alerts
  namespace: grafana
spec:
  groups:
    - name: macbook.backup.rules
      rules:
        - alert: MacbookBackupStale
          # 24h is 2x the 12h minimum interval between runs (MIN_INTERVAL_SEC
          # in macbook-backup.sh), the same 2x convention the declared list in
          # backup-alerts.md uses. The job is every 6h, and launchd replays
          # missed intervals after a sleep, so a healthy marker is at most
          # ~12h old and a day is unambiguous.
          expr: time() - macbook_backup_last_success_timestamp_seconds > 86400
          for: 15m
          labels:
            severity: critical
            alertgroup: backup
          annotations:
            summary: "macbook-backup has not completed a clean run in over 24h"
            description: "The last-success marker on pop is more than 24h old, so at least one source has been failing since then (the marker is stamped only when every source succeeds). Check `tail -50 ~/Library/Logs/macbook-backup.log` on pop. This is the BUG-1212 signature: copyparty answering 403 stops every source, and the fix is usually a stale password in ~/.config/copyparty/password or an IP ban."
        - alert: MacbookBackupMetricMissing
          # The freshness rule above is silent if the series disappears, which
          # is the same blind spot BackupFreshnessExporterDown guards for the
          # R2 tiers: a dead exporter looks identical to a healthy one.
          expr: absent(macbook_backup_last_success_timestamp_seconds)
          for: 30m
          labels:
            severity: warning
            alertgroup: backup
          annotations:
            summary: "macbook-backup freshness metric is absent"
            description: "The macbook-backup-exporter on pop is not exporting macbook_backup_last_success_timestamp_seconds, so the staleness alert cannot fire. Check the agent (`launchctl print gui/501/com.nathanwhyte.macbook-backup-exporter`) and its scrape target at host.docker.internal:9114."
