---
# Requires OnNamespaceExceptForAlertmanagerNamespace on prom-alertmanager.
# Keeping this in grafana lets it reference the existing webhook Secret.
#
# Without this route, alertgroup=hardware falls to the base Alertmanager
# route's default receiver, which is "null" — a rule with no matching route is
# silently discarded. That is the failure BUG-1129 documents, and the reason
# cpu/alerts.yaml is not useful on its own.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: hardware-alert-routing
  namespace: grafana
spec:
  route:
    receiver: slack-homelab
    matchers:
      - name: alertgroup
        value: hardware
        matchType: "="
    groupBy: [node, alertname]
    groupWait: 30s
    groupInterval: 5m
    # Tighter than the storage route's 1h. A node approaching its thermal trip
    # is a live condition, not a standing report.
    repeatInterval: 30m
  receivers:
    - name: slack-homelab
      slackConfigs:
        - # IMPR-1173: the endpoint literal lives in the Secret because the CRD's
          # apiURL is a SecretKeySelector, not an inline URL. Posting to
          # chat.postMessage makes `channel` a per-delivery parameter; the
          # incoming-webhook transport ignored it and bound the destination at
          # webhook-creation time (BUG-1135).
          apiURL:
            name: alertmanager-slack-bot-token
            key: api-url
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: alertmanager-slack-bot-token
                key: bot-token
          channel: "#cron-homelab"
          sendResolved: true
          title: "{{ .CommonLabels.alertname }} — {{ .Status }}"
          text: "<@U0BAEG2AFC4> {{ range .Alerts }}{{ .Annotations.summary }}: {{ .Annotations.description }}{{ end }}"
