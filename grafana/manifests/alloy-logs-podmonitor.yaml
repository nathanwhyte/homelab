---
# Scrapes the alloy-logs collectors' own /metrics (BUG-1293), so that
# loki_write_batch_retries_total and loki_write_dropped_entries_total reach
# Prometheus for AlloyLogsWriteRetrying (alloy-logs-alerts.yaml).
#
# It is a PodMonitor, not a ServiceMonitor, because the chart's two Services,
# k8s-monitoring-alloy-logs and the headless k8s-monitoring-alloy-logs-cluster,
# carry identical labels. A ServiceMonitor would scrape every pod twice. The
# kube-prometheus-stack Prometheus has an empty podMonitorSelector, so this is
# picked up without a release label.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: alloy-logs
  namespace: grafana
  labels:
    app.kubernetes.io/name: alloy-logs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: k8s-monitoring-alloy-logs
      app.kubernetes.io/name: alloy-logs
  podMetricsEndpoints:
    - port: http-metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
