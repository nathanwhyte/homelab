# Requires OnNamespaceExceptForAlertmanagerNamespace on prom-alertmanager.
# Keeping this in grafana lets it reference the existing webhook Secret.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: backup-alert-routing
  namespace: grafana
spec:
  route:
    receiver: slack-homelab
    matchers:
      - name: alertgroup
        value: backup
        matchType: "="
    groupBy: [namespace, alertname]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 1h
  receivers:
    - name: slack-homelab
      slackConfigs:
        - # IMPR-1173: the endpoint literal lives in the Secret because the CRD's
          # apiURL is a SecretKeySelector, not an inline URL. Posting to
          # chat.postMessage makes `channel` a per-delivery parameter; the
          # incoming-webhook transport ignored it and bound the destination at
          # webhook-creation time (BUG-1135).
          apiURL:
            name: alertmanager-slack-bot-token
            key: api-url
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: alertmanager-slack-bot-token
                key: bot-token
          channel: "#cron-homelab"
          sendResolved: true
          title: "{{ .CommonLabels.alertname }} — {{ .Status }}"
          text: "<@U0BAEG2AFC4> {{ range .Alerts }}{{ .Annotations.summary }}: {{ .Annotations.description }}{{ end }}"
