# Grafana Loki Helm Chart Values
#
# Reconstructed 2026-07-01 from `helm get values loki -n grafana` (user-supplied)
# so deploy-grafana.sh reproduces the running release. Drift previously left this
# file as comments-only while the live release carried the full config.
#
# 2026-07-01: persistence.storageClass longhorn-hdd -> longhorn-hdd-2x (2 replicas)
# and size 20Gi -> 50Gi to match the live PVC after manual expansion.

backend:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
# 2026-07-06 (IMPR-1038): cache sizing was chart-default (8192MB -> 9830Mi request,
# observed usage 9Mi / 7d peak 3Gi); repinned off timmy live during the garage-2
# scheduling incident. allocatedMemory drives both memcached -m and the pod request.
chunksCache:
  allocatedMemory: 1024
  nodeSelector:
    kubernetes.io/hostname: wemby
compactor:
  replicas: 0
deploymentMode: SingleBinary
distributor:
  replicas: 0
gateway:
  auth_enabled: false
  enabled: true
  service:
    nodePort: 31080
    port: 80
    type: NodePort
indexGateway:
  replicas: 0
ingester:
  replicas: 0
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  ingester:
    chunk_encoding: snappy
    chunk_idle_period: 30m
    max_chunk_age: 1h
  limits_config:
    allow_structured_metadata: true
    ingestion_burst_size_mb: 32
    ingestion_rate_mb: 16
    max_query_series: 500
    max_streams_per_user: 10000
    reject_old_samples: true
    reject_old_samples_max_age: 336h
    retention_period: 24h
    volume_enabled: true
  schemaConfig:
    configs:
      - from: "2024-04-01"
        index:
          period: 24h
          prefix: loki_index_
        object_store: filesystem
        schema: v13
        store: tsdb
  storage:
    type: filesystem
minio:
  enabled: false
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
read:
  replicas: 0
resultsCache:
  allocatedMemory: 256
  nodeSelector:
    kubernetes.io/hostname: manu
singleBinary:
  nodeSelector:
    kubernetes.io/hostname: timmy
  persistence:
    accessModes:
      - ReadWriteOnce
    enabled: true
    # 2026-07-06 (BUG-1033 recurrence): the chart's StatefulSet defaults to
    # persistentVolumeClaimRetentionPolicy whenScaled/whenDeleted: Delete, which
    # DELETED storage-loki-0 (and ~24h of logs) during a scale-0 reattach cycle.
    # Live sts patched to Retain/Retain the same day; this pins it for upgrades.
    enableStatefulSetAutoDeletePVC: false
    size: 50Gi
    # 2026-07-06 (IMPR-1038 rollout): longhorn-hdd-2x -> longhorn-hdd. The 07-01
    # reconstruction recorded the wrong class — the live PVC (storage-loki-0) is
    # longhorn-hdd. Any mismatch here makes every helm upgrade fail on the
    # immutable volumeClaimTemplates (the 07-06 10:46 failed release, and ours).
    storageClass: longhorn-hdd
  replicas: 1
  resources:
    limits:
      cpu: 300m
      # 2026-07-06 (IMPR-1038): 768Mi -> 1Gi; 7d peak hit 84% of the old limit
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi
write:
  replicas: 0
