# Grafana Loki Helm Chart Values

# Override: retention and limits
# Applied directly via ConfigMap in grafana namespace (helm-manage via kubectl apply)

# Key retention settings (configured in grafana/loki ConfigMap):
#   retention_period: 24h         - chunks older than 24h are deleted by compactor
#   reject_old_samples_max_age: 24h  - reject samples older than 24h at ingest time
