# Grafana Loki Helm Chart Values
#
# Reconstructed 2026-07-01 from `helm get values loki -n grafana` (user-supplied)
# so deploy-grafana.sh reproduces the running release. Drift previously left this
# file as comments-only while the live release carried the full config.
#
# 2026-07-01: persistence.storageClass longhorn-hdd -> longhorn-hdd-2x (2 replicas)
# and size 20Gi -> 50Gi to match the live PVC after manual expansion.

backend:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
# 2026-07-06 (IMPR-1038): cache sizing was chart-default (8192MB -> 9830Mi request,
# observed usage 9Mi / 7d peak 3Gi); repinned off timmy live during the garage-2
# scheduling incident, then disabled outright in the logging scale-back — log
# query volume doesn't justify a dedicated memcached pod. Re-enable with
# allocatedMemory (drives memcached -m AND the pod request) if usage grows.
chunksCache:
  enabled: false
  allocatedMemory: 1024
  nodeSelector:
    kubernetes.io/hostname: wemby
compactor:
  replicas: 0
deploymentMode: SingleBinary
distributor:
  replicas: 0
gateway:
  auth_enabled: false
  enabled: true
  # Pinned to timmy 2026-07-21 (IMPR-1020). The NodePort below is set to
  # externalTrafficPolicy: Local so the real client IP survives to the
  # NetworkPolicy (`grafana/nodeport-networkpolicy.yaml`) — under the default
  # `Cluster`, kube-proxy SNATs cross-node traffic to the node IP and any
  # source-CIDR rule silently matches everything (the BUG-1057 failure mode).
  #
  # `Local` only forwards to a pod on the receiving node, and mac/README.md
  # points the MacBook at 192.168.1.19 (timmy). This gateway ran on wemby, so
  # without the pin every push would have been dropped on the floor. It is a
  # single replica with no HA either way, so pinning costs no availability —
  # it only makes which-node deterministic, which `Local` requires.
  nodeSelector:
    kubernetes.io/hostname: timmy
  service:
    nodePort: 31080
    port: 80
    type: NodePort
    externalTrafficPolicy: Local
indexGateway:
  replicas: 0
ingester:
  replicas: 0
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  # 2026-09-04 (BUG-1096): retention_period below is INERT without this block.
  # Loki only deletes chunks when the compactor runs with retention_enabled;
  # without it the 24h limit is accepted and silently ignored, so storage-loki-0
  # grew to 8.70 GiB of 9.75 GiB (89%) holding every chunk since the volume was
  # created. Confirmed live: loki_boltdb_shipper_compactor_running was 1 (the
  # compactor was compacting) while
  # loki_compactor_apply_retention_last_successful_run_timestamp_seconds was 0
  # — retention had never once run.
  #
  # NOTE: the top-level `compactor:` key (replicas: 0) is the distributed-mode
  # Deployment and is correctly disabled for singleBinary. This block is Loki's
  # *config*, which is a different thing despite the identical name.
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
  ingester:
    chunk_encoding: snappy
    chunk_idle_period: 30m
    max_chunk_age: 1h
  limits_config:
    allow_structured_metadata: true
    # 2026-07-06 logging scale-back: 32/16 -> 8/4 MB/s; homelab ingest is a
    # fraction of this and the lower cap bounds ingester buffer memory.
    ingestion_burst_size_mb: 8
    ingestion_rate_mb: 4
    max_query_series: 500
    max_streams_per_user: 10000
    reject_old_samples: true
    reject_old_samples_max_age: 336h
    retention_period: 24h
    volume_enabled: true
  schemaConfig:
    configs:
      - from: "2024-04-01"
        index:
          period: 24h
          prefix: loki_index_
        object_store: filesystem
        schema: v13
        store: tsdb
  storage:
    type: filesystem
minio:
  enabled: false
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
read:
  replicas: 0
resultsCache:
  enabled: false
  allocatedMemory: 256
  nodeSelector:
    kubernetes.io/hostname: manu
singleBinary:
  nodeSelector:
    kubernetes.io/hostname: timmy
  persistence:
    accessModes:
      - ReadWriteOnce
    enabled: true
    # 2026-07-06 (BUG-1033 recurrence): the chart's StatefulSet defaults to
    # persistentVolumeClaimRetentionPolicy whenScaled/whenDeleted: Delete, which
    # DELETED storage-loki-0 (and ~24h of logs) during a scale-0 reattach cycle.
    # Live sts patched to Retain/Retain the same day; this pins it for upgrades.
    enableStatefulSetAutoDeletePVC: false
    # 2026-07-06 logging scale-back: 50Gi -> 10Gi. Free resize: the volume was
    # recreated blank the same day (BUG-1033 recurrence), and 24h retention at
    # homelab ingest rates needs ~1-2Gi. Size change is immutable on the sts —
    # requires delete sts + PVC before helm upgrade.
    size: 10Gi
    # 2026-07-06 (IMPR-1038 rollout): longhorn-hdd-2x -> longhorn-hdd. The 07-01
    # reconstruction recorded the wrong class — the live PVC (storage-loki-0) is
    # longhorn-hdd. Any mismatch here makes every helm upgrade fail on the
    # immutable volumeClaimTemplates (the 07-06 10:46 failed release, and ours).
    storageClass: longhorn-hdd
  replicas: 1
  resources:
    limits:
      cpu: 300m
      # 2026-07-06 (IMPR-1038): 768Mi -> 1Gi; 7d peak hit 84% of the old limit
      memory: 1Gi
    requests:
      cpu: 100m
      # 2026-07-06 logging scale-back: 512Mi -> 256Mi with caches disabled and
      # ingestion caps at 4MB/s; limit above keeps the burst headroom.
      memory: 256Mi
write:
  replicas: 0
