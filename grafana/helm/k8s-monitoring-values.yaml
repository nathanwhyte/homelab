# Kubernetes Monitoring Helm Chart Values
# Chart: grafana/k8s-monitoring
# Purpose: Deploy Alloy for log collection, forwarding to existing Loki

# Cluster configuration
cluster:
  name: k8s

# Destinations - logs to Loki, metrics to Prometheus (remote write)
# Enables Alloy to gather logs and metrics and deliver to the stack.
destinations:
  - name: loki
    type: loki
    # Point to existing Loki gateway service
    url: http://loki-gateway.grafana.svc.cluster.local/loki/api/v1/push
    # BUG-1293: Loki is pinned to timmy, so a timmy drain leaves it down for
    # hours. 2026-11-08 had 12.5 h. The chart default of 10 retries drops each
    # batch 4-8.5 min after its first send, and long-running pods lost 71% of
    # their lines. With 300 retries a batch is dropped only after about 22.5 h:
    # each wait at the 5m cap is 256-300 s (dskit backoff, Alloy v1.14.0).
    # This is finite, not 0 (forever), so a batch Loki keeps refusing with a
    # 5xx or 429 eventually frees the collector's single sender.
    # AlloyLogsWriteRetrying (manifests/alloy-logs-alerts.yaml) flags a
    # collector that keeps retrying.
    maxBackoffRetries: 300
  - name: prometheus
    type: prometheus
    # kube-prometheus-stack Prometheus remote write receiver (fullnameOverride: prom)
    url: http://prom-prometheus.grafana.svc.cluster.local:9090/api/v1/write

# Cluster events collection
clusterEvents:
  enabled: false
  collector: alloy-singleton

# Node logs
nodeLogs:
  enabled: true
  # Send to Loki (explicit so logs flow to the provisioned Loki datasource)
  destinations:
    - loki

# Collector is automatically set to alloy-logs

# Pod logs collection
podLogs:
  enabled: true
  gatherMethod: kubernetesApi
  destinations:
    - loki

# Collectors
alloy-singleton:
  enabled: true
  alloy:
    # Resource limits (tuned down: low actual usage)
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

# Alloy metrics collector - disabled (kube-prometheus-stack handles metrics)
alloy-metrics:
  enabled: false
  alloy:
    # Resource limits (tuned down: low actual usage)
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

alloy-logs:
  enabled: true
  alloy:
    mounts:
      varlog: true
      dockercontainers: false
    clustering:
      enabled: true
    # Resource limits (tuned down: moderate usage as DaemonSet)
    # 2026-07-06 (IMPR-1038): limit 512Mi -> 768Mi (7d peaks at 71-81% of old limit);
    # request 128Mi -> 256Mi to cover the ~180Mi chart-added sidecar overhead
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi

alloy-profiles:
  enabled: false

alloy-receiver:
  enabled: false

# Alloy Operator - manages Alloy instances
alloy-operator:
  # Deploy the Alloy Operator (manages Alloy instances)
  deploy: true
