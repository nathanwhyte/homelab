# kube-prometheus-stack Helm Chart Values

# Override: Prometheus retention
# Applied directly via Prometheus CRD in grafana namespace (helm-manage via kubectl apply)

prometheus:
  prometheusSpec:
    retention: 3d      # was 7d, reduced to save disk
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 50Gi   # 3d at 30s scrape ~15-20Gi actual usage
