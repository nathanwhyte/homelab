# kube-prometheus-stack Helm Chart Values
#
# Reconstructed 2026-07-01 from `helm get values kube-prometheus-stack -n grafana`
# (user-supplied) so deploy-grafana.sh reproduces the running release. The repo
# file previously held only retention + storage; the live release carried the
# full stack (scrape configs, grafana dashboards, node-exporter collectors, etc.).
#
# 2026-07-01: prometheus storageSpec storageClass longhorn-hdd -> longhorn-hdd-2x
# (2 replicas) and storage 50Gi -> 100Gi to match the live PVC after manual
# expansion. Alertmanager storage left on longhorn-hdd (unchanged).
#
# 2026-07-01: grafana admin password removed from values (was adminPassword:
# Homelab@123). Now sourced from the externally-managed Secret `grafana-admin`
# (keys admin-user / admin-password) via grafana.admin.existingSecret. That
# secret is NOT chart-managed and is NOT committed (matches *secret*.yaml
# gitignore) — create/rotate it out-of-band, e.g.:
#   kubectl create secret generic grafana-admin -n grafana \
#     --from-literal=admin-user=admin --from-literal=admin-password='<pw>'
# then rotate the DB with `grafana cli admin reset-admin-password` and
# restart the grafana pod so the reload sidecar picks up the new value.

alertmanager:
  # Alertmanager only sends the wemby AC-power alert to Slack. The Slack
  # incoming-webhook URL must be provided out-of-band as Secret
  # `alertmanager-slack-webhook` with key `api-url` in the grafana namespace.
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers:
          - "severity = critical"
        target_matchers:
          - "severity =~ warning|info"
        equal:
          - namespace
          - alertname
      - source_matchers:
          - "severity = warning"
        target_matchers:
          - "severity = info"
        equal:
          - namespace
          - alertname
      - source_matchers:
          - "alertname = InfoInhibitor"
        target_matchers:
          - "severity = info"
        equal:
          - namespace
      - target_matchers:
          - "alertname = InfoInhibitor"
    route:
      group_by:
        - namespace
        - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: "null"
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: slack-homelab
          matchers:
            - alertname = "WembyOnBattery"
        # IMPR-1118: backup alerts (BackupCronJobFailed, BackupFreshnessStale,
        # etc.) carry `alertgroup: backup` and route to the same Slack receiver.
        - receiver: slack-homelab
          matchers:
            - alertgroup = "backup"
    receivers:
      - name: "null"
      - name: slack-homelab
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/api-url
            channel: "#cron-homelab"
            send_resolved: true
            title: "{{ .CommonLabels.alertname }} — {{ .Status }}"
            text: "<@U0BAEG2AFC4> {{ range .Alerts }}{{ .Annotations.summary }}: {{ .Annotations.description }}{{ end }}"
    templates:
      - /etc/alertmanager/config/*.tmpl
  alertmanagerSpec:
    nodeSelector:
      kubernetes.io/hostname: timmy
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              # 2026-09-04 (IMPR-1122): 10Gi -> 2Gi on longhorn-observability.
              # Alertmanager was using 0.0 GiB of 10Gi. Moved off longhorn-hdd
              # because that class selects hdd-tagged disks, which timmy does not
              # have, so this volume lived on manu while the pod ran on timmy.
              storage: 2Gi
          storageClassName: longhorn-observability
    secrets:
      - alertmanager-slack-webhook
  enabled: true
defaultRules:
  create: true
  rules:
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
fullnameOverride: prom
global:
  rbac:
    create: true
grafana:
  additionalDataSources:
    - access: proxy
      editable: false
      isDefault: false
      name: Loki
      type: loki
      url: http://loki-gateway.grafana.svc.cluster.local
  admin:
    existingSecret: grafana-admin
    passwordKey: admin-password
    userKey: admin-user
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - prometheus
            topologyKey: kubernetes.io/hostname
          weight: 100
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - disableDeletion: false
          editable: true
          folder: ""
          name: default
          options:
            path: /var/lib/grafana/dashboards/default
          orgId: 1
          type: file
  dashboards:
    default:
      k8s-cluster:
        datasource: Prometheus
        folder: Kubernetes
        gnetId: 7249
        revision: 1
      k8s-nodes:
        datasource: Prometheus
        folder: Kubernetes
        gnetId: 15761
        revision: 4
      k8s-pods:
        datasource: Prometheus
        folder: Kubernetes
        gnetId: 15757
        revision: 4
      loki-logs:
        datasource: Loki
        folder: Logs
        gnetId: 12019
        revision: 3
      node-exporter:
        datasource: Prometheus
        folder: Kubernetes
        gnetId: 1860
        revision: 36
  enabled: true
  grafana.ini:
    dashboards:
      min_refresh_interval: 5s
    datasources:
      cache: true
    rendering:
      concurrent_render_request_limit: 5
      render_timeout: 30s
    server:
      query_timeout: 60s
  ingress:
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    enabled: true
    hosts:
      - grafana.nathanwhyte.dev
    ingressClassName: ""
    path: /
  livenessProbe:
    failureThreshold: 10
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  persistence:
    enabled: true
    existingClaim: grafana-storage-rwx
    type: pvc
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 768Mi
    requests:
      cpu: 50m
      memory: 128Mi
  service:
    port: 3000
    type: ClusterIP
kubeStateMetrics:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi
nameOverride: prom
prometheus:
  enabled: true
  prometheusSpec:
    additionalScrapeConfigs:
      - job_name: gpu-metrics
        kubernetes_sd_configs:
          - namespaces:
              names:
                - gpu-operator
            role: endpoints
        metrics_path: /metrics
        relabel_configs:
          - action: keep
            regex: .*dcgm-exporter.*
            source_labels:
              - __meta_kubernetes_endpoints_name
          - action: drop
            regex: .*-node-feature-discovery-master
            source_labels:
              - __meta_kubernetes_endpoints_name
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: kubernetes_node
        scheme: http
        scrape_interval: 60s
      - job_name: amd-gpu-metrics
        metrics_path: /metrics
        scrape_interval: 60s
        static_configs:
          - targets:
              - amdgpu-exporter.kube-system.svc.cluster.local:9101
      - job_name: ollama-metrics
        scrape_interval: 60s
        static_configs:
          - labels:
              node: timmy
            targets:
              - ollama.llama.svc:9111
      - job_name: garage
        scrape_interval: 60s
        static_configs:
          - targets:
              - garage-0.garage-headless.garage.svc.cluster.local:3903
              - garage-1.garage-headless.garage.svc.cluster.local:3903
              - garage-2.garage-headless.garage.svc.cluster.local:3903
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - grafana
              topologyKey: kubernetes.io/hostname
            weight: 100
    enableLifecycle: true
    enableRemoteWriteReceiver: true
    externalLabels:
      cluster: k8s
    image:
      pullPolicy: IfNotPresent
      registry: quay.io
      repository: prometheus/prometheus
      sha: ""
      tag: v3.7.3
    nodeSelector:
      kubernetes.io/hostname: timmy
    podMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      limits:
        cpu: 500m
        # 2026-07-06 (IMPR-1038): 2Gi -> 3Gi; 7d peak hit 94% of the old limit
        memory: 3Gi
      requests:
        cpu: 200m
        # 2026-07-06 (IMPR-1038): 1Gi -> 2Gi; steady usage 1.6Gi exceeded the old request
        memory: 2Gi
    # 2026-07-06 scale-back: 7d -> 3d per user decision (metrics rarely
    # consulted beyond a few days; 30Gi volume now has ample headroom).
    retention: 3d
    retentionSize: ""
    ruleSelector: {}
    ruleSelectorNilUsesHelmValues: false
    # 2026-07-06 logging/monitoring scale-back: 30s -> 60s everywhere (incl.
    # additionalScrapeConfigs) — halves sample ingest and Prometheus head-block
    # memory; homelab dashboards don't need 30s resolution.
    scrapeInterval: 60s
    serviceMonitorSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              # 2026-07-06: 100Gi -> 30Gi. Volume recreated blank (historical
              # data dropped by choice during the wemby reboot cycle); 7d
              # retention at 60s scrapes needs well under 30Gi.
              #
              # 2026-09-04 (IMPR-1122): 30Gi -> 12Gi, and off longhorn-hdd-2x.
              # Measured steady state at 3d/60s: 4,374 samples/s over 242,765
              # active series at ~1.90 B/sample = 2.75 GiB of blocks (allowing
              # for the 7h12m max-block-duration retention overshoot), plus
              # ~0.50 GiB head+WAL and a ~0.55 GiB compaction transient = 3.25
              # GiB steady / 3.80 GiB peak. 12Gi is 3.6x steady, 3.1x peak.
              # 30Gi was ~9x — and it never held metrics anyway: the volume sat
              # at 94% because of rebuild snapshots, not TSDB (see the class
              # comment in manifests/storageclass-longhorn-observability.yaml).
              storage: 12Gi
          storageClassName: longhorn-observability
    tsdb:
      outOfOrderTimeWindow: 5m
    version: v3.7.3
  service:
    nodePort: 30909
    port: 9090
    type: NodePort
    # Local (not the default Cluster) so the real client IP reaches the
    # NetworkPolicy in `grafana/nodeport-networkpolicy.yaml` — under `Cluster`,
    # kube-proxy SNATs cross-node traffic to the node IP and a source-CIDR rule
    # matches everything while appearing to filter (the BUG-1057 failure mode).
    # `prometheus-prom-prometheus-0` already runs on timmy, which is where
    # mac/README.md points the MacBook's remote_write, so Local forwards
    # correctly today. If that pod is ever rescheduled off timmy, remote-write
    # breaks — pin it, or repoint the client, rather than reverting to Cluster.
    externalTrafficPolicy: Local
prometheus-node-exporter:
  enabled: true
  extraArgs:
    - --collector.hwmon
    - --collector.systemd
    - --collector.textfile
    - --collector.netdev
    - --collector.netstat
    - --collector.diskstats
    - --collector.filesystem
    - --collector.meminfo
    - --collector.loadavg
    - --collector.cpu
  extraVolumeMounts:
    - mountPath: /host/sys/class/hwmon
      name: sys-class-hwmon
      readOnly: true
    - mountPath: /host/sys/class/thermal
      name: sys-class-thermal
      readOnly: true
  extraVolumes:
    - hostPath:
        path: /sys/class/hwmon
      name: sys-class-hwmon
    - hostPath:
        path: /sys/class/thermal
      name: sys-class-thermal
  hostIPC: false
  hostNetwork: false
  hostPID: true
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
prometheusOperator:
  enabled: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
