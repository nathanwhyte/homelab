rule_files:
  - backup-alerts.rules.yaml  # Replaced with a temporary path by test-backup-alerts.py.
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{namespace="grafana",job="backup-freshness-exporter"}'
        values: '1x100'
      - series: 'backup_freshness_up{namespace="grafana",job="backup-freshness-exporter"}'
        values: '1x100'
      - series: 'backup_freshness_last_run_timestamp_seconds{namespace="grafana",job="backup-freshness-exporter"}'
        values: '0+60x100'
      - series: 'backup_freshness_seconds{app="healthy"}'
        values: '3600x100'
      - series: 'backup_freshness_max_age_seconds{app="healthy"}'
        values: '172800x100'
    alert_rule_test:
      - {eval_time: 90m, alertname: BackupFreshnessStale, exp_alerts: []}
      - {eval_time: 90m, alertname: BackupFreshnessExporterDown, exp_alerts: []}
      - {eval_time: 90m, alertname: BackupFreshnessExporterStale, exp_alerts: []}
  # A declared database with no Kubernetes job series must still alert.
  - interval: 1m
    input_series:
      - series: 'backup_freshness_seconds{app="missing"}'
        values: '+Inf+0x90'
      - series: 'backup_freshness_max_age_seconds{app="missing"}'
        values: '172800x90'
    alert_rule_test:
      - eval_time: 61m
        alertname: BackupFreshnessStale
        exp_alerts:
          - exp_labels: {app: missing, severity: critical, alertgroup: backup}
            exp_annotations:
              summary: Backup for missing is stale (+Infs old)
              description: "The newest backup for missing is older than its threshold (2x the declared interval for a database dump; 36h for a longhorn/<namespace>/<pvc> volume). Either the backup job is failing (BUG-1014) or there is no backup job at all (BUG-1086). For a Longhorn volume, check `kubectl -n longhorn-system get backups.longhorn.io -l backup-volume=<volume>` and the backup-daily Job's log: the Job can exit 0 while one volume's backup fails."
  - interval: 1m
    input_series:
      - series: 'kube_job_status_failed{namespace="kube-system",job_name="k3s-datastore-backup-drill"}'
        values: '1x10'
      - series: 'kube_job_status_start_time{namespace="kube-system",job_name="k3s-datastore-backup-drill"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: BackupCronJobFailed
        exp_alerts:
          - exp_labels: {namespace: kube-system, job_name: k3s-datastore-backup-drill, severity: critical, alertgroup: backup}
            exp_annotations:
              summary: Backup job k3s-datastore-backup-drill failed in kube-system
              description: "A backup Job started in the last 24h has failed (). Check `kubectl -n kube-system describe job k3s-datastore-backup-drill` and the pod logs. This is the BUG-1014 signature: pg_dump succeeded but the upload step failed."
  # No target at all must alert; an absent metric is not a zero metric.
  - interval: 1m
    input_series:
      - series: 'up{namespace="grafana",job="backup-freshness-exporter"}'
        values: '1x40'
      - series: 'backup_freshness_up{namespace="grafana",job="backup-freshness-exporter"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: BackupFreshnessExporterDown
        exp_alerts:
          - exp_labels: {namespace: grafana, job: backup-freshness-exporter, severity: warning, alertgroup: backup}
            exp_annotations:
              summary: Backup freshness exporter is failing
              description: The exporter cannot list R2 or the Longhorn CRs, cannot be scraped, or has no scrape target. Check grafana/backup-freshness-exporter's logs, its ServiceMonitor, R2 credentials and its longhorn-system Role. The failed source's freshness rows are missing.
  - interval: 1m
    input_series:
      - series: 'up{namespace="grafana",job="backup-freshness-exporter"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: BackupFreshnessExporterDown
        exp_alerts:
          - exp_labels: {namespace: grafana, job: backup-freshness-exporter, severity: warning, alertgroup: backup}
            exp_annotations:
              summary: Backup freshness exporter is failing
              description: The exporter cannot list R2 or the Longhorn CRs, cannot be scraped, or has no scrape target. Check grafana/backup-freshness-exporter's logs, its ServiceMonitor, R2 credentials and its longhorn-system Role. The failed source's freshness rows are missing.
  - interval: 1m
    alert_rule_test:
      - eval_time: 31m
        alertname: BackupFreshnessExporterDown
        exp_alerts:
          - exp_labels:
              namespace: grafana
              job: backup-freshness-exporter
              severity: warning
              alertgroup: backup
            exp_annotations:
              summary: Backup freshness exporter is failing
              description: The exporter cannot list R2 or the Longhorn CRs, cannot be scraped, or has no scrape target. Check grafana/backup-freshness-exporter's logs, its ServiceMonitor, R2 credentials and its longhorn-system Role. The failed source's freshness rows are missing.
  # A healthy HTTP server with a frozen refresh worker must alert as stale.
  - interval: 1m
    input_series:
      - series: 'up{namespace="grafana",job="backup-freshness-exporter"}'
        values: '1x800'
      - series: 'backup_freshness_up{namespace="grafana",job="backup-freshness-exporter"}'
        values: '1x800'
      - series: 'backup_freshness_last_run_timestamp_seconds{namespace="grafana",job="backup-freshness-exporter"}'
        values: '0x800'
    alert_rule_test:
      - eval_time: 782m
        alertname: BackupFreshnessExporterStale
        exp_alerts:
          - exp_labels:
              namespace: grafana
              job: backup-freshness-exporter
              severity: warning
              alertgroup: backup
            exp_annotations:
              summary: Backup freshness exporter has not run in 12h
              description: The freshness exporter's last completed listing attempt was more than 12h ago. Its HTTP endpoint may still be serving while the refresh worker is stalled. Check the deployment and logs.
      - eval_time: 782m
        alertname: BackupFreshnessExporterDown
        exp_alerts: []
  # IMPR-1478: the Longhorn backup target goes unavailable for 30 minutes.
  - interval: 1m
    input_series:
      - series: 'backup_freshness_longhorn_target_available{namespace="grafana",job="backup-freshness-exporter"}'
        values: '1x10 0x40'
    alert_rule_test:
      - eval_time: 39m
        alertname: LonghornBackupTargetUnavailable
        exp_alerts: []
      - eval_time: 41m
        alertname: LonghornBackupTargetUnavailable
        exp_alerts:
          - exp_labels:
              namespace: grafana
              job: backup-freshness-exporter
              severity: critical
              alertgroup: backup
            exp_annotations:
              summary: Longhorn backup target is unavailable
              description: A Longhorn BackupTarget has reported available=false for 30 minutes, so no volume backup can run. Check `kubectl -n longhorn-system get backuptargets.longhorn.io -o yaml` and the longhorn-r2-backup-target secret.
  # A failed Longhorn backup-daily Job is a backup Job failure like the others.
  - interval: 1m
    input_series:
      - series: 'kube_job_status_failed{namespace="longhorn-system",job_name="backup-daily-29901234",reason="BackoffLimitExceeded"}'
        values: '1x20'
      - series: 'kube_job_status_start_time{namespace="longhorn-system",job_name="backup-daily-29901234"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: BackupCronJobFailed
        exp_alerts:
          - exp_labels:
              namespace: longhorn-system
              job_name: backup-daily-29901234
              reason: BackoffLimitExceeded
              severity: critical
              alertgroup: backup
            exp_annotations:
              summary: Backup job backup-daily-29901234 failed in longhorn-system
              description: "A backup Job started in the last 24h has failed (BackoffLimitExceeded). Check `kubectl -n longhorn-system describe job backup-daily-29901234` and the pod logs. This is the BUG-1014 signature: pg_dump succeeded but the upload step failed."
