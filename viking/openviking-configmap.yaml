---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openviking-config
  namespace: viking
data:
  ov.conf: |
    {
      "default_account": "default",
      "default_user": "natew",
      "storage": {
        "workspace": "/app/data"
      },
      "server": {
        "host": "0.0.0.0",
        "port": 1933,
        "workers": 1,
        "root_api_key": "openviking-homelab"
      },
      "log": {
        "level": "INFO",
        "output": "stdout"
      },
      "embedding": {
        "dense": {
          "provider": "openai",
          "model": "all-MiniLM-L6-v2",
          "api_key": "sk-no-key-required",
          "api_base": "http://embedder-llamacpp.viking.svc.cluster.local:8080/v1",
          "dimension": 384
        },
        "max_concurrent": 3
      },
      "vlm": {
        "provider": "litellm",
        "model": "openai/llama-3.1-8b-instruct",
        "api_key": "sk-no-key-required",
        "api_base": "http://llama-api.llama.svc.cluster.local/v1",
        "max_concurrent": 2
      }
    }
