---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openviking-config
  namespace: viking
data:
  ov.conf: |
    {
      "default_account": "default",
      "default_user": "natew",
      "storage": {
        "workspace": "/app/data",
        "vectordb": {
          "backend": "local",
          "name": "context",
          "dimension": 384
        }
      },
      "code": {
        "code_summary_mode": "ast"
      },
      "rerank": {
        "threshold": 0.2
      },
      "server": {
        "host": "0.0.0.0",
        "port": 1933,
        "workers": 3,
        "root_api_key": "openviking-homelab"
      },
      "log": {
        "level": "INFO",
        "output": "stdout"
      },
      "embedding": {
        "dense": {
          "provider": "openai",
          "model": "all-MiniLM-L6-v2",
          "api_key": "sk-no-key-required",
          "api_base": "http://embedder-llamacpp.viking.svc.cluster.local:8080/v1",
          "dimension": 384,
          "batch_size": 8
        },
        "max_concurrent": 8
      },
      "vlm": {
        "provider": "litellm",
        "model": "openai/qwen3-14b",
        "api_key": "sk-no-key-required",
        "api_base": "http://qwen-summarizer-llm.llama.svc.cluster.local/v1",
        "max_concurrent": 2
      }
    }
