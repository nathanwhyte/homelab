---
# Restrict to local network only
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ov-console-local-only
  namespace: viking
spec:
  ipAllowList:
    sourceRange:
      - 192.168.1.0/24
      - 10.42.0.0/16
      - 10.43.0.0/16

---
# HTTP → HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ov-console-https-redirect
  namespace: viking
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
# HTTP entrypoint — redirects to HTTPS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ov-console-redirect
  namespace: viking
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: viking-ov-console-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: viking.nathanwhyte.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ov-console
                port:
                  number: 8020

---
# HTTPS entrypoint — local network only
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ov-console-ingress
  namespace: viking
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: viking-ov-console-local-only@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - viking.nathanwhyte.dev
      secretName: viking-console-tls
  rules:
    - host: viking.nathanwhyte.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ov-console
                port:
                  number: 8020
