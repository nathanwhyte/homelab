---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder-llamacpp
  namespace: viking
  labels:
    app: embedder-llamacpp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: embedder-llamacpp
  template:
    metadata:
      labels:
        app: embedder-llamacpp
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - timmy
                      - manu
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: embedder-llamacpp
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 0
      initContainers:
        - name: model-fetch
          image: curlimages/curl:8.12.1
          env:
            - name: MODEL_FILE
              value: all-MiniLM-L6-v2-f16.gguf
            - name: MODEL_URL
              value: https://huggingface.co/second-state/All-MiniLM-L6-v2-Embedding-GGUF/resolve/main/all-MiniLM-L6-v2-ggml-model-f16.gguf
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - /bin/sh
            - -c
          args:
            - >-
              set -eu;
              model="/models/${MODEL_FILE}";
              if [ -f "${model}" ]; then
                echo "Embedding model already present in cache.";
              else
                echo "Downloading embedding model from ${MODEL_URL}...";
                curl -fL --retry 5 --retry-delay 5 "${MODEL_URL}" -o "${model}";
                echo "Download complete.";
              fi
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server
          command:
            - /app/llama-server
          args:
            - --model
            - /models/all-MiniLM-L6-v2-f16.gguf
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --embedding
            - --pooling
            - mean
            - --n-gpu-layers
            - "0"
            - --ctx-size
            - "4096"
            - --parallel
            - "8"
            - --batch-size
            - "2048"
            - --ubatch-size
            - "2048"
            - --mlock
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 200Mi
