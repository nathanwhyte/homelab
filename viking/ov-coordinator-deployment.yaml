---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ov-coordinator
  namespace: viking
  labels:
    app: ov-coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ov-coordinator
  template:
    metadata:
      labels:
        app: ov-coordinator
    spec:
      initContainers:
        - name: install-deps
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - pip install --no-cache-dir --target=/deps fastapi uvicorn httpx
          volumeMounts:
            - name: deps
              mountPath: /deps
      containers:
        - name: ov-coordinator
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - >-
              PYTHONPATH=/deps exec python -m uvicorn coordinator:app
              --host 0.0.0.0 --port 1933 --log-level info
              --app-dir /app
          ports:
            - containerPort: 1933
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: OV_WORKERS
              value: >-
                http://ov-worker-0.ov-worker-headless.viking.svc.cluster.local:1933,http://ov-worker-1.ov-worker-headless.viking.svc.cluster.local:1933,http://ov-worker-2.ov-worker-headless.viking.svc.cluster.local:1933,http://ov-worker-3.ov-worker-headless.viking.svc.cluster.local:1933,http://ov-worker-4.ov-worker-headless.viking.svc.cluster.local:1933
            - name: OV_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: openviking-config
                  key: api-key
            # Merged reads disabled — using sharded fan-out as default
            # - name: OV_MERGED_URL
            #   value: "http://ov-merged.viking.svc.cluster.local:1933"
            # - name: OV_MERGE_STATUS_URL
            #   value: "http://ov-merge.viking.svc.cluster.local:8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 1933
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 1933
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: code
              mountPath: /app
            - name: deps
              mountPath: /deps
      volumes:
        - name: code
          configMap:
            name: ov-coordinator-code
        - name: deps
          emptyDir: {}
