# Extract openviking-alerts.yaml's spec to openviking-rules.yaml before running promtool.
# BUG-1138: the queue alert must distinguish a backlog that is draining (healthy)
# from one that has stopped moving (a stall). Depth alone cannot do that.
rule_files: [openviking-rules.yaml]
evaluation_interval: 1m
tests:
  - name: a draining sync burst never fires
    # The 2026-09-15 12:37-13:21 CDT regression case, scaled down: pending goes
    # deep and then falls while processed climbs the whole time. This is the exact
    # shape that fired the retired rule 17 times.
    interval: 1m
    input_series:
      - series: 'openviking_queue_pending{queue="total"}'
        values: "74 441 1052 2473 2100 1600 1100 600 328 87 0x10"
      - series: 'openviking_queue_processed_total{queue="total"}'
        values: "100+60x19"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"}) or vector(0)
        eval_time: 25m
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: stall immediately after a completion fires in about 20m, not 30
    # THE case that matters, and the one this suite originally missed. A queue
    # that has been working and then wedges keeps its last increment inside the
    # 15m range until it ages out, so the expression only turns true at ~15m.
    # Any `for` is added ON TOP of that.
    #
    # With the old `for: 15m` this fired at 32m — for an alert whose summary
    # claims 15. Codex caught it on homelab #99; `for: 5m` gives ~20m.
    # Raising the hold again re-breaks this case.
    interval: 1m
    input_series:
      - series: 'openviking_queue_pending{queue="total"}'
        values: "600x40"
      - series: 'openviking_queue_processed_total{queue="total"}'
        values: "100 101 102 102x38"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"}) or vector(0)
        eval_time: 16m
        exp_samples: [{ labels: "{}", value: 0 }]
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"})
        eval_time: 24m
        exp_samples: [{ labels: "{}", value: 1 }]

  - name: a cold start with a backlog is debounced, not paged
    # processed_total flat from the FIRST sample — the shape after a pod restart
    # that comes back with a backlog and has not completed anything yet.
    # increase() is 0 immediately here, so this is what `for` actually guards.
    # It is NOT a model of a real stall; the case above is.
    interval: 1m
    input_series:
      - series: 'openviking_queue_pending{queue="total"}'
        values: "600x30"
      - series: 'openviking_queue_processed_total{queue="total"}'
        values: "4102x30"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"}) or vector(0)
        eval_time: 4m
        exp_samples: [{ labels: "{}", value: 0 }]
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"})
        eval_time: 8m
        exp_samples: [{ labels: "{}", value: 1 }]

  - name: a slow drain is not a stall
    # Draining at roughly 1 item/min. Depth stays well above the threshold for the
    # whole window, but processed advances, so this must stay silent. Under the
    # retired depth-based rule this fired.
    interval: 1m
    input_series:
      - series: 'openviking_queue_pending{queue="total"}'
        values: "300-1x29"
      - series: 'openviking_queue_processed_total{queue="total"}'
        values: "1000+1x29"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"}) or vector(0)
        eval_time: 28m
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: an empty queue with no progress never fires
    # Nothing pending means nothing to process. Flat processed is correct here and
    # must not alert, which is what the pending > 5 conjunct is for.
    interval: 1m
    input_series:
      - series: 'openviking_queue_pending{queue="total"}'
        values: "0x30"
      - series: 'openviking_queue_processed_total{queue="total"}'
        values: "4102x30"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"}) or vector(0)
        eval_time: 25m
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: the native series are not counted and cannot resurrect the double-count
    # The retired rule's bare sum() spanned both scrape targets. These native-side
    # series (capitalized queue names, no `total`) exist alongside the exporter's
    # and must contribute nothing: the selector is queue="total", which the native
    # endpoint never emits. If someone reintroduces a sum(), this test fails.
    interval: 1m
    input_series:
      - series: 'openviking_queue_pending{queue="total"}'
        values: "0x30"
      - series: 'openviking_queue_processed_total{queue="total"}'
        values: "4102x30"
      - series: 'openviking_queue_pending{queue="Embedding",container="openviking"}'
        values: "600x30"
      - series: 'openviking_queue_processed_total{queue="Embedding",container="openviking"}'
        values: "3759x30"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"}) or vector(0)
        eval_time: 25m
        exp_samples: [{ labels: "{}", value: 0 }]
      - expr: openviking_queue_pending{queue="total"}
        eval_time: 25m
        exp_samples: [{ labels: 'openviking_queue_pending{queue="total"}', value: 0 }]

  # BUG-1220: OpenVikingWedgedLockFile must name the wedged lock. Presence age
  # climbs 60s per 1m sample, so it crosses 2700 at 46m and fires at 51m.
  - name: a wedged lock fires per lock and names it
    interval: 1m
    input_series:
      - series: 'openviking_s3_ovlock_live_age_seconds{key="default/user/noot/sessions/mcp-store-e71a7b670fca/.path.ovlock",uri="viking://user/noot/sessions/mcp-store-e71a7b670fca",owner="9959d01e-e133-4e46-8074-04cc1de18b00",lock_type="E"}'
        values: "0+60x60"
      - series: 'openviking_s3_ovlock_oldest_live_age_seconds'
        values: "0+60x60"
    alert_rule_test:
      - alertname: OpenVikingWedgedLockFile
        eval_time: 50m
        exp_alerts: []
      - alertname: OpenVikingWedgedLockFile
        eval_time: 52m
        exp_alerts:
          - exp_labels:
              severity: warning
              key: default/user/noot/sessions/mcp-store-e71a7b670fca/.path.ovlock
              uri: viking://user/noot/sessions/mcp-store-e71a7b670fca
              owner: 9959d01e-e133-4e46-8074-04cc1de18b00
              lock_type: E
            exp_annotations:
              summary: "OpenViking lock viking://user/noot/sessions/mcp-store-e71a7b670fca live-refreshed for 52m 0s — wedge signature"
              description: "Lock default/user/noot/sessions/mcp-store-e71a7b670fca/.path.ovlock (owner handle 9959d01e-e133-4e46-8074-04cc1de18b00, type E) has been lease-refreshed continuously for 52m 0s: a wedged server-side task, not normal work. NEVER delete this lock file: its holder still believes it owns it. Recovery is an OV restart (deploy/openviking -n viking, after the queue drains), which only the in-Job heal (off since BUG-1181) or an operator may do. Find the holder with Loki {namespace=\"viking\", container=\"openviking\"} |= \"9959d01e-e133-4e46-8074-04cc1de18b00\" (ragfs::lock::manager refresh lines carry lease_ref and lock_path). The janitor reports these as WEDGED and never deletes them (IMPR-1095, BUG-1220)."

  - name: the unlabelled gauge alone still fires, with placeholders
    # An exporter without the labelled series (pre-BUG-1220 sidecar, or
    # OVLOCK_LABEL_TOP_N=0) must not leave the wedge unalerted.
    interval: 1m
    input_series:
      - series: 'openviking_s3_ovlock_oldest_live_age_seconds{pod="openviking-x"}'
        values: "0+60x60"
    alert_rule_test:
      - alertname: OpenVikingWedgedLockFile
        eval_time: 52m
        exp_alerts:
          - exp_labels:
              severity: warning
              pod: openviking-x
            exp_annotations:
              summary: "OpenViking lock (path not exported) live-refreshed for 52m 0s — wedge signature"
              description: "Lock (key not exported: read the latest ovlock-janitor run log) (owner handle unknown, type unknown) has been lease-refreshed continuously for 52m 0s: a wedged server-side task, not normal work. NEVER delete this lock file: its holder still believes it owns it. Recovery is an OV restart (deploy/openviking -n viking, after the queue drains), which only the in-Job heal (off since BUG-1181) or an operator may do. Find the holder with Loki {namespace=\"viking\", container=\"openviking\"} |= \"<owner>\" (ragfs::lock::manager refresh lines carry lease_ref and lock_path). The janitor reports these as WEDGED and never deletes them (IMPR-1095, BUG-1220)."

  - name: two wedged locks are two instances, and the fallback stays quiet
    interval: 1m
    input_series:
      - series: 'openviking_s3_ovlock_live_age_seconds{key="default/resources/a/.path.ovlock",uri="viking://resources/a",owner="h-a",lock_type="T"}'
        values: "0+60x60"
      - series: 'openviking_s3_ovlock_live_age_seconds{key="default/resources/b/.path.ovlock",uri="viking://resources/b",owner="h-b",lock_type="T"}'
        values: "0+50x60"
      - series: 'openviking_s3_ovlock_oldest_live_age_seconds'
        values: "0+60x60"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingWedgedLockFile",alertstate="firing"})
        eval_time: 60m
        exp_samples: [{ labels: "{}", value: 2 }]
      - expr: count(ALERTS{alertname="OpenVikingWedgedLockFile",alertstate="firing",key=""}) or vector(0)
        eval_time: 60m
        exp_samples: [{ labels: "{}", value: 0 }]

  # OpenVikingExporterUnscraped: OpenVikingDown cannot see a missing exporter.
  - name: a failing exporter scrape fires after 5m
    interval: 1m
    input_series:
      - series: 'up{namespace="viking", job="openviking", endpoint="metrics", pod="openviking-x"}'
        values: "1 1 0x20"
      - series: 'up{namespace="viking", job="openviking", endpoint="http", pod="openviking-x"}'
        values: "1x22"
    alert_rule_test:
      - alertname: OpenVikingExporterUnscraped
        eval_time: 6m
        exp_alerts: []
      - alertname: OpenVikingExporterUnscraped
        eval_time: 8m
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: viking
              job: openviking
              endpoint: metrics
              pod: openviking-x
            exp_annotations:
              summary: "ov-exporter (port 9210) not scraped for 5m"
              description: "Prometheus cannot scrape the ov-exporter sidecar, or the target is gone, so every openviking_* exporter series is missing and OpenVikingDown and the lock and queue rules above cannot fire. Check the pod (`kubectl -n viking get pods -l app=openviking`) and the ov-exporter container log; a failing scrape with a running container points at the exposition (`curl <pod-ip>:9210/metrics | promtool check metrics`)."

  - name: a vanished exporter target fires through absent()
    interval: 1m
    input_series:
      - series: 'up{namespace="viking", job="openviking", endpoint="http", pod="openviking-x"}'
        values: "1x20"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingExporterUnscraped",alertstate="firing"})
        eval_time: 8m
        exp_samples: [{ labels: "{}", value: 1 }]

  - name: a healthy exporter scrape stays quiet
    interval: 1m
    input_series:
      - series: 'up{namespace="viking", job="openviking", endpoint="metrics", pod="openviking-x"}'
        values: "1x20"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingExporterUnscraped"}) or vector(0)
        eval_time: 15m
        exp_samples: [{ labels: "{}", value: 0 }]

  # Client delivery counts going flat while recalls continue (plugin rename).
  - name: recalls with no counted delivery fire
    interval: 10m
    input_series:
      - series: 'openviking_client_recalls_total{machine="pop", harness="codex"}'
        values: "0+5x60"
      - series: 'openviking_client_recall_skips_total{machine="pop", harness="codex"}'
        values: "0+1x60"
      - series: 'openviking_client_recall_errors_total{machine="pop", harness="codex"}'
        values: "0x60"
      - series: 'openviking_client_recall_tokens_total{machine="pop", harness="codex"}'
        values: "5000x60"
      - series: 'openviking_client_recall_entries_total{machine="pop", harness="codex"}'
        values: "40x60"
    alert_rule_test:
      - alertname: OpenVikingClientRecallDeliveryFlat
        eval_time: 7h
        exp_alerts:
          - exp_labels:
              severity: warning
              machine: pop
              harness: codex
            exp_annotations:
              summary: "pop/codex recalls ran but delivered no counted memory for 6h"
              description: "Auto-recall runs that neither skipped nor failed kept arriving from pop (codex), but recall tokens or entries did not move. The likely cause is a memory-plugin update renaming the hook-log stage ov-telemetry-push.py counts (DELIVERY_EVENTS in dotfiles bin/ov-telemetry-push.py). Compare the stages in ~/.openviking/logs/*-hooks.log on that Mac with the table and update it."

  - name: recalls that deliver stay quiet
    interval: 10m
    input_series:
      - series: 'openviking_client_recalls_total{machine="pop", harness="codex"}'
        values: "0+5x60"
      - series: 'openviking_client_recall_skips_total{machine="pop", harness="codex"}'
        values: "0+1x60"
      - series: 'openviking_client_recall_errors_total{machine="pop", harness="codex"}'
        values: "0x60"
      - series: 'openviking_client_recall_tokens_total{machine="pop", harness="codex"}'
        values: "0+800x60"
      - series: 'openviking_client_recall_entries_total{machine="pop", harness="codex"}'
        values: "0+4x60"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingClientRecallDeliveryFlat"}) or vector(0)
        eval_time: 9h
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: recalls that all skip or fail stay quiet
    # An offline server or a run of filtered prompts is not a counting break.
    interval: 10m
    input_series:
      - series: 'openviking_client_recalls_total{machine="pop", harness="claude-code"}'
        values: "0+5x60"
      - series: 'openviking_client_recall_skips_total{machine="pop", harness="claude-code"}'
        values: "0+3x60"
      - series: 'openviking_client_recall_errors_total{machine="pop", harness="claude-code"}'
        values: "0+2x60"
      - series: 'openviking_client_recall_tokens_total{machine="pop", harness="claude-code"}'
        values: "9000x60"
      - series: 'openviking_client_recall_entries_total{machine="pop", harness="claude-code"}'
        values: "70x60"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingClientRecallDeliveryFlat"}) or vector(0)
        eval_time: 9h
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: a day of recalls with no session-start injection fires, one with injections stays quiet
    interval: 30m
    input_series:
      - series: 'openviking_client_recalls_total{machine="workbook", harness="claude-code"}'
        values: "0+10x60"
      - series: 'openviking_client_session_start_injects_total{machine="workbook", harness="claude-code"}'
        values: "300x60"
      - series: 'openviking_client_recalls_total{machine="pop", harness="claude-code"}'
        values: "0+10x60"
      - series: 'openviking_client_session_start_injects_total{machine="pop", harness="claude-code"}'
        values: "0+1x60"
    promql_expr_test:
      - expr: count by (machine) (ALERTS{alertname="OpenVikingClientSessionStartFlat",alertstate="firing"})
        eval_time: 26h
        exp_samples: [{ labels: '{machine="workbook"}', value: 1 }]

  - name: a long but sub-threshold lock never fires
    interval: 1m
    input_series:
      - series: 'openviking_s3_ovlock_live_age_seconds{key="default/resources/a/.path.ovlock",uri="viking://resources/a",owner="h-a",lock_type="T"}'
        values: "900+30x60"
      - series: 'openviking_s3_ovlock_oldest_live_age_seconds'
        values: "900+30x60"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingWedgedLockFile"}) or vector(0)
        eval_time: 60m
        exp_samples: [{ labels: "{}", value: 0 }]
