# Extract openviking-alerts.yaml's spec to openviking-rules.yaml before running promtool.
# BUG-1138: the queue alert must distinguish a backlog that is draining (healthy)
# from one that has stopped moving (a stall). Depth alone cannot do that.
rule_files: [openviking-rules.yaml]
evaluation_interval: 1m
tests:
  - name: a draining sync burst never fires
    # The 2026-09-15 12:37-13:21 CDT regression case, scaled down: pending goes
    # deep and then falls while processed climbs the whole time. This is the exact
    # shape that fired the retired rule 17 times.
    interval: 1m
    input_series:
      - series: 'openviking_queue_pending{queue="total"}'
        values: "74 441 1052 2473 2100 1600 1100 600 328 87 0x10"
      - series: 'openviking_queue_processed_total{queue="total"}'
        values: "100+60x19"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"}) or vector(0)
        eval_time: 25m
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: stall immediately after a completion fires in about 20m, not 30
    # THE case that matters, and the one this suite originally missed. A queue
    # that has been working and then wedges keeps its last increment inside the
    # 15m range until it ages out, so the expression only turns true at ~15m.
    # Any `for` is added ON TOP of that.
    #
    # With the old `for: 15m` this fired at 32m — for an alert whose summary
    # claims 15. Codex caught it on homelab #99; `for: 5m` gives ~20m.
    # Raising the hold again re-breaks this case.
    interval: 1m
    input_series:
      - series: 'openviking_queue_pending{queue="total"}'
        values: "600x40"
      - series: 'openviking_queue_processed_total{queue="total"}'
        values: "100 101 102 102x38"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"}) or vector(0)
        eval_time: 16m
        exp_samples: [{ labels: "{}", value: 0 }]
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"})
        eval_time: 24m
        exp_samples: [{ labels: "{}", value: 1 }]

  - name: a cold start with a backlog is debounced, not paged
    # processed_total flat from the FIRST sample — the shape after a pod restart
    # that comes back with a backlog and has not completed anything yet.
    # increase() is 0 immediately here, so this is what `for` actually guards.
    # It is NOT a model of a real stall; the case above is.
    interval: 1m
    input_series:
      - series: 'openviking_queue_pending{queue="total"}'
        values: "600x30"
      - series: 'openviking_queue_processed_total{queue="total"}'
        values: "4102x30"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"}) or vector(0)
        eval_time: 4m
        exp_samples: [{ labels: "{}", value: 0 }]
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"})
        eval_time: 8m
        exp_samples: [{ labels: "{}", value: 1 }]

  - name: a slow drain is not a stall
    # Draining at roughly 1 item/min. Depth stays well above the threshold for the
    # whole window, but processed advances, so this must stay silent. Under the
    # retired depth-based rule this fired.
    interval: 1m
    input_series:
      - series: 'openviking_queue_pending{queue="total"}'
        values: "300-1x29"
      - series: 'openviking_queue_processed_total{queue="total"}'
        values: "1000+1x29"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"}) or vector(0)
        eval_time: 28m
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: an empty queue with no progress never fires
    # Nothing pending means nothing to process. Flat processed is correct here and
    # must not alert, which is what the pending > 5 conjunct is for.
    interval: 1m
    input_series:
      - series: 'openviking_queue_pending{queue="total"}'
        values: "0x30"
      - series: 'openviking_queue_processed_total{queue="total"}'
        values: "4102x30"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"}) or vector(0)
        eval_time: 25m
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: the native series are not counted and cannot resurrect the double-count
    # The retired rule's bare sum() spanned both scrape targets. These native-side
    # series (capitalized queue names, no `total`) exist alongside the exporter's
    # and must contribute nothing: the selector is queue="total", which the native
    # endpoint never emits. If someone reintroduces a sum(), this test fails.
    interval: 1m
    input_series:
      - series: 'openviking_queue_pending{queue="total"}'
        values: "0x30"
      - series: 'openviking_queue_processed_total{queue="total"}'
        values: "4102x30"
      - series: 'openviking_queue_pending{queue="Embedding",container="openviking"}'
        values: "600x30"
      - series: 'openviking_queue_processed_total{queue="Embedding",container="openviking"}'
        values: "3759x30"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingQueueNotDraining",alertstate="firing"}) or vector(0)
        eval_time: 25m
        exp_samples: [{ labels: "{}", value: 0 }]
      - expr: openviking_queue_pending{queue="total"}
        eval_time: 25m
        exp_samples: [{ labels: 'openviking_queue_pending{queue="total"}', value: 0 }]

  # BUG-1220: OpenVikingWedgedLockFile must name the wedged lock. Presence age
  # climbs 60s per 1m sample, so it crosses 2700 at 46m and fires at 51m.
  - name: a wedged lock fires per lock and names it
    interval: 1m
    input_series:
      - series: 'openviking_s3_ovlock_live_age_seconds{key="default/user/noot/sessions/mcp-store-e71a7b670fca/.path.ovlock",uri="viking://user/noot/sessions/mcp-store-e71a7b670fca",owner="9959d01e-e133-4e46-8074-04cc1de18b00",lock_type="E"}'
        values: "0+60x60"
      - series: 'openviking_s3_ovlock_oldest_live_age_seconds'
        values: "0+60x60"
    alert_rule_test:
      - alertname: OpenVikingWedgedLockFile
        eval_time: 50m
        exp_alerts: []
      - alertname: OpenVikingWedgedLockFile
        eval_time: 52m
        exp_alerts:
          - exp_labels:
              severity: warning
              key: default/user/noot/sessions/mcp-store-e71a7b670fca/.path.ovlock
              uri: viking://user/noot/sessions/mcp-store-e71a7b670fca
              owner: 9959d01e-e133-4e46-8074-04cc1de18b00
              lock_type: E
            exp_annotations:
              summary: "OpenViking lock viking://user/noot/sessions/mcp-store-e71a7b670fca live-refreshed for 52m 0s — wedge signature"
              description: "Lock default/user/noot/sessions/mcp-store-e71a7b670fca/.path.ovlock (owner handle 9959d01e-e133-4e46-8074-04cc1de18b00, type E) has been lease-refreshed continuously for 52m 0s: a wedged server-side task, not normal work. NEVER delete this lock file: its holder still believes it owns it. Recovery is an OV restart (deploy/openviking -n viking, after the queue drains). The ov-lock-watchdog CronJob does it on its own once the owner has held the lock 3 h with a quiet queue, or 6 h (BUG-1282); otherwise an operator does it. The in-Job heal is off since BUG-1181. Find the holder with Loki {namespace=\"viking\", container=\"openviking\"} |= \"9959d01e-e133-4e46-8074-04cc1de18b00\" (v0.5.1.1 logs the ragfs lease lines at debug, so this may find nothing; GET /locks on port 9210 of the openviking Service lists every live lock, BUG-1282). The janitor reports these as WEDGED and never deletes them (IMPR-1095, BUG-1220)."

  - name: the unlabelled gauge alone still fires, with placeholders
    # An exporter without the labelled series (pre-BUG-1220 sidecar, or
    # OVLOCK_LABEL_TOP_N=0) must not leave the wedge unalerted.
    interval: 1m
    input_series:
      - series: 'openviking_s3_ovlock_oldest_live_age_seconds{pod="openviking-x"}'
        values: "0+60x60"
    alert_rule_test:
      - alertname: OpenVikingWedgedLockFile
        eval_time: 52m
        exp_alerts:
          - exp_labels:
              severity: warning
              pod: openviking-x
            exp_annotations:
              summary: "OpenViking lock (path not exported) live-refreshed for 52m 0s — wedge signature"
              description: "Lock (key not exported: read the latest ovlock-janitor run log) (owner handle unknown, type unknown) has been lease-refreshed continuously for 52m 0s: a wedged server-side task, not normal work. NEVER delete this lock file: its holder still believes it owns it. Recovery is an OV restart (deploy/openviking -n viking, after the queue drains). The ov-lock-watchdog CronJob does it on its own once the owner has held the lock 3 h with a quiet queue, or 6 h (BUG-1282); otherwise an operator does it. The in-Job heal is off since BUG-1181. Find the holder with Loki {namespace=\"viking\", container=\"openviking\"} |= \"<owner>\" (v0.5.1.1 logs the ragfs lease lines at debug, so this may find nothing; GET /locks on port 9210 of the openviking Service lists every live lock, BUG-1282). The janitor reports these as WEDGED and never deletes them (IMPR-1095, BUG-1220)."

  - name: two wedged locks are two instances, and the fallback stays quiet
    interval: 1m
    input_series:
      - series: 'openviking_s3_ovlock_live_age_seconds{key="default/resources/a/.path.ovlock",uri="viking://resources/a",owner="h-a",lock_type="T"}'
        values: "0+60x60"
      - series: 'openviking_s3_ovlock_live_age_seconds{key="default/resources/b/.path.ovlock",uri="viking://resources/b",owner="h-b",lock_type="T"}'
        values: "0+50x60"
      - series: 'openviking_s3_ovlock_oldest_live_age_seconds'
        values: "0+60x60"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingWedgedLockFile",alertstate="firing"})
        eval_time: 60m
        exp_samples: [{ labels: "{}", value: 2 }]
      - expr: count(ALERTS{alertname="OpenVikingWedgedLockFile",alertstate="firing",key=""}) or vector(0)
        eval_time: 60m
        exp_samples: [{ labels: "{}", value: 0 }]

  # OpenVikingExporterUnscraped: OpenVikingDown cannot see a missing exporter.
  - name: a failing exporter scrape fires after 5m
    interval: 1m
    input_series:
      - series: 'up{namespace="viking", job="openviking", endpoint="metrics", pod="openviking-x"}'
        values: "1 1 0x20"
      - series: 'up{namespace="viking", job="openviking", endpoint="http", pod="openviking-x"}'
        values: "1x22"
    alert_rule_test:
      - alertname: OpenVikingExporterUnscraped
        eval_time: 6m
        exp_alerts: []
      - alertname: OpenVikingExporterUnscraped
        eval_time: 8m
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: viking
              job: openviking
              endpoint: metrics
              pod: openviking-x
            exp_annotations:
              summary: "ov-exporter (port 9210) not scraped for 5m"
              description: "Prometheus cannot scrape the ov-exporter sidecar, or the target is gone, so every openviking_* exporter series is missing and OpenVikingDown and the lock and queue rules above cannot fire. Check the pod (`kubectl -n viking get pods -l app=openviking`) and the ov-exporter container log; a failing scrape with a running container points at the exposition (`curl <pod-ip>:9210/metrics | promtool check metrics`)."

  - name: a vanished exporter target fires through absent()
    interval: 1m
    input_series:
      - series: 'up{namespace="viking", job="openviking", endpoint="http", pod="openviking-x"}'
        values: "1x20"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingExporterUnscraped",alertstate="firing"})
        eval_time: 8m
        exp_samples: [{ labels: "{}", value: 1 }]

  - name: a healthy exporter scrape stays quiet
    interval: 1m
    input_series:
      - series: 'up{namespace="viking", job="openviking", endpoint="metrics", pod="openviking-x"}'
        values: "1x20"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingExporterUnscraped"}) or vector(0)
        eval_time: 15m
        exp_samples: [{ labels: "{}", value: 0 }]

  # Client delivery alerts read the shipper's since-last-delivery gauges
  # (dotfiles bin/ov-telemetry-push.py folds them from the hook logs; which
  # runs count, and what a skip, failure or delivery does, is tested there).
  # Each openviking restart starts new series under a new pod label, and a
  # dead pod's last value is held by last_over_time for 10m.
  - name: recalls with no counted delivery fire at 11, not at 10
    interval: 1m
    input_series:
      - series: 'openviking_client_recalls_since_delivery{machine="pop", harness="codex", pod="openviking-a"}'
        values: "0+1x11 11x60"
      - series: 'openviking_client_recalls_since_delivery{machine="workbook", harness="codex", pod="openviking-a"}'
        values: "0+1x10 10x60"
    alert_rule_test:
      - alertname: OpenVikingClientRecallDeliveryFlat
        eval_time: 50m
        exp_alerts:
          - exp_labels:
              severity: warning
              machine: pop
              harness: codex
            exp_annotations:
              summary: "pop/codex: 11 recalls in a row delivered no counted memory"
              description: "11 auto-recall runs from pop (codex) neither skipped, failed nor delivered tokens and entries since the last one that did. The likely cause is a memory-plugin update renaming the hook-log stage ov-telemetry-push.py counts (DELIVERY_EVENTS in dotfiles bin/ov-telemetry-push.py). Compare the stages in ~/.openviking/logs/*-hooks.log on that Mac with the table and update it."

  - name: session starts with no injection fire at 6, not at 5
    interval: 1m
    input_series:
      - series: 'openviking_client_session_start_runs_since_inject{machine="pop", harness="claude-code", pod="openviking-a"}'
        values: "0+1x6 6x60"
      - series: 'openviking_client_session_start_runs_since_inject{machine="workbook", harness="claude-code", pod="openviking-a"}'
        values: "0+1x5 5x60"
    alert_rule_test:
      - alertname: OpenVikingClientSessionStartFlat
        eval_time: 50m
        exp_alerts:
          - exp_labels:
              severity: warning
              machine: pop
              harness: claude-code
            exp_annotations:
              summary: "pop/claude-code: 6 session starts since the last counted injection"
              description: "The session-start hook ran 6 times on pop (claude-code) since the last session-start memory injection it counted. Either injection is off, or a memory-plugin update renamed the session-start stage ov-telemetry-push.py counts (DELIVERY_EVENTS in dotfiles bin/ov-telemetry-push.py). Check that Mac's ~/.openviking/logs/*-hooks.log."

  - name: a delivery resets the count before the alert fires
    interval: 1m
    input_series:
      - series: 'openviking_client_session_start_runs_since_inject{machine="pop", harness="claude-code", pod="openviking-a"}'
        values: "6x20 0x40"
      - series: 'openviking_client_recalls_since_delivery{machine="pop", harness="claude-code", pod="openviking-a"}'
        values: "11x20 0x40"
    promql_expr_test:
      - expr: count(ALERTS{alertname=~"OpenVikingClient(SessionStart|RecallDelivery)Flat"}) or vector(0)
        eval_time: 45m
        exp_samples: [{ labels: "{}", value: 0 }]

  # The 2026-11-08/09 false positive: counters on three pods, one of which
  # lived for one push and stayed flat. The counters no longer drive these
  # alerts, and a shipper that sends no gauges (one that predates them)
  # leaves no series to alert on.
  - name: counters alone across a pod restart never fire
    interval: 30m
    input_series:
      - series: 'openviking_client_session_start_runs_total{machine="pop", harness="claude-code", pod="openviking-a"}'
        values: "100+1x30 _x30"
      - series: 'openviking_client_session_start_injects_total{machine="pop", harness="claude-code", pod="openviking-a"}'
        values: "90x30 _x30"
      - series: 'openviking_client_session_start_injects_total{machine="pop", harness="claude-code", pod="openviking-b"}'
        values: "_x31 90x2 _x27"
      - series: 'openviking_client_recalls_total{machine="pop", harness="claude-code", pod="openviking-a"}'
        values: "0+10x60"
      - series: 'openviking_client_recall_tokens_total{machine="pop", harness="claude-code", pod="openviking-a"}'
        values: "500x60"
    promql_expr_test:
      - expr: count(ALERTS{alertname=~"OpenVikingClient(SessionStart|RecallDelivery)Flat"}) or vector(0)
        eval_time: 26h
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: a dead pod's held count after a delivery on the new pod stays quiet
    # Pod a reported 7 and stopped at 4.5m; pod b reports 0 from 5m. The
    # max holds 7 until a's last sample is 10m old, short of for: 30m.
    interval: 30s
    input_series:
      - series: 'openviking_client_session_start_runs_since_inject{machine="pop", harness="claude-code", pod="openviking-a"}'
        values: "7x9 _x110"
      - series: 'openviking_client_session_start_runs_since_inject{machine="pop", harness="claude-code", pod="openviking-b"}'
        values: "_x10 0x109"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingClientSessionStartFlat"}) or vector(0)
        eval_time: 59m
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: a count that carries across a pod restart still fires, once
    # The alert carries only machine and harness, so the restart neither
    # resets for: 30m nor opens a second alert.
    interval: 30s
    input_series:
      - series: 'openviking_client_session_start_runs_since_inject{machine="pop", harness="claude-code", pod="openviking-a"}'
        values: "7x39 _x80"
      - series: 'openviking_client_session_start_runs_since_inject{machine="pop", harness="claude-code", pod="openviking-b"}'
        values: "_x40 8x79"
    promql_expr_test:
      - expr: count by (machine) (ALERTS{alertname="OpenVikingClientSessionStartFlat",alertstate="firing"})
        eval_time: 35m
        exp_samples: [{ labels: '{machine="pop"}', value: 1 }]

  - name: a long but sub-threshold lock never fires
    interval: 1m
    input_series:
      - series: 'openviking_s3_ovlock_live_age_seconds{key="default/resources/a/.path.ovlock",uri="viking://resources/a",owner="h-a",lock_type="T"}'
        values: "900+30x60"
      - series: 'openviking_s3_ovlock_oldest_live_age_seconds'
        values: "900+30x60"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingWedgedLockFile"}) or vector(0)
        eval_time: 60m
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: a held lock the exporter never lists fires at 30m, not before
    # BUG-1282: the listing is the only evidence the wedge readers have.
    interval: 1m
    input_series:
      - series: 'openviking_lock_active{pod="openviking-a"}'
        values: "2x60"
      - series: "openviking_s3_ovlock_live_refreshing"
        values: "0x60"
      - series: "openviking_s3_ovlock_poll_ok"
        values: "1x60"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingLockListingBlind",alertstate="firing"}) or vector(0)
        eval_time: 29m
        exp_samples: [{ labels: "{}", value: 0 }]
      - expr: count(ALERTS{alertname="OpenVikingLockListingBlind",alertstate="firing"}) or vector(0)
        eval_time: 31m
        exp_samples: [{ labels: "{}", value: 1 }]

  - name: one listed lock restarts the blind clock
    interval: 1m
    input_series:
      - series: 'openviking_lock_active{pod="openviking-a"}'
        values: "1x60"
      - series: "openviking_s3_ovlock_live_refreshing"
        values: "0x25 1 0x34"
      - series: "openviking_s3_ovlock_poll_ok"
        values: "1x60"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingLockListingBlind"}) or vector(0)
        eval_time: 26m
        exp_samples: [{ labels: "{}", value: 0 }]
      - expr: count(ALERTS{alertname="OpenVikingLockListingBlind",alertstate="firing"}) or vector(0)
        eval_time: 55m
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: a failing lock poll leaves the alert to OpenVikingS3LockPollFailing
    interval: 1m
    input_series:
      - series: 'openviking_lock_active{pod="openviking-a"}'
        values: "1x60"
      - series: "openviking_s3_ovlock_live_refreshing"
        values: "0x60"
      - series: "openviking_s3_ovlock_poll_ok"
        values: "0x60"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingLockListingBlind"}) or vector(0)
        eval_time: 60m
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: no held lock never fires
    interval: 1m
    input_series:
      - series: 'openviking_lock_active{pod="openviking-a"}'
        values: "0x60"
      - series: "openviking_s3_ovlock_live_refreshing"
        values: "0x60"
      - series: "openviking_s3_ovlock_poll_ok"
        values: "1x60"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingLockListingBlind"}) or vector(0)
        eval_time: 60m
        exp_samples: [{ labels: "{}", value: 0 }]

  # BUG-1282: a failed watchdog run must stay reported after a later run
  # succeeds (KubeJobFailed does not), as one alert for the CronJob.
  - name: failed watchdog runs fire once, and a later success does not clear it
    interval: 1m
    input_series:
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="viking",job_name="ov-lock-watchdog-29001",condition="true"}'
        values: "1x60"
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="viking",job_name="ov-lock-watchdog-29001",owner_kind="CronJob",owner_name="ov-lock-watchdog",owner_is_controller="true"}'
        values: "1x60"
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="viking",job_name="ov-lock-watchdog-29016",condition="true"}'
        values: "1x60"
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="viking",job_name="ov-lock-watchdog-29016",owner_kind="CronJob",owner_name="ov-lock-watchdog",owner_is_controller="true"}'
        values: "1x60"
      # A later successful run: kube-state-metrics emits no Failed condition.
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="viking",job_name="ov-lock-watchdog-29031",owner_kind="CronJob",owner_name="ov-lock-watchdog",owner_is_controller="true"}'
        values: "_x15 1x45"
      # Another CronJob's failure in the same namespace is not this alert's.
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="viking",job_name="ovlock-janitor-29001",condition="true"}'
        values: "1x60"
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="viking",job_name="ovlock-janitor-29001",owner_kind="CronJob",owner_name="ovlock-janitor",owner_is_controller="true"}'
        values: "1x60"
    alert_rule_test:
      - alertname: OpenVikingLockWatchdogRunFailed
        eval_time: 0m
        exp_alerts: []
      - alertname: OpenVikingLockWatchdogRunFailed
        eval_time: 30m
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: viking
              owner_name: ov-lock-watchdog
            exp_annotations:
              summary: "2 failed ov-lock-watchdog run(s) in viking — an automatic OpenViking restart may have failed"
              description: "A run of the ov-lock-watchdog CronJob failed: exit 1 means a restart of deploy/openviking was attempted and failed (or an unexpected error), exit 2 means the Kubernetes API refused its ServiceAccount or its config is bad. A wedged lock may still be held. Read the run with kubectl -n viking get jobs | grep ov-lock-watchdog, then kubectl -n viking logs job/<name>, or Loki {namespace=\"viking\"} |= \"ov-lock-watchdog: restart FAILED\". If a lock is still wedged, restart deploy/openviking by hand after the queue drains. This clears when the failed Jobs are gone (48 h TTL, newest 5 kept), not when a later run succeeds (BUG-1282)."

  - name: a hand-copied probe Job with no CronJob owner does not fire it
    # ov-exporter-sidecar-patch.yaml's probe copies the CronJob's Job by hand,
    # so kube-state-metrics reports no owner for it.
    interval: 1m
    input_series:
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="viking",job_name="ov-lock-watchdog-probe",condition="true"}'
        values: "1x30"
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="viking",job_name="ov-lock-watchdog-probe",owner_kind="<none>",owner_name="<none>",owner_is_controller="<none>"}'
        values: "1x30"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingLockWatchdogRunFailed"}) or vector(0)
        eval_time: 20m
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: the alert clears when the failed watchdog Job is deleted
    interval: 1m
    input_series:
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="viking",job_name="ov-lock-watchdog-29001",condition="true"}'
        values: "1x10 stale"
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="viking",job_name="ov-lock-watchdog-29001",owner_kind="CronJob",owner_name="ov-lock-watchdog",owner_is_controller="true"}'
        values: "1x10 stale"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingLockWatchdogRunFailed", alertstate="firing"}) or vector(0)
        eval_time: 5m
        exp_samples: [{ labels: "{}", value: 1 }]
      - expr: count(ALERTS{alertname="OpenVikingLockWatchdogRunFailed"}) or vector(0)
        eval_time: 20m
        exp_samples: [{ labels: "{}", value: 0 }]

  # BUG-1282: openviking_lock_stale is ragfs's per-process count of lock tokens
  # an acquire replaced because their timestamp was older than the lock expiry,
  # exported as a gauge. A nonzero count that stays flat is no new replacement;
  # the rule alerts only on a burst. Its value is a lower bound on the
  # replacements in the last hour: never more than happened, and sometimes fewer
  # (the rule's comment gives examples). The regex matches the retired `> 0`
  # rule too, so the first case fails against it.
  - name: a pod holding a nonzero takeover count never fires
    # The 2026-11-06 live pod: 3 replacements at 06:02Z with one stale_owner
    # (session cc-52915218-...), 2 more about 4 h later, then flat. The retired
    # rule fired from the first.
    interval: 1m
    input_series:
      - series: 'openviking_lock_stale{pod="openviking-a"}'
        values: "0 0 3x239 5x240"
    promql_expr_test:
      - expr: count(ALERTS{alertname=~"OpenVikingStaleLock.*"}) or vector(0)
        eval_time: 30m
        exp_samples: [{ labels: "{}", value: 0 }]
      - expr: count(ALERTS{alertname=~"OpenVikingStaleLock.*"}) or vector(0)
        eval_time: 7h
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: the 30-day sampled peak of takeovers does not fire
    # The highest value of the rule's expression sampled every 5 min from
    # 2026-10-07 to 2026-11-06 was 10.
    interval: 1m
    input_series:
      - series: 'openviking_lock_stale{pod="openviking-a"}'
        values: "0x5 2 2 4 4 6 6 8 8 10x60"
    promql_expr_test:
      - expr: count(ALERTS{alertname=~"OpenVikingStaleLock.*"}) or vector(0)
        eval_time: 30m
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: a burst of takeovers fires at warning and clears after the hour
    # warning, not info: the Alertmanager route drops info, and a burst should reach Slack.
    interval: 1m
    input_series:
      - series: 'openviking_lock_stale{pod="openviking-a"}'
        values: "0x5 10 20 30x90"
    promql_expr_test:
      - expr: count(ALERTS{alertname="OpenVikingStaleLockTakeoverBurst", alertstate="firing", severity="warning"})
        eval_time: 10m
        exp_samples: [{ labels: "{}", value: 1 }]
      - expr: count(ALERTS{alertname="OpenVikingStaleLockTakeoverBurst"}) or vector(0)
        eval_time: 80m
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: exactly 20 takeovers on a nonzero baseline does not fire, 21 does
    # Round 1 of homelab#317: increase() read this as 20.17 and fired.
    interval: 30s
    input_series:
      - series: 'openviking_lock_stale{pod="openviking-a"}'
        values: "100x119 120x120"
      - series: 'openviking_lock_stale{pod="openviking-b"}'
        values: "100x119 121x120"
    promql_expr_test:
      - expr: count by (pod) (ALERTS{alertname="OpenVikingStaleLockTakeoverBurst", alertstate="firing"})
        eval_time: 65m
        exp_samples: [{ labels: '{pod="openviking-b"}', value: 1 }]

  - name: sparse samples count only the takeovers observed
    # Round 1 of homelab#317: increase() extrapolated 10 observed takeovers to 25.
    interval: 30s
    input_series:
      - series: 'openviking_lock_stale{pod="openviking-a"}'
        values: "100 110 _ _ 110 _x20"
    promql_expr_test:
      - expr: count(ALERTS{alertname=~"OpenVikingStaleLock.*"}) or vector(0)
        eval_time: 1m
        exp_samples: [{ labels: "{}", value: 0 }]
      - expr: count(ALERTS{alertname=~"OpenVikingStaleLock.*"}) or vector(0)
        eval_time: 5m
        exp_samples: [{ labels: "{}", value: 0 }]

  - name: a container restart whose low point was scraped counts the new takeovers
    # The series keeps its pod label, falls to 0 and climbs again.
    interval: 1m
    input_series:
      - series: 'openviking_lock_stale{pod="openviking-a"}'
        values: "30x20 0 0 3x30"
    promql_expr_test:
      - expr: count(ALERTS{alertname=~"OpenVikingStaleLock.*"}) or vector(0)
        eval_time: 40m
        exp_samples: [{ labels: "{}", value: 0 }]
      - expr: openviking_lock_stale - min_over_time(openviking_lock_stale[1h])
        eval_time: 40m
        exp_samples: [{ labels: '{pod="openviking-a"}', value: 3 }]

  # Rounds 2 and 3 of homelab#317: cases where the value counts fewer
  # replacements than happened, pinned so the rule's comment stays true. None of
  # them counts more.
  - name: a container restart whose low point went unscraped undercounts
    # 30 replacements after the restart, but the first sample after it reads 10.
    interval: 1m
    input_series:
      - series: 'openviking_lock_stale{pod="openviking-a"}'
        values: "100 10 30x10"
    promql_expr_test:
      - expr: openviking_lock_stale - min_over_time(openviking_lock_stale[1h])
        eval_time: 5m
        exp_samples: [{ labels: '{pod="openviking-a"}', value: 20 }]

  - name: a fully scraped container restart drops the replacements before it
    # 30 replacements, a restart scraped at 0, then 3 more: 33 happened, value 3.
    interval: 1m
    input_series:
      - series: 'openviking_lock_stale{pod="openviking-a"}'
        values: "0 30 0 3x5"
    promql_expr_test:
      - expr: openviking_lock_stale - min_over_time(openviking_lock_stale[1h])
        eval_time: 3m
        exp_samples: [{ labels: '{pod="openviking-a"}', value: 3 }]

  - name: the summary prints the exact count, not a rounded-up one
    # Round 3 of homelab#317: humanize rendered 12345 as "at least 12.35k".
    interval: 1m
    input_series:
      - series: 'openviking_lock_stale{pod="openviking-a"}'
        values: "0 12345x5"
    alert_rule_test:
      - alertname: OpenVikingStaleLockTakeoverBurst
        eval_time: 2m
        exp_alerts:
          - exp_labels:
              pod: openviking-a
              severity: warning
            exp_annotations:
              summary: "OpenViking replaced at least 12345 expired lock tokens in the last hour"
              description: "Each replacement is an acquire taking over a lock token whose timestamp was older than the lock expiry, logged as `replaced stale pathlock token during acquire` with its stale_owner. The count is of tokens, not owners: one owner can leave several (a path lock and per-file locks). The stale_owner values in the openviking container's log name the owners to look into. This is not a held lock, and a restart does not address it."

  - name: a rise whose earlier sample aged out of the window is not counted
    # A scrape gap of nearly an hour: the rise of 21 lands at 59m (sample 118 at
    # 30s), and at the 60m evaluation the 100 sample at 0s is outside the 1h
    # window, which is left-open (t-1h, t] since Prometheus 3.
    interval: 30s
    input_series:
      - series: 'openviking_lock_stale{pod="openviking-a"}'
        values: "100 _x117 121x120"
    promql_expr_test:
      - expr: openviking_lock_stale - min_over_time(openviking_lock_stale[1h])
        eval_time: 60m
        exp_samples: [{ labels: '{pod="openviking-a"}', value: 0 }]

  - name: a restart does not count the old pod's total as new takeovers
    # The old pod's series ends at 9; the new pod's starts again from 0.
    interval: 1m
    input_series:
      - series: 'openviking_lock_stale{pod="openviking-a"}'
        values: "9x30 stale"
      - series: 'openviking_lock_stale{pod="openviking-b"}'
        values: "_x31 0 0 3x60"
    promql_expr_test:
      - expr: count(ALERTS{alertname=~"OpenVikingStaleLock.*"}) or vector(0)
        eval_time: 45m
        exp_samples: [{ labels: "{}", value: 0 }]
