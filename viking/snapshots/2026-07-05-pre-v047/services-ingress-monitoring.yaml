- apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"monitoring.coreos.com/v1","kind":"PrometheusRule","metadata":{"annotations":{},"labels":{"app":"openviking"},"name":"openviking-alerts","namespace":"viking"},"spec":{"groups":[{"name":"openviking.rules","rules":[{"alert":"OpenVikingDown","annotations":{"description":"ov-exporter's last poll cycle failed (ov status or lock count). OV may be down or the exporter lost its API key.","summary":"OpenViking exporter reports OV unreachable for 5m"},"expr":"openviking_up == 0","for":"5m","labels":{"severity":"warning"}},{"alert":"OpenVikingLocksAccumulating","annotations":{"description":"Stale subtree lifecycle locks are accumulating in AGFS. GH #2015 was fixed in v0.4.4 and the lock-cleanup sidecar removed (IMPR-1007 Phase 3) — accumulation now signals a regression or crashed writes; clean up manually with: find /app/data/viking -name '.path.ovlock' -delete","summary":"OpenViking has \u003e20 stale .path.ovlock files for 5m"},"expr":"openviking_lock_path_ovlock_count \u003e 20","for":"5m","labels":{"severity":"warning"}},{"alert":"OpenVikingQueueNotDraining","annotations":{"description":"Queue depth is above 5 and has not fallen in 15m — indexing is stalled (VLM saturation or lock contention).","summary":"OpenViking total queue pending not decreasing over 15m"},"expr":"openviking_queue_pending{queue=\"total\"} \u003e 5 and delta(openviking_queue_pending{queue=\"total\"}[15m]) \u003e= 0","for":"15m","labels":{"severity":"warning"}}]}]}}
      prometheus-operator-validated: "true"
    creationTimestamp: "2026-06-22T01:42:44Z"
    generation: 2
    labels:
      app: openviking
    name: openviking-alerts
    namespace: viking
    resourceVersion: "48738457"
    uid: b543f412-7454-459d-a7bb-4c0d25c2c842
  spec:
    groups:
    - name: openviking.rules
      rules:
      - alert: OpenVikingDown
        annotations:
          description: ov-exporter's last poll cycle failed (ov status or lock count).
            OV may be down or the exporter lost its API key.
          summary: OpenViking exporter reports OV unreachable for 5m
        expr: openviking_up == 0
        for: 5m
        labels:
          severity: warning
      - alert: OpenVikingLocksAccumulating
        annotations:
          description: 'Stale subtree lifecycle locks are accumulating in AGFS. GH
            #2015 was fixed in v0.4.4 and the lock-cleanup sidecar removed (IMPR-1007
            Phase 3) — accumulation now signals a regression or crashed writes; clean
            up manually with: find /app/data/viking -name ''.path.ovlock'' -delete'
          summary: OpenViking has >20 stale .path.ovlock files for 5m
        expr: openviking_lock_path_ovlock_count > 20
        for: 5m
        labels:
          severity: warning
      - alert: OpenVikingQueueNotDraining
        annotations:
          description: Queue depth is above 5 and has not fallen in 15m — indexing
            is stalled (VLM saturation or lock contention).
          summary: OpenViking total queue pending not decreasing over 15m
        expr: openviking_queue_pending{queue="total"} > 5 and delta(openviking_queue_pending{queue="total"}[15m])
          >= 0
        for: 15m
        labels:
          severity: warning
