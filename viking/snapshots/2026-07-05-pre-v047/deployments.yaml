    creationTimestamp: "2026-05-10T05:55:16Z"
    generation: 86
    labels:
      app: openviking
    name: openviking
    namespace: viking
    resourceVersion: "48738622"
    uid: 53d98083-f7f0-495c-9ccc-bcbe94e1667c
  spec:
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 1
    selector:
      matchLabels:
        app: openviking
    strategy:
      type: Recreate
    template:
      metadata:
        annotations:
          kubectl.kubernetes.io/restartedAt: "2026-06-28T16:39:10-05:00"
        labels:
          app: openviking
      spec:
        containers:
        - env:
          - name: PYTHONPATH
            value: /ov-patch
          - name: VLM_MAX_CONCURRENT
            value: "8"
          - name: EMBEDDING_MAX_CONCURRENT
            value: "8"
          image: ghcr.io/volcengine/openviking:v0.4.4
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                - /bin/sh
                - -c
                - sleep 5
          livenessProbe:
            failureThreshold: 10
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            tcpSocket:
              port: 1933
            timeoutSeconds: 5
          name: openviking
          ports:
          - containerPort: 1933
            name: http
            protocol: TCP
          readinessProbe:
            failureThreshold: 10
            httpGet:
              path: /ready
              port: 1933
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          resources:
            limits:
              cpu: "12"
              memory: 8Gi
            requests:
              cpu: "4"
              memory: 4Gi
          startupProbe:
            failureThreshold: 10
            httpGet:
              path: /health
              port: 1933
              scheme: HTTP
            periodSeconds: 3
            successThreshold: 1
            timeoutSeconds: 30
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /app/.openviking/ov.conf
            name: config-out
            readOnly: true
            subPath: ov.conf
          - mountPath: /ov-patch
            name: ov-patch
          - mountPath: /app/data
            name: data
        - command:
          - /bin/sh
          - -c
          - |
            set -eu
            mkdir -p /tmp/ov
            cat >/tmp/ov/ovcli.conf <<EOF
            {"url": "${OPENVIKING_URL}", "api_key": "${OPENVIKING_KEY}", "account": "default", "user": "noot"}
            EOF
            export OPENVIKING_CLI_CONFIG_FILE=/tmp/ov/ovcli.conf
            ov language en >/dev/null 2>&1 || true
            exec python3 /scripts/ov-exporter.py
          env:
          - name: OPENVIKING_URL
            value: http://localhost:1933
          - name: OPENVIKING_KEY
            valueFrom:
              secretKeyRef:
                key: user-api-key
                name: openviking-api-key
          - name: AGFS_PATH
            value: /app/data/viking
          - name: POLL_INTERVAL
            value: "15"
          - name: PORT
            value: "9210"
          image: ghcr.io/volcengine/openviking:v0.4.4
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 9210
              scheme: HTTP
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
          name: ov-exporter
          ports:
          - containerPort: 9210
            name: metrics
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /metrics
              port: 9210
              scheme: HTTP
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: 9210
              scheme: HTTP
            periodSeconds: 3
            successThreshold: 1
            timeoutSeconds: 1
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /scripts
            name: exporter-script
            readOnly: true
          - mountPath: /app/data
            name: data
            readOnly: true
        dnsPolicy: ClusterFirst
        initContainers:
        - args:
          - |
            python3 -c "
            import json, os
            conf = json.load(open('/config-template/ov.conf'))
            conf['server']['root_api_key'] = os.environ['API_KEY']
            agfs = conf.get('storage', {}).get('agfs', {})
            if agfs.get('backend', 'local') == 's3':
                agfs.setdefault('s3', {})
                agfs['s3']['access_key'] = os.environ['S3_ACCESS_KEY']
                agfs['s3']['secret_key'] = os.environ['S3_SECRET_KEY']
            else:
                agfs.pop('s3', None)
            json.dump(conf, open('/config-out/ov.conf', 'w'), indent=2)
            "
          command:
          - /bin/sh
          - -c
          env:
          - name: API_KEY
            valueFrom:
              secretKeyRef:
                key: api-key
                name: openviking-api-key
          - name: S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                key: AWS_ACCESS_KEY_ID
                name: openviking-s3-credentials
                optional: true
          - name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                key: AWS_SECRET_ACCESS_KEY
                name: openviking-s3-credentials
                optional: true
          - name: VLM_MAX_CONCURRENT
            value: "8"
          - name: EMBEDDING_MAX_CONCURRENT
            value: "8"
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          name: config-rewrite
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /config-template
            name: config-template
          - mountPath: /config-out
            name: config-out
        - args:
          - echo "Cleaning stale temp files..."; find /app/data/temp -type f -mtime
            +1 -delete 2>/dev/null || true; find /app/data/temp -type d -empty -delete
            2>/dev/null || true; find /app/data/viking/default/temp -type d -empty
            -delete 2>/dev/null || true; echo "Removing stale locks..."; rm -f /app/data/.openviking.pid;
            rm -f /app/data/vectordb/context/store/LOCK; find /app/data/viking -name
            '.path.ovlock' -delete 2>/dev/null || true; echo "Done."
          command:
          - /bin/sh
          - -c
          env:
          - name: VLM_MAX_CONCURRENT
            value: "8"
          - name: EMBEDDING_MAX_CONCURRENT
            value: "8"
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          name: temp-cleanup
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /app/data
            name: data
        - args:
          - |
            python3 -c "
            import os, re, shutil
            src = '/app/.venv/lib/python3.13/site-packages/openviking'
            dst = '/ov-patch/openviking'
            shutil.copytree(src, dst, dirs_exist_ok=True)
            for root, dirs, files in os.walk(dst):
                for f in files:
                    if not f.endswith('.py'):
                        continue
                    path = os.path.join(root, f)
                    text = open(path, 'r', encoding='utf-8').read()
                    new_text = re.sub(r'\.role\.value\b', '.role', text)
                    # Role is a str subclass, not an enum; replace enum-style
                    # iteration over Role with the built-in role constants.
                    new_text = re.sub(
                        r'\{r\.value for r in Role\}',
                        '{Role.ROOT, Role.ADMIN, Role.USER}',
                        new_text,
                    )
                    if new_text != text:
                        open(path, 'w', encoding='utf-8').write(new_text)
                        print('patched', path)
            print('role.value patch done')
            "
          command:
          - /bin/sh
          - -c
          image: ghcr.io/volcengine/openviking:v0.4.4
          imagePullPolicy: IfNotPresent
          name: role-value-patch
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /ov-patch
            name: ov-patch
        nodeSelector:
          kubernetes.io/hostname: timmy
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        terminationGracePeriodSeconds: 15
        volumes:
        - configMap:
            defaultMode: 420
            name: openviking-standalone-config
          name: config-template
        - emptyDir: {}
          name: config-out
        - emptyDir: {}
          name: ov-patch
        - configMap:
            defaultMode: 493
            name: openviking-exporter
          name: exporter-script
        - name: data
          persistentVolumeClaim:
            claimName: openviking-data
