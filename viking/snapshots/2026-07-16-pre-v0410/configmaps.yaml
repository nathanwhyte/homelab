apiVersion: v1
items:
- apiVersion: v1
  data:
    ov.conf: |
      {
        "default_account": "default",
        "default_user": "noot",
        "storage": {
          "workspace": "/app/data",
          "transaction": {
            "lock_timeout": 30.0,
            "lock_expire": 60.0
          },
          "vectordb": {
            "backend": "http",
            "name": "context",
            "dimension": 2560,
            "url": "http://ov-vectordb.viking.svc.cluster.local:5000"
          },
          "agfs": {
            "backend": "s3",
            "s3": {
              "bucket": "openviking-agfs",
              "endpoint": "http://garage.garage.svc.cluster.local:3900",
              "region": "garage",
              "access_key": "${S3_ACCESS_KEY}",
              "secret_key": "${S3_SECRET_KEY}",
              "use_path_style": true
            }
          }
        },
        "git": {
          "enabled": false
        },
        "code": {
          "code_summary_mode": "ast"
        },
        "rerank": {
          "threshold": 0.2
        },
        "server": {
          "host": "0.0.0.0",
          "port": 1933,
          "workers": 2,
          "root_api_key": "${API_KEY}",
          "auth_mode": "trusted",
          "public_base_url": "https://context.nathanwhyte.dev",
          "temp_upload": {
            "default_mode": "local"
          },
          "observability": {
            "metrics": {
              "enabled": true,
              "exporters": {
                "prometheus": {
                  "enabled": true
                }
              }
            }
          }
        },
        "log": {
          "level": "INFO",
          "output": "stdout"
        },
        "embedding": {
          "max_input_tokens": 8192,
          "dense": {
            "provider": "openai",
            "model": "qwen3-embedding-4b",
            "api_key": "sk-no-...ired",
            "api_base": "http://embedder-qwen.viking.svc.cluster.local:8080/v1",
            "dimension": 2560,
            "batch_size": 256
          },
          "max_concurrent": 6
        },
        "vlm": {
          "provider": "openai",
          "model": "gemma4:31b-cloud",
          "api_key": "${OLLAMA_KEY}",
          "api_base": "http://chat-ollama.llama.svc.cluster.local:11434/v1",
          "max_concurrent": 8,
          "timeout": 120,
          "backup": {
            "provider": "litellm",
            "model": "openai/current.gguf",
            "api_key": "sk-no-...ired",
            "api_base": "http://llamacpp-vlm.viking.svc/v1",
            "max_concurrent": 3,
            "timeout": 600
          }
        }
      }
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
