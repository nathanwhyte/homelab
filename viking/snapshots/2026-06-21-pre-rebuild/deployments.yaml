    creationTimestamp: "2026-05-10T05:55:16Z"
    generation: 66
    labels:
      app: openviking
    name: openviking
    namespace: viking
    resourceVersion: "45122550"
    uid: 53d98083-f7f0-495c-9ccc-bcbe94e1667c
  spec:
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 1
    selector:
      matchLabels:
        app: openviking
    strategy:
      type: Recreate
    template:
      metadata:
        annotations:
          kubectl.kubernetes.io/restartedAt: "2026-06-21T17:41:08-04:00"
        labels:
          app: openviking
      spec:
        containers:
        - env:
          - name: VLM_MAX_CONCURRENT
            value: "8"
          - name: EMBEDDING_MAX_CONCURRENT
            value: "8"
          image: ghcr.io/volcengine/openviking:v0.3.14
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                - /bin/sh
                - -c
                - sleep 5
          livenessProbe:
            failureThreshold: 10
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            tcpSocket:
              port: 1933
            timeoutSeconds: 5
          name: openviking
          ports:
          - containerPort: 1933
            name: http
            protocol: TCP
          readinessProbe:
            failureThreshold: 10
            httpGet:
              path: /ready
              port: 1933
              scheme: HTTP
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 30
          resources:
            limits:
              cpu: "12"
              memory: 8Gi
            requests:
              cpu: "4"
              memory: 4Gi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: 1933
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 30
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /app/.openviking/ov.conf
            name: config-out
            readOnly: true
            subPath: ov.conf
          - mountPath: /app/data
            name: data
        - args:
          - |-
            while true; do
              find /app/data/viking -name '.path.ovlock' -delete 2>/dev/null || true;
              find /app/data/viking/default/temp -type d -empty -delete 2>/dev/null || true;
              sleep 30;
            done
          command:
          - /bin/sh
          - -c
          env:
          - name: VLM_MAX_CONCURRENT
            value: "8"
          - name: EMBEDDING_MAX_CONCURRENT
            value: "8"
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          name: lock-cleanup
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /app/data
            name: data
        dnsPolicy: ClusterFirst
        initContainers:
        - args:
          - |
            python3 -c "
            import json, os
            conf = json.load(open('/config-template/ov.conf'))
            conf['server']['root_api_key'] = os.environ['API_KEY']
            agfs = conf.get('storage', {}).get('agfs', {})
            if agfs.get('backend', 'local') == 's3':
                agfs.setdefault('s3', {})
                agfs['s3']['access_key'] = os.environ['S3_ACCESS_KEY']
                agfs['s3']['secret_key'] = os.environ['S3_SECRET_KEY']
            else:
                agfs.pop('s3', None)
            json.dump(conf, open('/config-out/ov.conf', 'w'), indent=2)
            "
          command:
          - /bin/sh
          - -c
          env:
          - name: API_KEY
            valueFrom:
              secretKeyRef:
                key: api-key
                name: openviking-api-key
          - name: S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                key: AWS_ACCESS_KEY_ID
                name: openviking-s3-credentials
                optional: true
          - name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                key: AWS_SECRET_ACCESS_KEY
                name: openviking-s3-credentials
                optional: true
          - name: VLM_MAX_CONCURRENT
            value: "8"
          - name: EMBEDDING_MAX_CONCURRENT
            value: "8"
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          name: config-rewrite
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /config-template
            name: config-template
          - mountPath: /config-out
            name: config-out
        - args:
          - echo "Cleaning stale temp files..."; find /app/data/temp -type f -mtime
            +1 -delete 2>/dev/null || true; find /app/data/temp -type d -empty -delete
            2>/dev/null || true; find /app/data/viking/default/temp -type d -empty
            -delete 2>/dev/null || true; echo "Removing stale locks..."; rm -f /app/data/.openviking.pid;
            rm -f /app/data/vectordb/context/store/LOCK; find /app/data/viking -name
            '.path.ovlock' -delete 2>/dev/null || true; echo "Done."
          command:
          - /bin/sh
          - -c
          env:
          - name: VLM_MAX_CONCURRENT
            value: "8"
          - name: EMBEDDING_MAX_CONCURRENT
            value: "8"
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          name: temp-cleanup
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /app/data
            name: data
        - args:
          - |
            echo "Patching semantic_processor.py with SyncDiff retry logic..."
            python3 << 'PATCH_EOF'
            import re
            path = "/app/.venv/lib/python3.13/site-packages/openviking/storage/queuefs/semantic_processor.py"
            with open(path) as f:
                content = f.read()
            # Match the try/except block around _mv_vector_store_l0_l1 using regex
            # to handle the backslash-continued f-string and variable formatting
            pattern = re.compile(
                r'[ \t]+try:\s+'
                r'await\s+viking_fs\._mv_vector_store_l0_l1\(\s+'
                r'root_dir,\s+target_dir,\s+ctx=ctx,\s+lock_handle=lock_handle,\s+\)\s+'
                r'except\s+Exception\s+as\s+e:\s+'
                r'logger\.error\([\s\S]+?Failed to move L0/L1[\s\S]+?\)',
                re.DOTALL
            )
            replacement = (
                '            import asyncio as _asyncio\n'
                '            max_retries = 3\n'
                '            for attempt in range(max_retries + 1):\n'
                '                try:\n'
                '                    await viking_fs._mv_vector_store_l0_l1(\n'
                '                        root_dir,\n'
                '                        target_dir,\n'
                '                        ctx=ctx,\n'
                '                        lock_handle=lock_handle,\n'
                '                    )\n'
                '                    break\n'
                '                except Exception as e:\n'
                '                    if attempt < max_retries:\n'
                '                        delay = 2 ** attempt\n'
                '                        logger.warning(\n'
                '                            f"[SyncDiff] Retry {attempt+1}/{max_retries} "\n'
                '                            f"L0/L1 move after lock contention ({delay}s): {root_dir}"\n'
                '                        )\n'
                '                        await _asyncio.sleep(delay)\n'
                '                    else:\n'
                '                        logger.error(\n'
                '                            f"[SyncDiff] Failed to move L0/L1 index after "\n'
                '                            f"{max_retries+1} attempts: {root_dir} -> {target_dir}, error={e}"\n'
                '                        )'
            )
            if pattern.search(content):
                content = pattern.sub(replacement, content)
                with open(path, 'w') as f:
                    f.write(content)
                print("Patch applied successfully")
            else:
                print("WARNING: Patch target not found")
                if "_mv_vector_store_l0_l1" in content:
                    print("  Found _mv_vector_store_l0_l1 reference")
                if "Failed to move L0/L1" in content:
                    print("  Found error message reference")
            PATCH_EOF
            echo "Patch complete."
          command:
          - /bin/sh
          - -c
          env:
          - name: VLM_MAX_CONCURRENT
            value: "8"
          - name: EMBEDDING_MAX_CONCURRENT
            value: "8"
          image: ghcr.io/volcengine/openviking:v0.3.14
          imagePullPolicy: IfNotPresent
          name: patch-syncdiff
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
        nodeSelector:
          kubernetes.io/hostname: timmy
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        terminationGracePeriodSeconds: 15
        volumes:
        - configMap:
            defaultMode: 420
            name: openviking-standalone-config
          name: config-template
        - emptyDir: {}
          name: config-out
        - name: data
          persistentVolumeClaim:
            claimName: openviking-data
