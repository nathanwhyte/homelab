---
# IMPR-1311 router guards. LiteLLM 1.103.1's Redis client does not reconnect after a
# Redis restart: the router keeps serving, but Haiku spend goes untallied (in memory
# and in Redis) until litellm-vlm itself restarts. Measured 2026-10-14: four Haiku
# calls after a Redis outage left the budget gauge unchanged across a router restart;
# after a clean router start the same batch landed in Redis. The Claude Console
# workspace limit ($100) stays the hard cap either way.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: litellm-vlm-alerts
  namespace: viking
  labels:
    app: litellm-vlm
spec:
  groups:
    - name: litellm-vlm.rules
      rules:
        - alert: LiteLLMRouterDown
          # absent() covers a missing scrape target as well as a failing one.
          expr: up{job="litellm-vlm"} == 0 or absent(up{job="litellm-vlm"})
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "The OpenViking VLM router (litellm-vlm) is not answering scrapes"
            description: "OpenViking falls over to its vlm.backup (gemma via chat-ollama) after a call's retries are exhausted, so summaries and memory continue on gemma alone with no Haiku overflow. Check kubectl -n viking get pods -l app=litellm-vlm and its logs. To pin OpenViking to gemma: viking/scripts/ov-vlm-swap.py gemma --apply."
        - alert: OpenVikingBypassingVLMRouter
          # OpenViking labels VLM calls with the credential's model: ov-vlm through the
          # router, gemma4:vlm when its vlm.backup (direct chat-ollama) serves them.
          # A short rate window held for 15m measures a sustained bypass; a 15m
          # increase() would keep firing after the router recovered. `unless` clears
          # it as soon as router traffic resumes (failback mixes both for a while).
          expr: |
            sum(rate(openviking_vlm_calls_total{model_name="gemma4:vlm"}[5m])) > 0
            unless
            (sum(rate(openviking_vlm_calls_total{model_name="ov-vlm"}[5m])) > 0)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking has been calling gemma directly, bypassing the VLM router, for 15m"
            description: "OpenViking's credential failover moved to vlm.backup after the router failed. It retries the router every 10 minutes or 50 calls; if this persists, the router is still failing. Haiku takes no overflow meanwhile."
        - alert: LiteLLMRedisRestartedAfterRouter
          # Container start times, not pod start times: an in-place container
          # restart (OOM, liveness) keeps the pod's StartTime but still breaks or
          # repairs the router's Redis connection.
          expr: |
            max(kube_pod_container_state_started{namespace="viking", pod=~"litellm-redis-.*", container="redis"})
              > max(kube_pod_container_state_started{namespace="viking", pod=~"litellm-vlm-.*", container="litellm"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "litellm-redis restarted after the VLM router; Haiku spend is not being tallied"
            description: "The router does not reconnect to Redis after a Redis restart, so the $90 routing threshold stops counting. Remedy: kubectl -n viking rollout restart deploy/litellm-vlm (a short VLM gap; OpenViking retries)."
        - alert: LiteLLMHaikuBudgetLow
          expr: litellm_provider_remaining_budget_metric{api_provider="anthropic"} < 10
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "Under $10 of the router's $90 Haiku threshold left in the current budget window"
            description: "The router's window runs one month from when its budget tracking started, not by calendar month, so it may not line up with the Console's monthly limit ($100, the hard cap). Overflow returns to gemma at $0; compare with Console usage."
