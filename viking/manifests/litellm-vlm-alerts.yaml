---
# IMPR-1311 router guards. LiteLLM 1.103.1's Redis client does not reconnect after a
# Redis restart: the router keeps serving, but Haiku spend goes untallied (in memory
# and in Redis) until litellm-vlm itself restarts. Measured 2026-10-14: four Haiku
# calls after a Redis outage left the budget gauge unchanged across a router restart;
# after a clean router start the same batch landed in Redis. The Claude Console
# workspace limit ($100) stays the hard cap either way.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: litellm-vlm-alerts
  namespace: viking
  labels:
    app: litellm-vlm
spec:
  groups:
    - name: litellm-vlm.rules
      rules:
        - alert: LiteLLMRouterDown
          # absent() covers a missing scrape target as well as a failing one.
          expr: up{job="litellm-vlm"} == 0 or absent(up{job="litellm-vlm"})
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "The OpenViking VLM router (litellm-vlm) is not answering scrapes"
            description: "OpenViking falls over to its vlm.backup (gemma via chat-ollama) after a call's retries are exhausted, so summaries and memory continue on gemma alone with no Haiku overflow. Check kubectl -n viking get pods -l app=litellm-vlm and its logs. To pin OpenViking to gemma: viking/scripts/ov-vlm-swap.py gemma --apply."
        - alert: OpenVikingBypassingVLMRouter
          # OpenViking labels VLM calls with the credential's model: ov-vlm through the
          # router, gemma4:vlm when its vlm.backup (direct chat-ollama) serves them.
          # A short rate window held for 15m measures a sustained bypass; a 15m
          # increase() would keep firing after the router recovered. `unless` clears
          # it as soon as router traffic resumes (failback mixes both for a while).
          expr: |
            sum(rate(openviking_vlm_calls_total{model_name="gemma4:vlm"}[5m])) > 0
            unless
            (sum(rate(openviking_vlm_calls_total{model_name="ov-vlm"}[5m])) > 0)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking has been calling gemma directly, bypassing the VLM router, for 15m"
            description: "OpenViking's credential failover moved to vlm.backup after the router failed. It retries the router every 10 minutes or 50 calls; if this persists, the router is still failing. Haiku takes no overflow meanwhile."
        - alert: LiteLLMRedisRestartedAfterRouter
          # Container start times, not pod start times: an in-place container
          # restart (OOM, liveness) keeps the pod's StartTime but still breaks or
          # repairs the router's Redis connection.
          expr: |
            max(kube_pod_container_state_started{namespace="viking", pod=~"litellm-redis-.*", container="redis"})
              > max(kube_pod_container_state_started{namespace="viking", pod=~"litellm-vlm-.*", container="litellm"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "litellm-redis restarted after the VLM router; Haiku spend is not being tallied"
            description: "The router does not reconnect to Redis after a Redis restart, so the $90 routing threshold stops counting. Remedy: kubectl -n viking rollout restart deploy/litellm-vlm (a short VLM gap; OpenViking retries)."
        - alert: LiteLLMAnthropicAuthFailing
          # 2026-10-21: the Haiku key expired and every overflow call returned 401
          # from ~01:00Z to 18:15Z (363 calls) with nothing alerting, since gemma
          # answered the fallbacks. LiteLLM counts a Haiku rejection under the
          # fallback that followed it, successful or failed; failure_responses
          # covers a rejection on a direct Haiku call. Keys expire 30 days after
          # issue (current one ~2026-11-20, IMPR-1311). Only overflow reaches
          # Haiku, so a dead key is silent until gemma overflows, and LiteLLM
          # records the rejection only when the fallback finishes (gemma's last
          # attempt can take 900 s).
          # increase() skips a series' first sample, so the _created terms
          # count a series created in the window with a nonzero value (a fresh
          # router pod's first rejection). _created is the creation time, so a
          # scrape gap does not look like a new series, and max_over_time keeps
          # the evidence after the pod is replaced. Only > 0 matters.
          expr: |
            (
              sum(increase(litellm_deployment_successful_fallbacks_total{namespace="viking", exception_class=~"Anthropic\\..*", exception_status=~"401|403"}[30m]))
              or vector(0)
            )
            + (
              count(
                max_over_time(litellm_deployment_successful_fallbacks_created{namespace="viking", exception_class=~"Anthropic\\..*", exception_status=~"401|403"}[30m]) > time() - 1800
                and max_over_time(litellm_deployment_successful_fallbacks_total{namespace="viking", exception_class=~"Anthropic\\..*", exception_status=~"401|403"}[30m]) > 0
              )
              or vector(0)
            )
            + (
              sum(increase(litellm_deployment_failed_fallbacks_total{namespace="viking", exception_class=~"Anthropic\\..*", exception_status=~"401|403"}[30m]))
              or vector(0)
            )
            + (
              count(
                max_over_time(litellm_deployment_failed_fallbacks_created{namespace="viking", exception_class=~"Anthropic\\..*", exception_status=~"401|403"}[30m]) > time() - 1800
                and max_over_time(litellm_deployment_failed_fallbacks_total{namespace="viking", exception_class=~"Anthropic\\..*", exception_status=~"401|403"}[30m]) > 0
              )
              or vector(0)
            )
            + (
              sum(increase(litellm_deployment_failure_responses_total{namespace="viking", api_provider="anthropic", exception_status=~"401|403"}[30m]))
              or vector(0)
            )
            + (
              count(
                max_over_time(litellm_deployment_failure_responses_created{namespace="viking", api_provider="anthropic", exception_status=~"401|403"}[30m]) > time() - 1800
                and max_over_time(litellm_deployment_failure_responses_total{namespace="viking", api_provider="anthropic", exception_status=~"401|403"}[30m]) > 0
              )
              or vector(0)
            )
            > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Anthropic rejected the VLM router's Haiku calls (401/403) in the last 30m"
            description: "Anthropic answered the router's Haiku calls with 401 (authentication) or 403 (permission), so overflow falls back to gemma and Haiku capacity is lost. Read the error in kubectl -n viking logs deploy/litellm-vlm. A 401 usually means the key in Secret anthropic-vlm-key expired or was revoked: put a new Console key in the Secret, then kubectl -n viking rollout restart deploy/litellm-vlm. For a 403, check the key's workspace and model access in the Claude Console first; a new key with the same access will not fix it."
        - alert: LiteLLMHaikuBudgetLow
          expr: litellm_provider_remaining_budget_metric{api_provider="anthropic"} < 10
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "Under $10 of the router's $90 Haiku threshold left in the current budget window"
            description: "The router's window runs one month from when its budget tracking started, not by calendar month, so it may not line up with the Console's monthly limit ($100, the hard cap). Overflow returns to gemma at $0; compare with Console usage."
