---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openviking-alerts
  namespace: viking
  labels:
    app: openviking
spec:
  groups:
    # Native v0.4.7 metric families (server.observability.metrics — IMPR-1032
    # Phase C). These are the go-forward rules.
    - name: openviking.native.rules
      rules:
        - alert: OpenVikingServiceNotReady
          expr: openviking_service_readiness == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking reports a service component not ready for 5m"
            description: "Native readiness gauge is 0 — a dependency (vectordb, embedder, VLM) or the server itself is unhealthy."
        - alert: OpenVikingStaleLocks
          expr: openviking_lock_stale > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking reports stale locks for 10m"
            description: "Potentially stale lock handles — the ERR-1014 signature (poisoned lock_handoff / abandoned client handle). Remedy: kubectl rollout restart deploy/openviking -n viking after the queue drains."
        # BUG-1138: OpenVikingNativeQueueNotDraining was retired here, not fixed.
        # It had two defects. Its bare sum() spanned BOTH scrape targets — the
        # native /metrics on the openviking container and the ov-exporter sidecar,
        # both selected by the same ServiceMonitor — and the exporter emits
        # per-queue series AND its own `total`, so the exporter was already
        # double-counted before the native series was added: measured 2026-09-15,
        # sum() = 427 against a true depth of 139. And it alerted on DEPTH, which
        # any legitimate compendium-sync burst exceeds by design — one delivered
        # job holds hundreds of items. It fired 13:07-13:21 CDT on 2026-09-15
        # while the queue drained itself to zero, and told the operator to
        # `rollout restart`, which would have aborted the drain.
        #
        # The stall signature lives in OpenVikingQueueNotDraining below, which
        # selects the exporter's `total` series directly and needs no sum() at
        # all. The native endpoint cannot express it: it emits no requeued_total,
        # so it cannot distinguish a poisoned message from a slow one.
        - alert: OpenVikingQueueErrors
          expr: sum(increase(openviking_queue_errors_total[15m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking queue processed errors in the last 15m"
            description: "openviking_queue_errors_total increased — check pod logs for the failing queue."
        # IMPR-1095: bucket-level lock rules (ov-exporter S3 polling). These
        # watch the Garage bucket where locks actually live under
        # agfs.backend: s3 — the legacy find-based rule below is blind there.
        - alert: OpenVikingS3LocksAccumulating
          expr: openviking_s3_ovlock_dead > 20
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: ">20 dead-lease .ovlock files in openviking-agfs for 15m"
            description: "Dead lock files are accumulating in the S3 AGFS bucket — the ovlock-janitor CronJob is failing, suspended, or misclassifying. Check its latest run logs (kubectl -n viking logs job/<latest ovlock-janitor job>) before any manual cleanup (IMPR-1095)."
        - alert: OpenVikingWedgedLockFile
          expr: openviking_s3_ovlock_oldest_live_age_seconds > 2700
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Live-refreshing .ovlock present for >45m — BUG-1039 wedge signature"
            description: "A lock file has been lease-refreshed continuously for over 45 minutes — a wedged server-side task, not normal work. The in-Job heal clears these during sync runs; outside one, follow BUG-1039's manual fallback (restart deploy/openviking -n viking after the queue drains). The janitor never deletes these by design (IMPR-1095 report-only)."
        - alert: OpenVikingS3LockPollFailing
          expr: openviking_s3_ovlock_poll_ok == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ov-exporter S3 lock polling not succeeding for 30m"
            description: "The bucket-level lock gauges are stale (OV down, Garage unreachable, or credentials broken) — the two lock alerts above are flying blind while this fires."
    # Exporter-sidecar rules (ov-exporter, port 9210). Kept during the Phase C
    # parity window; retire with the sidecar once the native rules have soaked.
    - name: openviking.rules
      rules:
        - alert: OpenVikingDown
          expr: openviking_up == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking exporter reports OV unreachable for 5m"
            description: "ov-exporter's last poll cycle failed (ov status or lock count). OV may be down or the exporter lost its API key."
        - alert: OpenVikingLocksAccumulating
          expr: openviking_lock_path_ovlock_count > 20
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking has >20 stale .path.ovlock files for 5m"
            description: "Stale subtree lifecycle locks are accumulating in AGFS. GH #2015 was fixed in v0.4.4 and the lock-cleanup sidecar removed (IMPR-1007 Phase 3) — accumulation now signals a regression or crashed writes; clean up manually with: find /app/data/viking -name '.path.ovlock' -delete. NOTE: this rule counts the local filesystem only — under agfs.backend: s3 it is blind and superseded by OpenVikingS3LocksAccumulating (IMPR-1095)."
        # BUG-1138: alert on STALLED PROGRESS, not on depth.
        #
        # `queue="total"` is unique to ov-exporter — the native endpoint emits
        # capitalized queue names (Embedding, Semantic, ExternalParse,
        # SessionCommit) and no `total` — so this selector matches exactly one
        # series and needs no sum(). Do not wrap it in one: a bare
        # sum(openviking_queue_pending) spans both scrape targets and triple-counts
        # (see the retired rule above).
        #
        # The conjunct is what makes this mean "stuck" rather than "busy". Deep
        # and falling is a healthy sync burst; deep and FLAT is the real stall.
        # increase() handles the counter reset across a pod restart.
        #
        # `for` is DELIBERATELY SHORT. increase(...[15m]) == 0 already means "no
        # completion in the last 15 minutes" — that IS the sustained condition, so
        # a long `for` stacks a second wait on top of it.
        #
        # This was `for: 15m` and it was wrong (Codex P2 on homelab #99). In the
        # realistic case — the queue stalls right after processing something — the
        # last increment stays inside the 15m range until it ages out, so the
        # expression only becomes true at ~15m and the hold then added 15m more.
        # Measured: 32 minutes to fire, for an alert whose summary says 15.
        #
        # The earlier justification was an artifact of the test fixture: its
        # counter was flat from the first sample, so increase() was 0 immediately
        # and the alert looked far twitchier than it is. A counter that has been
        # moving does not behave that way. See the "stall immediately after a
        # completion" case in viking/tests/alerts.test.yaml, which pins ~20m.
        #
        # What `for` still earns: warm-up. After a pod restart the series can
        # reappear with a backlog and no completion yet, where increase() is 0 and
        # nothing is wrong. 5m covers that without doubling detection latency.
        #
        # requeued_total is deliberately NOT a required conjunct: a hard wedge can
        # leave processed AND requeued both flat, and requiring requeued to climb
        # would miss it. It is the discriminator between ERR-1014 and plain
        # slowness, which is why the description tells the operator to read it.
        - alert: OpenVikingQueueNotDraining
          expr: openviking_queue_pending{queue="total"} > 5 and increase(openviking_queue_processed_total{queue="total"}[15m]) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking queue has made no progress in 15m"
            description: "Pending is above 5 and processed_total has not advanced in 15m — work is not moving, which is a stall rather than a backlog. CHECK THE DRAIN RATE FIRST: `ov status --output json`. A deep queue that is falling is a healthy compendium-sync burst and needs nothing. Restart only if pending is flat AND requeued_total is climbing, which is the ERR-1014 poisoned-message signature; a rollout restart mid-drain aborts in-flight work for nothing."
