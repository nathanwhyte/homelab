---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openviking-alerts
  namespace: viking
  labels:
    app: openviking
spec:
  groups:
    # Native v0.4.7 metric families (server.observability.metrics — IMPR-1032
    # Phase C). These are the go-forward rules.
    - name: openviking.native.rules
      rules:
        - alert: OpenVikingServiceNotReady
          expr: openviking_service_readiness == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking reports a service component not ready for 5m"
            description: "Native readiness gauge is 0 — a dependency (vectordb, embedder, VLM) or the server itself is unhealthy."
        - alert: OpenVikingStaleLocks
          expr: openviking_lock_stale > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking reports stale locks for 10m"
            description: "Potentially stale lock handles — the ERR-1014 signature (poisoned lock_handoff / abandoned client handle). Remedy: kubectl rollout restart deploy/openviking -n viking after the queue drains."
        # BUG-1138: OpenVikingNativeQueueNotDraining was retired here, not fixed.
        # It had two defects. Its bare sum() spanned BOTH scrape targets — the
        # native /metrics on the openviking container and the ov-exporter sidecar,
        # both selected by the same ServiceMonitor — and the exporter emits
        # per-queue series AND its own `total`, so the exporter was already
        # double-counted before the native series was added: measured 2026-09-15,
        # sum() = 427 against a true depth of 139. And it alerted on DEPTH, which
        # any legitimate compendium-sync burst exceeds by design — one delivered
        # job holds hundreds of items. It fired 13:07-13:21 CDT on 2026-09-15
        # while the queue drained itself to zero, and told the operator to
        # `rollout restart`, which would have aborted the drain.
        #
        # The stall signature lives in OpenVikingQueueNotDraining below, which
        # selects the exporter's `total` series directly and needs no sum() at
        # all. The native endpoint cannot express it: it emits no requeued_total,
        # so it cannot distinguish a poisoned message from a slow one.
        - alert: OpenVikingQueueErrors
          expr: increase(openviking_queue_errors_total{queue="total"}[15m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking queue processed errors in the last 15m"
            description: "openviking_queue_errors_total increased — check pod logs for the failing queue."
        # IMPR-1095: bucket-level lock rules (ov-exporter S3 polling). These
        # watch the Garage bucket where locks actually live under
        # agfs.backend: s3 — the legacy find-based rule below is blind there.
        - alert: OpenVikingS3LocksAccumulating
          expr: openviking_s3_ovlock_dead > 20
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: ">20 dead-lease .ovlock files in openviking-agfs for 15m"
            description: "Dead lock files are accumulating in the S3 AGFS bucket. The ovlock-janitor CronJob runs in SHADOW MODE (no --apply in ovlock-janitor-cronjob.yaml, IMPR-1095 Phase 4 not flipped), so it reports dead leases but deletes nothing — read its latest run logs (kubectl -n viking logs job/<latest ovlock-janitor job>) to see which keys it would delete, then either flip --apply or clean up by hand from that list (IMPR-1095)."
        # BUG-1220: one lock stayed live-refreshed ~70h (2026-10-09..12) and
        # this alert could not say which. It now fires per lock from ov-exporter's
        # labelled series (key, uri, owner, lock_type — top 3 live locks present
        # >= 15m, so bounded), and the templates name the lock. The second arm
        # is a fallback on the unlabelled gauge, for an exporter that predates
        # the labelled series or has it disabled; `unless on()` keeps it from
        # paging a second time when a labelled instance is already firing.
        # Coverage gap: the top-N bound (OVLOCK_LABEL_TOP_N) also caps what is
        # named. With more than N locks wedged at once, the extras get no
        # series and the muted fallback cannot cover them; the janitor lists
        # them as presence_age=not-exported. A labelled lock's age restarts
        # when its holder changes, so one series is one holder's tenure.
        # Re-notification cadence for this alert is set in the Alertmanager
        # route (grafana/helm/kube-prometheus-stack-values.yaml), not here.
        - alert: OpenVikingWedgedLockFile
          expr: |
            openviking_s3_ovlock_live_age_seconds > 2700
            or
            (
              openviking_s3_ovlock_oldest_live_age_seconds > 2700
              unless on() (openviking_s3_ovlock_live_age_seconds > 2700)
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking lock {{ or $labels.uri \"(path not exported)\" }} live-refreshed for {{ $value | humanizeDuration }} — wedge signature"
            description: "Lock {{ or $labels.key \"(key not exported: read the latest ovlock-janitor run log)\" }} (owner handle {{ or $labels.owner \"unknown\" }}, type {{ or $labels.lock_type \"unknown\" }}) has been lease-refreshed continuously for {{ $value | humanizeDuration }}: a wedged server-side task, not normal work. NEVER delete this lock file: its holder still believes it owns it. Recovery is an OV restart (deploy/openviking -n viking, after the queue drains), which only the in-Job heal (off since BUG-1181) or an operator may do. Find the holder with Loki {namespace=\"viking\", container=\"openviking\"} |= \"{{ or $labels.owner \"<owner>\" }}\" (v0.5.1.1 logs the ragfs lease lines at debug, so this may find nothing; GET /locks on port 9210 of the openviking Service lists every live lock, BUG-1282). The janitor reports these as WEDGED and never deletes them (IMPR-1095, BUG-1220)."
        - alert: OpenVikingS3LockPollFailing
          expr: openviking_s3_ovlock_poll_ok == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ov-exporter S3 lock polling not succeeding for 30m"
            description: "The bucket-level lock gauges are stale (OV down, Garage unreachable, or credentials broken) — the two lock alerts above are flying blind while this fires."
        # BUG-1282: the lock alerts above, ov-lock-watchdog and the sync's wedge
        # check all read the exporter's bucket listing, so a listing that stops
        # seeing locks reads as "no locks" to every one of them. The server's
        # own count is the independent check. It must hold for 30m because the
        # two sources routinely disagree for a poll or two: the count is live
        # and includes short write leases, and the listing is up to a poll old.
        # In the 2 days to 2026-11-01 the exporter was empty on 19% of samples
        # with a lease held, and the longest such stretch in 7 days was about
        # 14 min. A wedged lock beside other listed locks does not fire this:
        # one listed lock resets the 30m.
        - alert: OpenVikingLockListingBlind
          expr: |
            sum(openviking_lock_active) > 0
            unless on() (sum(openviking_s3_ovlock_live_refreshing) > 0)
            and on() (openviking_s3_ovlock_poll_ok == 1)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking counts {{ $value }} held lock(s) but ov-exporter has listed none for 30m"
            description: "The server's openviking_lock_active stayed above 0 for 30m while the exporter's S3 listing found no live lock and its poll succeeded, so OpenVikingWedgedLockFile, ov-lock-watchdog and the sync's wedge check are all blind to whatever is held. Suspect a changed lock key layout or a lease whose object is gone. Compare GET /locks on port 9210 of the openviking Service with the bucket before trusting a watchdog decision=none (BUG-1282)."
    # Exporter-sidecar rules (ov-exporter, port 9210). Kept during the Phase C
    # parity window; retire with the sidecar once the native rules have soaked.
    - name: openviking.rules
      rules:
        - alert: OpenVikingDown
          expr: openviking_up == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking exporter reports OV unreachable for 5m"
            description: "ov-exporter's last poll cycle failed (ov status or lock count). OV may be down or the exporter lost its API key."
        # OpenVikingDown is silent when openviking_up is absent: a crashed
        # exporter, a scrape broken by bad exposition, or no pod at all.
        # TargetDown covers the first two only, so absent() closes the third.
        - alert: OpenVikingExporterUnscraped
          expr: >-
            up{namespace="viking", job="openviking", endpoint="metrics"} == 0
            or absent(up{namespace="viking", job="openviking", endpoint="metrics"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ov-exporter (port 9210) not scraped for 5m"
            description: "Prometheus cannot scrape the ov-exporter sidecar, or the target is gone, so every openviking_* exporter series is missing and OpenVikingDown and the lock and queue rules above cannot fire. Check the pod (`kubectl -n viking get pods -l app=openviking`) and the ov-exporter container log; a failing scrape with a running container points at the exposition (`curl <pod-ip>:9210/metrics | promtool check metrics`)."
        # Client delivery counts come from ov-telemetry-push.py (dotfiles)
        # matching hook-log stage names written for openviking-memory 0.4.7
        # (Claude Code) and 0.8.3 (Codex). A plugin update that renames a
        # stage makes a count go flat with no error, so alert when recall
        # runs that neither skipped nor failed keep coming but deliver nothing.
        # increase() extrapolates to the window edges, so exactly N events
        # read slightly above N; the thresholds are >= N+1, not > N.
        - alert: OpenVikingClientRecallDeliveryFlat
          expr: >-
            (
              increase(openviking_client_recalls_total[6h])
              - increase(openviking_client_recall_skips_total[6h])
              - increase(openviking_client_recall_errors_total[6h])
            ) >= 11
            and on (machine, harness)
            (
              increase(openviking_client_recall_tokens_total[6h]) == 0
              or increase(openviking_client_recall_entries_total[6h]) == 0
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.machine }}/{{ $labels.harness }} recalls ran but delivered no counted memory for 6h"
            description: "Auto-recall runs that neither skipped nor failed kept arriving from {{ $labels.machine }} ({{ $labels.harness }}), but recall tokens or entries did not move. The likely cause is a memory-plugin update renaming the hook-log stage ov-telemetry-push.py counts (DELIVERY_EVENTS in dotfiles bin/ov-telemetry-push.py). Compare the stages in ~/.openviking/logs/*-hooks.log on that Mac with the table and update it."
        # Gated on session-start hook runs, not recalls: a long-lived session
        # recalls for days without a new session start, and failed recalls
        # say nothing about whether a session started.
        - alert: OpenVikingClientSessionStartFlat
          expr: >-
            increase(openviking_client_session_start_runs_total[24h]) >= 6
            and on (machine, harness)
            increase(openviking_client_session_start_injects_total[24h]) == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.machine }}/{{ $labels.harness }} session-start hook ran but counted no injection in 24h"
            description: "The session-start hook ran about 6 or more times on {{ $labels.machine }} ({{ $labels.harness }}) in 24h (increase() extrapolates, so the count is approximate), but no session-start memory injection was counted. Either injection is off, or a memory-plugin update renamed the session-start stage ov-telemetry-push.py counts (DELIVERY_EVENTS in dotfiles bin/ov-telemetry-push.py). Check that Mac's ~/.openviking/logs/*-hooks.log."
        # OpenVikingLocksAccumulating (openviking_lock_path_ovlock_count > 20)
        # was retired 2026-09-21: it counted .path.ovlock files on the PVC with
        # find, and under agfs.backend: s3 the locks live in the Garage bucket,
        # so the gauge is permanently 0 and the rule could never fire. The
        # bucket-level OpenVikingS3LocksAccumulating above (IMPR-1095) is the
        # live rule; the exporter still exports the PVC count for reference.
        # BUG-1138: alert on STALLED PROGRESS, not on depth.
        #
        # `queue="total"` is unique to ov-exporter — the native endpoint emits
        # capitalized queue names (Embedding, Semantic, ExternalParse,
        # SessionCommit) and no `total` — so this selector matches exactly one
        # series and needs no sum(). Do not wrap it in one: a bare
        # sum(openviking_queue_pending) spans both scrape targets and triple-counts
        # (see the retired rule above).
        #
        # The conjunct is what makes this mean "stuck" rather than "busy". Deep
        # and falling is a healthy sync burst; deep and FLAT is the real stall.
        # increase() handles the counter reset across a pod restart.
        #
        # `for` is DELIBERATELY SHORT. increase(...[15m]) == 0 already means "no
        # completion in the last 15 minutes" — that IS the sustained condition, so
        # a long `for` stacks a second wait on top of it.
        #
        # This was `for: 15m` and it was wrong (Codex P2 on homelab #99). In the
        # realistic case — the queue stalls right after processing something — the
        # last increment stays inside the 15m range until it ages out, so the
        # expression only becomes true at ~15m and the hold then added 15m more.
        # Measured: 32 minutes to fire, for an alert whose summary says 15.
        #
        # The earlier justification was an artifact of the test fixture: its
        # counter was flat from the first sample, so increase() was 0 immediately
        # and the alert looked far twitchier than it is. A counter that has been
        # moving does not behave that way. See the "stall immediately after a
        # completion" case in viking/tests/alerts.test.yaml, which pins ~20m.
        #
        # What `for` still earns: warm-up. After a pod restart the series can
        # reappear with a backlog and no completion yet, where increase() is 0 and
        # nothing is wrong. 5m covers that without doubling detection latency.
        #
        # requeued_total is deliberately NOT a required conjunct: a hard wedge can
        # leave processed AND requeued both flat, and requiring requeued to climb
        # would miss it. It is the discriminator between ERR-1014 and plain
        # slowness, which is why the description tells the operator to read it.
        - alert: OpenVikingQueueNotDraining
          expr: openviking_queue_pending{queue="total"} > 5 and increase(openviking_queue_processed_total{queue="total"}[15m]) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking queue has made no progress in 15m"
            description: "Pending is above 5 and processed_total has not advanced in 15m — work is not moving, which is a stall rather than a backlog. CHECK THE DRAIN RATE FIRST: `ov status --output json`. A deep queue that is falling is a healthy compendium-sync burst and needs nothing. Restart only if pending is flat AND requeued_total is climbing, which is the ERR-1014 poisoned-message signature; a rollout restart mid-drain aborts in-flight work for nothing."
