---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openviking-alerts
  namespace: viking
  labels:
    app: openviking
spec:
  groups:
    - name: openviking.rules
      rules:
        - alert: OpenVikingDown
          expr: openviking_up == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking exporter reports OV unreachable for 5m"
            description: "ov-exporter's last poll cycle failed (ov status or lock count). OV may be down or the exporter lost its API key."
        - alert: OpenVikingLocksAccumulating
          expr: openviking_lock_path_ovlock_count > 20
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking has >20 stale .path.ovlock files for 5m"
            description: "Stale subtree lifecycle locks are accumulating in AGFS. GH #2015 was fixed in v0.4.4 and the lock-cleanup sidecar removed (IMPR-1007 Phase 3) — accumulation now signals a regression or crashed writes; clean up manually with: find /app/data/viking -name '.path.ovlock' -delete"
        - alert: OpenVikingQueueNotDraining
          expr: openviking_queue_pending{queue="total"} > 5 and delta(openviking_queue_pending{queue="total"}[15m]) >= 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking total queue pending not decreasing over 15m"
            description: "Queue depth is above 5 and has not fallen in 15m — indexing is stalled (VLM saturation or lock contention)."
