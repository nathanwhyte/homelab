---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ov-vectordb-data
  namespace: viking
  annotations:
    # Not read by the Longhorn CSI driver; intent only. The live Volume was raised
    # to 2 replicas by hand on 2026-09-22 — see openviking-pvc.yaml.
    longhorn.io/number-of-replicas: "2"
    # LIVE Longhorn Volume settings applied on 2026-09-22 with
    # viking/scripts/ov-volume-locality.sh (dataLocality best-effort, 2 replicas);
    # the claim's own class `longhorn-ssd` cannot express them. During the manu
    # drill the index flush hit EIO within a minute of the volume faulting while
    # the pod kept running. Re-provision with storageclass-longhorn-ov.yaml via
    # restore/ov-claims-longhorn-ov.yaml.
    homelab.nathanwhyte.dev/longhorn-data-locality: best-effort
    homelab.nathanwhyte.dev/longhorn-live-replicas: "2"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ssd
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Gi
