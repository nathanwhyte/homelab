---
# ServiceMonitor for the OV exporter sidecar (ov-exporter container in the
# openviking pod). The kube-prometheus-stack Prometheus is configured with
# an empty serviceMonitorSelector, so any ServiceMonitor in any namespace
# is auto-scraped.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openviking
  namespace: viking
  labels:
    app: openviking
spec:
  selector:
    matchLabels:
      app: openviking
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scrapeTimeout: 10s
