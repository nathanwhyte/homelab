---
# ServiceMonitor for OpenViking metrics. Two endpoints during the IMPR-1032
# Phase C transition:
#   - port http (1933): native /metrics (server.observability.metrics,
#     v0.4.7). NEVER expose this path through an Ingress — it bypasses auth.
#   - port metrics (9210): the ov-exporter sidecar; retire once native
#     alert parity is confirmed.
# The kube-prometheus-stack Prometheus is configured with an empty
# serviceMonitorSelector, so any ServiceMonitor in any namespace is
# auto-scraped.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openviking
  namespace: viking
  labels:
    app: openviking
spec:
  selector:
    matchLabels:
      app: openviking
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
      scrapeTimeout: 10s
    - port: metrics
      interval: 30s
      path: /metrics
      scrapeTimeout: 10s
