---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking
  namespace: viking
  labels:
    app: openviking
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openviking
  template:
    metadata:
      labels:
        app: openviking
    spec:
      terminationGracePeriodSeconds: 15
      # Keep the OpenViking data path on timmy while the dedicated CUDA VLM
      # backend on manu owns the NVIDIA GPU.
      nodeSelector:
        kubernetes.io/hostname: timmy
      initContainers:
        - name: config-rewrite
          image: python:3.12-slim
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -c "
              import json, os
              conf = json.load(open('/config-template/ov.conf'))
              conf['server']['root_api_key'] = os.environ['API_KEY']
              vlm = conf.get('vlm', {})
              if vlm.get('api_key') == '\${OLLAMA_KEY}':
                  vlm['api_key'] = os.environ.get('OLLAMA_KEY', '')
              agfs = conf.get('storage', {}).get('agfs', {})
              if agfs.get('backend', 'local') == 's3':
                  agfs.setdefault('s3', {})
                  agfs['s3']['access_key'] = os.environ['S3_ACCESS_KEY']
                  agfs['s3']['secret_key'] = os.environ['S3_SECRET_KEY']
              else:
                  agfs.pop('s3', None)
              json.dump(conf, open('/config-out/ov.conf', 'w'), indent=2)
              "
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-api-key
                  key: api-key
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            # Bearer for the llama-ns ollama auth proxy (cloud VLM primary,
            # IDEA-1050). Duplicated from llama/ollama-api-key.
            - name: OLLAMA_KEY
              valueFrom:
                secretKeyRef:
                  name: ollama-api-key
                  key: API_KEY
                  optional: true
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config-out
              mountPath: /config-out
        - name: temp-cleanup
          image: busybox:1.37
          # .path.ovlock wipe removed at the v0.4.10 bump (IMPR-1063): tree locks
          # live in S3 under agfs:s3 (the wipe was a no-op on this PVC), and
          # v0.4.10 resumes interrupted work after restart — wiping its locks
          # would race the resume (IMPR-1062 spike). The RocksDB LOCK removal
          # stays: harmless on v0.4.10 (which also self-cleans it) and still
          # covers a rollback to older images.
          command:
            - /bin/sh
            - -c
          args:
            - echo "Cleaning stale temp files..."; find /app/data/temp -type f -mtime +1 -delete 2>/dev/null || true; find /app/data/temp -type d -empty -delete 2>/dev/null || true; find /app/data/viking/default/temp -type d -empty -delete 2>/dev/null || true; echo "Removing stale pid/store locks..."; rm -f /app/data/.openviking.pid; rm -f /app/data/vectordb/context/store/LOCK; echo "Done."
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: openviking
          # v0.4.5 fixed the Role serialization bug upstream, so the former
          # role-value-patch init container (and its /ov-patch PYTHONPATH
          # override) is gone as of the v0.4.7 bump (IMPR-1032 Phase B).
          # v0.4.10 bump: IMPR-1063 (no data migration in the 0.4.7→0.4.10
          # range; rollback is a pure tag revert).
          image: ghcr.io/volcengine/openviking:v0.4.10
          ports:
            - containerPort: 1933
              name: http
          resources:
            requests:
              # Single-instance local AGFS keeps indexing, queue work, and file
              # operations in one pod. Keep memory capped so timmy still has
              # headroom for model runtime caches and node-level services.
              # 2026-07-06 (IMPR-1038): 4Gi -> 2Gi; 7d peak 1.4Gi, limit keeps burst room.
              cpu: "4"
              memory: 2Gi
            limits:
              cpu: "12"
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /health
              port: 1933
            periodSeconds: 3
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 1933
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1933
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          volumeMounts:
            - name: config-out
              mountPath: /app/.openviking/ov.conf
              subPath: ov.conf
              readOnly: true
            - name: data
              mountPath: /app/data
        - name: ov-exporter
          # Reuses the OV image so the `ov` CLI is available for `ov status`
          # polling. Script is mounted from the openviking-exporter ConfigMap;
          # regenerate via viking/scripts/regen-exporter-configmap.sh.
          # `ov language en` runs once at container start to clear v0.4.x's
          # first-run language gate (the gate persists state under
          # ~/.openviking/, which is the container's HOME).
          image: ghcr.io/volcengine/openviking:v0.4.10
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /tmp/ov
              cat >/tmp/ov/ovcli.conf <<EOF
              {"url": "${OPENVIKING_URL}", "api_key": "${OPENVIKING_KEY}", "account": "default", "user": "noot"}
              EOF
              export OPENVIKING_CLI_CONFIG_FILE=/tmp/ov/ovcli.conf
              ov language en >/dev/null 2>&1 || true
              exec python3 /scripts/ov-exporter.py
          env:
            - name: OPENVIKING_URL
              value: http://localhost:1933
            - name: OPENVIKING_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-api-key
                  # Root key, not user-api-key: the stored user-scoped key went
                  # stale at the June rebuild and every 15s `ov status` poll
                  # 401'd (openviking_up stuck at 0, OpenVikingDown always
                  # firing). ov status needs the root key per the exporter
                  # docs; the CLI config already carries account/user identity
                  # headers for trusted mode. Fixed 2026-07-16 (IMPR-1063
                  # verification follow-up).
                  key: api-key
            - name: AGFS_PATH
              value: /app/data/viking
            - name: POLL_INTERVAL
              value: "15"
            - name: PORT
              value: "9210"
          ports:
            - containerPort: 9210
              name: metrics
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /health
              port: 9210
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9210
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9210
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: exporter-script
              mountPath: /scripts
              readOnly: true
            - name: data
              mountPath: /app/data
              readOnly: true
      volumes:
        - name: config-template
          configMap:
            name: openviking-standalone-config
        - name: config-out
          emptyDir: {}
        - name: exporter-script
          configMap:
            name: openviking-exporter
            defaultMode: 0755
        - name: data
          persistentVolumeClaim:
            claimName: openviking-data
