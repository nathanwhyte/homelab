---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking
  namespace: viking
  labels:
    app: openviking
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openviking
  template:
    metadata:
      labels:
        app: openviking
    spec:
      terminationGracePeriodSeconds: 15
      # Keep the OpenViking data path on timmy while the dedicated CUDA VLM
      # backend on manu owns the NVIDIA GPU.
      nodeSelector:
        kubernetes.io/hostname: timmy
      initContainers:
        - name: config-rewrite
          image: python:3.12-slim
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -c "
              import json, os
              conf = json.load(open('/config-template/ov.conf'))
              conf['server']['root_api_key'] = os.environ['API_KEY']
              vlm = conf.get('vlm', {})
              if vlm.get('api_key') == '\${OLLAMA_KEY}':
                  vlm['api_key'] = os.environ.get('OLLAMA_KEY', '')
              agfs = conf.get('storage', {}).get('agfs', {})
              if agfs.get('backend', 'local') == 's3':
                  agfs.setdefault('s3', {})
                  agfs['s3']['access_key'] = os.environ['S3_ACCESS_KEY']
                  agfs['s3']['secret_key'] = os.environ['S3_SECRET_KEY']
              else:
                  agfs.pop('s3', None)
              json.dump(conf, open('/config-out/ov.conf', 'w'), indent=2)
              "
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-api-key
                  key: api-key
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            # Bearer sent on the VLM route. The chat-ollama shim forwards headers
            # unchanged to timmy's host daemon (ollama.llama.svc, no auth), so the
            # local gemma4:vlm route (homelab #131) never checks it; it dates from
            # the cloud primary (IDEA-1050). Duplicated from llama/ollama-api-key.
            - name: OLLAMA_KEY
              valueFrom:
                secretKeyRef:
                  name: ollama-api-key
                  key: API_KEY
                  optional: true
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config-out
              mountPath: /config-out
        - name: temp-cleanup
          image: busybox:1.37
          # .path.ovlock wipe removed at the v0.4.10 bump (IMPR-1063): tree locks
          # live in S3 under agfs:s3 (the wipe was a no-op on this PVC), and
          # v0.4.10 resumes interrupted work after restart — wiping its locks
          # would race the resume (IMPR-1062 spike). The RocksDB LOCK removal
          # stays: harmless on v0.4.10 (which also self-cleans it) and still
          # covers a rollback to older images.
          command:
            - /bin/sh
            - -c
          args:
            - echo "Cleaning stale temp files..."; find /app/data/temp -type f -mtime +1 -delete 2>/dev/null || true; find /app/data/temp -type d -empty -delete 2>/dev/null || true; find /app/data/viking/default/temp -type d -empty -delete 2>/dev/null || true; echo "Removing stale pid/store locks..."; rm -f /app/data/.openviking.pid; rm -f /app/data/vectordb/context/store/LOCK; echo "Done."
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: openviking
          # v0.4.5 fixed the Role serialization bug upstream, so the former
          # role-value-patch init container (and its /ov-patch PYTHONPATH
          # override) is gone as of the v0.4.7 bump (IMPR-1032 Phase B).
          # v0.4.10 bump: IMPR-1063 (no data migration in the 0.4.7→0.4.10
          # range; rollback is a pure tag revert).
          image: ghcr.io/volcengine/openviking:v0.4.20
          ports:
            - containerPort: 1933
              name: http
          resources:
            requests:
              # Single-instance local AGFS keeps indexing, queue work, and file
              # operations in one pod. Keep memory capped so timmy still has
              # headroom for model runtime caches and node-level services.
              # 2026-07-06 (IMPR-1038): 4Gi -> 2Gi; 7d peak 1.4Gi, limit keeps burst room.
              #
              # 2026-09-14 (BUG-1130): cpu 4 -> 500m, memory 2Gi -> 3Gi.
              # Prometheus, 2d window ending 17:00Z (before the manu clock cap
              # and the incident-response scale-downs, neither of which touches
              # this pod — it is pinned to timmy):
              #   CPU     peak 101m, p99 52m, p95 21m, mean 13m
              #   memory  peak 2606Mi
              # The 4-core request was never measured: IMPR-1038 right-sized
              # memory on the line above and CPU was out of its scope. It
              # reserved half of timmy's 8 schedulable cores on a node running
              # at 3%, leaving ~1219m of request budget for everything else.
              # 500m keeps ~5x headroom over peak and matches the other viking
              # deployments.
              #
              # This frees reservation; it does not change what can land on
              # timmy. CI runners are excluded from the node by a required
              # nodeAffinity in arc/runner-scale-set-compendium-values.yaml, so
              # they were never eligible here regardless of budget. Moving them
              # would be a separate, deliberate decision about that affinity.
              #
              # Memory moves the other way: IMPR-1038's 2Gi was correct against
              # a 1.4Gi peak in July, but the footprint has grown ~80% since and
              # the pod now sits above its own request, making it an eviction
              # candidate under node pressure. 3Gi restores ~18% headroom.
              #
              # Limits unchanged — burst room for indexing is still wanted, and
              # nothing here was measured against them. Prometheus retention is
              # 3d, so no bulk-sync run is guaranteed to be inside the window;
              # re-check CPU after a full compendium sync before trusting 500m
              # as a long-term floor.
              cpu: 500m
              memory: 3Gi
            limits:
              cpu: "12"
              memory: 8Gi
          # BUG-1049: no runtime readinessProbe, deliberately.
          #
          # /ready shares the process with semantic indexing. Under a full
          # re-index it exceeded its 10s timeout, 3 strikes marked the pod
          # NotReady, and the kubelet pulled it from the openviking Service —
          # a full outage, because this is single-replica. Ejection then
          # deepened the overload that caused it (flap loop).
          #
          # Readiness ejection only helps when OTHER replicas absorb the
          # traffic. With one replica it converts "slow" into "down". Serving
          # slowly is strictly better here.
          #
          # The startupProbe below is the sole gate on joining the Service, so
          # its budget is sized to worst-case boot (Garage + vectordb
          # reconnect): 3s x 20 = 60s, was 3s x 10 = 30s.
          startupProbe:
            httpGet:
              path: /health
              port: 1933
            periodSeconds: 3
            failureThreshold: 20
          # Liveness stays conservative and TCP-only — it never touches the
          # indexing path. 30s x 10 ~= 5min before a restart.
          livenessProbe:
            tcpSocket:
              port: 1933
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          # BUG-1155: point OV's PromptManager at an override directory so the
          # semantic overview template can be shrunk without forking the image.
          # PromptManager._resolve_templates_dir honours this env var above
          # config.prompts.templates_dir, and _resolve_template_path falls back
          # PER FILE to the bundled directory — so the override ConfigMap holds
          # only overview_generation.yaml and every other template is untouched.
          #
          # Deliberately wired as an env var rather than a prompts.templates_dir
          # key in openviking-standalone-configmap.yaml: that ConfigMap also
          # carries vlm.model and semantic.overview_max_chars, and re-applying
          # the whole document from a stale branch is what silently reverted the
          # VLM to a cloud tag for half an hour on 2026-09-18.
          #
          # Rollback without touching any ConfigMap:
          #   kubectl set env deployment/openviking -n viking \
          #     OPENVIKING_PROMPT_TEMPLATES_DIR-
          env:
            - name: OPENVIKING_PROMPT_TEMPLATES_DIR
              value: /etc/openviking/prompts
            # BUG-1176 (same loader, same ConfigMap): ov_extract_patch.py makes a degraded
            # memory extraction (empty/unparseable LLM output after the loop's own retry)
            # a retryable Phase 2 failure — 5 retries, 15–120 s backoff — instead of an
            # empty memory_diff.json recorded as success; a run that still fails gets
            # .failed.json and a failed task. Guarded on v0.4.20 + the ExtractLoop.run
            # source sha256; OV_EXTRACT_PATCH=0 turns it off alone. Grep the pod log for
            # "ov-extract-patch: applied" (twice per worker) after any change.
            #
            # IMPR-1185: sitecustomize.py on this path installs a post-import wrapper
            # around SemanticProcessor._generate_overview that builds Quick Navigation
            # and Directory Coverage in code from the child inventory (the model writes
            # prose only). Guarded on openviking v0.4.20 + a source sha256; on any other
            # image it logs "NOT applied" and stock behaviour stays. Canaried on ov-test
            # (homelab #146). Sources: viking/manifests/test/nav-patch/; ConfigMap
            # regenerated by viking/scripts/regen-nav-patch-configmap.sh.
            #
            # COUPLED to openviking-prompt-overrides-configmap.yaml (homelab #149): that
            # template is prose-only and no longer asks the model for a navigation list,
            # so "NOT applied" (image bump, source drift, OV_NAV_PATCH=0) or removing
            # PYTHONPATH stores overviews with NO navigation. Restore the model-built
            # template in that ConfigMap (see its header) BEFORE bumping the image or
            # rolling this back, and grep the pod log for "NOT applied" after any change.
            #
            # Rollback of the patch alone (only after the template is restored):
            #   kubectl set env deployment/openviking -n viking PYTHONPATH-
            - name: PYTHONPATH
              value: /ov-nav-patch
          volumeMounts:
            - name: config-out
              mountPath: /app/.openviking/ov.conf
              subPath: ov.conf
              readOnly: true
            - name: nav-patch
              mountPath: /ov-nav-patch
              readOnly: true
            # Directory mount, NOT subPath: a subPath mount never receives
            # ConfigMap updates. PromptManager caches parsed templates in-process
            # with no file watch either way, so a template edit still needs a
            # pod restart — but this removes one of the two staleness traps.
            # /etc/openviking/prompts does not exist in the image, so nothing is
            # shadowed.
            - name: prompt-overrides
              mountPath: /etc/openviking/prompts/semantic
              readOnly: true
            - name: data
              mountPath: /app/data
        - name: ov-exporter
          # Reuses the OV image so the `ov` CLI is available for `ov status`
          # polling. Script is mounted from the openviking-exporter ConfigMap;
          # regenerate via viking/scripts/regen-exporter-configmap.sh.
          # `ov language en` runs once at container start to clear v0.4.x's
          # first-run language gate (the gate persists state under
          # ~/.openviking/, which is the container's HOME).
          image: ghcr.io/volcengine/openviking:v0.4.20
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /tmp/ov
              cat >/tmp/ov/ovcli.conf <<EOF
              {"url": "${OPENVIKING_URL}", "api_key": "${OPENVIKING_KEY}", "account": "default", "user": "noot"}
              EOF
              export OPENVIKING_CLI_CONFIG_FILE=/tmp/ov/ovcli.conf
              ov language en >/dev/null 2>&1 || true
              exec python3 /scripts/ov-exporter.py
          env:
            - name: OPENVIKING_URL
              value: http://localhost:1933
            - name: OPENVIKING_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-api-key
                  # Root key, not user-api-key: the stored user-scoped key went
                  # stale at the June rebuild and every 15s `ov status` poll
                  # 401'd (openviking_up stuck at 0, OpenVikingDown always
                  # firing). ov status needs the root key per the exporter
                  # docs; the CLI config already carries account/user identity
                  # headers for trusted mode. Fixed 2026-07-16 (IMPR-1063
                  # verification follow-up).
                  key: api-key
            - name: AGFS_PATH
              value: /app/data/viking
            - name: POLL_INTERVAL
              value: "15"
            - name: PORT
              value: "9210"
            # IMPR-1095: bucket-level .ovlock classification. Under
            # agfs.backend: s3 the locks live in Garage, so the find-based
            # AGFS_PATH count above is blind (BUG-1039's 269-file drift).
            - name: OVLOCK_S3_BUCKET
              value: openviking-agfs
            - name: OVLOCK_S3_ENDPOINT
              value: http://garage.garage.svc.cluster.local:3900
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          ports:
            - containerPort: 9210
              name: metrics
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          # BUG-1049: the exporter's readinessProbe is removed too, for a
          # reason that is easy to miss — a Pod is Ready only if EVERY
          # container is Ready, so this sidecar gated membership of the same
          # openviking Service as the main container. Worse, it scraped
          # /metrics off OpenViking, so it went slow at exactly the moments
          # OpenViking did: a second ejection path perfectly correlated with
          # the first. Removing only the main container's probe would have
          # left this one still able to pull the pod out of its own Service.
          #
          # Its /health startupProbe and livenessProbe are unchanged; they
          # check the exporter itself, not OpenViking.
          startupProbe:
            httpGet:
              path: /health
              port: 9210
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 9210
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: exporter-script
              mountPath: /scripts
              readOnly: true
            - name: data
              mountPath: /app/data
              readOnly: true
      volumes:
        - name: config-template
          configMap:
            name: openviking-standalone-config
        - name: config-out
          emptyDir: {}
        - name: exporter-script
          configMap:
            name: openviking-exporter
            defaultMode: 0755
        # BUG-1155: overview_generation.yaml only; every other prompt template
        # resolves to the bundled copy via PromptManager's per-file fallback.
        - name: prompt-overrides
          configMap:
            name: openviking-prompt-overrides
        # IMPR-1185 navigation patch (see the PYTHONPATH comment on the main container).
        - name: nav-patch
          configMap:
            name: openviking-nav-patch
            items:
              - key: sitecustomize.py
                path: sitecustomize.py
              - key: ov_nav_patch.py
                path: ov_nav_patch.py
        - name: data
          persistentVolumeClaim:
            claimName: openviking-data
