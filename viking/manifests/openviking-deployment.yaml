---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking
  namespace: viking
  labels:
    app: openviking
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openviking
  template:
    metadata:
      labels:
        app: openviking
    spec:
      terminationGracePeriodSeconds: 15
      affinity:
        nodeAffinity:
          # Patty and Steph are being decommissioned, so prefer the remaining
          # stable general-purpose nodes.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - manu
                      - wemby
            # Actively avoid timmy (unstable AMD GPU node)
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - timmy
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - qwen-summarizer
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: config-rewrite
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              python3 -c "
              import json, os
              conf = json.load(open('/config-template/ov.conf'))
              conf['server']['root_api_key'] = os.environ['API_KEY']
              agfs = conf.get('storage', {}).get('agfs', {})
              if agfs.get('backend', 'local') == 's3':
                  agfs.setdefault('s3', {})
                  agfs['s3']['access_key'] = os.environ['S3_ACCESS_KEY']
                  agfs['s3']['secret_key'] = os.environ['S3_SECRET_KEY']
              else:
                  agfs.pop('s3', None)
              json.dump(conf, open('/config-out/ov.conf', 'w'), indent=2)
              "
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-api-key
                  key: api-key
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config-out
              mountPath: /config-out
        - name: temp-cleanup
          image: busybox:1.37
          command: ["/bin/sh", "-c"]
          args:
            - >-
              echo "Cleaning stale temp files...";
              find /app/data/temp -type f -mtime +1 -delete 2>/dev/null || true;
              find /app/data/temp -type d -empty -delete 2>/dev/null || true;
              echo "Removing stale locks...";
              rm -f /app/data/.openviking.pid;
              rm -f /app/data/vectordb/context/store/LOCK;
              find /app/data/viking -name '.path.ovlock' -delete 2>/dev/null || true;
              echo "Done."
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: openviking
          image: ghcr.io/volcengine/openviking:v0.3.14
          ports:
            - containerPort: 1933
              name: http
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: 1933
            periodSeconds: 3
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 1933
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1933
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: config-out
              mountPath: /app/.openviking/ov.conf
              subPath: ov.conf
              readOnly: true
            - name: data
              mountPath: /app/data
      volumes:
        - name: config-template
          configMap:
            name: openviking-config
        - name: config-out
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: openviking-data
