---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking
  namespace: viking
  labels:
    app: openviking
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openviking
  template:
    metadata:
      labels:
        app: openviking
    spec:
      terminationGracePeriodSeconds: 15
      # Keep the OpenViking data path on timmy while the dedicated CUDA VLM
      # backend on manu owns the NVIDIA GPU.
      nodeSelector:
        kubernetes.io/hostname: timmy
      initContainers:
        - name: config-rewrite
          image: python:3.12-slim
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -c "
              import json, os
              conf = json.load(open('/config-template/ov.conf'))
              conf['server']['root_api_key'] = os.environ['API_KEY']
              agfs = conf.get('storage', {}).get('agfs', {})
              if agfs.get('backend', 'local') == 's3':
                  agfs.setdefault('s3', {})
                  agfs['s3']['access_key'] = os.environ['S3_ACCESS_KEY']
                  agfs['s3']['secret_key'] = os.environ['S3_SECRET_KEY']
              else:
                  agfs.pop('s3', None)
              json.dump(conf, open('/config-out/ov.conf', 'w'), indent=2)
              "
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-api-key
                  key: api-key
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config-out
              mountPath: /config-out
        - name: temp-cleanup
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
          args:
            - echo "Cleaning stale temp files..."; find /app/data/temp -type f -mtime +1 -delete 2>/dev/null || true; find /app/data/temp -type d -empty -delete 2>/dev/null || true; find /app/data/viking/default/temp -type d -empty -delete 2>/dev/null || true; echo "Removing stale locks..."; rm -f /app/data/.openviking.pid; rm -f /app/data/vectordb/context/store/LOCK; find /app/data/viking -name '.path.ovlock' -delete 2>/dev/null || true; echo "Done."
          volumeMounts:
            - name: data
              mountPath: /app/data
        - name: patch-syncdiff
          image: ghcr.io/volcengine/openviking:v0.3.14
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "Patching semantic_processor.py with SyncDiff retry logic..."
              python3 << 'PATCH_EOF'
              import re
              path = "/app/.venv/lib/python3.13/site-packages/openviking/storage/queuefs/semantic_processor.py"
              with open(path) as f:
                  content = f.read()
              # Match the try/except block around _mv_vector_store_l0_l1 using regex
              # to handle the backslash-continued f-string and variable formatting
              pattern = re.compile(
                  r'[ \t]+try:\s+'
                  r'await\s+viking_fs\._mv_vector_store_l0_l1\(\s+'
                  r'root_dir,\s+target_dir,\s+ctx=ctx,\s+lock_handle=lock_handle,\s+\)\s+'
                  r'except\s+Exception\s+as\s+e:\s+'
                  r'logger\.error\([\s\S]+?Failed to move L0/L1[\s\S]+?\)',
                  re.DOTALL
              )
              replacement = (
                  '            import asyncio as _asyncio\n'
                  '            max_retries = 10\n'
                  '            for attempt in range(max_retries + 1):\n'
                  '                try:\n'
                  '                    await viking_fs._mv_vector_store_l0_l1(\n'
                  '                        root_dir,\n'
                  '                        target_dir,\n'
                  '                        ctx=ctx,\n'
                  '                        lock_handle=lock_handle,\n'
                  '                    )\n'
                  '                    break\n'
                  '                except Exception as e:\n'
                  '                    if attempt < max_retries:\n'
                  '                        delay = min(2 ** attempt, 60)\n'
                  '                        logger.warning(\n'
                  '                            f"[SyncDiff] Retry {attempt+1}/{max_retries} "\n'
                  '                            f"L0/L1 move after lock contention ({delay}s): {root_dir}"\n'
                  '                        )\n'
                  '                        await _asyncio.sleep(delay)\n'
                  '                    else:\n'
                  '                        logger.error(\n'
                  '                            f"[SyncDiff] Failed to move L0/L1 index after "\n'
                  '                            f"{max_retries+1} attempts: {root_dir} -> {target_dir}, error={e}"\n'
                  '                        )'
              )
              if pattern.search(content):
                  content = pattern.sub(replacement, content)
                  with open(path, 'w') as f:
                      f.write(content)
                  print("Patch applied successfully")
              else:
                  print("WARNING: Patch target not found")
                  if "_mv_vector_store_l0_l1" in content:
                      print("  Found _mv_vector_store_l0_l1 reference")
                  if "Failed to move L0/L1" in content:
                      print("  Found error message reference")
              PATCH_EOF
              echo "Patch complete."
      containers:
        - name: openviking
          image: ghcr.io/volcengine/openviking:v0.3.14
          ports:
            - containerPort: 1933
              name: http
          resources:
            requests:
              # Single-instance local AGFS keeps indexing, queue work, and file
              # operations in one pod. Keep memory capped so timmy still has
              # headroom for model runtime caches and node-level services.
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "12"
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /health
              port: 1933
            periodSeconds: 3
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 1933
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1933
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          volumeMounts:
            - name: config-out
              mountPath: /app/.openviking/ov.conf
              subPath: ov.conf
              readOnly: true
            - name: data
              mountPath: /app/data
        - name: lock-cleanup
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
          args:
            - |-
              while true; do
                find /app/data/viking -name '.path.ovlock' -delete 2>/dev/null || true;
                find /app/data/viking/default/temp -type d -empty -delete 2>/dev/null || true;
                sleep 300;
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: config-template
          configMap:
            name: openviking-standalone-config
        - name: config-out
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: openviking-data
