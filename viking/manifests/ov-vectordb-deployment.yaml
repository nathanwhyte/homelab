---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ov-vectordb
  namespace: viking
  labels:
    app: ov-vectordb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ov-vectordb
  template:
    metadata:
      labels:
        app: ov-vectordb
    spec:
      nodeSelector:
        kubernetes.io/hostname: timmy
      terminationGracePeriodSeconds: 15
      containers:
        - name: ov-vectordb
          image: ghcr.io/volcengine/openviking:v0.4.10
          command: ["python", "-m", "openviking.storage.vectordb.service.server_fastapi"]
          env:
            - name: VIKINGDB_PERSIST_PATH
              value: /data/vikingdb
          ports:
            - name: http
              containerPort: 5000
          # BUG-1049: single-replica service on OpenViking's indexing path.
          # startupProbe gates joining the Service; nothing tears it out or
          # restarts it afterwards for being slow.
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 3
            failureThreshold: 20
          # readinessProbe removed — with one replica, ejecting it from its own
          # Service turns "slow" into "down" for OpenViking, which is the only
          # caller.
          #
          # livenessProbe was http /health with the DEFAULT 1s timeout and 3
          # failures — a restart after ~48s of slow /health. That is worse than
          # the readiness ejection this bug is about: a restart mid-index drops
          # in-flight work rather than just delaying it. Now TCP-only with a
          # ~5min budget, matching openviking's: it catches a wedged process
          # without ever asking a loaded one to answer HTTP promptly.
          livenessProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: "1"
              # 2026-07-06 (IMPR-1038): 2Gi -> 1Gi; 7d peak 618Mi, limit keeps burst room.
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ov-vectordb-data
