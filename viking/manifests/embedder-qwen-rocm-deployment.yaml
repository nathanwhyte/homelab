---
# Qwen3-Embedding-4B on timmy's RX 9070 XT (ROCm) — RETIRED rollback path.
# See plan: ~/code/compendium/docs/plans/2026-06-22-IDEA-1042-qwen-embedding-deployment.md
#
# Superseded 2026-06-29 by embedder-qwen-cuda (wemby GTX 1060) so timmy's
# 9070 XT is free for Ollama (mem0 LLM extraction). replicas=0; the live
# `embedder-qwen` Service now lives in embedder-qwen-cuda-deployment.yaml
# (selector app=embedder-qwen-cuda). To roll back to ROCm: scale this to 1
# AND repoint the Service selector to app=embedder-qwen-rocm.
# Replaced nomic-embed-text-v1.5 (768 -> 2560 dim, vectordb re-embed in plan Phase 3-4).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embedder-qwen-model-cache
  namespace: viking
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ssd
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder-qwen-rocm
  namespace: viking
  labels:
    app: embedder-qwen-rocm
spec:
  replicas: 0 # retired; superseded by embedder-qwen-cuda on wemby
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: embedder-qwen-rocm
  template:
    metadata:
      labels:
        app: embedder-qwen-rocm
    spec:
      nodeSelector:
        kubernetes.io/hostname: timmy
        gpu.vendor: amd
      securityContext:
        fsGroup: 0
      initContainers:
        - name: model-fetch
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              model_path="/models/${MODEL_FILE}"
              if [ -f "${model_path}" ]; then
                echo "Model already cached: ${model_path}"
              else
                echo "Downloading ${MODEL_FILE}..."
                curl -fL --retry 5 --retry-delay 10 "${MODEL_URL}" -o "${model_path}.tmp"
                mv "${model_path}.tmp" "${model_path}"
                echo "Download complete."
              fi
              ln -sf "${model_path}" /models/current.gguf
              echo "Model ready."
          env:
            - name: MODEL_FILE
              value: Qwen3-Embedding-4B-Q8_0.gguf
            - name: MODEL_URL
              value: https://huggingface.co/Qwen/Qwen3-Embedding-4B-GGUF/resolve/main/Qwen3-Embedding-4B-Q8_0.gguf
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llamacpp
          # ROCm gfx1201 validated: llama/docs/2026-06-28-rocm-gfx1201-validation-baseline.md
          image: ghcr.io/ggml-org/llama.cpp:server-rocm
          env:
            # RDNA4 guardrail: keeps container on discrete RX 9070 XT, not iGPU.
            # Do NOT set HSA_OVERRIDE_GFX_VERSION — gfx1201 is native.
            - name: HIP_VISIBLE_DEVICES
              value: "0"
          command: ["/app/llama-server"]
          args:
            - --model
            - /models/current.gguf
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --embedding
            - --pooling
            - last
            - --ctx-size
            # Total ctx across parallel slots → 8192/slot at --parallel 4,
            # matching OV's embedding.max_input_tokens=8192 so long chunks
            # (e.g. PROJ-012's 1826-token block) don't get rejected with
            # "exceeds available context size". --parallel was 6 but the
            # embedder isn't the bottleneck for this workload (the VLM is),
            # so 4 slots is plenty and gives each slot a full 8k of context.
            - "32768"
            - --n-gpu-layers
            - "999"
            - --parallel
            - "4"
            - --threads
            - "8"
            - --batch-size
            - "4096"
            - --ubatch-size
            - "4096"
            - --split-mode
            - none
            - --main-gpu
            - "0"
            - --flash-attn
            - "on"
            - --metrics
            - --mlock
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "500m"
              # 2026-07-06 (IMPR-1038): 2Gi -> 3Gi; host-RAM 7d peak 4.5Gi (mmap'd GGUF).
              memory: 3Gi
            limits:
              cpu: "8"
              memory: 12Gi
          securityContext:
            privileged: true
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            - name: rocblas-library
              mountPath: /opt/rocm/lib/rocblas/library
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: embedder-qwen-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: rocblas-library
          hostPath:
            path: /opt/rocm-7.2.1/lib/rocblas/library
            type: Directory
# The `embedder-qwen` Service is NOT defined here anymore — it lives in
# embedder-qwen-cuda-deployment.yaml (selector app=embedder-qwen-cuda).
# Keeping it out of this file prevents re-applying the ROCm rollback from
# repointing the Service at a 0-replica deployment. See the header comment
# for the manual repoint steps if ROCm is actually rolled back.
