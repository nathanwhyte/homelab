---
# Qwen3-Embedding-4B on timmy's RX 9070 XT (ROCm) — RETIRED rollback (replicas=0).
# The embedder was relocated to manu's GTX 1080 (CUDA) on 2026-07-17 (IMPR-1077);
# this deployment is kept at replicas=0 as an instant rollback path. Roll back by
# scaling this to 1 and repointing the `embedder-qwen` Service selector back to
# app=embedder-qwen. History below (was primary on timmy 2026-07-06 → 07-17).
# Migrated back 2026-07-06 from wemby's GTX 1060 (CUDA): wemby's charging
# cable/port keeps failing → battery drains → the node hard-drops (repeated
# NodeStatusUnknown flaps overnight 2026-07-05/06). The live OV embedder must
# not sit on a node that loses power intermittently. timmy was the only node
# stable through the incident and its 9070 XT (16 GB) has ample headroom to
# co-reside with Ollama (~5 GB embedder incl. KV; bench proved two embedders +
# Ollama co-resided fine). Backend-invariance validated by TASK-1122: Qwen-4B
# on this exact 9070 XT reproduced the wemby/Metal numbers exactly (55.9/73.5).
# See: benchmarks/embedding-retrieval/benchmark.md.
#
# ROCm gfx1201 validated: llama/docs/2026-06-28-rocm-gfx1201-validation-baseline.md
# The `embedder-qwen` Service now lives in embedder-qwen-service.yaml and selects
# app=embedder-qwen-cuda (the manu/1080 deployment) — it no longer lives in this
# file. embedder-qwen-cuda-deployment.yaml is the live primary (replicas=1).
# Cutover / rollback runbook: viking/docs/2026-07-06-embedder-migration-wemby-to-timmy.md
#
# IMPR-1040: Deployment renamed embedder-qwen-rocm -> embedder-qwen so backend/
# node migrations no longer force a resource rename — backend is expressed via
# the `backend` label and this manifest filename instead.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embedder-qwen-model-cache
  namespace: viking
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ssd
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder-qwen
  namespace: viking
  labels:
    app: embedder-qwen
    backend: rocm
spec:
  replicas: 0 # RETIRED rollback — embedder relocated to manu/GTX 1080 CUDA 2026-07-17 (IMPR-1077); scale to 1 + repoint the Service selector to app=embedder-qwen to roll back
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: embedder-qwen
  template:
    metadata:
      labels:
        app: embedder-qwen
        backend: rocm
    spec:
      nodeSelector:
        kubernetes.io/hostname: timmy
        gpu.vendor: amd
      securityContext:
        fsGroup: 0
      initContainers:
        - name: model-fetch
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              model_path="/models/${MODEL_FILE}"
              if [ -f "${model_path}" ]; then
                echo "Model already cached: ${model_path}"
              else
                echo "Downloading ${MODEL_FILE}..."
                curl -fL --retry 5 --retry-delay 10 "${MODEL_URL}" -o "${model_path}.tmp"
                mv "${model_path}.tmp" "${model_path}"
                echo "Download complete."
              fi
              ln -sf "${model_path}" /models/current.gguf
              echo "Model ready."
          env:
            - name: MODEL_FILE
              value: Qwen3-Embedding-4B-Q8_0.gguf
            - name: MODEL_URL
              value: https://huggingface.co/Qwen/Qwen3-Embedding-4B-GGUF/resolve/main/Qwen3-Embedding-4B-Q8_0.gguf
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server-rocm
          env:
            # RDNA4 guardrail: keeps container on discrete RX 9070 XT, not iGPU.
            # Do NOT set HSA_OVERRIDE_GFX_VERSION — gfx1201 is native.
            - name: HIP_VISIBLE_DEVICES
              value: "0"
          command: ["/app/llama-server"]
          args:
            - --model
            - /models/current.gguf
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --embedding
            - --pooling
            - last
            # ctx 8192 / parallel 1 → full 8192 per slot, matching OV's
            # embedding.max_input_tokens=8192 and the proven wemby prod config.
            # NOT the retired 32768/parallel-4: that KV footprint OOM'd when
            # co-resident with Ollama on this card during the TASK-1122 bench.
            - --ctx-size
            - "8192"
            - --n-gpu-layers
            - "999"
            - --parallel
            - "1"
            - --threads
            - "8"
            # batch 4096 (bench-validated on this 9070 XT) for indexing throughput
            # — higher than wemby's 512, which was 1060-VRAM-constrained. Raises
            # transient memory only; 16 GB leaves Ollama ample room. Lower to 512
            # if Ollama ever contends for VRAM.
            - --batch-size
            - "4096"
            - --ubatch-size
            - "4096"
            - --split-mode
            - none
            - --main-gpu
            - "0"
            - --flash-attn
            - "on"
            - --metrics
            # NO --mlock: timmy is the control-plane node; pinning host RAM on it
            # is disallowed (2026-07-05 incident guardrail). Weights live in VRAM
            # via --n-gpu-layers 999 regardless, so mlock buys nothing here.
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "500m"
              # 2026-07-06 (IMPR-1038): 2Gi -> 3Gi; host-RAM 7d peak 4.5Gi (mmap'd GGUF).
              memory: 3Gi
            limits:
              cpu: "8"
              memory: 12Gi
          securityContext:
            privileged: true
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            - name: rocblas-library
              mountPath: /opt/rocm/lib/rocblas/library
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: embedder-qwen-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: rocblas-library
          hostPath:
            path: /opt/rocm-7.2.1/lib/rocblas/library
            type: Directory
