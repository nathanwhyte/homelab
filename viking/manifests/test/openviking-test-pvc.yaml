---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openviking-test-data
  namespace: viking
  labels:
    app: ov-test
    component: openviking-test
  annotations:
    longhorn.io/number-of-replicas: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn-ssd
  volumeMode: Filesystem
