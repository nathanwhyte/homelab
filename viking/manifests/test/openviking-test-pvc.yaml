---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openviking-test-data
  namespace: viking
  labels:
    app: ov-test
    component: openviking-test
  annotations:
    longhorn.io/number-of-replicas: "1"
    # LIVE Longhorn Volume setting applied on 2026-09-22 with
    # viking/scripts/ov-volume-locality.sh together with the prod pair (see
    # ../openviking-pvc.yaml): best-effort locality only, still 1 replica —
    # throwaway data.
    homelab.nathanwhyte.dev/longhorn-data-locality: best-effort
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn-ssd
  volumeMode: Filesystem
