---
# OpenViking TEST instance, rebuilt 2026-09-21 from openviking-deployment.yaml for
# the IMPR-1185 navigation-patch canary. Replaces the stale v0.3.14 scaffold (and
# its version-coupled patch-syncdiff initContainer).
#
# Differences from prod, all deliberate:
#   * PYTHONPATH=/ov-nav-patch + the ov-nav-patch ConfigMap: sitecustomize.py installs
#     the deterministic Quick Navigation wrapper (nav-patch/ov_nav_patch.py) and the
#     BUG-1176 extraction-retry wrapper (nav-patch/ov_extract_patch.py). Each is guarded
#     on openviking v0.4.20 + a source hash; otherwise stock behaviour, logged.
#   * No ov-exporter sidecar, no NodePort/ingress; ClusterIP only.
#   * Own PVC, own vectordb, own S3 bucket (see ov-test-configmap.yaml).
# It reuses prod's openviking-prompt-overrides ConfigMap, so the canary runs the
# production template.
#
# Rollback of the patch without touching anything else:
#   kubectl set env deployment/openviking-test -n viking PYTHONPATH-
# Teardown: kubectl delete -k viking/manifests/test/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking-test
  namespace: viking
  labels:
    app: openviking-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openviking-test
  template:
    metadata:
      labels:
        app: openviking-test
    spec:
      terminationGracePeriodSeconds: 15
      nodeSelector:
        kubernetes.io/hostname: timmy
      initContainers:
        - name: config-rewrite
          image: python:3.12-slim
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -c "
              import json, os
              conf = json.load(open('/config-template/ov.conf'))
              conf['server']['root_api_key'] = os.environ['API_KEY']
              vlm = conf.get('vlm', {})
              if vlm.get('api_key') == '\${OLLAMA_KEY}':
                  vlm['api_key'] = os.environ.get('OLLAMA_KEY', '')
              agfs = conf.get('storage', {}).get('agfs', {})
              if agfs.get('backend', 'local') == 's3':
                  agfs.setdefault('s3', {})
                  agfs['s3']['access_key'] = os.environ['S3_ACCESS_KEY']
                  agfs['s3']['secret_key'] = os.environ['S3_SECRET_KEY']
              else:
                  agfs.pop('s3', None)
              json.dump(conf, open('/config-out/ov.conf', 'w'), indent=2)
              "
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-api-key
                  key: api-key
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: OLLAMA_KEY
              valueFrom:
                secretKeyRef:
                  name: ollama-api-key
                  key: API_KEY
                  optional: true
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config-out
              mountPath: /config-out
        - name: temp-cleanup
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
          args:
            - echo "Cleaning stale temp files..."; find /app/data/temp -type f -mtime +1 -delete 2>/dev/null || true; find /app/data/temp -type d -empty -delete 2>/dev/null || true; rm -f /app/data/.openviking.pid; rm -f /app/data/vectordb/context/store/LOCK; echo "Done."
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: openviking-test
          image: ghcr.io/volcengine/openviking:v0.4.20
          ports:
            - containerPort: 1933
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          # No readinessProbe, as prod (BUG-1049): startupProbe gates Service membership.
          startupProbe:
            httpGet:
              path: /health
              port: 1933
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 1933
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          env:
            - name: OPENVIKING_PROMPT_TEMPLATES_DIR
              value: /etc/openviking/prompts
            # IMPR-1185: sitecustomize.py on this path installs the nav patch.
            - name: PYTHONPATH
              value: /ov-nav-patch
            # Opt-in capture of each directory's real overview inputs, for tuning
            # the nav glosses offline. Test instance only; drop before prod.
            - name: OV_NAV_PATCH_DUMP
              value: /app/data/navdump
          volumeMounts:
            - name: config-out
              mountPath: /app/.openviking/ov.conf
              subPath: ov.conf
              readOnly: true
            - name: prompt-overrides
              mountPath: /etc/openviking/prompts/semantic
              readOnly: true
            - name: nav-patch
              mountPath: /ov-nav-patch
              readOnly: true
            - name: data
              mountPath: /app/data
      volumes:
        - name: config-template
          configMap:
            name: openviking-test-config
        - name: config-out
          emptyDir: {}
        - name: prompt-overrides
          configMap:
            name: openviking-prompt-overrides
        - name: nav-patch
          configMap:
            name: ov-nav-patch
            items:
              - key: sitecustomize.py
                path: sitecustomize.py
              - key: ov_nav_patch.py
                path: ov_nav_patch.py
              - key: ov_extract_patch.py
                path: ov_extract_patch.py
        - name: data
          persistentVolumeClaim:
            claimName: openviking-test-data
