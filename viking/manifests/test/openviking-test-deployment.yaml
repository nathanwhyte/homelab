---
# REHEARSAL SCAFFOLD — this branch (impr-1152/rehearsal) MUST NOT MERGE.
#
# Rebuilt 2026-09-15 for the v0.4.10 -> v0.4.20 upgrade rehearsal (IMPR-1152
# step 1.3.3, decision D5). Changes from the committed scaffold:
#   - image v0.3.14 -> v0.4.20, pinned to the index digest
#   - patch-syncdiff initContainer DELETED. It patched 0.3.14-era
#     semantic_processor.py source and has no meaning against a 0.4.20 image;
#     this is what the old STALE header warned a blind tag-bump would break.
#   - PVC requests 5Gi -> 10Gi, because a Longhorn restore must match the
#     source volume size and both production PVCs are 10Gi.
#
# The prior header's warning is discharged rather than ignored: it said do not
# blind-bump the tag while the version-coupled source patch is present, and the
# patch is now gone. These edits are throwaway and land nowhere — see D5.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking-test
  namespace: viking
  labels:
    app: openviking-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openviking-test
  template:
    metadata:
      labels:
        app: openviking-test
    spec:
      terminationGracePeriodSeconds: 15
      nodeSelector:
        kubernetes.io/hostname: timmy
      initContainers:
        # Mirrors prod: rewrite API key + inject S3 creds (we use the same
        # secret name `openviking-s3-credentials` to avoid creating a copy).
        - name: config-rewrite
          image: python:3.12-slim
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -c "
              import json, os
              conf = json.load(open('/config-template/ov.conf'))
              conf['server']['root_api_key'] = os.environ['API_KEY']
              agfs = conf.get('storage', {}).get('agfs', {})
              if agfs.get('backend', 'local') == 's3':
                  agfs.setdefault('s3', {})
                  agfs['s3']['access_key'] = os.environ['S3_ACCESS_KEY']
                  agfs['s3']['secret_key'] = os.environ['S3_SECRET_KEY']
              else:
                  agfs.pop('s3', None)
              json.dump(conf, open('/config-out/ov.conf', 'w'), indent=2)
              "
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-api-key
                  key: api-key
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config-out
              mountPath: /config-out
        - name: temp-cleanup
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
          args:
            - echo "Cleaning stale temp files..."; find /app/data/temp -type f -mtime +1 -delete 2>/dev/null || true; find /app/data/temp -type d -empty -delete 2>/dev/null || true; find /app/data/viking/default/temp -type d -empty -delete 2>/dev/null || true; echo "Removing stale locks..."; rm -f /app/data/.openviking.pid; rm -f /app/data/vectordb/context/store/LOCK; find /app/data/viking -name '.path.ovlock' -delete 2>/dev/null || true; echo "Done."
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: openviking-test
          image: ghcr.io/volcengine/openviking:v0.4.20@sha256:b9827753d035f4157b5b318865907fd18f738924ad6398c86feb1182f209825b
          ports:
            - containerPort: 1933
              name: http
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /health
              port: 1933
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 1933
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1933
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          volumeMounts:
            - name: config-out
              mountPath: /app/.openviking/ov.conf
              subPath: ov.conf
              readOnly: true
            - name: data
              mountPath: /app/data
      # No TTL sidecar in this revision: the cluster's image registry
      # can't pull kubectl, and a self-deletion sidecar isn't worth the
      # complexity for a 1-shot test. The operator is expected to
      # `kubectl delete -k viking/manifests/test/` when done; the test
      # docs and validate.sh print a reminder. To add a TTL later,
      # use a `python:3-alpine` image with an in-cluster API call.
      volumes:
        - name: config-template
          configMap:
            name: openviking-test-config
        - name: config-out
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: openviking-test-data
