---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Non-prod OpenViking test stack: validates `agfs:s3` + `vectordb:http`
# together before committing the production cutover.
#
# Apply:  kubectl apply -k viking/manifests/test/
# Teardown: kubectl delete -k viking/manifests/test/
#
# All resources live in the `viking` namespace and use distinct names so
# they cannot collide with the production openviking deployment.
namespace: viking
resources:
  # PVCs are NOT in this bundle for the rehearsal: they must BIND to the
  # Longhorn volumes restored from the 1.2.2 backups, not be provisioned
  # empty by the storage class. Applying the dynamic PVC manifests would
  # give the candidate a blank corpus and the rehearsal would prove nothing.
  # They are created by ov-test-restored-pvcs.yaml instead (step 1.3.2).
  - openviking-test-deployment.yaml
  - openviking-test-service.yaml
  - ov-test-vectordb-deployment.yaml
  - ov-test-vectordb-service.yaml
  - ov-test-configmap.yaml
  # ov-test-bucket-setup.yaml is NOT in this bundle; it's a one-shot Job
  # and should be applied separately (see ov-test-validate.sh).
