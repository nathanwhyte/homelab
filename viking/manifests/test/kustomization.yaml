---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Non-prod OpenViking test stack: validates `agfs:s3` + `vectordb:http`
# together before committing the production cutover.
#
# Apply:  kubectl apply -k viking/manifests/test/
# Teardown: kubectl delete -k viking/manifests/test/
#
# All resources live in the `viking` namespace and use distinct names so
# they cannot collide with the production openviking deployment.
namespace: viking
resources:
  - openviking-test-pvc.yaml
  - openviking-test-deployment.yaml
  - openviking-test-service.yaml
  - ov-test-vectordb-pvc.yaml
  - ov-test-vectordb-deployment.yaml
  - ov-test-vectordb-service.yaml
  - ov-test-configmap.yaml
# IMPR-1185: the navigation patch, mounted on PYTHONPATH by openviking-test.
# disableNameSuffixHash keeps the name stable so a `kubectl set env … PYTHONPATH-`
# rollback and the Deployment's volume reference stay simple; a patch change
# needs a rollout restart.
configMapGenerator:
  - name: ov-nav-patch
    files:
      - nav-patch/sitecustomize.py
      - nav-patch/ov_nav_patch.py
      - nav-patch/ov_extract_patch.py
      - nav-patch/ov_chatlog_patch.py
      - nav-patch/ov_s3_cache_patch.py
      - nav-patch/ov_memory_guard_patch.py
      - nav-patch/ov_event_abstract_patch.py
    options:
      disableNameSuffixHash: true
      labels:
        app: openviking-test
# The test bucket openviking-agfs-test exists in Garage (created 2026-09-15) and is
# readable by the same key as prod's bucket; empty it before a fresh canary.
