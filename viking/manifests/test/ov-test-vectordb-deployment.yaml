---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ov-vectordb-test
  namespace: viking
  labels:
    app: ov-vectordb-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ov-vectordb-test
  template:
    metadata:
      labels:
        app: ov-vectordb-test
    spec:
      nodeSelector:
        kubernetes.io/hostname: timmy
      terminationGracePeriodSeconds: 15
      containers:
        - name: ov-vectordb-test
          image: ghcr.io/volcengine/openviking:v0.4.20@sha256:b9827753d035f4157b5b318865907fd18f738924ad6398c86feb1182f209825b
          command: ["python", "-m", "openviking.storage.vectordb.service.server_fastapi"]
          env:
            - name: VIKINGDB_PERSIST_PATH
              # MUST match production's path. This claim binds
              # ov-test-vdb-restore-20260915, a restore of production's vectordb
              # volume, where the collection lives at /data/vikingdb/default/context.
              # There is no collision to avoid: it is a separate volume from the
              # production ov-vectordb's. Pointing this at a "distinct" path made
              # the service create an empty collection beside the restored one, so
              # every semantic-retrieval check returned total:0 against a corpus
              # that was sitting right there. Same failure mode as the dynamic-PVC
              # problem in 1.3.4 — the rehearsal appears to pass while proving
              # nothing.
              value: /data/vikingdb
          ports:
            - name: http
              containerPort: 5000
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ov-vectordb-test-data
