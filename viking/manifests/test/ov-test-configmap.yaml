---
# Test-instance ov.conf, rebuilt 2026-09-21 from openviking-standalone-configmap.yaml
# (IMPR-1185 canary). Same shape as prod, with three deliberate differences:
#   * agfs bucket  openviking-agfs-test   (prod: openviking-agfs)
#   * vectordb     ov-vectordb-test, collection context_test   (prod: ov-vectordb / context)
#   * no public_base_url and no prometheus exporter
#
# 2026-09-25 (ov-test-vectordb-repair): two test-only fixes so memory records are
# writable and readable again —
#   * collection renamed context-test -> context_test: the vectordb service's
#     validate_name_str rejects hyphens ("name can only contain letters, numbers
#     and underscore"), so every CreateVikingdbCollection call for "context-test"
#     failed server-side (error code 1000004) while the client logged a false
#     "Created collection" success. The collection never existed on disk
#     (confirmed: no context-test/ dir under /data/test/vikingdb/default/,
#     ListVikingdbCollection returned an empty list), so no write was ever
#     actually persisted or readable. Prod's collection name "context" has no
#     hyphen and is unaffected — this is a test-config-only defect.
#   * embedding.max_input_tokens lowered 8192 -> 7000: OpenViking's local
#     truncation heuristic (utils/embedding_input.py, ~4 chars/token, CJK-aware)
#     undercounts markdown-heavy compendium content relative to the actual
#     qwen3-embedding-4b BPE tokenizer by 5-13% in observed failures (n_prompt_tokens
#     9038/9282/8598 against embedder ctx-size 8192), tripping the embedding
#     circuit breaker and stalling the (max_concurrent=1) embedding queue behind
#     it. Prod uses the identical value/heuristic/endpoint, so this is a
#     test-side safety margin, not a shared-embedder fix.
# The embedder and the VLM are the SAME services prod uses (qwen3-embedding-4b on
# manu, gemma4:vlm via chat-ollama on timmy). Test generation therefore shares
# timmy's single VLM slot with prod; keep canary runs short and serial.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openviking-test-config
  namespace: viking
  labels:
    app: ov-test
data:
  ov.conf: |
    {
      "default_account": "default",
      "default_user": "noot",
      "storage": {
        "workspace": "/app/data",
        "vectordb": {
          "backend": "http",
          "name": "context_test",
          "dimension": 2560,
          "url": "http://ov-vectordb-test.viking.svc.cluster.local:5000"
        },
        "agfs": {
          "backend": "s3",
          "s3": {
            "bucket": "openviking-agfs-test",
            "endpoint": "http://garage.garage.svc.cluster.local:3900",
            "region": "garage",
            "access_key": "${S3_ACCESS_KEY}",
            "secret_key": "${S3_SECRET_KEY}",
            "use_path_style": true
          }
        }
      },
      "git": {
        "enabled": false
      },
      "rerank": {
        "threshold": 0.2
      },
      "server": {
        "host": "0.0.0.0",
        "port": 1933,
        "workers": 1,
        "root_api_key": "${API_KEY}",
        "auth_mode": "trusted",
        "temp_upload": {
          "default_mode": "local"
        }
      },
      "log": {
        "level": "INFO",
        "output": "stdout"
      },
      "embedding": {
        "max_input_tokens": 7000,
        "dense": {
          "provider": "openai",
          "model": "qwen3-embedding-4b",
          "api_key": "sk-no-key-required",
          "api_base": "http://embedder-qwen.viking.svc.cluster.local:8080/v1",
          "dimension": 2560,
          "batch_size": 256
        },
        "max_concurrent": 1
      },
      "semantic": {
        "overview_max_chars": 20000,
        "abstract_max_chars": 256,
        "overview_sample_limit": 105
      },
      "vlm": {
        "provider": "openai",
        "model": "gemma4:vlm",
        "api_key": "${OLLAMA_KEY}",
        "api_base": "http://chat-ollama.llama.svc.cluster.local:11434/v1",
        "max_concurrent": 1,
        "timeout": 600
      }
    }
