---
# LAN-only NodePort for OpenViking API + MCP.
# Reachable on any node IP at port 31933; protected by OV root API key.
# Complements the ClusterIP service used inside the cluster and the
# Cloudflare tunnel used for public web access.
apiVersion: v1
kind: Service
metadata:
  name: openviking-lan
  namespace: viking
spec:
  type: NodePort
  ports:
    - name: http
      port: 1933
      targetPort: 1933
      nodePort: 31933
      protocol: TCP
    # The ov-exporter sidecar, so each Mac's ov-telemetry-push.py can POST
    # hook delivery totals to /client-telemetry (root API key required). This
    # also puts the exporter's unauthenticated GET /metrics on the LAN, which
    # holds nothing beyond what Grafana already shows.
    - name: client-telemetry
      port: 9210
      targetPort: 9210
      nodePort: 31934
      protocol: TCP
  selector:
    app: openviking
