apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-rocm-model-cache
  namespace: viking
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ssd
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp-rocm
  namespace: viking
  labels:
    app: llamacpp-rocm
spec:
  # Idle default is 0: the VLM holds ~9 GB resident and is only needed during
  # indexing (L0/L1 generation). Bring it up on demand with
  # `viking/tools/ov-vlm.sh run -- <index command>`, which scales it back to 0
  # after the OV index queue drains. Re-applying this manifest will scale it
  # back to 0, so do indexing through the wrapper rather than `kubectl apply`.
  replicas: 0
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llamacpp-rocm
  template:
    metadata:
      labels:
        app: llamacpp-rocm
        vlm-pool: "true"
    spec:
      nodeSelector:
        kubernetes.io/hostname: timmy
        gpu.vendor: amd
      securityContext:
        fsGroup: 0
      initContainers:
        - name: model-fetch
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              model_path="/models/${MODEL_FILE}"
              if [ -f "${model_path}" ]; then
                echo "Model already cached: ${model_path}"
              else
                echo "Downloading ${MODEL_FILE}..."
                curl -fL --retry 5 --retry-delay 10 "${MODEL_URL}" -o "${model_path}.tmp"
                mv "${model_path}.tmp" "${model_path}"
                echo "Download complete."
              fi
              ln -sf "${model_path}" /models/current.gguf
              echo "Model ready."
          env:
            - name: MODEL_FILE
              value: Qwen_Qwen3-8B-IQ4_XS.gguf
            - name: MODEL_URL
              value: https://huggingface.co/bartowski/Qwen_Qwen3-8B-GGUF/resolve/main/Qwen_Qwen3-8B-IQ4_XS.gguf
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server-rocm
          env:
            - name: HIP_VISIBLE_DEVICES
              value: "0"
          command: ["/app/llama-server"]
          args:
            - --model
            - /models/current.gguf
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --ctx-size
            - "57344"
            - --n-gpu-layers
            - "999"
            - --parallel
            - "6"
            - --threads
            - "8"
            - --cache-type-k
            - q4_0
            - --cache-type-v
            - q4_0
            - --cont-batching
            - --batch-size
            - "2048"
            - --ubatch-size
            - "2048"
            - --split-mode
            - none
            - --main-gpu
            - "0"
            - --flash-attn
            - "on"
            - --metrics
            - --reasoning-format
            - deepseek
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 20Gi
          securityContext:
            privileged: true
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            - name: rocblas-library
              mountPath: /opt/rocm/lib/rocblas/library
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llama-rocm-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: rocblas-library
          hostPath:
            path: /opt/rocm-7.2.1/lib/rocblas/library
            type: Directory
