---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openviking-config
  namespace: viking
data:
  ov.conf: |
    {
      "default_account": "default",
      "default_user": "noot",
      "storage": {
        "workspace": "/app/data",
        "vectordb": {
          "backend": "local",
          "name": "context",
          "dimension": 768
        },
        "agfs": {
          "backend": "s3",
          "s3": {
            "bucket": "openviking-agfs",
            "endpoint": "http://garage.garage.svc.cluster.local:3900",
            "region": "garage",
            "access_key": "${S3_ACCESS_KEY}",
            "secret_key": "${S3_SECRET_KEY}",
            "use_path_style": true
          }
        }
      },
      "code": {
        "code_summary_mode": "ast"
      },
      "rerank": {
        "threshold": 0.2
      },
      "server": {
        "host": "0.0.0.0",
        "port": 1933,
        "workers": 1,
        "root_api_key": "${API_KEY}"
      },
      "log": {
        "level": "INFO",
        "output": "stdout"
      },
      "embedding": {
        "max_input_tokens": 1900,
        "dense": {
          "provider": "openai",
          "model": "nomic-embed-text-v1.5",
          "api_key": "sk-no-key-required",
          "api_base": "http://embedder-llamacpp.viking.svc.cluster.local:8080/v1",
          "dimension": 768,
          "batch_size": 128
        },
        "max_concurrent": 4
      },
      "vlm": {
        "provider": "litellm",
        "model": "ollama/qwen3:8b",
        "api_key": "sk-no-key-required",
        "api_base": "http://ollama.llama.svc.cluster.local:11434",
        "max_concurrent": 2
      }
    }
