---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder-llamacpp
  namespace: viking
  labels:
    app: embedder-llamacpp
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Single-GPU node: can't surge a 2nd pod onto the one GPU during in-place
      # updates. (A temporary maxUnavailable:0/maxSurge:1 was used for the
      # 2026-06-06 cross-node move manu→wemby, then reverted to this.)
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: embedder-llamacpp
  template:
    metadata:
      labels:
        app: embedder-llamacpp
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: wemby
        gpu: "true"
      securityContext:
        fsGroup: 0
      initContainers:
        - name: model-fetch
          image: curlimages/curl:8.12.1
          env:
            - name: MODEL_FILE
              value: nomic-embed-text-v1.5.f16.gguf
            - name: MODEL_URL
              value: https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.f16.gguf
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - /bin/sh
            - -c
          args:
            - >-
              set -eu;
              model="/models/${MODEL_FILE}";
              if [ -f "${model}" ]; then
                echo "Embedding model already present in cache.";
              else
                echo "Downloading embedding model from ${MODEL_URL}...";
                curl -fL --retry 5 --retry-delay 5 "${MODEL_URL}" -o "${model}";
                echo "Download complete.";
              fi
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          command:
            - /app/llama-server
          args:
            - --model
            - /models/nomic-embed-text-v1.5.f16.gguf
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --embedding
            - --pooling
            - mean
            - --n-gpu-layers
            - "999"
            - --ctx-size
            - "16384"
            - --parallel
            - "8"
            - --batch-size
            - "4096"
            - --ubatch-size
            - "4096"
            - --rope-scaling
            - yarn
            - --rope-freq-scale
            - "0.75"
            - --mlock
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 6Gi
              nvidia.com/gpu: "1"
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: wemby-model-cache
