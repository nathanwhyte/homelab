---
# BUG-1220: RBAC for the ov-lock-watchdog CronJob, which restarts
# deploy/openviking when ONE lock has been held by the SAME lease for hours.
# It reads the Deployment (settled? last restartedAt?), finds the one live
# openviking pod, reads its container log (the ragfs::lock::manager refresh
# lines carry lease_ref), and PATCHes the kubectl restartedAt annotation, which
# is all `kubectl rollout restart` does. The Job image has no kubectl.
#
# Scope, deliberately the least that works:
#   - deployments/openviking: get + patch, resourceNames-scoped to the ONE
#     Deployment. No update, no delete, no other Deployment.
#   - pods get/list and pods/log get, read-only. `list` cannot be
#     resourceName-scoped (the pod name changes on every rollout), so this is
#     namespace-wide read of pods and their logs in viking, the same grant and
#     the same reason as compendium/sync-rbac.yaml (BUG-1181, homelab#207). No
#     exec, attach, port-forward, delete, secrets or configmaps.
# It never touches a lock file: locks live in the Garage bucket, and this
# ServiceAccount holds no S3 credentials.
#
# Verify after applying (each should print the answer on the right):
#   kubectl auth can-i patch deployments/openviking -n viking \
#     --as=system:serviceaccount:viking:ov-lock-watchdog              # yes
#   kubectl auth can-i patch deployments/ov-vectordb -n viking \
#     --as=system:serviceaccount:viking:ov-lock-watchdog              # no
#   kubectl auth can-i delete pods -n viking \
#     --as=system:serviceaccount:viking:ov-lock-watchdog              # no
#   kubectl auth can-i get secrets -n viking \
#     --as=system:serviceaccount:viking:ov-lock-watchdog              # no
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ov-lock-watchdog
  namespace: viking
  labels:
    app.kubernetes.io/name: openviking
    app.kubernetes.io/component: ov-lock-watchdog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ov-lock-watchdog
  namespace: viking
  labels:
    app.kubernetes.io/name: openviking
    app.kubernetes.io/component: ov-lock-watchdog
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["openviking"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ov-lock-watchdog
  namespace: viking
  labels:
    app.kubernetes.io/name: openviking
    app.kubernetes.io/component: ov-lock-watchdog
subjects:
  - kind: ServiceAccount
    name: ov-lock-watchdog
    namespace: viking
roleRef:
  kind: Role
  name: ov-lock-watchdog
  apiGroup: rbac.authorization.k8s.io
