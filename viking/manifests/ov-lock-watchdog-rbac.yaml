---
# BUG-1220: RBAC for the ov-lock-watchdog CronJob, which restarts
# deploy/openviking when ONE lock has been held by the SAME owner for hours.
# It reads the Deployment (settled? last restartedAt?) and PATCHes the kubectl
# restartedAt annotation, which is all `kubectl rollout restart` does. The Job
# image has no kubectl.
#
# Scope, deliberately the least that works:
#   - deployments/openviking: get + patch, resourceNames-scoped to the ONE
#     Deployment. No update, no delete, no other Deployment.
#   - Nothing else: no pods or pods/log since BUG-1282, because the lock
#     evidence comes from ov-exporter over HTTP, and no exec, attach,
#     port-forward, delete, secrets or configmaps.
# It never touches a lock file: locks live in the Garage bucket, and this
# ServiceAccount holds no S3 credentials.
#
# Verify after applying (each should print the answer on the right):
#   kubectl auth can-i patch deployments/openviking -n viking \
#     --as=system:serviceaccount:viking:ov-lock-watchdog              # yes
#   kubectl auth can-i patch deployments/ov-vectordb -n viking \
#     --as=system:serviceaccount:viking:ov-lock-watchdog              # no
#   kubectl auth can-i get pods --subresource=log -n viking \
#     --as=system:serviceaccount:viking:ov-lock-watchdog              # no
#   kubectl auth can-i get secrets -n viking \
#     --as=system:serviceaccount:viking:ov-lock-watchdog              # no
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ov-lock-watchdog
  namespace: viking
  labels:
    app.kubernetes.io/name: openviking
    app.kubernetes.io/component: ov-lock-watchdog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ov-lock-watchdog
  namespace: viking
  labels:
    app.kubernetes.io/name: openviking
    app.kubernetes.io/component: ov-lock-watchdog
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["openviking"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ov-lock-watchdog
  namespace: viking
  labels:
    app.kubernetes.io/name: openviking
    app.kubernetes.io/component: ov-lock-watchdog
subjects:
  - kind: ServiceAccount
    name: ov-lock-watchdog
    namespace: viking
roleRef:
  kind: Role
  name: ov-lock-watchdog
  apiGroup: rbac.authorization.k8s.io
