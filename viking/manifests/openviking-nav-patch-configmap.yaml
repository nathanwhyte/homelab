        if not phase2_ok:
            logger.warning("ov-nav-patch: phase 2 self-check failed; phase 1 only")

        async def _generate_overview(
            self,
            dir_uri,
            file_summaries,
            children_abstracts,
            llm_sem=None,
            total_files=None,
            total_children=None,
            ctx=None,
