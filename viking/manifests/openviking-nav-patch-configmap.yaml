                    out = await generate_brief_overview(
                        module,
                        self,
                        dir_uri,
                        file_summaries,
                        children_abstracts,
                        total_files,
                        total_children,
                        ctx,
                    )
                except Exception:
                    logger.exception(
                        "ov-nav-patch: phase 2 failed for %s; falling back to phase 1",
                        dir_uri,
                    )
                    out = None
                if out is not None:
                    dump_inputs(
                        dir_uri,
                        file_summaries,
                        children_abstracts,
                        total_files,
                        total_children,
                        "",
                        out,
                    )
                    return out
            raw = await orig(
                self,
                dir_uri,
                file_summaries,
                children_abstracts,
                llm_sem,
                total_files,
                total_children,
                ctx=ctx,
            )
            try:
                cap = module.get_openviking_config().semantic.overview_max_chars
                out = assemble(
                    self,
                    raw,
                    dir_uri,
                    file_summaries,
                    children_abstracts,
                    total_files,
                    total_children,
                    cap,
                )
            except Exception:
                logger.exception(
                    "ov-nav-patch: assemble failed for %s; returning stock output", dir_uri
                )
                return raw
            dump_inputs(
                dir_uri,
                file_summaries,
                children_abstracts,
                total_files,
                total_children,
                raw,
                out,
            )
            return out

        _generate_overview._ov_nav_patch = True
        _generate_overview.__wrapped__ = orig
        cls._generate_overview = _generate_overview
        logger.warning(
            "ov-nav-patch: applied to SemanticProcessor._generate_overview (pid %s, phase 2 %s)",
            os.getpid(),
            "on" if phase2_ok else "off",
        )
