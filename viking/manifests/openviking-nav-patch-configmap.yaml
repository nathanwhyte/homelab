        for token in text.split():
            if len(" ".join(tokens + [token])) + 1 > budget:
                break
            tokens.append(token)
        tokens = _trim_tail(_clause_cut(tokens), truncated=True)
        return _as_sentence(" ".join(tokens))


    def entry_body(summary: str, budget: int, name: str | None = None) -> str:
        """The cached summary body for one entry: framing stripped, clipped to ``budget``.

        Idempotent: ``entry_body(entry_body(s, b), b) == entry_body(s, b)``, so a body
        read back from the cache and rebuilt on the next regeneration does not drift.
        """
        if budget <= 0:
            return ""
        sentences = [s for s in SENTENCE_END.split(_clean(summary)) if s.strip()]
        first = ""
        while sentences and (not first or _is_name(first, name)):
            first = _phrase(SECOND_LEAD_IN.sub("", sentences.pop(0).strip()))
        if _is_name(first, name):
            first = ""
        if _weak(first) and sentences:
            second = _phrase(SECOND_LEAD_IN.sub("", sentences[0].strip()))
            if second and not _weak(second):
                first = second
                sentences.pop(0)
        parts = [_as_sentence(first)] + [
            _as_sentence(s) for s in sentences if not STRUCTURE_SENTENCE.match(s.strip())
        ]
        return clip_body(" ".join(p for p in parts if p), min(budget, MAX_BODY_CHARS))


    def _contents_entries(processor, dir_uri, file_summaries, children_abstracts):
        entries = []
        for item in file_summaries:
            target = processor._markdown_link_target(dir_uri, item["name"])
            entries.append(
                (f"### [{item['name']}]({target})", item.get("summary", ""), item["name"])
            )
        for item in children_abstracts:
            target = processor._markdown_link_target(dir_uri, item["name"])
            entries.append(
                (f"### [{item['name']}/]({target})", item.get("abstract", ""), item["name"])
            )
        return entries


    def build_contents(
        processor, dir_uri: str, file_summaries, children_abstracts, space: int
    ) -> tuple[str, int]:
        """``(block, entries_listed)``: the entry list, always within ``space`` chars.

        Tiers, each tried only when the one before cannot fit: one H3 per entry with a
        summary body sized to the space; H3s without bodies; a compact ``- [name](uri)``
        list; that list cut to what fits. Headings alone can exceed the cap (105 long file
        names), and the stock size limit would then cut every link away (Codex P2,
        2026-09-24), so the result never relies on it.
        """
        entries = _contents_entries(processor, dir_uri, file_summaries, children_abstracts)
        if not entries:
            return "", 0
        fixed = len(CONTENTS_HEADING) + sum(len(h) + 4 for h, _, _ in entries)
        budget = (space - fixed) // len(entries)
        while budget >= MIN_BODY_CHARS:
            blocks = [CONTENTS_HEADING]
            for heading, summary, name in entries:
                body = entry_body(summary, budget, name)
                blocks.append(f"{heading}\n\n{body}" if body else heading)
            text = "\n\n".join(blocks)
            if len(text) <= space:
                return text, len(entries)
            budget -= max(1, (len(text) - space) // len(entries) + 1)
        text = "\n\n".join([CONTENTS_HEADING] + [h for h, _, _ in entries])
        if len(text) <= space:
            return text, len(entries)
        lines = [f"- {h.removeprefix('### ')}" for h, _, _ in entries]
        listed: list[str] = []
        used = len(CONTENTS_HEADING) + 2
        for line in lines:
            if used + len(line) + 1 > space:
                break
            listed.append(line)
            used += len(line) + 1
        if not listed:
            return "", 0
        return "\n\n".join([CONTENTS_HEADING, "\n".join(listed)]), len(listed)


    def build_brief_prompt(
        dir_uri: str,
        file_summaries,
        children_abstracts,
        total_files: int,
        total_children: int,
        output_language: str,
    ) -> str:
        lines = []
        for item in file_summaries:
            g = gloss(item.get("summary", ""), BRIEF_GLOSS_WORDS, item["name"])
            lines.append(f"- {item['name']}" + (f": {g}" if g else ""))
        for item in children_abstracts:
            g = gloss(item.get("abstract", ""), BRIEF_GLOSS_WORDS, item["name"])
            lines.append(f"- {item['name']}/ (subdirectory)" + (f": {g}" if g else ""))
        total = total_files + total_children
        provided = len(file_summaries) + len(children_abstracts)
        hint = (
            f" Only {provided} of the {total} entries are shown; hedge any generalization"
            ' ("the sample shows …").'
            if provided < total
            else ""
        )
        return BRIEF_PROMPT.format(
            output_language=output_language,
            dir_name=dir_uri.rstrip("/").split("/")[-1],
            coverage_hint=hint,
            entries="\n".join(lines) or "None",
        )


    def sanitize_brief(processor, raw: str) -> str:
        """Plain prose from the model's reply: no headings, lists, tables or links.

        The brief is the prose before the first heading that follows some prose, so a
        leading H1 or "## Brief Description" is skipped and anything the model wrote in
        later sections is dropped.
        """
        kept: list[str] = []
        for line in (raw or "").splitlines():
            stripped = line.strip()
            if stripped.startswith("#"):
                if kept:
                    break
                continue
            if (
                stripped
                and not stripped.startswith(("|", ">", "```"))
                and not re.match(r"^(?:[-*+]|\d+[.)])\s", stripped)
            ):
                kept.append(stripped)
        text = " ".join(kept)
        text = MARKDOWN_LINK.sub(r"\1", text)
        text = re.sub(r"\S*viking://\S*", "", text).replace("**", "")
        text = BRIEF_LABEL.sub("", re.sub(r"\s+", " ", text).strip())
        if any(marker in text for marker in FAILURE_MARKERS):
            return ""
        if text and text[-1] not in ".!?。？！":
            ends = [m.end() for m in re.finditer(r"[.!?。？！](?=\s|$)", text)]
            text = text[: ends[-1]] if ends else ""  # cut off by max_tokens mid-sentence
        return processor._truncate_generated_text(text.strip(), BRIEF_MAX_CHARS)


    def assemble_contents(
        processor,
        raw_brief: str,
        dir_uri: str,
        file_summaries,
        children_abstracts,
        total_files: int | None,
        total_children: int | None,
        cap: int,
    ) -> str:
        """Pure transform: model brief + inputs into the Phase 2 layout, within ``cap``."""
        total_files = len(file_summaries) if total_files is None else total_files
        total_children = (
            len(children_abstracts) if total_children is None else total_children
        )
        provided = len(file_summaries) + len(children_abstracts)
        brief = sanitize_brief(processor, raw_brief)
        name = dir_uri.rstrip("/").split("/")[-1]
        head = (
            f"# {name}\n\n{brief}"
            if brief
            else fallback_head(dir_uri, total_files, total_children)
        )
        # Reserve the longest coverage sentence any listed count can produce (digit counts
        # vary: "105 … 894" is longer than "0 … 999", Codex P2 round 2), build the list, then
        # state how many entries it really holds. The loop is a backstop: the result must
        # never depend on the stock tail-cut, which removes links from the end.
        reserve = max(
            len(build_coverage(total_files, total_children, k, where="below"))
            for k in range(provided + 1)
        )
        space = cap - len(head) - reserve - 4
        while True:
            contents, listed = build_contents(
                processor, dir_uri, file_summaries, children_abstracts, space
            )
            coverage = build_coverage(
                total_files, total_children, min(listed, provided), where="below"
            )
            fixed = f"{head}\n\n{coverage}"
            out = f"{fixed}\n\n{contents}" if contents else fixed
            if len(out) <= cap or space <= 0:
                return out
            space -= len(out) - cap


    def _accepts_max_tokens(func) -> bool:
        try:
            return "max_tokens" in inspect.signature(func).parameters
        except (TypeError, ValueError):
            return False


    def _output_language(config, text: str) -> str:
        try:
            from openviking.session.memory.utils.language import resolve_output_language

            return resolve_output_language(text, config=config)
        except Exception:  # noqa: BLE001 — language detection is best-effort
            return "en"


    async def generate_brief_overview(
        module, processor, dir_uri, file_summaries, children_abstracts, tf, tc
    ):
        """Phase 2 replacement body. Returns None when the VLM is unavailable."""
        import contextlib

        config = module.get_openviking_config()
        vlm = config.vlm
        if not vlm.is_available():
            return None
        tf = len(file_summaries) if tf is None else tf
        tc = len(children_abstracts) if tc is None else tc
        language = _output_language(
            config,
            "\n".join(
                [x.get("summary", "") for x in file_summaries]
                + [x.get("abstract", "") for x in children_abstracts]
            )
            or dir_uri,
        )
        prompt = build_brief_prompt(
            dir_uri, file_summaries, children_abstracts, tf, tc, language
        )
        kwargs = (
            {"max_tokens": BRIEF_MAX_TOKENS}
            if _accepts_max_tokens(vlm.get_completion_async)
            else {}
        )
        stage = getattr(module, "bind_telemetry_stage", None)
        raw = ""
        try:
            with stage("resource_summarize") if stage else contextlib.nullcontext():
                raw = await vlm.get_completion_async(prompt, **kwargs)
        except Exception:
            logger.exception(
                "ov-nav-patch: brief generation failed for %s; code brief used", dir_uri
            )
        cap = config.semantic.overview_max_chars
        return assemble_contents(
            processor,
            raw if isinstance(raw, str) else "",
            dir_uri,
            file_summaries,
            children_abstracts,
            tf,
            tc,
            cap,
        )


    def phase2_self_check(cls) -> bool:
        """Round-trip a Phase 2 overview through the installed parsers.

        Phase 2 relies on ``_parse_overview_md`` keying linked H3s to the entry name and
        on ``_extract_abstract_from_overview`` returning the brief; if either no longer
        holds, Phase 2 stays off and Phase 1 is used.
        """
        try:
            p = object.__new__(cls)
            fs = [
                {"name": "a.md", "summary": "Alpha entry about caching. It has detail."},
                {"name": "b c.md", "summary": "Beta entry."},
            ]
            cs = [{"name": "sub", "abstract": "Subdirectory with archived entries."}]
            doc = assemble_contents(
                p, "Brief prose.", "viking://resources/x/d", fs, cs, None, None, 20000
            )
            cache = p._parse_overview_md(doc)
            return (
                cache.get("a.md") == "Alpha entry about caching. It has detail."
                and cache.get("b c.md") == "Beta entry."
                and p._extract_abstract_from_overview(doc) == "Brief prose."
            )
        except Exception:
            logger.exception("ov-nav-patch: phase 2 self-check raised")
            return False


    def _source_hash(func) -> str | None:
        try:
            return hashlib.sha256(inspect.getsource(func).encode()).hexdigest()
        except (OSError, TypeError):
            return None


    def dump_inputs(
        dir_uri, file_summaries, children_abstracts, total_files, total_children, raw, out
    ) -> None:
        """Opt-in capture of one generation's real inputs, for tuning the glosses offline.

        Writes nothing unless OV_NAV_PATCH_DUMP names a directory, and never raises:
        a dump failure must not affect the overview that is returned.
        """
        target = os.environ.get("OV_NAV_PATCH_DUMP")
        if not target:
            return
        try:
            import json
            import time

            os.makedirs(target, exist_ok=True)
            slug = re.sub(r"[^A-Za-z0-9]+", "_", dir_uri)[-120:]
            path = os.path.join(target, f"{slug}-{time.time_ns()}-{os.getpid()}.json")
            with open(path, "w", encoding="utf-8") as fh:
                json.dump(
                    {
                        "dir_uri": dir_uri,
                        "file_summaries": list(file_summaries),
                        "children_abstracts": list(children_abstracts),
                        "total_files": total_files,
                        "total_children": total_children,
                        "raw": raw,
                        "out": out,
                    },
                    fh,
                    ensure_ascii=False,
                )
        except Exception:
            logger.exception("ov-nav-patch: input dump failed for %s", dir_uri)


    def apply(module) -> bool:
        """Patch ``module.SemanticProcessor._generate_overview`` in place; True if applied."""
        if os.environ.get("OV_NAV_PATCH", "1") == "0":
            logger.warning("ov-nav-patch: disabled by OV_NAV_PATCH=0")
            return False
        import openviking

        version = getattr(openviking, "__version__", None)
        cls = getattr(module, "SemanticProcessor", None)
        orig = getattr(cls, "_generate_overview", None)
        if getattr(orig, "_ov_nav_patch", False):
            return True
        digest = _source_hash(orig) if orig else None
        if version != EXPECTED_VERSION or digest != EXPECTED_SOURCE_SHA256:
            logger.warning(
                "ov-nav-patch: NOT applied (version=%r source_sha256=%s); stock overview behaviour kept",
                version,
                digest,
            )
            return False

        phase2_ok = phase2_self_check(cls)
        if not phase2_ok:
            logger.warning("ov-nav-patch: phase 2 self-check failed; phase 1 only")

        async def _generate_overview(
            self,
            dir_uri,
            file_summaries,
            children_abstracts,
            llm_sem=None,
            total_files=None,
            total_children=None,
        ):
            if phase2_ok and phase2_enabled(dir_uri):
                try:
                    out = await generate_brief_overview(
                        module,
                        self,
                        dir_uri,
                        file_summaries,
                        children_abstracts,
                        total_files,
                        total_children,
                    )
                except Exception:
                    logger.exception(
                        "ov-nav-patch: phase 2 failed for %s; falling back to phase 1",
                        dir_uri,
                    )
                    out = None
                if out is not None:
                    dump_inputs(
                        dir_uri,
                        file_summaries,
                        children_abstracts,
                        total_files,
                        total_children,
                        "",
                        out,
                    )
                    return out
            raw = await orig(
                self,
                dir_uri,
                file_summaries,
                children_abstracts,
                llm_sem,
                total_files,
                total_children,
            )
            try:
                cap = module.get_openviking_config().semantic.overview_max_chars
                out = assemble(
                    self,
                    raw,
                    dir_uri,
                    file_summaries,
                    children_abstracts,
                    total_files,
                    total_children,
                    cap,
                )
            except Exception:
                logger.exception(
                    "ov-nav-patch: assemble failed for %s; returning stock output", dir_uri
                )
                return raw
            dump_inputs(
                dir_uri,
                file_summaries,
                children_abstracts,
                total_files,
                total_children,
                raw,
                out,
            )
            return out

        _generate_overview._ov_nav_patch = True
        _generate_overview.__wrapped__ = orig
        cls._generate_overview = _generate_overview
        logger.warning(
            "ov-nav-patch: applied to SemanticProcessor._generate_overview (pid %s, phase 2 %s)",
            os.getpid(),
            "on" if phase2_ok else "off",
        )
        return True
  ov_s3_cache_patch.py: |
    """Disable RAGFS's process-local S3 metadata cache on v0.4.20 (BUG-1174).

    A cached negative stat survives another worker's mkdir. The lock manager then
    gets AlreadyExists from mkdir and the same stale NotFound from its verification
    stat, failing a valid session commit. The cache also has a sliding TTL, so polling
    can retain a stale result indefinitely. The Rust plugin supports cache_enabled,
    but v0.4.20's Python config serializer does not expose it. Set that existing
    plugin option at the serializer boundary; locks and their errors stay intact.

    This disables both S3 stat and list caches, trading metadata requests for correct
    cross-process visibility. Other storage backends and the separate RAGFS runtime
    cache are unchanged. Version/source guarded; OV_S3_CACHE_PATCH=0 rolls back.
    """

    import functools
    import hashlib
    import inspect
    import logging
    import os

    EXPECTED_VERSION = "v0.4.20"
    EXPECTED_SHA256 = "3dd278b535bd5059e7eb09d58642560721c41fc8ccde403e1150c6282d0151e9"
    logger = logging.getLogger("ov_s3_cache_patch")


    def without_metadata_cache(original):
        @functools.wraps(original)
        def serialize(config):
            params = dict(original(config))
            params["cache_enabled"] = False
            return params

        serialize._ov_s3_cache_patch = True
        return serialize


    def apply(module):
        if os.environ.get("OV_S3_CACHE_PATCH", "1") == "0":
            logger.warning("ov-s3-cache-patch: disabled by OV_S3_CACHE_PATCH=0")
            return False
        import openviking

        original = getattr(module, "_serialize_s3_plugin_params", None)
        if getattr(original, "_ov_s3_cache_patch", False):
            return True
        try:
            digest = hashlib.sha256(inspect.getsource(original).encode()).hexdigest()
        except (OSError, TypeError):
            digest = None
        version = getattr(openviking, "__version__", None)
        if version != EXPECTED_VERSION or digest != EXPECTED_SHA256:
            logger.warning(
                "ov-s3-cache-patch: NOT applied (version=%r sha256=%s)", version, digest
            )
            return False
        module._serialize_s3_plugin_params = without_metadata_cache(original)
        logger.warning(
            "ov-s3-cache-patch: applied; S3 metadata cache off (pid %d)", os.getpid()
        )
        return True
  sitecustomize.py: |
    """Post-import hook that installs the OpenViking v0.4.20 runtime patches.

    Mounted from a ConfigMap onto PYTHONPATH. Python's ``site`` imports this file at
    interpreter start in every process, including the uvicorn workers. Each patch is
    installed only in a process that imports its target module, so the ``ov`` CLI and
    the entrypoint's helper interpreters are unaffected.

    Patches (each guarded on the installed version + a source hash, each with its own
    off switch; a patch failure never breaks the import):

      * ov_s3_cache_patch — BUG-1174: disable process-local S3 metadata caches so a
                            worker sees directories created by another worker.
      * ov_nav_patch      — IMPR-1185: deterministic Quick Navigation in directory
                            overviews (``SemanticProcessor._generate_overview``).
      * ov_extract_patch  — BUG-1176: a degraded memory extraction (empty/unparseable
                            LLM output after the loop's own retry) becomes a retryable
                            Phase 2 failure instead of an empty ``memory_diff.json``
                            recorded as success (``ExtractLoop.run`` + the session's
                            Phase 2 retry classifier and budget).
      * ov_chatlog_patch  — BUG-1177: ChatLog speaker labels follow the turn's role
                            (assistant turns read ``assistant``) and tool-only turns no
                            longer render as empty lines (``MessageRange._speaker_for`` +
                            ``_format_contiguous_group``).
      * ov_memory_guard_patch — BUG-1180: an ``add_only`` memory write (events,
                            trajectories) never replaces an existing memory; an exact
                            duplicate is dropped and a collision goes to a free sibling
                            path (``MemoryUpdater.apply_operations``); its echo
                            guard cuts pasted OpenViking recall output from user
                            turns before extraction (``ExtractContext.__init__``,
                            ``OV_ECHO_GUARD=0``).

    Rollback of one patch: its env switch (``OV_S3_CACHE_PATCH=0``, ``OV_EXTRACT_PATCH=0``, ``OV_CHATLOG_PATCH=0``, ``OV_MEMORY_GUARD=0``; ``OV_NAV_PATCH=0``
    only after the model-built overview template is restored, see the Deployment).
    Rollback of everything: remove PYTHONPATH from the Deployment
    (``kubectl set env … PYTHONPATH-``), again only after that template restore.
    """

    import importlib.abc
    import importlib.machinery
    import sys

    # target module -> (patch module, apply function name)
    TARGETS = {
        "openviking.utils.agfs_utils": ("ov_s3_cache_patch", "apply"),
        "openviking.storage.queuefs.semantic_processor": ("ov_nav_patch", "apply"),
        "openviking.session.memory.extract_loop": (
            "ov_extract_patch",
            "apply_extract_loop",
        ),
        "openviking.session.session": ("ov_extract_patch", "apply_session"),
        "openviking.session.memory.memory_updater": [
            ("ov_chatlog_patch", "apply"),
            ("ov_memory_guard_patch", "apply"),
            ("ov_memory_guard_patch", "apply_echo_guard"),
        ],
    }


    def _entries(entry):
        """A target maps to one ``(patch, apply)`` pair or a list of them, applied in order."""
        return [entry] if isinstance(entry, tuple) else list(entry)


    class _PatchingLoader(importlib.abc.Loader):
        def __init__(self, loader, entries):
            self._loader = loader
            self._entries = entries

        def create_module(self, spec):
            return self._loader.create_module(spec)

        def exec_module(self, module):
            self._loader.exec_module(module)
            for patch_module, apply_name in self._entries:
                try:
                    patch = __import__(patch_module)
                    getattr(patch, apply_name)(module)
                except Exception as exc:  # noqa: BLE001 — a patch failure must never break the import
                    print(
                        f"{patch_module}: install failed for {module.__name__}: {exc!r}",
                        file=sys.stderr,
                    )


    class _Finder(importlib.abc.MetaPathFinder):
        def find_spec(self, fullname, path, target=None):
            entry = TARGETS.get(fullname)
            if entry is None:
                return None
            spec = importlib.machinery.PathFinder.find_spec(fullname, path)
            if spec is not None and spec.loader is not None:
                spec.loader = _PatchingLoader(spec.loader, _entries(entry))
            return spec


    if not any(isinstance(f, _Finder) for f in sys.meta_path):
        sys.meta_path.insert(0, _Finder())
