  ov_chatlog_patch.py: |
    """ChatLog speaker labels follow the turn's role, and tool-only turns drop out (BUG-1177).

    OpenViking v0.4.20 renders the ``ChatLog`` of an extracted memory (the ``events`` template,
    ``prompts/templates/memory/events.yaml``) through ``MessageRange.pretty_print`` in
    ``openviking.session.memory.memory_updater``. Each line is ``**{speaker}**: {content}``, and
    ``MessageRange._speaker_for`` picks the speaker as ``peer_id or role``. The pilot lane runs
    recall peer scope ``actor`` with an explicit compendium peer, so every turn, user and
    assistant alike, carries the same ``peer_id``: every ChatLog line gets one label and a user's
    approval reads exactly like the agent's reply. ``role`` is stored on every message but never
    consulted. Separately, ``_format_contiguous_group`` emits a line for every message group
    without an empty-content check, and ``_message_content`` reads only ``TextPart`` — so an
    assistant turn that was only tool calls renders as an empty ``**name**:`` line.

    This patch changes two things in ``MessageRange``:

      * ``_speaker_for`` — an assistant turn is labelled ``assistant``; any other turn keeps the
        stock ``peer_id or role`` (several human peers in one shared session stay distinct).
        ``_can_merge_messages`` compares speakers, so a user chunk can no longer merge into an
        assistant chunk under the shared label.
      * ``_format_contiguous_group`` — lines whose content is empty after the speaker label are
        dropped. Only the rendered ChatLog changes; stored messages and tool parts are untouched.

    Rendering only: capture, the stored archive, recall and extraction are unchanged.

    Guarded: applies only to openviking ``v0.4.20`` whose ``_speaker_for`` and
    ``_format_contiguous_group`` sources hash to the expected values; otherwise it logs
    "NOT applied" and the stock renderer stays. Disable at runtime with ``OV_CHATLOG_PATCH=0``.
    """

    from __future__ import annotations

    import functools
    import hashlib
    import inspect
    import logging
    import os
    import re

    EXPECTED_VERSION = "v0.4.20"
    EXPECTED_SPEAKER_SHA256 = (
        "b3117533db57255151072c51d4ffb839172f6533cefe2cc3c295689f8ab00a64"
    )
    EXPECTED_GROUP_SHA256 = (
        "aa7c32112426ca961768e50942b51f4841a9b238cec8a641493fa74e4b578f5d"
    )
    ASSISTANT_LABEL = "assistant"

    logger = logging.getLogger("ov_chatlog_patch")
    _EMPTY_LINE = re.compile(r"^\*\*.*?\*\*:\s*$", re.DOTALL)


    def _source_hash(fn) -> str | None:
        try:
            return hashlib.sha256(inspect.getsource(fn).encode()).hexdigest()
        except (OSError, TypeError):
            return None


    def _enabled() -> bool:
        if os.environ.get("OV_CHATLOG_PATCH", "1") == "0":
            logger.warning("ov-chatlog-patch: disabled by OV_CHATLOG_PATCH=0")
            return False
        return True


    def speaker_for(message) -> str:
        """Assistant turns are ``assistant``; other turns keep ``peer_id or role``."""
        role = getattr(message, "role", None)
        if role == ASSISTANT_LABEL:
            return ASSISTANT_LABEL
        return getattr(message, "peer_id", None) or role


    def wrap_group(orig):
        """Wrap ``_format_contiguous_group``: drop lines with nothing after the label."""

        @functools.wraps(orig)
        def format_contiguous_group(self, msg_group):
            lines = orig(self, msg_group)
            return [line for line in lines if not _EMPTY_LINE.match(line)]

        format_contiguous_group._ov_chatlog_patch = True
        return format_contiguous_group


    def apply(module) -> bool:
        """Patch ``module.MessageRange`` in place; True if applied."""
        if not _enabled():
            return False
        import openviking

        version = getattr(openviking, "__version__", None)
        cls = getattr(module, "MessageRange", None)
        group = getattr(cls, "_format_contiguous_group", None)
        if getattr(group, "_ov_chatlog_patch", False):
            return True
        raw_speaker = cls.__dict__.get("_speaker_for") if cls is not None else None
        speaker_fn = (
            raw_speaker.__func__ if isinstance(raw_speaker, staticmethod) else raw_speaker
        )
        speaker_digest = _source_hash(speaker_fn) if speaker_fn else None
        group_digest = _source_hash(group) if group else None
        if (
            version != EXPECTED_VERSION
            or speaker_digest != EXPECTED_SPEAKER_SHA256
            or group_digest != EXPECTED_GROUP_SHA256
        ):
            logger.warning(
                "ov-chatlog-patch: NOT applied to MessageRange (version=%r speaker_sha256=%s "
                "group_sha256=%s); stock ChatLog rendering kept",
                version,
                speaker_digest,
                group_digest,
            )
            return False
        cls._speaker_for = staticmethod(speaker_for)
        cls._format_contiguous_group = wrap_group(group)
        logger.warning(
            "ov-chatlog-patch: applied to MessageRange ChatLog rendering (pid %d)",
            os.getpid(),
        )
        return True


    # module name -> apply function, consumed by sitecustomize.py
    TARGETS = {
        "openviking.session.memory.memory_updater": apply,
    }
  ov_extract_patch.py: |
    """Degraded memory extraction becomes a retryable failure, not a silent empty diff (BUG-1176).

    OpenViking v0.4.20's ``ExtractLoop.run`` gives the extraction LLM one format retry; when
    that is exhausted with an empty, unparseable or refusal completion it returns a
    ``ResolvedOperations`` with no upserts and an ``errors`` list, and ``MemoryUpdater.apply``
    turns that into ``result.errors`` and returns. The compressor then writes an empty
    ``memory_diff.json``, the session logs ``Extracted 0 memories`` and the archive gets its
    ``.done`` marker. A saturated VLM (the 2026-09-22 BUG-1173 backfill) therefore produced
    three "successful" commits with nothing in them; the same archive replayed idle yielded
    four memories.

    This wrapper changes two things, both inside the existing Phase 2 machinery:

      * ``ExtractLoop.run`` — when the *session extraction* loop (context provider exactly
        ``SessionExtractContextProvider``) returns errors and no upserts, raise
        ``ExtractionDegradedError`` instead of returning. ``extract_long_term_memories`` runs with
        ``strict_extract_errors=True`` in the commit path, so the error reaches
        ``_run_retryable_phase2_step`` and is retried by ``retry_async``; if every retry fails the
        archive gets ``.failed.json`` (stage ``memory_extraction``) and the task fails — visible,
        exact, and re-drivable — instead of an empty diff recorded as success. The streaming
        memory updater's merge loops (``PatchMergeContextProvider``, ``max_iterations=1``) are
        left returning: they run after append-only events have already been written, and a
        whole-step retry there would regenerate and duplicate those events. A degraded merge
        is logged, not raised.
      * ``openviking.session.session`` — ``is_retryable_api_error`` also returns True for
        ``ExtractionDegradedError``, and the Phase 2 retry constants are widened from
        3 retries × (1 s … 8 s) to 5 retries × (15 s … 120 s): ``retry_async`` makes up to
        6 attempts with 5 capped, jittered sleeps (about 345–420 s of sleeping in all, no
        overall deadline), plus the extraction's own LLM time per attempt. Both are module
        globals the nested retry helper reads at call time. This half applies only after the
        loop half applied in the same process, so the guard governs both.

    Also logs, at WARNING, an extraction that parsed fine but produced zero operations, with the
    loop's last failure kind, so a future zero window is diagnosable from the pod log alone.
    That parsed-empty outcome is indistinguishable from "nothing to extract" and is NOT raised.

    Scope of the claim: this protects against a demonstrated source-code defect (an exhausted
    retry becomes a successful empty diff). Whether the 2026-09-22 zero runs took this path or
    returned a parsed empty program is not established by the INFO log; see BUG-1176.

    Guarded: applies only to openviking ``v0.4.20`` whose ``ExtractLoop.run`` source hashes to
    ``EXPECTED_RUN_SHA256``; otherwise it logs "NOT applied" and stock behaviour stays.
    Disable at runtime with ``OV_EXTRACT_PATCH=0``. Retry budget overrides:
    ``OV_EXTRACT_PATCH_RETRIES``, ``OV_EXTRACT_PATCH_BASE_DELAY``, ``OV_EXTRACT_PATCH_MAX_DELAY``.
    """

    from __future__ import annotations

    import functools
    import hashlib
    import inspect
    import logging
    import os

    EXPECTED_VERSION = "v0.4.20"
    EXPECTED_RUN_SHA256 = "f9bf435228ca4a82200442f47752a0f4b7e2213a0c86dcb08a6a773357156876"
    DEFAULT_RETRIES = 5
    DEFAULT_BASE_DELAY_SECONDS = 15.0
    DEFAULT_MAX_DELAY_SECONDS = 120.0

    logger = logging.getLogger("ov_extract_patch")
    SESSION_PROVIDER = (
        "SessionExtractContextProvider"  # exact class; subclasses are merge loops
    )
    _state = {"loop_applied": False}


    class ExtractionDegradedError(RuntimeError):
        """The extraction LLM produced no usable operations after the loop's own retry."""


    def _source_hash(fn) -> str | None:
        try:
            return hashlib.sha256(inspect.getsource(fn).encode()).hexdigest()
        except (OSError, TypeError):
            return None


    def _enabled() -> bool:
        if os.environ.get("OV_EXTRACT_PATCH", "1") == "0":
            logger.warning("ov-extract-patch: disabled by OV_EXTRACT_PATCH=0")
            return False
        return True


    def wrap_run(orig):
        """Wrap ``ExtractLoop.run``: errors-only result raises; zero-op result is logged."""

        @functools.wraps(orig)
        async def run(self):
            operations, tools_used = await orig(self)
            if operations is None:
                return operations, tools_used
            upserts = getattr(operations, "upsert_operations", None) or []
            errors = list(getattr(operations, "errors", None) or [])
            kind = getattr(self, "_last_llm_failure_kind", None) or "unknown"
            provider = type(getattr(self, "context_provider", None)).__name__
            if errors and not upserts:
                if provider != SESSION_PROVIDER:
                    logger.warning(
                        "ov-extract-patch: degraded %s loop (failure_kind=%s: %s); returned as-is "
                        "because a retry here would duplicate already-appended events",
                        provider,
                        kind,
                        errors[0][:200],
                    )
                    return operations, tools_used
                logger.warning(
                    "ov-extract-patch: extraction degraded (failure_kind=%s, %d error(s): %s); "
                    "raising for Phase 2 retry instead of recording an empty diff",
                    kind,
                    len(errors),
                    errors[0][:200],
                )
                raise ExtractionDegradedError(
                    f"memory extraction degraded: failure_kind={kind}: {errors[0][:200]}"
                )
            if not upserts:
                deletes = getattr(operations, "delete_file_contents", None) or []
                logger.warning(
                    "ov-extract-patch: extraction parsed but produced 0 upsert operations "
                    "(deletes=%d, last_failure_kind=%s)",
                    len(deletes),
                    kind,
                )
            return operations, tools_used

        run._ov_extract_patch = True  # type: ignore[attr-defined]
        return run


    def wrap_is_retryable(orig):
        @functools.wraps(orig)
        def is_retryable(error):
            if isinstance(error, ExtractionDegradedError):
                return True
            return orig(error)

        is_retryable._ov_extract_patch = True  # type: ignore[attr-defined]
        return is_retryable


    def retry_budget() -> tuple[int, float, float]:
        def _num(name, default, cast):
            raw = os.environ.get(name)
            if raw is None or not raw.strip():
                return default
            try:
                value = cast(raw)
            except ValueError:
                logger.warning("ov-extract-patch: ignoring %s=%r", name, raw)
                return default
            return value if value > 0 else default

        return (
            _num("OV_EXTRACT_PATCH_RETRIES", DEFAULT_RETRIES, int),
            _num("OV_EXTRACT_PATCH_BASE_DELAY", DEFAULT_BASE_DELAY_SECONDS, float),
            _num("OV_EXTRACT_PATCH_MAX_DELAY", DEFAULT_MAX_DELAY_SECONDS, float),
        )


    def apply_extract_loop(module) -> bool:
        """Patch ``module.ExtractLoop.run`` in place; True if applied."""
        if not _enabled():
            return False
        import openviking

        version = getattr(openviking, "__version__", None)
        cls = getattr(module, "ExtractLoop", None)
        orig = getattr(cls, "run", None)
        if getattr(orig, "_ov_extract_patch", False):
            return True
        digest = _source_hash(orig) if orig else None
        if version != EXPECTED_VERSION or digest != EXPECTED_RUN_SHA256:
            logger.warning(
                "ov-extract-patch: NOT applied to ExtractLoop.run (version=%r source_sha256=%s); "
                "stock extraction behaviour kept",
                version,
                digest,
            )
            return False
        cls.run = wrap_run(orig)
        _state["loop_applied"] = True
        logger.warning("ov-extract-patch: applied to ExtractLoop.run (pid %d)", os.getpid())
        return True


    def apply_session(module) -> bool:
        """Patch the retry classifier and constants in ``openviking.session.session``."""
        if not _enabled():
            return False
        import openviking

        version = getattr(openviking, "__version__", None)
        orig = getattr(module, "is_retryable_api_error", None)
        needed = (
            "_MEMORY_EXTRACTION_MAX_RETRIES",
            "_MEMORY_EXTRACTION_RETRY_BASE_DELAY_SECONDS",
            "_MEMORY_EXTRACTION_RETRY_MAX_DELAY_SECONDS",
        )
        if getattr(orig, "_ov_extract_patch", False):
            return True
        if not _state["loop_applied"]:
            logger.warning(
                "ov-extract-patch: NOT applied to session retry — the ExtractLoop half was not "
                "applied in this process (guard failed or extract_loop not imported first); "
                "stock retry budget kept"
            )
            return False
        if (
            version != EXPECTED_VERSION
            or orig is None
            or not all(hasattr(module, n) for n in needed)
        ):
            logger.warning(
                "ov-extract-patch: NOT applied to session retry (version=%r classifier=%r constants=%s)",
                version,
                orig is not None,
                [hasattr(module, n) for n in needed],
            )
            return False
        retries, base_delay, max_delay = retry_budget()
        module.is_retryable_api_error = wrap_is_retryable(orig)
        module._MEMORY_EXTRACTION_MAX_RETRIES = retries
        module._MEMORY_EXTRACTION_RETRY_BASE_DELAY_SECONDS = base_delay
        module._MEMORY_EXTRACTION_RETRY_MAX_DELAY_SECONDS = max_delay
        logger.warning(
            "ov-extract-patch: applied to session Phase 2 retry (retries=%d base=%.0fs max=%.0fs, pid %d)",
            retries,
            base_delay,
            max_delay,
            os.getpid(),
        )
        return True


    # module name -> apply function, consumed by sitecustomize.py
    TARGETS = {
        "openviking.session.memory.extract_loop": apply_extract_loop,
        "openviking.session.session": apply_session,
    }
  ov_nav_patch.py: |
    """Deterministic Quick Navigation for OpenViking v0.4.20 directory overviews (IMPR-1185).

    The stock ``SemanticProcessor._generate_overview`` asks the VLM to write the whole
    overview, including one navigation line per entry with an exact link placeholder.
    Every navigation defect in compendium BUG-1155 / BUG-1169 / BUG-1170 / BUG-1172
    comes from that structured emission. Code already holds the child inventory, so
    this wrapper keeps the model's prose and replaces its navigation and coverage
    sections with lists built from the inputs.

    Output layout (the order is load-bearing):

        # <dir>                      model H1
        <Brief Description>          model prose; the L0 abstract is extracted from it
        ## Quick Navigation          code-built, one line per entry, real URIs
        ## Directory Coverage        code-built from the counts
        ## Detailed Description      model prose, pre-truncated to the space left

    Constraints honoured (v0.4.20 source):
      * ``_extract_abstract_from_overview`` reads prose after the H1 up to the first
        ``##``, so navigation sits under an ``##`` AFTER the brief.
      * ``_parse_overview_md`` treats every ``###`` body as a cached per-file summary and
        keeps appending until the next ``###``, so nothing code-generated may follow
        the model's last H3; everything added here precedes the first H3.
      * ``_enforce_size_limits`` tail-cuts at a sentence boundary; the tail is sized so
        the document is already under ``overview_max_chars`` and every nav line ends in
        a period as a backstop.

    Guarded: applies only to openviking ``v0.4.20`` whose ``_generate_overview`` source
    hashes to ``EXPECTED_SOURCE_SHA256``; otherwise it logs and leaves stock behaviour.
    Model failures (the stock placeholder strings) are passed through unchanged.
    Disable at runtime with ``OV_NAV_PATCH=0``.
    """

    from __future__ import annotations

    import hashlib
    import inspect
    import logging
    import os
    import re

    EXPECTED_VERSION = "v0.4.20"
    EXPECTED_SOURCE_SHA256 = (
        "aec8040007bbfed22727309060fc7034a325a738925e65024337d1aefe71325f"
    )
    NAV_SHARE = 0.6  # nav may take at most this share of overview_max_chars
    MAX_GLOSS_WORDS = 12
    FAILURE_MARKERS = (
        "[Directory overview is not generated]",
        "[Directory overview is not ready]",
    )
    NAV_HEADINGS = {"quick navigation", "快速导航"}
    COVERAGE_HEADINGS = {"directory coverage", "目录覆盖"}
    MANGLED_PLACEHOLDER = re.compile(
        r"(?<![\w/])(?:viking|v)://(?:input)*input_sample_([fc]\d+)"
    )
    SENTENCE_END = re.compile(r"(?<=[.!?。？！])\s")

    logger = logging.getLogger("ov_nav_patch")


    def build_link_map(
        processor, dir_uri: str, file_summaries, children_abstracts
    ) -> dict[str, str]:
        """Rebuild the stock placeholder map (same numbering as _generate_overview)."""
        link_map: dict[str, str] = {}
        for idx, item in enumerate(file_summaries, 1):
            link_map[f"f{idx}"] = processor._markdown_link_target(dir_uri, item["name"])
        for idx, item in enumerate(children_abstracts, 1):
            link_map[f"c{idx}"] = processor._markdown_link_target(dir_uri, item["name"])
        return link_map


    def repair_placeholders(text: str, link_map: dict[str, str]) -> str:
        """Resolve placeholders the model mangled (``v://…``, ``inputinput_…``) — BUG-1170."""

        def sub(match: re.Match) -> str:
            return link_map.get(match.group(1), match.group(0))

        return MANGLED_PLACEHOLDER.sub(sub, text)


    def split_sections(text: str) -> tuple[str, list[tuple[str, str]]]:
        """Split into (head, [(h2_title, section_text)]) on lines starting with ``## ``."""
        head_lines: list[str] = []
        sections: list[tuple[str, list[str]]] = []
        for line in text.split("\n"):
            if line.startswith("## "):
                sections.append((line[3:].strip(), [line]))
            elif sections:
                sections[-1][1].append(line)
            else:
                head_lines.append(line)
        return "\n".join(head_lines).strip(), [
            (t, "\n".join(ls).strip()) for t, ls in sections
        ]


    def _clean(text: str) -> str:
        text = re.sub(r"[#*`>\[\]]", "", text or "")
        # emphasis underscores only; keep identifiers such as source_file_names intact
        text = re.sub(r"(?<!\w)_+|_+(?!\w)", "", text)
        return re.sub(r"\s+", " ", text).strip()


    # Stock framing the summarizer puts in front of the part that distinguishes an entry,
    # measured on real v0.4.20 inputs (54 of 55 bugs/resolved summaries open with
    # "This document is a bug report and resolution … for BUG-NNNN, which <verb> …").
    SUBJECT = (
        r"This (?:[\w-]+\s+){0,2}?"
        r"(?:document|documentation|file|entry|report|directory|specification)"
    )
    PAYLOAD_AFTER = re.compile(
        rf"^{SUBJECT}\b.*?"
        r"(?:,?\s+(?:which|that)\s+(?:details?|identif(?:y|ies)|address(?:es)?|document(?:s)?|"
        r"describes?|explains?|covers?|records?|tracks?|captures?|outlines?|proposes?|"
        r"summari[sz]es?|specif(?:y|ies)|defines?|investigates?|analy[sz]es?|"
        r"introduces?|establish(?:es)?|ensures?|implements?|adds?|enables?|supports?|"
        r"(?:aims?|aimed|seeks?|sought) to)"
        r"|\s+(?:detailing|describing|documenting|regarding|concerning|addressing|covering|"
        r"outlining|analy[sz]ing|investigating|identifying|explaining|tracking|proposing|"
        r"reporting|summari[sz]ing|specifying|defining|highlighting|examining|evaluating|"
        r"recording|capturing|presenting)"
        r"|\s+(?:log|record|summary|report|analysis|post-mortem)\s+(?:for|of|on)(?=\s+(?:a|an)\s)"
        r"|\s+(?:related to|relating to|focused on|focusing on|about|on the topic of))\s+(.+)$",
        re.IGNORECASE,
    )
    SELF_ID = re.compile(r"\s*\(\s*[A-Z]+-\d+\s*\)")
    PROCESS_NOUN = (
        r"(?:identification|investigation|analysis|root cause analysis|resolution|diagnosis|"
        r"fix|remediation|triage|discovery|implementation|development)"
    )
    PROCESS_LEAD = re.compile(
        rf"^(?:the\s+)?{PROCESS_NOUN}(?:\s*,\s*(?:and\s+)?{PROCESS_NOUN}|\s+and\s+{PROCESS_NOUN})*"
        r"\s+(?:of|for)\s+",
        re.IGNORECASE,
    )
    LEAD_IN = re.compile(
        rf"^{SUBJECT}\s+"
        r"(?:is|serves as|contains|provides|describes|documents|captures|records)\s+",
        re.IGNORECASE,
    )
    SECOND_LEAD_IN = re.compile(
        r"^(?:The (?:primary |main )?(?:purpose|goal|aim) (?:of \S+ )?is to|It (?:details|describes|covers))\s+",
        re.IGNORECASE,
    )
    # "feature specification and implementation record for …" — measured on real
    # features/completed summaries, 2026-09-22.
    DOC_TYPE_LEAD = re.compile(
        r"^(?:(?:technical|proposed)\s+)?"
        r"(?:feature|bug|design|implementation|improvement|enhancement)\s+"
        r"(?:request|specification|spec|report|record|design)"
        r"(?:\s+and\s+(?:[\w-]+\s+){0,2}?(?:record|guide|analysis|design|file|registry|log|"
        r"summary|report|research file))?\s+(?:for|of|on)\s+",
        re.IGNORECASE,
    )
    ENDS_WITH_ID = re.compile(r"\b[A-Z]+-\d+$")
    LEADING_ARTICLE = re.compile(r"^(?:a|an|the)\s+", re.IGNORECASE)
    DANGLING = {
        "a",
        "an",
        "and",
        "as",
        "at",
        "by",
        "due",
        "during",
        "for",
        "from",
        "in",
        "into",
        "its",
        "of",
        "on",
        "or",
        "that",
        "the",
        "their",
        "to",
        "where",
        "which",
        "named",
        "called",
        "while",
        "with",
        "within",
    }
    MIN_CLAUSE_WORDS = 4
    # past participles that, when a clip lands on them, leave a dangling "… caused" /
    # "… triggered"; short or noun-like "-ed" words (bed, red, need, seed) excluded
    PARTICIPLE_TAIL = re.compile(r"^[a-z]{3,}(?<![eo]e)(?<!ne)ed$")
    AUXILIARY = {"is", "are", "was", "were", "be", "been", "being", "get", "got", "gets"}


    def _phrase(sentence: str) -> str:
        """One sentence with the summarizer's framing removed (not yet clipped)."""
        s = SELF_ID.sub("", sentence.rstrip(" .;:,!?。？！"))
        m = PAYLOAD_AFTER.match(s)
        text = m.group(1) if m else LEAD_IN.sub("", s)
        text = LEADING_ARTICLE.sub("", text).strip()
        text = DOC_TYPE_LEAD.sub("", text)
        text = PROCESS_LEAD.sub("", LEADING_ARTICLE.sub("", text).strip())
        return LEADING_ARTICLE.sub("", text).strip()


    def _weak(text: str) -> bool:
        """A phrase that names only the document type or points back at its own ID."""
        return (
            not text
            or bool(ENDS_WITH_ID.search(text))
            or bool(DOC_TYPE_LEAD.match(text + " for "))
        )


    def gloss(summary: str, words: int, name: str | None = None) -> str:
        """The distinguishing phrase of a summary, clipped at a clause boundary.

        Takes the first sentence, drops the summarizer's stock framing ("This document
        is a bug report … for BUG-NNNN, which details …"), clips to ``words`` words at
        the last comma inside the limit when there is one, and strips dangling function
        words. Returns "" when nothing is left or the gloss would only repeat ``name``.
        """
        if words <= 0:
            return ""
        sentences = SENTENCE_END.split(_clean(summary), maxsplit=2)
        text = _phrase(sentences[0])
        if _weak(text) and len(sentences) > 1:
            second = _phrase(SECOND_LEAD_IN.sub("", sentences[1].strip()))
            if second and not _weak(second):
                text = second
        tokens = text.split()
        truncated = len(tokens) > words
        if truncated:
            cut = tokens[:words]
            commas = [i for i, t in enumerate(cut) if t.endswith(",")]
            if commas and commas[-1] + 1 >= MIN_CLAUSE_WORDS:
                cut = cut[: commas[-1] + 1]
            tokens = cut
        while tokens:
            last = tokens[-1].lower().strip(",;:")
            if last in DANGLING:
                tokens.pop()
            elif truncated and len(tokens) > 1 and tokens[-2].lower() == "to":
                # a clipped "to <verb>" ("… optimizing the write path to handle") reads as
                # an unfinished clause; drop both words
                del tokens[-2:]
            elif (
                truncated
                and len(tokens) > MIN_CLAUSE_WORDS
                and PARTICIPLE_TAIL.match(last)
                and tokens[-2].lower() not in AUXILIARY  # "that were dismissed" is complete
            ):
                # a clipped trailing participle ("… outage in the system caused") promises
                # an agent or object that was cut off
                tokens.pop()
            else:
                break
        out = " ".join(tokens).rstrip(" .;:,!?。？！—-")
        if name and out.lower().strip() in {name.lower().strip("/"), name.lower()}:
            return ""
        return out


    def build_nav(
        processor,
        dir_uri: str,
        file_summaries,
        children_abstracts,
        total_files: int,
        total_children: int,
        words: int,
    ) -> str:
        lines = ["## Quick Navigation", ""]
        for item in file_summaries:
            target = processor._markdown_link_target(dir_uri, item["name"])
            g = gloss(item.get("summary", ""), words, item["name"])
            lines.append(f"- [{item['name']}]({target})" + (f" — {g}." if g else "."))
        for item in children_abstracts:
            target = processor._markdown_link_target(dir_uri, item["name"])
            g = gloss(item.get("abstract", ""), words, item["name"])
            lines.append(f"- [{item['name']}/]({target})" + (f" — {g}." if g else "."))
        missing = (total_files + total_children) - (
            len(file_summaries) + len(children_abstracts)
        )
        if missing > 0:
            lines.append(f"- {missing} further entries are not listed.")
        return "\n".join(lines)


    def build_coverage(total_files: int, total_children: int, provided: int) -> str:
        total = total_files + total_children
        if provided >= total:
            sentence = (
                f"Total direct entries: {total} ({total_files} files, {total_children} subdirectories); "
                "all of them are listed above."
            )
        else:
            sentence = (
                f"Total direct entries: {total} ({total_files} files, {total_children} subdirectories); "
                f"{provided} are listed above and {total - provided} were not individually examined."
            )
        return f"## Directory Coverage\n\n{sentence}"


    def fallback_head(dir_uri: str, total_files: int, total_children: int) -> str:
        name = dir_uri.rstrip("/").split("/")[-1]
        return (
            f"# {name}\n\n"
            f"Directory {name} with {total_files} files and {total_children} subdirectories."
        )


    def assemble(
        processor,
        raw: str,
        dir_uri: str,
        file_summaries,
        children_abstracts,
        total_files: int | None,
        total_children: int | None,
        cap: int,
    ) -> str:
        """Pure transform of the model's raw overview into the deterministic layout."""
        if any(marker in raw for marker in FAILURE_MARKERS):
            return raw
        total_files = len(file_summaries) if total_files is None else total_files
        total_children = (
            len(children_abstracts) if total_children is None else total_children
        )
        provided = len(file_summaries) + len(children_abstracts)

        raw = repair_placeholders(
            raw, build_link_map(processor, dir_uri, file_summaries, children_abstracts)
        )
        head, sections = split_sections(raw)
        head_prose = [
            ln for ln in head.split("\n") if ln.strip() and not ln.startswith("#")
        ]
        if not head_prose:
            head = fallback_head(dir_uri, total_files, total_children)

        kept = [
            text
            for title, text in sections
            if title.strip().lower() not in NAV_HEADINGS | COVERAGE_HEADINGS
        ]

        nav = ""
        for words in range(MAX_GLOSS_WORDS, -1, -1):
            nav = build_nav(
                processor,
                dir_uri,
                file_summaries,
                children_abstracts,
                total_files,
                total_children,
                words,
            )
            if len(nav) <= int(cap * NAV_SHARE):
                break
        coverage = build_coverage(total_files, total_children, provided)

        fixed = f"{head}\n\n{nav}\n\n{coverage}"
        budget = cap - len(fixed) - 2
        tail = "\n\n".join(kept).strip()
        if tail and budget > 0:
            tail = processor._truncate_generated_text(tail, budget)
            return f"{fixed}\n\n{tail}"
        return fixed


    def _source_hash(func) -> str | None:
        try:
            return hashlib.sha256(inspect.getsource(func).encode()).hexdigest()
        except (OSError, TypeError):
            return None


    def dump_inputs(
        dir_uri, file_summaries, children_abstracts, total_files, total_children, raw, out
    ) -> None:
        """Opt-in capture of one generation's real inputs, for tuning the glosses offline.

        Writes nothing unless OV_NAV_PATCH_DUMP names a directory, and never raises:
        a dump failure must not affect the overview that is returned.
        """
        target = os.environ.get("OV_NAV_PATCH_DUMP")
        if not target:
            return
        try:
            import json
            import time

            os.makedirs(target, exist_ok=True)
            slug = re.sub(r"[^A-Za-z0-9]+", "_", dir_uri)[-120:]
            path = os.path.join(target, f"{slug}-{time.time_ns()}-{os.getpid()}.json")
            with open(path, "w", encoding="utf-8") as fh:
                json.dump(
                    {
                        "dir_uri": dir_uri,
                        "file_summaries": list(file_summaries),
                        "children_abstracts": list(children_abstracts),
                        "total_files": total_files,
                        "total_children": total_children,
                        "raw": raw,
                        "out": out,
                    },
                    fh,
                    ensure_ascii=False,
                )
        except Exception:
            logger.exception("ov-nav-patch: input dump failed for %s", dir_uri)


    def apply(module) -> bool:
        """Patch ``module.SemanticProcessor._generate_overview`` in place; True if applied."""
        if os.environ.get("OV_NAV_PATCH", "1") == "0":
            logger.warning("ov-nav-patch: disabled by OV_NAV_PATCH=0")
            return False
        import openviking

        version = getattr(openviking, "__version__", None)
        cls = getattr(module, "SemanticProcessor", None)
        orig = getattr(cls, "_generate_overview", None)
        if getattr(orig, "_ov_nav_patch", False):
            return True
        digest = _source_hash(orig) if orig else None
        if version != EXPECTED_VERSION or digest != EXPECTED_SOURCE_SHA256:
            logger.warning(
                "ov-nav-patch: NOT applied (version=%r source_sha256=%s); stock overview behaviour kept",
                version,
                digest,
            )
            return False

        async def _generate_overview(
            self,
            dir_uri,
            file_summaries,
            children_abstracts,
            llm_sem=None,
            total_files=None,
            total_children=None,
        ):
            raw = await orig(
                self,
                dir_uri,
                file_summaries,
                children_abstracts,
                llm_sem,
                total_files,
                total_children,
            )
            try:
                cap = module.get_openviking_config().semantic.overview_max_chars
                out = assemble(
                    self,
                    raw,
                    dir_uri,
                    file_summaries,
                    children_abstracts,
                    total_files,
                    total_children,
                    cap,
                )
            except Exception:
                logger.exception(
                    "ov-nav-patch: assemble failed for %s; returning stock output", dir_uri
                )
                return raw
            dump_inputs(
                dir_uri,
                file_summaries,
                children_abstracts,
                total_files,
                total_children,
                raw,
                out,
            )
            return out

        _generate_overview._ov_nav_patch = True
        _generate_overview.__wrapped__ = orig
        cls._generate_overview = _generate_overview
        logger.warning(
            "ov-nav-patch: applied to SemanticProcessor._generate_overview (pid %s)",
            os.getpid(),
        )
        return True
  sitecustomize.py: |
    """Post-import hook that installs the OpenViking v0.4.20 runtime patches.

    Mounted from a ConfigMap onto PYTHONPATH. Python's ``site`` imports this file at
    interpreter start in every process, including the uvicorn workers. Each patch is
    installed only in a process that imports its target module, so the ``ov`` CLI and
    the entrypoint's helper interpreters are unaffected.

    Patches (each guarded on the installed version + a source hash, each with its own
    off switch; a patch failure never breaks the import):

      * ov_nav_patch      — IMPR-1185: deterministic Quick Navigation in directory
                            overviews (``SemanticProcessor._generate_overview``).
      * ov_extract_patch  — BUG-1176: a degraded memory extraction (empty/unparseable
                            LLM output after the loop's own retry) becomes a retryable
                            Phase 2 failure instead of an empty ``memory_diff.json``
                            recorded as success (``ExtractLoop.run`` + the session's
                            Phase 2 retry classifier and budget).
      * ov_chatlog_patch  — BUG-1177: ChatLog speaker labels follow the turn's role
                            (assistant turns read ``assistant``) and tool-only turns no
                            longer render as empty lines (``MessageRange._speaker_for`` +
                            ``_format_contiguous_group``).

    Rollback of one patch: its env switch (``OV_EXTRACT_PATCH=0``, ``OV_CHATLOG_PATCH=0``; ``OV_NAV_PATCH=0``
    only after the model-built overview template is restored, see the Deployment).
    Rollback of everything: remove PYTHONPATH from the Deployment
    (``kubectl set env … PYTHONPATH-``), again only after that template restore.
    """

    import importlib.abc
    import importlib.machinery
    import sys

    # target module -> (patch module, apply function name)
    TARGETS = {
        "openviking.storage.queuefs.semantic_processor": ("ov_nav_patch", "apply"),
        "openviking.session.memory.extract_loop": (
            "ov_extract_patch",
            "apply_extract_loop",
        ),
        "openviking.session.session": ("ov_extract_patch", "apply_session"),
        "openviking.session.memory.memory_updater": ("ov_chatlog_patch", "apply"),
    }


    class _PatchingLoader(importlib.abc.Loader):
        def __init__(self, loader, patch_module, apply_name):
            self._loader = loader
            self._patch_module = patch_module
            self._apply_name = apply_name

        def create_module(self, spec):
            return self._loader.create_module(spec)

        def exec_module(self, module):
            self._loader.exec_module(module)
            try:
                patch = __import__(self._patch_module)
                getattr(patch, self._apply_name)(module)
            except Exception as exc:  # noqa: BLE001 — a patch failure must never break the import
                print(
                    f"{self._patch_module}: install failed for {module.__name__}: {exc!r}",
                    file=sys.stderr,
                )


    class _Finder(importlib.abc.MetaPathFinder):
        def find_spec(self, fullname, path, target=None):
            entry = TARGETS.get(fullname)
            if entry is None:
                return None
            spec = importlib.machinery.PathFinder.find_spec(fullname, path)
            if spec is not None and spec.loader is not None:
                spec.loader = _PatchingLoader(spec.loader, *entry)
            return spec


    if not any(isinstance(f, _Finder) for f in sys.meta_path):
        sys.meta_path.insert(0, _Finder())
