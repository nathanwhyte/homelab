---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ov-worker
  namespace: viking
  labels:
    app: ov-worker
spec:
  serviceName: ov-worker-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: ov-worker
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          longhorn.io/number-of-replicas: "2"
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-ssd
        resources:
          requests:
            storage: 5Gi
  template:
    metadata:
      labels:
        app: ov-worker
    spec:
      terminationGracePeriodSeconds: 15
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - timmy
            - weight: 20
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - manu
      initContainers:
        - name: config-gen
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              python3 -c "
              import json, os
              conf = json.load(open('/config-template/ov.conf'))
              conf['vlm']['max_concurrent'] = 4
              conf['embedding']['max_concurrent'] = 3
              conf['server']['root_api_key'] = os.environ['API_KEY']
              agfs = conf.get('storage', {}).get('agfs', {})
              if agfs.get('backend', 'local') == 's3':
                  agfs.setdefault('s3', {})
                  agfs['s3']['access_key'] = os.environ['S3_ACCESS_KEY']
                  agfs['s3']['secret_key'] = os.environ['S3_SECRET_KEY']
              else:
                  agfs.pop('s3', None)
              # As of IDEA-009 Phase 3, all workers route VLM to the unified
              # `llamacpp-vlm` service (selector vlm-pool=true), which currently
              # round-robins across llamacpp-cuda-ov (manu) and llamacpp-rocm
              # (timmy). Phase 4 will retire the rocm deployment.
              conf['vlm']['api_base'] = 'http://llamacpp-vlm.viking.svc/v1'
              json.dump(conf, open('/config-out/ov.conf', 'w'), indent=2)
              "
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-api-key
                  key: api-key
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config-out
              mountPath: /config-out
        - name: temp-cleanup
          image: busybox:1.37
          command: ["/bin/sh", "-c"]
          args:
            - >-
              echo "Cleaning stale temp files...";
              find /app/data/temp -type f -mtime +1 -delete 2>/dev/null || true;
              find /app/data/temp -type d -empty -delete 2>/dev/null || true;
              echo "Removing stale locks...";
              rm -f /app/data/.openviking.pid;
              rm -f /app/data/vectordb/context/store/LOCK;
              find /app/data/viking -name '.path.ovlock' -delete 2>/dev/null || true;
              echo "Done."
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: openviking
          image: ghcr.io/volcengine/openviking:v0.3.14
          ports:
            - containerPort: 1933
              name: http
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "3"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: 1933
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 1933
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1933
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: config-out
              mountPath: /app/.openviking/ov.conf
              subPath: ov.conf
              readOnly: true
            - name: data
              mountPath: /app/data
      volumes:
        - name: config-template
          configMap:
            name: openviking-config
        - name: config-out
          emptyDir: {}
