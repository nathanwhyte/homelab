---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Canonical OpenViking rebuild set. Secrets are intentionally excluded because
# real values must live in untracked *.secret.yaml files created from examples.
resources:
  - namespace.yaml
  - openviking-configmap.yaml
  - openviking-standalone-configmap.yaml
  - openviking-exporter-configmap.yaml
  - openviking-nav-patch-configmap.yaml
  - openviking-dashboard-configmap.yaml
  - openviking-native-dashboard-configmap.yaml
  # BUG-1101 drill: the class a re-provisioned OV claim must select (2 replicas,
  # best-effort locality). The live claims below stay on longhorn-ssd — PVC class
  # is immutable — with the same settings patched onto their Longhorn Volumes by
  # viking/scripts/ov-volume-locality.sh. Restore-time claims: restore/ (not here).
  - storageclass-longhorn-ov.yaml
  - ov-vectordb-pvc.yaml
  - ov-vectordb-deployment.yaml
  - ov-vectordb-service.yaml
  # Embedder: primary is embedder-qwen-cuda (manu/GTX 1080 CUDA) since the
  # 2026-07-17 cutover (IMPR-1077); embedder-qwen-rocm (timmy/9070 XT) is the
  # retired replicas=0 rollback. The neutral embedder-qwen Service lives in
  # embedder-qwen-service.yaml and selects app=embedder-qwen-cuda (IMPR-1040
  # deviation: selector moved rather than Deployment renamed).
  - embedder-qwen-cuda-deployment.yaml
  - embedder-qwen-rocm-deployment.yaml
  - embedder-qwen-service.yaml
  - llamacpp-vlm-service.yaml
  - cuda-llamacpp-deployment.yaml
  - cuda-llamacpp-service.yaml
  - openviking-pvc.yaml
  # BUG-1155: semantic overview template override. Holds ONE file; PromptManager
  # falls back per file to the bundled templates for everything else.
  - openviking-prompt-overrides-configmap.yaml
  - openviking-deployment.yaml
  - openviking-service.yaml
  - openviking-nodeport-service.yaml
  - openviking-ingress.yaml
  - openviking-mcp-ingress.yaml
  - openviking-servicemonitor.yaml
  - openviking-alerts.yaml
  # IMPR-1095: stale S3 .ovlock janitor (shadow mode until Phase 4 flips --apply)
  - ovlock-janitor-configmap.yaml
  - ovlock-janitor-cronjob.yaml
