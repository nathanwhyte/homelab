---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Canonical OpenViking rebuild set. Secrets are intentionally excluded because
# real values must live in untracked *.secret.yaml files created from examples.
resources:
  - namespace.yaml
  - openviking-configmap.yaml
  - openviking-standalone-configmap.yaml
  - openviking-exporter-configmap.yaml
  - openviking-nav-patch-configmap.yaml
  - openviking-dashboard-configmap.yaml
  - openviking-native-dashboard-configmap.yaml
  - openviking-memory-reads-dashboard-configmap.yaml
  # BUG-1101 drill: the class a re-provisioned OV claim must select (2 replicas,
  # best-effort locality). The live claims below stay on longhorn-ssd — PVC class
  # is immutable — with the same settings patched onto their Longhorn Volumes by
  # viking/scripts/ov-volume-locality.sh. Restore-time claims: restore/ (not here).
  - storageclass-longhorn-ov.yaml
  - ov-vectordb-pvc.yaml
  - ov-vectordb-deployment.yaml
  - ov-vectordb-service.yaml
  # Embedder: primary is embedder-qwen-cuda (Qwen3-Embedding-4B on manu/GTX 1080,
  # Service embedder-qwen) since 2026-07-17 (IMPR-1077). At replicas=0:
  # embedder-qwen-rocm (timmy, retired) and embedder-eg2-cuda (EmbeddingGemma 2,
  # Service embedder-eg2), parked after the rolled-back 2026-10-08 TASK-1218
  # cutover. Runbook: viking/docs/2026-10-08-embedder-embeddinggemma-2-cutover.md.
  - embedder-eg2-cuda-deployment.yaml
  - embedder-eg2-service.yaml
  - embedder-qwen-cuda-deployment.yaml
  - embedder-qwen-rocm-deployment.yaml
  - embedder-qwen-service.yaml
  # IMPR-1344: prompt shim in front of embedder-qwen (adds Qwen's query
  # instruction when OV sends input_type=query; documents pass unchanged).
  - embedder-prompt-shim-configmap.yaml
  - embedder-prompt-shim-deployment.yaml
  - embedder-prompt-shim-service.yaml
  # IMPR-1410: its /metrics scrape and the error-rate alert.
  - embedder-prompt-shim-servicemonitor.yaml
  - embedder-prompt-shim-alerts.yaml
  - llamacpp-vlm-service.yaml
  - cuda-llamacpp-deployment.yaml
  - cuda-llamacpp-service.yaml
  - openviking-pvc.yaml
  # BUG-1155: semantic overview template override. Holds ONE file; PromptManager
  # falls back per file to the bundled templates for everything else.
  - openviking-prompt-overrides-configmap.yaml
  # IMPR-1311: LiteLLM router in front of the VLM (gemma4 first, Haiku overflow under
  # a monthly cap) and the Redis that holds its budget spend. Secret litellm-vlm is
  # created from litellm-vlm.secret.yaml.example.
  - litellm-redis-pvc.yaml
  - litellm-redis-deployment.yaml
  - litellm-redis-service.yaml
  - litellm-vlm-configmap.yaml
  - litellm-vlm-deployment.yaml
  - litellm-vlm-service.yaml
  - litellm-vlm-servicemonitor.yaml
  - litellm-vlm-alerts.yaml
  - openviking-deployment.yaml
  - openviking-service.yaml
  - openviking-nodeport-service.yaml
  - openviking-ingress.yaml
  - openviking-mcp-ingress.yaml
  - openviking-servicemonitor.yaml
  - openviking-alerts.yaml
  # BUG-1196: alert on failed session-commit memory extraction
  - openviking-extraction-alerts.yaml
  # IMPR-1095: stale S3 .ovlock janitor (shadow mode until Phase 4 flips --apply)
  - ovlock-janitor-configmap.yaml
  - ovlock-janitor-cronjob.yaml
  # BUG-1220: restarts OV when one lease holds one lock for hours. Ships in
  # --dry-run (shadow) mode; see the CronJob header for the flip.
  - ov-lock-watchdog-rbac.yaml
  - ov-lock-watchdog-configmap.yaml
  - ov-lock-watchdog-cronjob.yaml
