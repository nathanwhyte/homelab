---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openviking-data
  namespace: viking
  annotations:
    # Not read by the Longhorn CSI driver (v1.12.0 takes replica count from the
    # class only); kept as a statement of intent. The live Volume was raised to 2
    # replicas by hand on 2026-09-22 — see below.
    longhorn.io/number-of-replicas: "2"
    # LIVE Longhorn Volume settings that this claim's class (`longhorn-ssd`: 1
    # replica, locality disabled) does not express and cannot be changed to
    # express — a PVC's class is immutable. Applied on 2026-09-22 with
    # viking/scripts/ov-volume-locality.sh after the manu node drill (BUG-1101)
    # found this volume's only replica on manu's disk while the pod runs on timmy:
    # Longhorn faulted it 5m51s after k3s-agent stopped, OV logged "database disk
    # image is malformed" on every queue worker (17:30:51–17:31:24Z), and /health
    # returned 200 in every sample taken during the ~18 min until recovery.
    #   dataLocality best-effort — one replica on the attached node when Longhorn
    #     can place it there (not a guarantee; watch LocalReplicaSchedulingFailure)
    #   numberOfReplicas 2 — the redundancy; the second replica is on another node
    # The class a re-provisioned claim must select is storageclass-longhorn-ov.yaml;
    # the restore-time claim is restore/ov-claims-longhorn-ov.yaml.
    homelab.nathanwhyte.dev/longhorn-data-locality: best-effort
    homelab.nathanwhyte.dev/longhorn-live-replicas: "2"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn-ssd
  volumeMode: Filesystem
