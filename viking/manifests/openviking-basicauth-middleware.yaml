---
# BasicAuth middleware for OpenViking ingress.
# Requires the openviking-auth-secret Secret to exist:
#   kubectl apply -f viking/openviking-auth.secret.yaml.example  # (after creating .yaml with htpasswd hash)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: openviking-basicauth
  namespace: viking
spec:
  basicAuth:
    secret: openviking-auth-secret