---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openviking-standalone-config
  namespace: viking
data:
  # git.enabled is forced off: v0.4.6+ defaults it on and inherits the Garage
  # S3 backend from storage.agfs, which would silently start writing .ovgit
  # object trees to the openviking-agfs bucket at the v0.4.7 bump. Opt in
  # deliberately if VikingFS snapshots are ever wanted (IMPR-1032).
  #
  # There is deliberately NO AGFS path-lock timeout configured. Both spellings
  # are dead as of v0.4.20, verified against the running server:
  #   storage.transaction.lock_timeout / lock_expire   (the pre-v0.4.19 keys)
  #   storage.agfs.pathlock.lock_timeout_secs / _secs  (their documented successor)
  # The second pair still logs "is deprecated and ignored; the runtime wait
  # timeout is fixed at 0.0 seconds" on every start. Re-adding either spelling
  # buys nothing and re-introduces the warning. The 0.0s wait is the live
  # behaviour and is tracked separately — it is the reason BUG-1039's orphaned
  # tree locks matter and why raising embedding concurrency needs its own gate.
  #
  # embedding.max_input_tokens is 6000, not the embedder's 8192 ctx (BUG-1191).
  # OpenViking trims by an estimate (utils/embedding_input.py: non-CJK chars / 4),
  # and the qwen3-embedding-4b tokenizer counts markdown-heavy memory text ~16%
  # higher. The daily events overview (MemoryUpdater, one line per event, 36k chars
  # on a busy day) went to the embedder at 9,459-9,477 real tokens, got a 400
  # exceed_context_size_error, and each one opened the embedding circuit breaker,
  # stalling every embedding for about a minute. 6000 estimated is ~6.9k real at the
  # observed ratio. Raise it only together with the embedder's --ctx-size.
  ov.conf: |
    {
      "default_account": "default",
      "default_user": "noot",
      "storage": {
        "workspace": "/app/data",
        "vectordb": {
          "backend": "http",
          "name": "context",
          "dimension": 2560,
          "url": "http://ov-vectordb.viking.svc.cluster.local:5000"
        },
        "agfs": {
          "backend": "s3",
          "s3": {
            "bucket": "openviking-agfs",
            "endpoint": "http://garage.garage.svc.cluster.local:3900",
            "region": "garage",
            "access_key": "${S3_ACCESS_KEY}",
            "secret_key": "${S3_SECRET_KEY}",
            "use_path_style": true
          }
        }
      },
      "git": {
        "enabled": false
      },
      "rerank": {
        "threshold": 0.2
      },
      "server": {
        "host": "0.0.0.0",
        "port": 1933,
        "workers": 1,
        "root_api_key": "${API_KEY}",
        "auth_mode": "trusted",
        "public_base_url": "https://context.nathanwhyte.dev",
        "temp_upload": {
          "default_mode": "local"
        },
        "observability": {
          "metrics": {
            "enabled": true,
            "exporters": {
              "prometheus": {
                "enabled": true
              }
            }
          }
        }
      },
      "log": {
        "level": "INFO",
        "output": "stdout"
      },
      "embedding": {
        "max_input_tokens": 6000,
        "dense": {
          "provider": "openai",
          "model": "qwen3-embedding-4b",
          "api_key": "sk-no-...ired",
          "api_base": "http://embedder-qwen.viking.svc.cluster.local:8080/v1",
          "dimension": 2560,
          "batch_size": 256
        },
        "max_concurrent": 1
      },
      "semantic": {
        "overview_max_chars": 20000,
        "abstract_max_chars": 256,
        "overview_sample_limit": 105
      },
      "vlm": {
        "provider": "openai",
        "model": "gemma4:vlm",
        "api_key": "${OLLAMA_KEY}",
        "api_base": "http://chat-ollama.llama.svc.cluster.local:11434/v1",
        "max_concurrent": 1,
        "timeout": 600
      }
    }
