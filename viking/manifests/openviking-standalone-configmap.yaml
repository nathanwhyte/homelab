---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openviking-standalone-config
  namespace: viking
data:
  ov.conf: |
    {
      "default_account": "default",
      "default_user": "noot",
      "storage": {
        "workspace": "/app/data",
        "transaction": {
          "lock_timeout": 30.0,
          "lock_expire": 60.0,
          "v2_lock_retry_interval_seconds": 0.5,
          "v2_lock_max_retries": 10
        },
        "vectordb": {
          "backend": "http",
          "name": "context",
          "dimension": 768,
          "url": "http://ov-vectordb.viking.svc.cluster.local:5000"
        },
        "agfs": {
          "backend": "s3",
          "s3": {
            "bucket": "openviking-agfs",
            "endpoint": "http://garage.garage.svc.cluster.local:3900",
            "region": "garage",
            "access_key": "${S3_ACCESS_KEY}",
            "secret_key": "${S3_SECRET_KEY}",
            "use_path_style": true
          }
        }
      },
      "code": {
        "code_summary_mode": "ast"
      },
      "rerank": {
        "threshold": 0.2
      },
      "server": {
        "host": "0.0.0.0",
        "port": 1933,
        "workers": 2,
        "root_api_key": "${API_KEY}"
      },
      "log": {
        "level": "INFO",
        "output": "stdout"
      },
      "embedding": {
        "_comment_max_input_tokens": "Intentionally absent. The embedder runs --parallel 2 with --ctx-size 16384 (8192/slot, matching nomic-embed's native limit). OV chunks inputs internally; a max_input_tokens guardrail would truncate documents unnecessarily. Removed from live in PR #10 era.",
        "dense": {
          "provider": "openai",
          "model": "nomic-embed-text-v1.5",
          "api_key": "sk-no-...ired",
          "api_base": "http://embedder-llamacpp.viking.svc.cluster.local:8080/v1",
          "dimension": 768,
          "batch_size": 128
        },
        "max_concurrent": 4
      },
      "vlm": {
        "provider": "litellm",
        "model": "openai/current.gguf",
        "api_key": "sk-no-...ired",
        "api_base": "http://llamacpp-vlm.viking.svc/v1",
        "max_concurrent": 2,
        "timeout": 120
      }
    }