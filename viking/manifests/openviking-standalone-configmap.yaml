---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openviking-standalone-config
  namespace: viking
data:
  # git.enabled is forced off: v0.4.6+ defaults it on and inherits the Garage
  # S3 backend from storage.agfs, which would silently start writing .ovgit
  # object trees to the openviking-agfs bucket at the v0.4.7 bump. Opt in
  # deliberately if VikingFS snapshots are ever wanted (IMPR-1032).
  #
  # There is deliberately NO AGFS path-lock timeout configured. Both spellings
  # are dead as of v0.4.20, verified against the running server:
  #   storage.transaction.lock_timeout / lock_expire   (the pre-v0.4.19 keys)
  #   storage.agfs.pathlock.lock_timeout_secs / _secs  (their documented successor)
  # The second pair still logs "is deprecated and ignored; the runtime wait
  # timeout is fixed at 0.0 seconds" on every start. Re-adding either spelling
  # buys nothing and re-introduces the warning. The 0.0s wait is the live
  # behaviour and is tracked separately — it is the reason BUG-1039's orphaned
  # tree locks matter and why raising embedding concurrency needs its own gate.
  #
  # embedding.max_input_tokens is 6000, not the embedder's 8192 ctx (BUG-1191).
  # OpenViking trims by an estimate (utils/embedding_input.py: non-CJK chars / 4),
  # and the qwen3-embedding-4b tokenizer counts markdown-heavy memory text ~16%
  # higher. The daily events overview (MemoryUpdater, one line per event, 36k chars
  # on a busy day) went to the embedder at 9,459-9,477 real tokens, got a 400
  # exceed_context_size_error, and each one opened the embedding circuit breaker,
  # stalling every embedding for about a minute. 6000 estimated is ~6.9k real at the
  # observed ratio. Raise it only together with the embedder's --ctx-size.
  #
  # Embedder: Qwen3-Embedding-4B via embedder-qwen, collection `context` (2,560
  # dims). The TASK-1218 cutover to EmbeddingGemma 2 (context_eg2, 768 dims) ran
  # on 2026-10-08 and was rolled back the same window: EG2 was OOMKilled on the
  # GTX 1080. context_eg2 exists but is empty. Attempt record and retry
  # preconditions: viking/docs/2026-10-08-embedder-embeddinggemma-2-cutover.md.
  #
  # VLM concurrency (IMPR-1303). On v0.4.20 vlm.max_concurrent is read twice on
  # the Semantic path: QueueManager._max_concurrent_for_queue returns it as the
  # number of Semantic jobs run at once (queue_manager.py), and every job's
  # SemanticDAG takes it again as its own per-node semaphore (semantic_dag.py,
  # max_concurrent_llm), so the ceiling on in-flight Semantic VLM calls is the
  # square: 4 at the old value of 2, 16 at 4. It is not read by session commits,
  # which queue_workers.session_commit.max_concurrent bounds instead (code
  # default 8, one Phase 2 job per worker; a job's extraction batch is an
  # ExtractLoop that defaults to 3 sequential VLM iterations, and format
  # retries, refetches and repairs add calls beyond that, so a batch is one
  # call only when its first iteration succeeds outright). Every call shares
  # timmy's four OLLAMA_NUM_PARALLEL slots with chat-ollama-proxy's other
  # callers (omnibot, omnipendium, the warm job); the excess waits in Ollama's
  # queue, so vlm.timeout (1200) is the thing to watch. 1 -> 2 landed in #218
  # (2026-10-13 15:35 CDT); 2 -> 4 and session_commit 8 -> 12 followed after a
  # 6 h window peaked at Semantic 102 pending and SessionCommit 13 pending
  # (above the 8 workers) with zero Phase 2 errors and an oldest live lock of
  # 59 s against the 2700 s OpenVikingWedgedLockFile threshold. Before raising
  # either again: record ov-extract-outcome counts, VLM timeouts and
  # openviking_s3_ovlock_oldest_live_age_seconds before and after (BUG-1220).
  #
  # VLM route (IMPR-1311): OpenViking calls the LiteLLM router's `ov-vlm` group
  # (litellm-vlm-configmap.yaml), which sends gemma4:vlm up to 4 calls in flight,
  # overflow to Claude Haiku 5.5 under a $100/month cap, and the rest back to gemma.
  # The in-flight ceiling above therefore no longer queues past gemma's slots. To
  # bypass the router, restore the direct block with
  # `viking/scripts/ov-vlm-swap.py gemma --apply`.
  ov.conf: |
    {
      "default_account": "default",
      "default_user": "noot",
      "storage": {
        "workspace": "/app/data",
        "vectordb": {
          "backend": "http",
          "name": "context",
          "dimension": 2560,
          "url": "http://ov-vectordb.viking.svc.cluster.local:5000"
        },
        "agfs": {
          "backend": "s3",
          "s3": {
            "bucket": "openviking-agfs",
            "endpoint": "http://garage.garage.svc.cluster.local:3900",
            "region": "garage",
            "access_key": "${S3_ACCESS_KEY}",
            "secret_key": "${S3_SECRET_KEY}",
            "use_path_style": true
          }
        }
      },
      "git": {
        "enabled": false
      },
      "rerank": {
        "threshold": 0.2
      },
      "server": {
        "host": "0.0.0.0",
        "port": 1933,
        "workers": 1,
        "root_api_key": "${API_KEY}",
        "auth_mode": "trusted",
        "public_base_url": "https://context.nathanwhyte.dev",
        "temp_upload": {
          "default_mode": "local"
        },
        "observability": {
          "metrics": {
            "enabled": true,
            "exporters": {
              "prometheus": {
                "enabled": true
              }
            }
          }
        }
      },
      "log": {
        "level": "INFO",
        "output": "stdout"
      },
      "embedding": {
        "max_input_tokens": 6000,
        "dense": {
          "provider": "openai",
          "model": "qwen3-embedding-4b",
          "api_key": "sk-no-...ired",
          "api_base": "http://embedder-qwen.viking.svc.cluster.local:8080/v1",
          "dimension": 2560,
          "batch_size": 256
        },
        "max_concurrent": 1
      },
      "semantic": {
        "overview_max_chars": 20000,
        "abstract_max_chars": 256,
        "overview_sample_limit": 105
      },
      "vlm": {
        "provider": "openai",
        "model": "ov-vlm",
        "api_key": "${LITELLM_KEY}",
        "api_base": "http://litellm-vlm.viking.svc.cluster.local:4000/v1",
        "max_concurrent": 4,
        "timeout": 1200
      },
      "queue_workers": {
        "session_commit": {
          "max_concurrent": 12
        }
      }
    }
