                    lines.append(f'{name}{{{label_name}="{safe}"}} {v}')

        with _lock:
            gauge(
                "openviking_up",
                "1 if last poll cycle succeeded, 0 otherwise.",
                _metrics["openviking_up"],
            )
            gauge(
                "openviking_last_poll_unix",
