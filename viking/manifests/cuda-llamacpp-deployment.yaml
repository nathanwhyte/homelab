---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-cuda-model-cache
  namespace: viking
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ssd
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp-cuda-ov
  namespace: viking
  labels:
    app: llamacpp-cuda-ov
spec:
  # Primary VLM under the IDEA-009 GPU reshuffle (VLM → manu/GTX 1080).
  # Steady-state: replicas=1, always on. The 1080 is VLM-exclusive — the
  # embedder moved to wemby's GTX 1060 in IDEA-009 Phase 2 and hermes-agent
  # is CPU-only, so there is no GPU memory conflict. Earlier on-demand
  # scaling (scaled to 0 at idle, brought up via viking/tools/ov-vlm.sh for
  # index runs) is no longer worth the friction: cold model load from the
  # Longhorn PVC is ~40s, and an in-flight scale-down can cut off L0 jobs
  # the VLM is actively generating. Cold-load cost is paid once on pod
  # startup; keeping the model warm is cheaper than the round-trip risk.
  # If you ever need the 1080 for something else, scale down manually:
  # `kubectl scale deploy/llamacpp-cuda-ov --replicas=0 -n viking`.
  #
  # 2026-07-17 (TASK-1136): pinned to 0 to free the 1080 for the cross-card
  # embedder throughput benchmark. VLM is offline while this holds. Restore
  # to `replicas: 1` (and revert this note) when the benchmark completes.
  replicas: 0
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llamacpp-cuda-ov
  template:
    metadata:
      labels:
        app: llamacpp-cuda-ov
        vlm-pool: "true"
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: manu
        gpu: "true"
      securityContext:
        fsGroup: 0
      initContainers:
        - name: gpu-tune
          image: nvidia/cuda:12.4.0-base-ubuntu22.04
          command: ["nvidia-smi", "-pl", "238"]
          securityContext:
            # Setting a power limit needs SYS_ADMIN, not full privileged
            # (IMPR-1022). Verify the initContainer log shows the 238 W cap
            # applied on next rollout.
            capabilities:
              add: ["SYS_ADMIN"]
          resources:
            limits:
              nvidia.com/gpu: "1"
        - name: model-fetch
          image: curlimages/curl:8.12.1
          env:
            # IQ4_XS (~4.2 GB) — same quant as the ROCm VLM; fits the 8 GB GTX 1080
            # with a 32k context. (Was Q4_K_M ~5.2 GB, which OOMs at this context.)
            - name: MODEL_FILE
              value: Qwen_Qwen3-8B-IQ4_XS.gguf
            - name: MODEL_URL
              value: https://huggingface.co/bartowski/Qwen_Qwen3-8B-GGUF/resolve/main/Qwen_Qwen3-8B-IQ4_XS.gguf
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["/bin/sh", "-c"]
          args:
            - >-
              set -eu;
              model_path="/models/${MODEL_FILE}";
              if [ -f "${model_path}" ]; then
                echo "Model already cached: ${model_path}";
              else
                echo "Downloading ${MODEL_FILE}...";
                curl -fL --retry 5 --retry-delay 10 "${MODEL_URL}" -o "${model_path}.tmp";
                mv "${model_path}.tmp" "${model_path}";
                echo "Download complete.";
              fi;
              ln -sf "${model_path}" /models/current.gguf;
              echo "Model ready."
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          command:
            - /app/llama-server
          args:
            - --model
            - /models/current.gguf
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --ctx-size
            # Reduced 65536→32768 to fit the 8 GB GTX 1080 (IDEA-009). Total server
            # context splits across parallel slots → 8k tokens/request at parallel=4,
            # still 8× OpenViking's ~1k-token document splits. Bumped 2→4 (IDEA-1042
            # Phase 4) to drain the post-Qwen-cutover semantic queue faster; the
            # embedder is no longer the bottleneck so VLM was the queue's long pole.
            - "32768"
            - --n-gpu-layers
            - "999"
            - --parallel
            - "4"
            - --threads
            - "8"
            - --cache-type-k
            - q4_0
            - --cache-type-v
            - q4_0
            - --cont-batching
            - --batch-size
            - "2048"
            - --ubatch-size
            - "1024"
            - --split-mode
            - none
            - --main-gpu
            - "0"
            - --flash-attn
            - "on"
            - --metrics
            - --reasoning-format
            - deepseek
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "500m"
              # 2026-07-06 (IMPR-1038): 3Gi -> 5Gi; steady host-RAM use 5Gi (7d peak
              # 8.9Gi). Moot once the VLM standby is retired post-cloud-soak.
              memory: 5Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 10Gi
              nvidia.com/gpu: "1"
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llama-cuda-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
