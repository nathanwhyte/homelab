---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-cuda-model-cache
  namespace: viking
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ssd
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp-cuda-ov
  namespace: viking
  labels:
    app: llamacpp-cuda-ov
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llamacpp-cuda-ov
  template:
    metadata:
      labels:
        app: llamacpp-cuda-ov
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: manu
        gpu: "true"
      securityContext:
        fsGroup: 0
      initContainers:
        - name: gpu-tune
          image: nvidia/cuda:12.4.0-base-ubuntu22.04
          command: ["nvidia-smi", "-pl", "238"]
          securityContext:
            privileged: true
          resources:
            limits:
              nvidia.com/gpu: "1"
        - name: model-fetch
          image: curlimages/curl:8.12.1
          env:
            - name: MODEL_FILE
              value: Qwen3-8B-Q4_K_M.gguf
            - name: MODEL_URL
              value: https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["/bin/sh", "-c"]
          args:
            - >-
              set -eu;
              model_path="/models/${MODEL_FILE}";
              if [ -f "${model_path}" ]; then
                echo "Model already cached: ${model_path}";
              else
                echo "Downloading ${MODEL_FILE}...";
                curl -fL --retry 5 --retry-delay 10 "${MODEL_URL}" -o "${model_path}.tmp";
                mv "${model_path}.tmp" "${model_path}";
                echo "Download complete.";
              fi;
              ln -sf "${model_path}" /models/current.gguf;
              echo "Model ready."
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          command:
            - /app/llama-server
          args:
            - --model
            - /models/current.gguf
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --ctx-size
            - "32768"
            - --n-gpu-layers
            - "999"
            - --parallel
            - "4"
            - --threads
            - "8"
            - --cache-type-k
            - q4_0
            - --cache-type-v
            - q4_0
            - --cont-batching
            - --batch-size
            - "2048"
            - --ubatch-size
            - "1024"
            - --split-mode
            - none
            - --main-gpu
            - "0"
            - --flash-attn
            - "on"
            - --metrics
            - --reasoning-format
            - deepseek
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: 3Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 10Gi
              nvidia.com/gpu: "1"
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llama-cuda-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
