---
# Qwen3-Embedding-4B on manu's GTX 1080 (CUDA) — PRIMARY embedder since 2026-07-17.
# Relocated here from timmy's RX 9070 XT (ROCm) by IMPR-1077 (TASK-1136 throughput
# decision); the ROCm deployment (embedder-qwen-rocm-deployment.yaml) is retired at
# replicas=0 as the rollback path. Own PVC embedder-cuda-model-cache so it coexisted
# with the ROCm embedder during the transition.
# The `embedder-qwen` Service (embedder-qwen-service.yaml) selects app=embedder-qwen-cuda.
# Cutover / rollback runbook: viking/docs/2026-07-06-embedder-migration-wemby-to-timmy.md
# IMPR-1040 deviation: this Deployment keeps its backend-qualified name
# (embedder-qwen-cuda) even though it is now the live target — per the IMPR-1077
# decision the neutral Service selector was moved rather than the Deployment renamed
# (a recorded cosmetic deviation from the IMPR-1040 backend-neutral-name convention).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embedder-cuda-model-cache
  namespace: viking
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ssd
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder-qwen-cuda
  namespace: viking
  labels:
    app: embedder-qwen-cuda
spec:
  replicas: 1 # PRIMARY — live embedder on manu/GTX 1080; the embedder-qwen Service (embedder-qwen-service.yaml) selects app=embedder-qwen-cuda (cutover 2026-07-17, IMPR-1077)
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: embedder-qwen-cuda
  template:
    metadata:
      labels:
        app: embedder-qwen-cuda
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: manu
        gpu.vendor: nvidia
      securityContext:
        fsGroup: 0
      initContainers:
        - name: model-fetch
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              model_path="/models/${MODEL_FILE}"
              if [ -f "${model_path}" ]; then
                echo "Model already cached: ${model_path}"
              else
                echo "Downloading ${MODEL_FILE}..."
                curl -fL --retry 5 --retry-delay 10 "${MODEL_URL}" -o "${model_path}.tmp"
                mv "${model_path}.tmp" "${model_path}"
                echo "Download complete."
              fi
              ln -sf "${model_path}" /models/current.gguf
              echo "Model ready."
          env:
            - name: MODEL_FILE
              value: Qwen3-Embedding-4B-Q8_0.gguf
            - name: MODEL_URL
              value: https://huggingface.co/Qwen/Qwen3-Embedding-4B-GGUF/resolve/main/Qwen3-Embedding-4B-Q8_0.gguf
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          command: ["/app/llama-server"]
          args:
            - --model
            - /models/current.gguf
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --embedding
            - --pooling
            - last
            # Two slots since 2026-09-22 (IDEA-1100 recall latency, embedder
            # slot serialization): with one slot a ~300-token recall query
            # waits behind whichever 3–8k-token overview chunk is in flight —
            # measured 2026-09-22 on live pilot sessions: recall p50 310 ms but
            # p95 3.4 s, and OV logged 5–12 s "embedding slow call"s about once
            # per 5 min (task sizes p50 287, p90 3,534, p99 6,912, max 7,655
            # tokens). A second slot lets a short request join the batch
            # beside a long one — but only in one order: this llama.cpp build
            # (b11011) visits slots in fixed order and fills each ubatch from
            # the first pending prompt, so a long prompt already in slot 0
            # still holds a short prompt in slot 1 for its ~14 ubatches; the
            # reverse order interleaves. Treat the gain as order-dependent
            # until measured under mixed load in both orders (2026-09-22
            # Codex review of homelab #156). --parallel N divides --ctx-size
            # between slots (kv_unified=false), and each slot must be >= OV's
            # embedding.max_input_tokens (8192) or chunks above it are
            # rejected with "exceeds available context size" (the IDEA-1042
            # cutover lesson in viking/openviking.md) — hence 16384 for two
            # 8k slots. OV's embedding.max_concurrent stays 1: that semaphore
            # is per event loop (queue worker and API/recall loop each get
            # one in-flight request), so 1 already allows one background
            # embed plus one recall embed; raising it would let indexing take
            # both slots and reserve nothing for recall (IMPR-1074's pairing
            # rule was about not exceeding the slot count, not matching it).
            #
            # VRAM (MiB): each 8,192-token f16 slot's KV is 1,152 MiB
            # (Qwen3-4B GGUF header: 36 layers × 8 KV heads × 128 dim × K+V
            # × 2 bytes = 147,456 B/token). Measured peaks on this card
            # (TASK-1217 CSVs, one slot): batch 2048 → 6,655 MiB, batch 512 →
            # 5,677 MiB, so dropping the batch buffer pays for the second
            # slot: expected two-slot peak ≈ 6,829 MiB (−4% tok/s, 788 vs
            # 822). Verify with nvidia-smi under sustained load after rollout;
            # back out if it exceeds ~7,500 MiB (692 MiB spare). Three f16
            # slots (~7,981 MiB) do not fit; more slots need q8_0 KV
            # (--cache-type-k/-v q8_0, 612 MiB/slot) and a retrieval-quality
            # check first. The cuda-llamacpp VLM-failover pod that used to
            # share this card is not deployed (checked 2026-09-22).
            #
            # Back-out (all four, in one apply): --ctx-size 8192, --parallel 1,
            # --batch-size 2048, --ubatch-size 2048. No ConfigMap change is
            # part of this rollout.
            - --ctx-size
            - "16384"
            - --n-gpu-layers
            - "999"
            - --parallel
            - "2"
            - --threads
            - "4"
            - --batch-size
            - "512"
            - --ubatch-size
            - "512"
            - --split-mode
            - none
            - --main-gpu
            - "0"
            - --flash-attn
            - "on"
            - --metrics
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 6Gi
              nvidia.com/gpu: "1"
          # privileged dropped (IMPR-1022): runtimeClassName nvidia + the
          # nvidia.com/gpu resource inject the GPU; verify with nvidia-smi in
          # the pod on next rollout.
          # BUG-1049: single-replica GPU inference. /health shares the process
          # with embedding work, so it goes slow exactly when the embedder is
          # busiest — which is when OpenViking most needs it.
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          # readinessProbe removed — no second replica exists to absorb the
          # traffic, so ejection only converts "slow" into "down".
          #
          # livenessProbe was http /health, restarting the pod after ~75s of
          # slow health. Restarting a GPU embedder mid-batch is expensive
          # (model reload from the cache PVC) and drops in-flight work. TCP-only
          # with a ~5min budget still catches a genuinely wedged process.
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: embedder-cuda-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
# NOTE: the `embedder-qwen` Service lives in its own file, embedder-qwen-service.yaml
# (selector app=embedder-qwen-cuda since the 2026-07-17 IMPR-1077 cutover). Do not
# re-add it here — two Services with the same name would fight over the selector on apply.
