---
# Qwen3-Embedding-4B on wemby's GTX 1060 (CUDA).
# Moved from timmy's RX 9070 XT to free VRAM for Ollama (mem0 LLM extraction).
# GTX 1060 has 6 GB VRAM; Qwen3-Embedding-4B Q8_0 ≈ 4 GB weights.
# Conservative ctx (16384) + parallel 2 → 8192/slot, same per-slot context as
# the ROCm deployment's 32768/4. KV cache fits in remaining ~2 GB.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embedder-qwen-model-cache
  namespace: viking
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ssd
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder-qwen-cuda
  namespace: viking
  labels:
    app: embedder-qwen-cuda
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: embedder-qwen-cuda
  template:
    metadata:
      labels:
        app: embedder-qwen-cuda
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: wemby
        gpu.vendor: nvidia
      securityContext:
        fsGroup: 0
      initContainers:
        - name: model-fetch
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              model_path="/models/${MODEL_FILE}"
              if [ -f "${model_path}" ]; then
                echo "Model already cached: ${model_path}"
              else
                echo "Downloading ${MODEL_FILE}..."
                curl -fL --retry 5 --retry-delay 10 "${MODEL_URL}" -o "${model_path}.tmp"
                mv "${model_path}.tmp" "${model_path}"
                echo "Download complete."
              fi
              ln -sf "${model_path}" /models/current.gguf
              echo "Model ready."
          env:
            - name: MODEL_FILE
              value: Qwen3-Embedding-4B-Q8_0.gguf
            - name: MODEL_URL
              value: https://huggingface.co/Qwen/Qwen3-Embedding-4B-GGUF/resolve/main/Qwen3-Embedding-4B-Q8_0.gguf
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          command: ["/app/llama-server"]
          args:
            - --model
            - /models/current.gguf
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --embedding
            - --pooling
            - last
            # GTX 1060 has 6 GB VRAM; Qwen3-Embedding-4B Q8_0 ≈ 4 GB weights,
            # leaving ~2 GB for KV cache. 8192 ctx / 1 slot keeps KV ~580 MB.
            # parallel=1 means no slot multiplication; batch reduced to fit.
            - --ctx-size
            - "8192"
            - --n-gpu-layers
            - "999"
            - --parallel
            - "1"
            - --threads
            - "4"
            - --batch-size
            - "512"
            - --ubatch-size
            - "512"
            - --split-mode
            - none
            - --main-gpu
            - "0"
            - --flash-attn
            - "on"
            - --metrics
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 6Gi
              nvidia.com/gpu: "1"
          securityContext:
            privileged: true
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: embedder-qwen-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: embedder-qwen
  namespace: viking
  labels:
    app: embedder-qwen-cuda
spec:
  type: ClusterIP
  selector:
    app: embedder-qwen-cuda
  ports:
    - name: http
      port: 8080
      targetPort: 8000
      protocol: TCP