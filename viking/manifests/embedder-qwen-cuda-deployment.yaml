---
# Qwen3-Embedding-4B on wemby's GTX 1060 (CUDA) — RETIRED rollback path.
# Was PRIMARY 2026-06-29 → 2026-07-06; superseded by embedder-qwen-rocm on
# timmy's RX 9070 XT after wemby's charging cable/port kept failing and the
# node hard-dropped repeatedly (see the rocm file header + migration runbook).
# replicas=0. The live `embedder-qwen` Service now lives in
# embedder-qwen-rocm-deployment.yaml (selector app=embedder-qwen-rocm); its
# Service block was removed from THIS file so there is exactly one Service.
# To roll back to wemby CUDA: scale this to 1 AND repoint the Service selector
# to app=embedder-qwen-cuda (only if wemby's power is fixed). Runbook:
# viking/docs/2026-07-06-embedder-migration-wemby-to-timmy.md
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embedder-qwen-model-cache
  namespace: viking
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ssd
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder-qwen-cuda
  namespace: viking
  labels:
    app: embedder-qwen-cuda
spec:
  replicas: 0 # retired; superseded by embedder-qwen-rocm on timmy 2026-07-06
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: embedder-qwen-cuda
  template:
    metadata:
      labels:
        app: embedder-qwen-cuda
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: wemby
        gpu.vendor: nvidia
      securityContext:
        fsGroup: 0
      initContainers:
        - name: model-fetch
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              model_path="/models/${MODEL_FILE}"
              if [ -f "${model_path}" ]; then
                echo "Model already cached: ${model_path}"
              else
                echo "Downloading ${MODEL_FILE}..."
                curl -fL --retry 5 --retry-delay 10 "${MODEL_URL}" -o "${model_path}.tmp"
                mv "${model_path}.tmp" "${model_path}"
                echo "Download complete."
              fi
              ln -sf "${model_path}" /models/current.gguf
              echo "Model ready."
          env:
            - name: MODEL_FILE
              value: Qwen3-Embedding-4B-Q8_0.gguf
            - name: MODEL_URL
              value: https://huggingface.co/Qwen/Qwen3-Embedding-4B-GGUF/resolve/main/Qwen3-Embedding-4B-Q8_0.gguf
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          command: ["/app/llama-server"]
          args:
            - --model
            - /models/current.gguf
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --embedding
            - --pooling
            - last
            # GTX 1060 has 6 GB VRAM; Qwen3-Embedding-4B Q8_0 ≈ 4 GB weights,
            # leaving ~2 GB for KV cache. 8192 ctx / 1 slot keeps KV ~580 MB.
            # parallel=1 means no slot multiplication; batch reduced to fit.
            - --ctx-size
            - "8192"
            - --n-gpu-layers
            - "999"
            - --parallel
            - "1"
            - --threads
            - "4"
            - --batch-size
            - "512"
            - --ubatch-size
            - "512"
            - --split-mode
            - none
            - --main-gpu
            - "0"
            - --flash-attn
            - "on"
            - --metrics
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 6Gi
              nvidia.com/gpu: "1"
          # privileged dropped (IMPR-1022): runtimeClassName nvidia + the
          # nvidia.com/gpu resource inject the GPU; verify with nvidia-smi in
          # the pod on next rollout.
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: embedder-qwen-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
# NOTE: the `embedder-qwen` Service was moved to
# embedder-qwen-rocm-deployment.yaml (selector app=embedder-qwen-rocm) as part
# of the 2026-07-06 migration. Do not re-add it here — two Services with the
# same name would fight over the selector on apply.
