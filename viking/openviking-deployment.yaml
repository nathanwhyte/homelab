---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking
  namespace: viking
  labels:
    app: openviking
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openviking
  template:
    metadata:
      labels:
        app: openviking
    spec:
      terminationGracePeriodSeconds: 15
      affinity:
        nodeAffinity:
          # Patty and Steph are being decommissioned, so prefer the remaining
          # stable general-purpose nodes.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - manu
                      - wemby
            # Actively avoid timmy (unstable AMD GPU node)
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - timmy
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - qwen-summarizer
                        - llamacpp-rocm
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: temp-cleanup
          image: busybox:1.37
          command: ["/bin/sh", "-c"]
          args:
            - >-
              echo "Cleaning stale temp files...";
              find /app/data/temp -type f -mtime +1 -delete 2>/dev/null || true;
              find /app/data/temp -type d -empty -delete 2>/dev/null || true;
              echo "Removing stale locks...";
              rm -f /app/data/.openviking.pid;
              rm -f /app/data/vectordb/context/store/LOCK;
              find /app/data/viking -name '.path.ovlock' -delete 2>/dev/null || true;
              echo "Done."
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: openviking
          image: ghcr.io/volcengine/openviking:v0.2.9
          ports:
            - containerPort: 1933
              name: http
          resources:
            requests:
              cpu: "2"
              memory: 1.5Gi
            limits:
              cpu: "4"
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /health
              port: 1933
            periodSeconds: 3
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 1933
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 1933
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: config
              mountPath: /app/ov.conf
              subPath: ov.conf
              readOnly: true
            - name: data
              mountPath: /app/data
      volumes:
        - name: config
          configMap:
            name: openviking-config
        - name: data
          persistentVolumeClaim:
            claimName: openviking-data
