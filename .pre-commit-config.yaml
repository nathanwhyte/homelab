# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # Bumped from v3.2.0 to v5.0.0 on 2026-06-30 — v3.2.0 doesn't ship
    # `check-shebang-scripts-are-executable` (added in v4.x), so the config
    # couldn't be installed/loaded. v5.0.0 is the latest stable before v6.0.0
    # (Aug 2025); v6.0.0 deferred pending review.
    rev: v5.0.0
    hooks:
      # Four trees whose bytes are the record or the contract, so the whitespace
      # fixers must not rewrite them: benchmarks/results/ and
      # benchmarks/embedding-retrieval/results*/ (recorded tool output),
      # benchmarks/ollama/corpus/ (prompt corpora whose bytes and sha256 are
      # pinned in manifest.json), and *.patch (a trailing blank context line is
      # counted in the hunk header).
      - id: trailing-whitespace
        exclude: ^benchmarks/(results/|embedding-retrieval/results[^/]*/|ollama/corpus/)|\.patch$
      - id: end-of-file-fixer
        exclude: ^benchmarks/(results/|embedding-retrieval/results[^/]*/|ollama/corpus/)|\.patch$
      - id: check-yaml
        # exclude viking/snapshots/ — point-in-time archives of cluster state;
        # reformatting would lose the "what it actually was" signal
        exclude: ^viking/snapshots/
        # `-m` enables multi-document mode. Several manifests in this repo
        # legitimately use `---` separators (multi-doc Services, multi-ingress
        # files, etc.). check-yaml defaults to single-doc and errors on the
        # second `---`.
        args: ["-m"]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # The repo is public: an R2 key pair sat in two yt-dlp scripts as
  # `os.environ.get` defaults until 2026-10-19. gitleaks scans staged changes;
  # `.gitleaks.toml` adds a rule for S3-style key pairs its defaults miss.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
        # The stock entry adds --verbose, whose excerpt can print a second,
        # unredacted secret on the same line; report rule and location only.
        # --ignore-gitleaks-allow: an inline `gitleaks:allow` comment must not
        # wave a secret through; allowlist known placeholders in .gitleaks.toml.
        # --config: GITLEAKS_CONFIG must not swap out the repo's rules.
        # secret-files fails while a .gitleaksignore exists, which this cannot.
        entry: >-
          gitleaks git --pre-commit --redact --staged --no-banner
          --ignore-gitleaks-allow --config .gitleaks.toml
          --report-format template --report-template .gitleaks-report.tmpl
          --report-path -

  - repo: local
    hooks:
      # Secret-named files (force-added past .gitignore) and Kubernetes Secrets
      # with real values in any YAML/JSON, including kubectl dumps.
      - id: secret-files
        name: Secret files and Secret values
        entry: _scripts/check-secret-files.py
        language: python
        # The default `types: [file]` skips symlinks, which the hook rejects;
        # `types` and `types_or` both apply, so clear `types`.
        types: []
        types_or: [file, symlink]
        additional_dependencies: [pyyaml==6.0.2]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-format

  - repo: local
    hooks:
      # IMPR-1419: every test-*.py / test_*.py opens with the GIT_* scrub header,
      # because hooks inherit GIT_DIR and GIT_INDEX_FILE and a suite's fixture
      # git then acts on the repository being committed (homelab#254 round 5).
      # A new suite anywhere triggers it, so it matches by basename. fail_fast:
      # a failure stops the run here, before any later hook runs the unscrubbed
      # suite, so keep this above every hook that runs a test suite.
      - id: test-git-scrub
        name: every test suite opens with the GIT_* scrub (IMPR-1419)
        entry: python3 _scripts/check-test-git-scrub.py
        language: system
        pass_filenames: false
        fail_fast: true
        files: (^|/)test[-_][^/]*\.py$|^_scripts/(check-test-git-scrub|lib/git_env)\.py$
      - id: test-git-scrub-tests
        name: check-test-git-scrub fixture tests (IMPR-1419)
        entry: python3 _scripts/test-check-test-git-scrub.py
        language: system
        pass_filenames: false
        files: ^_scripts/((test-)?check-test-git-scrub|lib/git_env)\.py$
      # IMPR-1387: the checker's regression cases, one per review finding on
      # homelab#242. Runs in a pre-commit-managed env with the checker's own
      # pyyaml pin, so it needs nothing from uv's cache.
      - id: check-secret-files-tests
        name: check-secret-files regression cases
        entry: python3 _scripts/test-check-secret-files.py CheckerCaseTests
        language: python
        additional_dependencies: [pyyaml==6.0.2]
        pass_filenames: false
        files: ^_scripts/(test-)?check-secret-files\.py$
      # IMPR-1387: the same hooks under a real `pre-commit run` in a scratch repo,
      # since calling the script skips what pre-commit decides first (symlinks,
      # gitleaks flags). Also runs when the config or gitleaks files change. Skips
      # (exit 0) when the hook environments cannot install offline, and
      # pre-commit shows a passing hook's output only with `verbose`, so the
      # SKIP line stays visible; CHECK_SECRET_FILES_REQUIRE_DISPATCH=1 makes a
      # skip a failure.
      - id: check-secret-files-dispatch-tests
        name: secret hooks under real pre-commit dispatch
        entry: python3 _scripts/test-check-secret-files.py DispatchTests
        language: python
        additional_dependencies: [pyyaml==6.0.2]
        pass_filenames: false
        verbose: true
        files: ^(_scripts/(test-)?check-secret-files\.py|\.pre-commit-config\.yaml|\.gitleaks\.toml|\.gitleaks-report\.tmpl)$
      - id: backup-freshness-tests
        name: Backup freshness exporter tests
        entry: python3 grafana/test-backup-freshness-exporter.py
        language: system
        pass_filenames: false
        files: ^grafana/(test-)?backup-freshness-exporter\.py$
      # IMPR-1331: the Haiku-share reading script. Stdlib only, fakes only.
      - id: ov-haiku-reading-tests
        name: ov-haiku-reading tests
        entry: python3 viking/scripts/test-ov-haiku-reading.py
        language: system
        pass_filenames: false
        files: ^viking/scripts/(test-)?ov-haiku-reading\.py$
      # IMPR-1413: what the prod and test stacks mount, as `kubectl kustomize`
      # renders them, agrees with the nav-patch files on disk, and so does
      # sitecustomize.py's TARGETS. homelab#250 shipped a patch its Deployments'
      # items: lists did not mount. Any viking/manifests/ file can change a render,
      # so the filter takes the whole tree. kubectl: on both MacBooks and CI's runner.
      - id: nav-patch-files
        name: nav-patch file lists
        entry: viking/scripts/regen-nav-patch-configmap.sh --check
        language: python
        additional_dependencies: [pyyaml==6.0.2]
        pass_filenames: false
        files: ^viking/(manifests/|scripts/(regen-nav-patch-configmap\.sh|(test-)?check-nav-patch-files\.py)$)
      - id: nav-patch-files-tests
        name: check-nav-patch-files regression cases
        entry: python3 viking/scripts/test-check-nav-patch-files.py
        language: python
        additional_dependencies: [pyyaml==6.0.2]
        pass_filenames: false
        files: ^viking/(manifests/|scripts/(regen-nav-patch-configmap\.sh|(test-)?check-nav-patch-files\.py)$)
      # IMPR-1413: the nav-patch suite. Uses the `openviking` uv tool's Python when
      # it exists, mapping its `0.4.20` to the image's `v0.4.20`; without
      # openviking (CI) the real-module cases skip, and `verbose` keeps that SKIP
      # line visible. NAV_PATCH_REQUIRE_OPENVIKING=1 makes the skip a failure.
      - id: nav-patch-tests
        name: nav-patch suite
        entry: python3 viking/scripts/run-nav-patch-tests.py
        language: system
        pass_filenames: false
        verbose: true
        files: ^viking/(manifests/test/nav-patch/|scripts/run-nav-patch-tests\.py$)
      # BUG-1220 / IMPR-1095: the lock wedge exporter and the janitor have no
      # CI either. Stdlib only and offline (stubbed S3, loopback socket).
      - id: ov-exporter-tests
        name: ov-exporter lock series tests
        entry: python3 viking/exporters/test_ov_exporter.py
        language: system
        pass_filenames: false
        files: ^viking/exporters/
      - id: ovlock-janitor-tests
        name: ovlock-janitor tests
        entry: python3 viking/tools/test_ovlock_janitor.py
        language: system
        pass_filenames: false
        files: ^viking/(exporters/s3lite\.py|tools/(test_)?ovlock[-_]janitor\.py)$
      - id: ov-lock-watchdog-tests
        name: ov-lock-watchdog tests
        entry: python3 viking/tools/test_ov_lock_watchdog.py
        language: system
        pass_filenames: false
        files: ^viking/(tools/(test_)?ov[-_]lock[-_]watchdog\.py|manifests/ov-lock-watchdog-configmap\.yaml)$
      - id: ov-contention-watch-tests
        name: ov-contention-watch tests
        entry: python3 viking/tools/test_ov_contention_watch.py
        language: system
        pass_filenames: false
        files: ^viking/tools/(test_)?ov[-_]contention[-_]watch\.py$
      # IMPR-1344: every OV embedding call passes through the prompt shim.
      - id: embedder-prompt-shim-tests
        name: embedder-prompt-shim tests
        entry: python3 viking/tools/test_embedder_prompt_shim.py
        language: system
        pass_filenames: false
        files: ^viking/(tools/(test_)?embedder[-_]prompt[-_]shim\.py|manifests/embedder-prompt-shim-configmap\.yaml)$
      # IDEA-1150: session watches ask this before alerting; it reads the
      # window files the two maintenance scripts write.
      - id: maintenance-active-tests
        name: maintenance-active tests
        entry: python3 scripts/test-maintenance-active.py
        language: system
        pass_filenames: false
        files: ^scripts/((test-)?maintenance-active\.py|timmy-offline\.sh|node-maintenance\.sh)$
      # Which maintenance commands open, keep and close those windows.
      - id: maintenance-window-tests
        name: maintenance window tests
        entry: bash -c 'bash tests/test-node-maintenance-window.sh && bash tests/test-timmy-offline-quiet.sh'
        language: system
        pass_filenames: false
        files: ^(scripts/(maintenance-active\.py|timmy-offline\.sh|node-maintenance\.sh)|tests/test-(node-maintenance-window|timmy-offline-quiet)\.sh)$
      - id: helm-deploy-tests
        name: Helm deployment version safety tests
        entry: python3 scripts/test-helm-deploy.py
        language: system
        pass_filenames: false
        files: ^(scripts/(test-)?helm-deploy\.py|(?:grafana|harbor|openwebui|dashboard|garage)/deploy-[^/]+\.sh)$
      - id: arc-deploy-tests
        name: ARC CPU trial deployment safety tests
        entry: python3 arc/test-deploy-arc.py
        language: system
        pass_filenames: false
        files: ^arc/((test-)?deploy-arc\.(sh|py)|(test-)?runner-count-ownership(-integration)?\.py|runner-scale-set-compendium-values\.yaml|arc\.md)$
      - id: arc-ownership-integration
        name: ARC ownership regression (real disposable Kubernetes API)
        entry: python3 arc/check-runner-count-ownership.py
        language: system
        pass_filenames: false
        files: ^arc/((test-)?deploy-arc\.(sh|py)|(check-|test-)?runner-count-ownership(-integration)?\.py|runner-scale-set-compendium-values\.yaml|arc\.md)$
      - id: arc-ownership-driver-tests
        name: ARC disposable API isolation and cleanup tests
        entry: python3 arc/test-check-runner-count-ownership.py
        language: system
        pass_filenames: false
        files: ^arc/(test-)?check-runner-count-ownership\.py$
      # BUG-1135 / IMPR-1173: guards the class where a Slack receiver's
      # `channel` field is a lie because the transport ignores it. Fixture-driven,
      # so it also proves the checker can fail.
      - id: slack-transport-tests
        name: Slack transport check fixtures
        entry: uv run --no-project --with pyyaml python3 grafana/test-slack-transport.py
        language: system
        pass_filenames: false
        # The driver is `test-slack-transport.py`, NOT `test-check-slack-transport.py`.
        # An earlier `(test-)?check-slack-transport` filter matched a file that does
        # not exist, so edits to the driver itself skipped the hook and could weaken
        # the fixtures silently. Name all three files literally.
        files: ^grafana/(check-slack-transport\.(sh|test\.yaml)|test-slack-transport\.py)$
      # BUG-1243: run-yt-dlp.sh lives in a ConfigMap and decides whether each
      # yt-dlp Job fails. Stub yt-dlp, offline; reruns under busybox in the
      # CronJobs' image when docker has it locally (never pulls), since busybox
      # and macOS sh differ on the wrapper's grep -f. pyyaml for the manifests,
      # from uv's cache only (`uv run --with pyyaml true` once fills it).
      - id: yt-dlp-wrapper-tests
        name: run-yt-dlp.sh wrapper tests
        entry: uv run --offline --no-project --with pyyaml python3 media/yt-dlp/test-run-yt-dlp.py
        language: system
        pass_filenames: false
        files: ^media/yt-dlp/(test-run-yt-dlp\.py|yt-dlp-(config|playlists)\.yaml|cronjobs\.yaml|cronjob-validation\.yaml|media-pvc\.yaml)$
      - id: bare-code-fences
        name: Check for bare code fences (MD040)
        description: Reject commits with bare ``` fences that lack a language tag.
        entry: _scripts/check-bare-fences.sh
        language: script
        types: [markdown]
        pass_filenames: true
      # The two agentic-coding test files are the only guards for the harness's
      # score-corrupting defect classes (verifier bypass, token truncation,
      # metric drift) and there is no CI — so they run here, scoped to the
      # tools dir. Both are hermetic: neither calls probe_sandbox, so they run
      # unsandboxed identically on macOS and the Linux cluster.
      - id: agentic-harness-tests
        name: agentic-coding harness unit tests
        entry: python3 benchmarks/ollama/tools/test_agentic_harness.py
        language: system
        pass_filenames: false
        files: ^benchmarks/ollama/tools/
      - id: agentic-coding-fixtures
        name: agentic-coding fixture self-test
        entry: python3 benchmarks/ollama/tools/test_coding_tasks.py
        language: system
        pass_filenames: false
        files: ^benchmarks/ollama/tools/
        # Heavier (runs every fixture verifier several times) -> pre-push.
        stages: [pre-push]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        # Use the repo's tuned config. Same viking/snapshots exclusion as check-yaml.
        # --no-warnings so the 10 pre-existing warnings (comments-indentation,
        # comments missing starting space) don't block commits; only errors do.
        # 13 errors remain — 9 auto-fixed by end-of-file-fixer, 4 are real
        # issues in gpu/amd/amdgpu-fan.yml, harbor/harbor-values.yaml,
        # longhorn/ui.yaml.
        args:
          - --config-file=.yamllint.yml
          - --no-warnings
        exclude: ^viking/snapshots/

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        # --fix would rewrite recorded benchmark reports (benchmarks/results/),
        # and benchmarks/harbor/tasks/*/instruction.md is the prompt handed to
        # the agent under test, so neither is linted.
        exclude: ^benchmarks/(results/|harbor/tasks/)
        args:
          - --config
          - .markdownlint-cli2.jsonc
          - --fix
