---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heaper
  namespace: heaper
  labels:
    app: heaper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: heaper
  template:
    metadata:
      labels:
        app: heaper
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - steph
                      - patty
      containers:
        - name: heaper
          image: ghcr.io/janlunge/heaper:latest
          ports:
            - containerPort: 80
              name: http
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: ENABLE_INTERNAL_POSTGRES
              value: "true"
            - name: POSTGRES_USER
              value: "heaper"
            - name: POSTGRES_DB
              value: "heaper"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: heaper-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api
              port: 80
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
            - name: app-data
              mountPath: /usr/src/app/data
              subPath: data
            - name: app-data
              mountPath: /usr/src/app/config
              subPath: config
            - name: app-data
              mountPath: /mnt/thumbnails
              subPath: thumbnails
            - name: storage
              mountPath: /mnt/storage
            - name: backups
              mountPath: /mnt/backups
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: heaper-postgres
        - name: app-data
          persistentVolumeClaim:
            claimName: heaper-data
        - name: storage
          persistentVolumeClaim:
            claimName: heaper-storage
        - name: backups
          persistentVolumeClaim:
            claimName: heaper-backups
